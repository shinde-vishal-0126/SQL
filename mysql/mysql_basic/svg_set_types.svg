<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
    <rect width="800" height="400" fill="#eeeeee" rx="10"/>
    <text x="400" y="50" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#1f1f1f" text-anchor="middle">Types of SET Operators</text>
    
    <!-- Central Node -->
    <rect x="320" y="170" width="160" height="60" rx="30" fill="#C586C0" opacity="0.2"/>
    <rect x="320" y="170" width="160" height="60" rx="30" fill="none" stroke="#793a74" stroke-width="2"/>
    <text x="400" y="205" font-family="Arial" font-size="18" font-weight="bold" fill="#1f1f1f" text-anchor="middle">SET Operators</text>
    
    <!-- Branches -->
    <path d="M 320 200 C 250 200, 250 100, 180 100" fill="none" stroke="#b1b1b6" stroke-width="3"/>
    <path d="M 320 200 C 250 200, 250 170, 180 170" fill="none" stroke="#b1b1b6" stroke-width="3"/>
    <path d="M 480 200 C 550 200, 550 130, 620 130" fill="none" stroke="#b1b1b6" stroke-width="3"/>
    <path d="M 480 200 C 550 200, 550 270, 620 270" fill="none" stroke="#b1b1b6" stroke-width="3"/>
    
    <!-- Nodes -->
    <rect x="40" y="75" width="140" height="50" rx="10" fill="#e8e8e9" stroke="#0072b0" stroke-width="2"/>
    <text x="110" y="105" font-family="Arial" font-size="16" font-weight="bold" fill="#0072b0" text-anchor="middle">UNION</text>
    
    <rect x="40" y="145" width="140" height="50" rx="10" fill="#e8e8e9" stroke="#0072b0" stroke-width="2"/>
    <text x="110" y="175" font-family="Arial" font-size="16" font-weight="bold" fill="#0072b0" text-anchor="middle">UNION ALL</text>
    
    <rect x="620" y="105" width="140" height="50" rx="10" fill="#e8e8e9" stroke="#267d6b" stroke-width="2"/>
    <text x="690" y="135" font-family="Arial" font-size="16" font-weight="bold" fill="#267d6b" text-anchor="middle">INTERSECT</text>
    
    <rect x="620" y="245" width="140" height="50" rx="10" fill="#e8e8e9" stroke="#b80b0b" stroke-width="2"/>
    <text x="690" y="275" font-family="Arial" font-size="16" font-weight="bold" fill="#b80b0b" text-anchor="middle">EXCEPT (MINUS)</text>
    
    <!-- Subtexts -->
    <text x="110" y="135" font-family="Arial" font-size="12" fill="#5f5f5f" text-anchor="middle">Unique Rows</text>
    <text x="110" y="205" font-family="Arial" font-size="12" fill="#5f5f5f" text-anchor="middle">All Rows (with Dupes)</text>
    <text x="690" y="165" font-family="Arial" font-size="12" fill="#5f5f5f" text-anchor="middle">Common Rows</text>
    <text x="690" y="305" font-family="Arial" font-size="12" fill="#5f5f5f" text-anchor="middle">Only in First Query</text>
</svg>