<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
    <rect width="800" height="400" fill="#1E1E1E" rx="10"/>
    <text x="400" y="30" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#DCDCAA" text-anchor="middle">Database Engine Architecture</text>
    
    <!-- SERVER SIDE -->
    <text x="250" y="70" font-family="Arial" font-size="18" font-weight="bold" fill="#4FC1FF" text-anchor="middle">SERVER</text>
    
    <!-- Cache -->
    <rect x="50" y="90" width="400" height="70" fill="#2D2D30" stroke="#4EC9B0" stroke-width="2"/>
    <text x="250" y="130" font-family="Arial" font-size="16" font-weight="bold" fill="#4EC9B0" text-anchor="middle">CACHE (Fast, Short-term)</text>
    
    <!-- Disk -->
    <rect x="50" y="190" width="400" height="180" fill="#2D2D30" stroke="#C586C0" stroke-width="2"/>
    <text x="250" y="215" font-family="Arial" font-size="16" font-weight="bold" fill="#C586C0" text-anchor="middle">DISK (Slow, Long-term)</text>
    
    <!-- Disk Sections -->
    <rect x="70" y="240" width="100" height="100" fill="#1E1E1E" stroke="#A0A0A0" stroke-width="1"/>
    <text x="120" y="265" font-family="Arial" font-size="14" font-weight="bold" fill="#A0A0A0" text-anchor="middle">TEMP</text>
    <text x="120" y="290" font-family="Arial" font-size="11" fill="#A0A0A0" text-anchor="middle">Short tasks</text>
    
    <rect x="200" y="240" width="100" height="100" fill="#1E1E1E" stroke="#A0A0A0" stroke-width="1"/>
    <text x="250" y="265" font-family="Arial" font-size="14" font-weight="bold" fill="#A0A0A0" text-anchor="middle">CATALOG</text>
    <text x="250" y="290" font-family="Arial" font-size="11" fill="#A0A0A0" text-anchor="middle">Metadata</text>
    
    <rect x="330" y="240" width="100" height="100" fill="#1E1E1E" stroke="#A0A0A0" stroke-width="1"/>
    <text x="380" y="265" font-family="Arial" font-size="14" font-weight="bold" fill="#A0A0A0" text-anchor="middle">USER</text>
    <text x="380" y="290" font-family="Arial" font-size="11" fill="#A0A0A0" text-anchor="middle">Actual Data</text>

    <!-- DB Engine -->
    <rect x="470" y="90" width="40" height="280" fill="#2D2D30" stroke="#DCDCAA" stroke-width="2"/>
    <text x="495" y="230" font-family="Arial" font-size="14" font-weight="bold" fill="#DCDCAA" text-anchor="middle" transform="rotate(-90 495 230)">DATABASE ENGINE</text>

    <!-- CLIENT SIDE -->
    <text x="670" y="70" font-family="Arial" font-size="18" font-weight="bold" fill="#4FC1FF" text-anchor="middle">CLIENT</text>
    <rect x="570" y="150" width="200" height="150" fill="#2D2D30" stroke="#A0A0A0" stroke-width="2"/>
    <text x="670" y="200" font-family="Arial" font-size="16" font-weight="bold" fill="#E0E0E0" text-anchor="middle">Data Engineer</text>
    <text x="670" y="230" font-family="Arial" font-size="14" fill="#4FC1FF" text-anchor="middle">Sends Query</text>
    <text x="670" y="260" font-family="Arial" font-size="14" fill="#4EC9B0" text-anchor="middle">Receives Result</text>

    <!-- Flow Arrows -->
    <path d="M 570 210 L 520 210" stroke="#4FC1FF" stroke-width="2"/>
    <polygon points="520,210 530,205 530,215" fill="#4FC1FF"/>
    
    <path d="M 520 250 L 570 250" stroke="#4EC9B0" stroke-width="2"/>
    <polygon points="570,250 560,245 560,255" fill="#4EC9B0"/>
</svg>
