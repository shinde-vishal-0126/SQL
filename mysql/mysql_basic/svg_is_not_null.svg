<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 150">
    <rect width="600" height="150" fill="#1E1E1E" rx="10"/>
    <text x="150" y="50" font-family="Courier New" font-size="20" font-weight="bold" fill="#4FC1FF" text-anchor="middle">IS NOT NULL</text>
    <text x="150" y="80" font-family="Arial" font-size="12" fill="#A0A0A0" text-anchor="middle">Returns TRUE if value is NOT NULL</text>
    
    <text x="400" y="50" font-family="Courier New" font-size="14" fill="#E0E0E0" text-anchor="middle">Price: 10</text>
    <path d="M 400 55 L 400 75" fill="none" stroke="#3E3E42" stroke-width="2" marker-end="url(#arrow_gray)"/>
    <text x="400" y="90" font-family="Courier New" font-size="14" font-weight="bold" fill="#4EC9B0" text-anchor="middle">TRUE</text>
    
    <text x="500" y="50" font-family="Courier New" font-size="14" fill="#F44747" text-anchor="middle">Price: NULL</text>
    <path d="M 500 55 L 500 75" fill="none" stroke="#3E3E42" stroke-width="2" marker-end="url(#arrow_gray)"/>
    <text x="500" y="90" font-family="Courier New" font-size="14" font-weight="bold" fill="#F44747" text-anchor="middle">FALSE</text>

    <defs>
        <marker id="arrow_gray" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
            <path d="M0,0 L0,6 L9,3 z" fill="#3E3E42" />
        </marker>
    </defs>
</svg>