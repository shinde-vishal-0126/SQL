<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1150 780" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>

    <linearGradient id="yellowHeader" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0b1120"/>
    </linearGradient>

    <filter id="boxShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#000000" flood-opacity="0.45"/>
    </filter>

    <marker id="arrowSky" markerWidth="8" markerHeight="8" refX="5" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#38bdf8"/>
    </marker>
    <marker id="arrowYellow" markerWidth="8" markerHeight="8" refX="5" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#fbbf24"/>
    </marker>
    <marker id="arrowGreen" markerWidth="8" markerHeight="8" refX="5" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#34d399"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1150" height="780" rx="16" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="2"/>

  <!-- Subtle Grid lines -->
  <g opacity="0.07">
    <path d="M0,78 L1150,78 M0,156 L1150,156 M0,234 L1150,234 M0,312 L1150,312 M0,390 L1150,390 M0,468 L1150,468 M0,546 L1150,546 M0,624 L1150,624 M0,702 L1150,702" stroke="#94a3b8" stroke-width="1"/>
    <path d="M115,0 L115,780 M230,0 L230,780 M345,0 L345,780 M460,0 L460,780 M575,0 L575,780 M690,0 L690,780 M805,0 L805,780 M920,0 L920,780 M1035,0 L1035,780" stroke="#94a3b8" stroke-width="1"/>
  </g>

  <!-- Title -->
  <g transform="translate(575, 38)" text-anchor="middle">
    <text font-family="'Segoe UI', Roboto, sans-serif" font-size="26" font-weight="bold" fill="#f8fafc">Grouping in SQL: GROUP BY Clause &amp; Data Aggregation</text>
    <text y="24" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" fill="#94a3b8">Combines rows sharing identical values into summary rows — Aggregating a column by another column</text>
  </g>

  <!-- ========================================================================= -->
  <!-- TOP: MENTAL MODEL / QUERY CLAUSES BRANCHING -->
  <!-- ========================================================================= -->
  <g transform="translate(60, 85)" filter="url(#boxShadow)">
    <rect width="1030" height="150" rx="12" fill="#0b1120" stroke="#334155" stroke-width="1.5"/>

    <!-- Left: SQL Query box with branching to GROUP BY -->
    <g transform="translate(30, 20)">
      <rect width="110" height="108" rx="8" fill="#1e293b" stroke="#64748b" stroke-width="1.5"/>
      <text x="55" y="50" font-family="'Segoe UI', sans-serif" font-size="15" font-weight="bold" fill="#fbbf24" text-anchor="middle">SQL</text>
      <text x="55" y="72" font-family="'Segoe UI', sans-serif" font-size="15" font-weight="bold" fill="#f8fafc" text-anchor="middle">Query</text>
      <circle cx="25" cy="92" r="6" fill="none" stroke="#94a3b8" stroke-width="2"/>
      <line x1="30" y1="96" x2="38" y2="103" stroke="#94a3b8" stroke-width="2"/>

      <!-- Arrows -->
      <line x1="110" y1="25" x2="160" y2="15" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrowSky)"/>
      <line x1="110" y1="45" x2="160" y2="40" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrowSky)"/>
      <line x1="110" y1="65" x2="160" y2="65" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrowSky)"/>
      <line x1="110" y1="85" x2="160" y2="92" stroke="#fbbf24" stroke-width="2.5" marker-end="url(#arrowYellow)"/>

      <!-- Clauses -->
      <rect x="165" y="4" width="95" height="22" rx="4" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <text x="212" y="19" font-family="'Fira Code', monospace" font-size="11" fill="#94a3b8" text-anchor="middle">SELECT</text>

      <rect x="165" y="29" width="95" height="22" rx="4" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <text x="212" y="44" font-family="'Fira Code', monospace" font-size="11" fill="#94a3b8" text-anchor="middle">FROM</text>

      <rect x="165" y="54" width="95" height="22" rx="4" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <text x="212" y="69" font-family="'Fira Code', monospace" font-size="11" fill="#94a3b8" text-anchor="middle">WHERE</text>

      <!-- Active: GROUP BY -->
      <rect x="165" y="80" width="125" height="28" rx="6" fill="#854d0e" stroke="#fbbf24" stroke-width="1.5"/>
      <text x="227" y="99" font-family="'Fira Code', monospace" font-size="12" font-weight="bold" fill="#fef08a" text-anchor="middle">GROUP BY ∑</text>
    </g>

    <!-- Center/Right: Core Mental Definition -->
    <g transform="translate(360, 25)">
      <text x="0" y="24" font-family="'Segoe UI', sans-serif" font-size="19" font-weight="bold" fill="#38bdf8">The Core Mental Model of Grouping:</text>
      <text x="0" y="54" font-family="'Segoe UI', sans-serif" font-size="14" fill="#cbd5e1">1. <tspan font-weight="bold" fill="#facc15">Combines Rows</tspan> with the same value in specified columns into one summary row.</text>
      <text x="0" y="78" font-family="'Segoe UI', sans-serif" font-size="14" fill="#cbd5e1">2. <tspan font-weight="bold" fill="#34d399">Aggregates a Column By Another Column</tspan> (e.g. Total Score By Country).</text>
      <text x="0" y="102" font-family="'Segoe UI', sans-serif" font-size="14" fill="#cbd5e1">3. Operates with aggregate functions: <tspan font-family="'Fira Code', monospace" fill="#38bdf8">SUM(), COUNT(), AVG(), MIN(), MAX()</tspan>.</text>
    </g>
  </g>

  <!-- ========================================================================= -->
  <!-- MIDDLE/BOTTOM: 3-STEP VISUAL EXECUTION OF GROUP BY -->
  <!-- ========================================================================= -->
  <g transform="translate(60, 260)" filter="url(#boxShadow)">
    <rect width="1030" height="480" rx="12" fill="#0b1120" stroke="#334155" stroke-width="1.5"/>

    <!-- Banner -->
    <rect width="1030" height="42" rx="12" fill="#1e293b"/>
    <rect y="30" width="1030" height="12" fill="#1e293b"/>
    <text x="25" y="27" font-family="'Segoe UI', sans-serif" font-size="15" font-weight="bold" fill="#f8fafc">
      Visual Lifecycle: <tspan fill="#38bdf8">SELECT country, SUM(score) AS total_score FROM customers GROUP BY country;</tspan>
    </text>

    <!-- STEP 1: FROM Table -->
    <g transform="translate(35, 65)">
      <rect width="280" height="380" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
      <rect width="280" height="35" rx="8" fill="#334155"/>
      <rect y="23" width="280" height="12" fill="#334155"/>
      <text x="140" y="24" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="bold" fill="#f8fafc" text-anchor="middle">Step ①: FROM customers</text>

      <text x="15" y="60" font-family="'Segoe UI', sans-serif" font-size="12" fill="#94a3b8">Raw Table (5 records):</text>

      <!-- Table header -->
      <rect x="15" y="75" width="250" height="24" fill="#0f172a"/>
      <text x="22" y="91" font-family="'Fira Code', monospace" font-size="11" font-weight="bold" fill="#cbd5e1">id | name   | country | score</text>

      <!-- Rows with color highlights for Country -->
      <!-- Row 1: Maria (Germany) -->
      <rect x="15" y="105" width="250" height="45" rx="4" fill="#0284c7" fill-opacity="0.25" stroke="#0284c7" stroke-width="1"/>
      <text x="22" y="125" font-family="'Fira Code', monospace" font-size="11" fill="#f8fafc">1  | Maria  | </text>
      <text x="120" y="125" font-family="'Fira Code', monospace" font-size="11" font-weight="bold" fill="#38bdf8">Germany</text>
      <text x="180" y="125" font-family="'Fira Code', monospace" font-size="11" fill="#f8fafc">| 350</text>
      <text x="22" y="142" font-family="'Segoe UI', sans-serif" font-size="10" fill="#94a3b8">Germany bucket item 1</text>

      <!-- Row 2: John (USA) -->
      <rect x="15" y="155" width="250" height="45" rx="4" fill="#dc2626" fill-opacity="0.25" stroke="#dc2626" stroke-width="1"/>
      <text x="22" y="175" font-family="'Fira Code', monospace" font-size="11" fill="#f8fafc">2  | John   | </text>
      <text x="120" y="175" font-family="'Fira Code', monospace" font-size="11" font-weight="bold" fill="#f87171">USA    </text>
      <text x="180" y="175" font-family="'Fira Code', monospace" font-size="11" fill="#f8fafc">| 900</text>
      <text x="22" y="192" font-family="'Segoe UI', sans-serif" font-size="10" fill="#94a3b8">USA bucket item 1</text>

      <!-- Row 3: Georg (UK) -->
      <rect x="15" y="205" width="250" height="45" rx="4" fill="#059669" fill-opacity="0.25" stroke="#059669" stroke-width="1"/>
      <text x="22" y="225" font-family="'Fira Code', monospace" font-size="11" fill="#f8fafc">3  | Georg  | </text>
      <text x="120" y="225" font-family="'Fira Code', monospace" font-size="11" font-weight="bold" fill="#34d399">UK     </text>
      <text x="180" y="225" font-family="'Fira Code', monospace" font-size="11" fill="#f8fafc">| 750</text>
      <text x="22" y="242" font-family="'Segoe UI', sans-serif" font-size="10" fill="#94a3b8">UK bucket item 1</text>

      <!-- Row 4: Martin (Germany) -->
      <rect x="15" y="255" width="250" height="45" rx="4" fill="#0284c7" fill-opacity="0.25" stroke="#0284c7" stroke-width="1"/>
      <text x="22" y="275" font-family="'Fira Code', monospace" font-size="11" fill="#f8fafc">4  | Martin | </text>
      <text x="120" y="275" font-family="'Fira Code', monospace" font-size="11" font-weight="bold" fill="#38bdf8">Germany</text>
      <text x="180" y="275" font-family="'Fira Code', monospace" font-size="11" fill="#f8fafc">| 500</text>
      <text x="22" y="292" font-family="'Segoe UI', sans-serif" font-size="10" fill="#94a3b8">Germany bucket item 2</text>

      <!-- Row 5: Peter (USA) -->
      <rect x="15" y="305" width="250" height="45" rx="4" fill="#dc2626" fill-opacity="0.25" stroke="#dc2626" stroke-width="1"/>
      <text x="22" y="325" font-family="'Fira Code', monospace" font-size="11" fill="#f8fafc">5  | Peter  | </text>
      <text x="120" y="325" font-family="'Fira Code', monospace" font-size="11" font-weight="bold" fill="#f87171">USA    </text>
      <text x="180" y="325" font-family="'Fira Code', monospace" font-size="11" fill="#f8fafc">| 0</text>
      <text x="22" y="342" font-family="'Segoe UI', sans-serif" font-size="10" fill="#94a3b8">USA bucket item 2</text>
    </g>

    <!-- Arrow 1 -> 2 -->
    <g transform="translate(325, 230)">
      <path d="M0,0 L35,0" stroke="#fbbf24" stroke-width="3" marker-end="url(#arrowYellow)"/>
      <text x="18" y="-12" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="bold" fill="#fbbf24" text-anchor="middle">HASH /</text>
      <text x="18" y="22" font-family="'Segoe UI', sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">BUCKET</text>
    </g>

    <!-- STEP 2: GROUP BY Country (Grouping Buckets) -->
    <g transform="translate(375, 65)">
      <rect width="320" height="380" rx="8" fill="#1e293b" stroke="#eab308" stroke-width="1.5"/>
      <rect width="320" height="35" rx="8" fill="#854d0e"/>
      <rect y="23" width="320" height="12" fill="#854d0e"/>
      <text x="160" y="24" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="bold" fill="#fef08a" text-anchor="middle">Step ②: GROUP BY country</text>

      <text x="15" y="60" font-family="'Segoe UI', sans-serif" font-size="12" fill="#cbd5e1">Rows collapsed into Distinct Country Groups:</text>

      <!-- Group 1: Germany -->
      <g transform="translate(15, 75)">
        <rect width="290" height="85" rx="6" fill="#0f172a" stroke="#0284c7" stroke-width="1.5"/>
        <rect width="90" height="24" rx="4" fill="#0284c7"/>
        <text x="45" y="16" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">Germany</text>
        <text x="100" y="17" font-family="'Segoe UI', sans-serif" font-size="11" fill="#94a3b8">(2 rows merged)</text>
        <text x="15" y="44" font-family="'Fira Code', monospace" font-size="11" fill="#cbd5e1">• Maria score: 350</text>
        <text x="15" y="62" font-family="'Fira Code', monospace" font-size="11" fill="#cbd5e1">• Martin score: 500</text>
        <text x="15" y="80" font-family="'Fira Code', monospace" font-size="11" font-weight="bold" fill="#38bdf8">➔ SUM = 350 + 500 = 850</text>
      </g>

      <!-- Group 2: USA -->
      <g transform="translate(15, 170)">
        <rect width="290" height="85" rx="6" fill="#0f172a" stroke="#dc2626" stroke-width="1.5"/>
        <rect width="90" height="24" rx="4" fill="#dc2626"/>
        <text x="45" y="16" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">USA</text>
        <text x="100" y="17" font-family="'Segoe UI', sans-serif" font-size="11" fill="#94a3b8">(2 rows merged)</text>
        <text x="15" y="44" font-family="'Fira Code', monospace" font-size="11" fill="#cbd5e1">• John score: 900</text>
        <text x="15" y="62" font-family="'Fira Code', monospace" font-size="11" fill="#cbd5e1">• Peter score: 0</text>
        <text x="15" y="80" font-family="'Fira Code', monospace" font-size="11" font-weight="bold" fill="#f87171">➔ SUM = 900 + 0 = 900</text>
      </g>

      <!-- Group 3: UK -->
      <g transform="translate(15, 265)">
        <rect width="290" height="75" rx="6" fill="#0f172a" stroke="#059669" stroke-width="1.5"/>
        <rect width="90" height="24" rx="4" fill="#059669"/>
        <text x="45" y="16" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">UK</text>
        <text x="100" y="17" font-family="'Segoe UI', sans-serif" font-size="11" fill="#94a3b8">(1 row)</text>
        <text x="15" y="44" font-family="'Fira Code', monospace" font-size="11" fill="#cbd5e1">• Georg score: 750</text>
        <text x="15" y="66" font-family="'Fira Code', monospace" font-size="11" font-weight="bold" fill="#34d399">➔ SUM = 750</text>
      </g>
    </g>

    <!-- Arrow 2 -> 3 -->
    <g transform="translate(705, 230)">
      <path d="M0,0 L35,0" stroke="#34d399" stroke-width="3" marker-end="url(#arrowGreen)"/>
      <text x="18" y="-12" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="bold" fill="#34d399" text-anchor="middle">AGGREGATE</text>
      <text x="18" y="22" font-family="'Segoe UI', sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">CALCULATE</text>
    </g>

    <!-- STEP 3: Output Table (Final Aggregate Rows) -->
    <g transform="translate(755, 65)">
      <rect width="240" height="380" rx="8" fill="#1e293b" stroke="#059669" stroke-width="1.5"/>
      <rect width="240" height="35" rx="8" fill="#065f46"/>
      <rect y="23" width="240" height="12" fill="#065f46"/>
      <text x="120" y="24" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="bold" fill="#a7f3d0" text-anchor="middle">Step ③: Output Result Set</text>

      <text x="15" y="60" font-family="'Segoe UI', sans-serif" font-size="12" fill="#cbd5e1">1 Row per Group Returned:</text>

      <!-- Table -->
      <g transform="translate(15, 80)">
        <rect width="210" height="32" rx="4" fill="#0f172a" stroke="#334155" stroke-width="1"/>
        <text x="15" y="21" font-family="'Fira Code', monospace" font-size="12" font-weight="bold" fill="#cbd5e1">country | total_score</text>

        <!-- Row 1: Germany 850 -->
        <g transform="translate(0, 42)">
          <rect width="210" height="48" rx="6" fill="#0284c7" fill-opacity="0.3" stroke="#0284c7" stroke-width="1"/>
          <text x="15" y="29" font-family="'Fira Code', monospace" font-size="13" font-weight="bold" fill="#38bdf8">Germany</text>
          <text x="140" y="29" font-family="'Fira Code', monospace" font-size="14" font-weight="bold" fill="#ffffff">850</text>
        </g>

        <!-- Row 2: USA 900 -->
        <g transform="translate(0, 100)">
          <rect width="210" height="48" rx="6" fill="#dc2626" fill-opacity="0.3" stroke="#dc2626" stroke-width="1"/>
          <text x="15" y="29" font-family="'Fira Code', monospace" font-size="13" font-weight="bold" fill="#f87171">USA</text>
          <text x="140" y="29" font-family="'Fira Code', monospace" font-size="14" font-weight="bold" fill="#ffffff">900</text>
        </g>

        <!-- Row 3: UK 750 -->
        <g transform="translate(0, 158)">
          <rect width="210" height="48" rx="6" fill="#059669" fill-opacity="0.3" stroke="#059669" stroke-width="1"/>
          <text x="15" y="29" font-family="'Fira Code', monospace" font-size="13" font-weight="bold" fill="#34d399">UK</text>
          <text x="140" y="29" font-family="'Fira Code', monospace" font-size="14" font-weight="bold" fill="#ffffff">750</text>
        </g>

        <!-- Recap note -->
        <g transform="translate(0, 225)">
          <rect width="210" height="58" rx="6" fill="#0f172a" stroke="#fbbf24" stroke-width="1"/>
          <text x="10" y="20" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="bold" fill="#fbbf24">Notice:</text>
          <text x="10" y="36" font-family="'Segoe UI', sans-serif" font-size="11" fill="#cbd5e1">5 raw rows were aggregated</text>
          <text x="10" y="50" font-family="'Segoe UI', sans-serif" font-size="11" fill="#cbd5e1">into exactly <tspan fill="#34d399" font-weight="bold">3 summary rows</tspan>!</text>
        </g>
      </g>
    </g>
  </g>
</svg>
