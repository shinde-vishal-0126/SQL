<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300">
    <rect width="600" height="300" fill="#eeeeee" rx="10"/>
    <text x="300" y="30" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#793a74" text-anchor="middle">Joins &amp; Anti-Joins Recap</text>
    
    <!-- Left Join -->
    <text x="150" y="80" font-family="Courier New" font-size="14" font-weight="bold" fill="#1f1f1f" text-anchor="middle">LEFT JOIN</text>
    <circle cx="130" cy="120" r="30" fill="#4FC1FF" opacity="0.6"/>
    <circle cx="170" cy="120" r="30" fill="none" stroke="#b1b1b6" stroke-width="2"/>
    <path d="M 150 97 A 30 30 0 0 1 150 143 A 30 30 0 0 1 150 97" fill="#4FC1FF" opacity="0.6"/>
    <text x="150" y="170" font-family="Arial" font-size="10" fill="#5f5f5f" text-anchor="middle">All Left + Intersect</text>

    <!-- Left Anti Join -->
    <text x="450" y="80" font-family="Courier New" font-size="14" font-weight="bold" fill="#b80b0b" text-anchor="middle">LEFT ANTI JOIN</text>
    <circle cx="430" cy="120" r="30" fill="#4FC1FF" opacity="0.6"/>
    <circle cx="470" cy="120" r="30" fill="none" stroke="#b1b1b6" stroke-width="2"/>
    <path d="M 450 97 A 30 30 0 0 1 450 143 A 30 30 0 0 1 450 97" fill="#eeeeee"/>
    <text x="450" y="170" font-family="Arial" font-size="10" fill="#5f5f5f" text-anchor="middle">Left Join + IS NULL</text>
    <text x="450" y="185" font-family="Arial" font-size="10" fill="#5f5f5f" text-anchor="middle">(Unmatching Rows Only)</text>

    <!-- Right Join -->
    <text x="150" y="220" font-family="Courier New" font-size="14" font-weight="bold" fill="#1f1f1f" text-anchor="middle">RIGHT JOIN</text>
    <circle cx="130" cy="260" r="30" fill="none" stroke="#b1b1b6" stroke-width="2"/>
    <circle cx="170" cy="260" r="30" fill="#4EC9B0" opacity="0.6"/>
    <path d="M 150 237 A 30 30 0 0 1 150 283 A 30 30 0 0 1 150 237" fill="#4EC9B0" opacity="0.6"/>

    <!-- Right Anti Join -->
    <text x="450" y="220" font-family="Courier New" font-size="14" font-weight="bold" fill="#b80b0b" text-anchor="middle">RIGHT ANTI JOIN</text>
    <circle cx="430" cy="260" r="30" fill="none" stroke="#b1b1b6" stroke-width="2"/>
    <circle cx="470" cy="260" r="30" fill="#4EC9B0" opacity="0.6"/>
    <path d="M 450 237 A 30 30 0 0 1 450 283 A 30 30 0 0 1 450 237" fill="#eeeeee"/>
</svg>