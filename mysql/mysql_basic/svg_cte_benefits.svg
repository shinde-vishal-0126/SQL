<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
    <rect width="800" height="400" fill="#1E1E1E" rx="10"/>
    
    <!-- Left Side: Benefits -->
    <text x="120" y="150" font-family="Comic Sans MS, cursive, sans-serif" font-size="20" font-weight="bold" fill="#4EC9B0">👓 READABILITY</text>
    <text x="120" y="200" font-family="Comic Sans MS, cursive, sans-serif" font-size="20" font-weight="bold" fill="#4EC9B0">🧩 MODULARITY</text>
    <text x="120" y="250" font-family="Comic Sans MS, cursive, sans-serif" font-size="20" font-weight="bold" fill="#4EC9B0">🔄 REUSABILITY</text>
    
    <!-- Connection Lines -->
    <path d="M 300 200 L 450 120" fill="none" stroke="#E0E0E0" stroke-width="2" stroke-dasharray="5,5"/>
    <path d="M 300 200 L 450 200" fill="none" stroke="#E0E0E0" stroke-width="2" stroke-dasharray="5,5"/>
    <path d="M 300 200 L 450 280" fill="none" stroke="#E0E0E0" stroke-width="2" stroke-dasharray="5,5"/>
    
    <!-- Right Side: Query Box -->
    <rect x="450" y="50" width="300" height="300" fill="#2D2D30" stroke="#1E1E1E" stroke-width="2" rx="5"/>
    <text x="600" y="40" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#FFD700" text-anchor="middle">QUERY</text>
    
    <!-- CTE 1 -->
    <text x="470" y="90" font-family="Arial" font-size="14" font-weight="bold" fill="#4FC1FF">CTE_Top_Customers</text>
    <rect x="470" y="100" width="260" height="40" fill="#1E1E1E" stroke="#E0E0E0" stroke-width="2"/>
    <text x="480" y="115" font-family="Arial" font-size="12" font-weight="bold" fill="#007ACC">SELECT ...</text>
    <text x="480" y="130" font-family="Arial" font-size="12" font-weight="bold" fill="#E0E0E0">FROM customers WHERE ...</text>
    
    <!-- CTE 2 -->
    <text x="470" y="170" font-family="Arial" font-size="14" font-weight="bold" fill="#4FC1FF">CTE_Top_Products</text>
    <rect x="470" y="180" width="260" height="40" fill="#1E1E1E" stroke="#E0E0E0" stroke-width="2"/>
    <text x="480" y="195" font-family="Arial" font-size="12" font-weight="bold" fill="#007ACC">SELECT ...</text>
    <text x="480" y="210" font-family="Arial" font-size="12" font-weight="bold" fill="#E0E0E0">FROM products JOIN ...</text>
    
    <!-- Main Query -->
    <text x="400" y="295" font-family="Arial" font-size="16" font-weight="bold" fill="#FFD700">MAIN</text>
    <text x="400" y="315" font-family="Arial" font-size="16" font-weight="bold" fill="#FFD700">QUERY</text>
    
    <path d="M 460 290 L 480 290" fill="none" stroke="#FFD700" stroke-width="2"/>
    <path d="M 460 290 L 460 330" fill="none" stroke="#FFD700" stroke-width="2"/>
    <path d="M 460 330 L 480 330" fill="none" stroke="#FFD700" stroke-width="2"/>
    
    <text x="490" y="300" font-family="Arial" font-size="16" font-weight="bold" fill="#007ACC">SELECT ...</text>
    <text x="490" y="320" font-family="Arial" font-size="16" font-weight="bold" fill="#007ACC">FROM CTE_Top_Customers</text>
    <text x="490" y="340" font-family="Arial" font-size="16" font-weight="bold" fill="#007ACC">JOIN CTE_Top_Products ...</text>
</svg>
