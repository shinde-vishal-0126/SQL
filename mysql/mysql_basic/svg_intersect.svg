<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 300">
    <rect width="500" height="300" fill="#1E1E1E" rx="10"/>
    <text x="250" y="40" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#C586C0" text-anchor="middle">INTERSECT (Common Rows)</text>
    
    <!-- Clip path to show only intersection -->
    <defs>
        <clipPath id="intersectClip">
            <circle cx="300" cy="160" r="80"/>
        </clipPath>
    </defs>
    
    <circle cx="200" cy="160" r="80" fill="none" stroke="#4FC1FF" stroke-width="3"/>
    <circle cx="300" cy="160" r="80" fill="none" stroke="#4EC9B0" stroke-width="3"/>
    
    <circle cx="200" cy="160" r="80" fill="#C586C0" opacity="0.6" clip-path="url(#intersectClip)"/>
    
    <text x="150" y="165" font-family="Arial" font-size="16" font-weight="bold" fill="#A0A0A0">Table A</text>
    <text x="350" y="165" font-family="Arial" font-size="16" font-weight="bold" fill="#A0A0A0">Table B</text>
    <text x="250" y="165" font-family="Arial" font-size="16" font-weight="bold" fill="#E0E0E0" text-anchor="middle">Match</text>
    
    <text x="250" y="270" font-family="Arial" font-size="14" fill="#A0A0A0" text-anchor="middle">Returns ONLY the rows that exist in BOTH queries</text>
</svg>