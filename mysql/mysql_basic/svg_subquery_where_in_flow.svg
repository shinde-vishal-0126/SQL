<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450">
    <rect width="800" height="450" fill="#eeeeee" rx="10"/>
    <text x="400" y="30" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#575724" text-anchor="middle">Execution Flow: IN Operator</text>
    
    <!-- Customer Table -->
    <rect x="50" y="60" width="180" height="120" fill="#e8e8e9" stroke="#0072b0" stroke-width="2"/>
    <text x="140" y="80" font-family="Arial" font-size="14" font-weight="bold" fill="#1f1f1f" text-anchor="middle">Customers (Germany)</text>
    <rect x="50" y="90" width="180" height="20" fill="#4FC1FF"/>
    <text x="140" y="105" font-family="Arial" font-size="12" font-weight="bold" fill="#1E1E1E" text-anchor="middle">CustomerID</text>
    <text x="140" y="130" font-family="Arial" font-size="12" fill="#1f1f1f" text-anchor="middle">1</text>
    <text x="140" y="150" font-family="Arial" font-size="12" fill="#1f1f1f" text-anchor="middle">4</text>

    <!-- Subquery -->
    <rect x="300" y="60" width="220" height="120" fill="#eeeeee" stroke="#793a74" stroke-width="2"/>
    <text x="410" y="80" font-family="Arial" font-size="14" font-weight="bold" fill="#793a74" text-anchor="middle">SUBQUERY</text>
    <text x="310" y="110" font-family="Courier New" font-size="12" fill="#296fa9">SELECT <tspan fill="#1f1f1f">CustomerID</tspan></text>
    <text x="310" y="130" font-family="Courier New" font-size="12" fill="#296fa9">FROM <tspan fill="#1f1f1f">Customers</tspan></text>
    <text x="310" y="150" font-family="Courier New" font-size="12" fill="#296fa9">WHERE <tspan fill="#1f1f1f">Country='Germany'</tspan></text>

    <!-- Passing data -->
    <path d="M 230 120 L 290 120" stroke="#333333" stroke-width="2"/>
    <polygon points="290,120 280,115 280,125" fill="#E0E0E0"/>
    
    <!-- Intermediate Array -->
    <rect x="360" y="210" width="100" height="40" fill="#e8e8e9" stroke="#333333" stroke-width="1"/>
    <text x="410" y="235" font-family="Courier New" font-size="14" font-weight="bold" fill="#1f1f1f" text-anchor="middle">(1, 4)</text>
    <path d="M 410 180 L 410 210" stroke="#793a74" stroke-width="2"/>
    <polygon points="410,210 405,200 415,200" fill="#C586C0"/>

    <!-- Main Query -->
    <rect x="250" y="280" width="300" height="130" fill="#e8e8e9" stroke="#575724" stroke-width="2"/>
    <text x="400" y="300" font-family="Arial" font-size="14" font-weight="bold" fill="#575724" text-anchor="middle">MAIN QUERY</text>
    <text x="270" y="330" font-family="Courier New" font-size="14" fill="#296fa9">SELECT <tspan fill="#1f1f1f">OrderID, Sales</tspan></text>
    <text x="270" y="350" font-family="Courier New" font-size="14" fill="#296fa9">FROM <tspan fill="#1f1f1f">Orders</tspan></text>
    <text x="270" y="370" font-family="Courier New" font-size="14" fill="#296fa9">WHERE <tspan fill="#1f1f1f">CustomerID </tspan><tspan fill="#267d6b">IN (1, 4)</tspan></text>

    <path d="M 410 250 L 410 280" stroke="#333333" stroke-width="2"/>
    <polygon points="410,280 405,270 415,270" fill="#E0E0E0"/>

    <!-- Orders Table (Final Result) -->
    <rect x="600" y="280" width="150" height="100" fill="#e8e8e9" stroke="#267d6b" stroke-width="2"/>
    <text x="675" y="300" font-family="Arial" font-size="14" font-weight="bold" fill="#1f1f1f" text-anchor="middle">FINAL RESULT</text>
    <rect x="600" y="310" width="150" height="20" fill="#4EC9B0"/>
    <text x="630" y="325" font-family="Arial" font-size="10" font-weight="bold" fill="#1E1E1E">OrderID</text>
    <text x="710" y="325" font-family="Arial" font-size="10" font-weight="bold" fill="#1E1E1E">Sales</text>
    
    <text x="630" y="350" font-family="Arial" font-size="12" fill="#1f1f1f">O-101</text>
    <text x="710" y="350" font-family="Arial" font-size="12" fill="#1f1f1f">500</text>
    <text x="630" y="370" font-family="Arial" font-size="12" fill="#1f1f1f">O-104</text>
    <text x="710" y="370" font-family="Arial" font-size="12" fill="#1f1f1f">950</text>

    <path d="M 550 340 L 600 340" stroke="#267d6b" stroke-width="2"/>
    <polygon points="600,340 590,335 590,345" fill="#4EC9B0"/>
</svg>
