<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
    <rect width="800" height="400" fill="#eeeeee" rx="10"/>
    <text x="400" y="40" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#575724" text-anchor="middle">6 Golden Rules of SET Operators</text>
    
    <g transform="translate(50, 80)">
        <rect x="0" y="0" width="330" height="70" rx="5" fill="#e8e8e9" stroke="#0072b0" stroke-width="1"/>
        <text x="15" y="25" font-family="Arial" font-size="16" font-weight="bold" fill="#0072b0">1. SQL Clauses</text>
        <text x="15" y="45" font-family="Arial" font-size="12" fill="#1f1f1f">Can use WHERE, GROUP BY, etc.</text>
        <text x="15" y="60" font-family="Arial" font-size="12" fill="#b80b0b">ORDER BY only once at the end!</text>
        
        <rect x="0" y="90" width="330" height="70" rx="5" fill="#e8e8e9" stroke="#0072b0" stroke-width="1"/>
        <text x="15" y="115" font-family="Arial" font-size="16" font-weight="bold" fill="#0072b0">2. Same Number of Columns</text>
        <text x="15" y="135" font-family="Arial" font-size="12" fill="#1f1f1f">Query 1: 3 Columns</text>
        <text x="15" y="150" font-family="Arial" font-size="12" fill="#1f1f1f">Query 2: 3 Columns (Must Match!)</text>

        <rect x="0" y="180" width="330" height="70" rx="5" fill="#e8e8e9" stroke="#0072b0" stroke-width="1"/>
        <text x="15" y="205" font-family="Arial" font-size="16" font-weight="bold" fill="#0072b0">3. Compatible Data Types</text>
        <text x="15" y="225" font-family="Arial" font-size="12" fill="#1f1f1f">Col 1 in Q1 must be compatible</text>
        <text x="15" y="240" font-family="Arial" font-size="12" fill="#1f1f1f">with Col 1 in Q2 (e.g. INT with BIGINT).</text>
        
        <rect x="370" y="0" width="330" height="70" rx="5" fill="#e8e8e9" stroke="#0072b0" stroke-width="1"/>
        <text x="385" y="25" font-family="Arial" font-size="16" font-weight="bold" fill="#0072b0">4. Same Order of Columns</text>
        <text x="385" y="45" font-family="Arial" font-size="12" fill="#1f1f1f">Col 1: Name | Col 2: Age</text>
        <text x="385" y="60" font-family="Arial" font-size="12" fill="#1f1f1f">Must be the exact same order in both queries.</text>
        
        <rect x="370" y="90" width="330" height="70" rx="5" fill="#e8e8e9" stroke="#0072b0" stroke-width="1"/>
        <text x="385" y="115" font-family="Arial" font-size="16" font-weight="bold" fill="#0072b0">5. First Query Controls Aliases</text>
        <text x="385" y="135" font-family="Arial" font-size="12" fill="#1f1f1f">The column names in the final result</text>
        <text x="385" y="150" font-family="Arial" font-size="12" fill="#1f1f1f">are entirely taken from Query 1.</text>

        <rect x="370" y="180" width="330" height="70" rx="5" fill="#e8e8e9" stroke="#0072b0" stroke-width="1"/>
        <text x="385" y="205" font-family="Arial" font-size="16" font-weight="bold" fill="#0072b0">6. Mapping Correct Columns</text>
        <text x="385" y="225" font-family="Arial" font-size="12" fill="#1f1f1f">Even if rules pass, logically mapping Name</text>
        <text x="385" y="240" font-family="Arial" font-size="12" fill="#1f1f1f">to Name (not Age to Name) is vital!</text>
    </g>
</svg>