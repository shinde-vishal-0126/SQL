<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" width="100%" height="100%">
  <defs>
    <!-- Shadows & Filters -->
    <filter id="cardShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
    <filter id="glow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0284c7" flood-opacity="0.2"/>
    </filter>

    <!-- Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </linearGradient>

    <linearGradient id="dbmsBoxGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0f9ff"/>
      <stop offset="100%" stop-color="#e0f2fe"/>
    </linearGradient>

    <linearGradient id="step1Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>

    <linearGradient id="step2Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>

    <linearGradient id="step3Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>

    <linearGradient id="step4Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#6d28d9"/>
    </linearGradient>

    <!-- Markers -->
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L7,3 z" fill="#0284c7"/>
    </marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L7,3 z" fill="#10b981"/>
    </marker>
    <marker id="arrowPurple" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L7,3 z" fill="#7c3aed"/>
    </marker>
  </defs>

  <style>
    .title { font-family: 'Segoe UI', system-ui, sans-serif; font-weight: 800; font-size: 22px; fill: #0f172a; }
    .subtitle { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 13px; fill: #64748b; font-weight: 500; }
    .step-num { font-family: 'Segoe UI', system-ui, sans-serif; font-weight: 900; font-size: 12px; fill: #ffffff; }
    .step-title { font-family: 'Segoe UI', system-ui, sans-serif; font-weight: 800; font-size: 15px; fill: #0f172a; }
    .step-desc { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 12px; fill: #475569; }
    .badge-text { font-family: 'Segoe UI', system-ui, sans-serif; font-weight: 700; font-size: 11px; }
  </style>

  <!-- Canvas Frame -->
  <rect x="15" y="15" width="970" height="590" rx="16" fill="url(#bgGrad)" stroke="#cbd5e1" stroke-width="2" filter="url(#cardShadow)"/>

  <!-- Top Title Bar -->
  <text x="500" y="52" text-anchor="middle" class="title">How DBMS Executes an SQL Query (Step-by-Step Lifecycle)</text>
  <text x="500" y="72" text-anchor="middle" class="subtitle">From Client Request to Security, Priority Optimization, Storage Engine, and Instant Response</text>

  <!-- ==================== STEP 1: CLIENTS (LEFT) ==================== -->
  <g transform="translate(45, 110)">
    <rect width="210" height="440" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#cardShadow)"/>
    
    <!-- Step Badge -->
    <circle cx="35" cy="35" r="16" fill="url(#step1Grad)"/>
    <text x="35" y="40" text-anchor="middle" class="step-num">1</text>
    <text x="65" y="40" class="step-title" fill="#1d4ed8">Clients Send Query</text>

    <line x1="20" y1="65" x2="190" y2="65" stroke="#f1f5f9" stroke-width="2"/>

    <!-- Client 1: Developers / Users -->
    <g transform="translate(20, 85)">
      <rect width="170" height="60" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
      <circle cx="30" cy="30" r="14" fill="#fed7aa" stroke="#ea580c" stroke-width="1.2"/>
      <circle cx="30" cy="26" r="4" fill="#ea580c"/>
      <path d="M 23 37 Q 30 32 37 37" fill="none" stroke="#ea580c" stroke-width="1.2"/>
      <text x="55" y="27" font-family="'Segoe UI', sans-serif" font-weight="700" font-size="12" fill="#1e293b">Users / Devs</text>
      <text x="55" y="43" font-family="'Segoe UI', sans-serif" font-size="10" fill="#64748b">Ad-hoc Queries</text>
    </g>

    <!-- Client 2: Applications (App </>) -->
    <g transform="translate(20, 160)">
      <rect width="170" height="60" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
      <rect x="18" y="16" width="26" height="26" rx="4" fill="#3b82f6"/>
      <text x="31" y="33" text-anchor="middle" font-family="monospace" font-weight="800" font-size="11" fill="#ffffff">&lt;/&gt;</text>
      <text x="55" y="27" font-family="'Segoe UI', sans-serif" font-weight="700" font-size="12" fill="#1e293b">Web / Mobile Apps</text>
      <text x="55" y="43" font-family="'Segoe UI', sans-serif" font-size="10" fill="#64748b">Live API Traffic</text>
    </g>

    <!-- Client 3: Analytics / Power BI -->
    <g transform="translate(20, 235)">
      <rect width="170" height="60" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
      <rect x="18" y="16" width="26" height="26" rx="4" fill="#eab308"/>
      <text x="31" y="33" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-weight="900" font-size="13" fill="#ffffff">📊</text>
      <text x="55" y="27" font-family="'Segoe UI', sans-serif" font-weight="700" font-size="12" fill="#1e293b">Power BI / Reports</text>
      <text x="55" y="43" font-family="'Segoe UI', sans-serif" font-size="10" fill="#64748b">Analytical Aggregates</text>
    </g>

    <!-- SQL Query Sample Box -->
    <g transform="translate(18, 315)">
      <rect width="174" height="105" rx="8" fill="#0f172a"/>
      <text x="12" y="22" font-family="monospace" font-size="10" fill="#38bdf8">-- Incoming SQL</text>
      <text x="12" y="42" font-family="monospace" font-weight="700" font-size="11" fill="#f8fafc">SELECT</text>
      <text x="60" y="42" font-family="monospace" font-size="11" fill="#facc15">SUM(amount)</text>
      <text x="12" y="62" font-family="monospace" font-weight="700" font-size="11" fill="#f8fafc">FROM</text>
      <text x="48" y="62" font-family="monospace" font-size="11" fill="#4ade80">sales;</text>
      <rect x="10" y="78" width="154" height="18" rx="4" fill="#1e293b"/>
      <text x="87" y="91" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="9" font-weight="600" fill="#94a3b8">Question: "Total Spending?"</text>
    </g>
  </g>

  <!-- Arrow 1: Clients -> DBMS -->
  <g transform="translate(260, 240)">
    <path d="M 0 0 L 45 0" stroke="#0284c7" stroke-width="3" fill="none" marker-end="url(#arrowBlue)"/>
    <rect x="5" y="-22" width="36" height="16" rx="3" fill="#e0f2fe"/>
    <text x="23" y="-10" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="9" font-weight="800" fill="#0369a1">SQL</text>
  </g>

  <!-- ==================== CENTER: DBMS ENGINE (STEPS 2, 3, 4) ==================== -->
  <g transform="translate(315, 110)">
    <!-- Big DBMS Container -->
    <rect width="360" height="440" rx="14" fill="url(#dbmsBoxGrad)" stroke="#0284c7" stroke-width="2" filter="url(#glow)"/>
    
    <!-- DBMS Title Header -->
    <rect x="0" y="0" width="360" height="42" rx="14" fill="#0284c7"/>
    <text x="180" y="27" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-weight="900" font-size="16" fill="#ffffff" letter-spacing="1">⚙️ DBMS INTERNAL CONTROLLER</text>

    <!-- STEP 2: Security & Permissions Check -->
    <g transform="translate(20, 58)">
      <rect width="320" height="95" rx="10" fill="#ffffff" stroke="#10b981" stroke-width="1.5" filter="url(#cardShadow)"/>
      <circle cx="28" cy="28" r="14" fill="url(#step2Grad)"/>
      <text x="28" y="33" text-anchor="middle" class="step-num">2</text>
      <text x="52" y="32" class="step-title" fill="#065f46">Security &amp; Permissions Gate</text>
      
      <text x="28" y="60" class="step-desc">• Checks: Is the user authenticated?</text>
      <text x="28" y="78" class="step-desc">• Validates: Is this SQL query allowed to run?</text>

      <!-- Pass Badge -->
      <rect x="235" y="20" width="70" height="22" rx="11" fill="#dcfce7" stroke="#86efac" stroke-width="1"/>
      <text x="270" y="35" text-anchor="middle" class="badge-text" fill="#166534">✔ Passed</text>
    </g>

    <!-- Connect Arrow 2 -> 3 -->
    <path d="M 180 155 L 180 178" stroke="#10b981" stroke-width="2.5" fill="none" marker-end="url(#arrowGreen)"/>

    <!-- STEP 3: Priority Queue & Query Optimizer -->
    <g transform="translate(20, 185)">
      <rect width="320" height="105" rx="10" fill="#ffffff" stroke="#f59e0b" stroke-width="1.5" filter="url(#cardShadow)"/>
      <circle cx="28" cy="28" r="14" fill="url(#step3Grad)"/>
      <text x="28" y="33" text-anchor="middle" class="step-num">3</text>
      <text x="52" y="32" class="step-title" fill="#92400e">Priority &amp; Query Optimizer</text>
      
      <text x="28" y="58" class="step-desc">• Determines query priority in the queue</text>
      <text x="28" y="75" class="step-desc">• Decides execution order (avoids deadlocks)</text>
      <text x="28" y="92" class="step-desc">• Builds fastest execution plan (using indexes)</text>

      <!-- Priority Badge -->
      <rect x="235" y="20" width="70" height="22" rx="11" fill="#fef3c7" stroke="#fde68a" stroke-width="1"/>
      <text x="270" y="35" text-anchor="middle" class="badge-text" fill="#b45309">⚡ Priority #1</text>
    </g>

    <!-- Connect Arrow 3 -> 4 -->
    <path d="M 180 292 L 180 315" stroke="#f59e0b" stroke-width="2.5" fill="none" marker-end="url(#arrowGreen)"/>

    <!-- STEP 4: Execution Engine -->
    <g transform="translate(20, 322)">
      <rect width="320" height="100" rx="10" fill="#ffffff" stroke="#8b5cf6" stroke-width="1.5" filter="url(#cardShadow)"/>
      <circle cx="28" cy="28" r="14" fill="url(#step4Grad)"/>
      <text x="28" y="33" text-anchor="middle" class="step-num">4</text>
      <text x="52" y="32" class="step-title" fill="#5b21b6">Execution Engine (I/O)</text>
      
      <text x="28" y="58" class="step-desc">• Converts SQL to physical read/write operations</text>
      <text x="28" y="76" class="step-desc">• Interacts with storage tables &amp; locks</text>

      <!-- Engine Badge -->
      <rect x="235" y="20" width="70" height="22" rx="11" fill="#ede9fe" stroke="#ddd6fe" stroke-width="1"/>
      <text x="270" y="35" text-anchor="middle" class="badge-text" fill="#6d28d9">Executing</text>
    </g>
  </g>

  <!-- ==================== RIGHT: DATABASE STORAGE & RESULTS (STEPS 5 & 6) ==================== -->
  
  <!-- Arrow 4 -> 5: Engine to Storage -->
  <g transform="translate(680, 240)">
    <path d="M 0 0 L 40 0" stroke="#7c3aed" stroke-width="3" fill="none" marker-end="url(#arrowPurple)"/>
    <text x="20" y="-10" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="10" font-weight="700" fill="#6d28d9">Fetch</text>
  </g>

  <g transform="translate(730, 110)">
    <!-- Database Storage Card -->
    <rect width="225" height="240" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#cardShadow)"/>

    <!-- Cylinder Mini Graphic -->
    <g transform="translate(60, 20)">
      <ellipse cx="50" cy="20" rx="45" ry="14" fill="#3b82f6" stroke="#1e40af" stroke-width="1.5"/>
      <path d="M 5 20 L 5 80 C 5 95, 95 95, 95 80 L 95 20 Z" fill="#eff6ff" stroke="#1e40af" stroke-width="1.5"/>
      <ellipse cx="50" cy="20" rx="40" ry="10" fill="#60a5fa"/>
      <text x="50" y="23" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-weight="900" font-size="10" fill="#ffffff">DATABASE</text>

      <!-- Tables inside -->
      <g transform="translate(18, 40)">
        <rect width="64" height="35" rx="3" fill="#ffffff" stroke="#2563eb" stroke-width="1"/>
        <rect width="64" height="10" rx="2" fill="#3b82f6"/>
        <line x1="21" y1="10" x2="21" y2="35" stroke="#bfdbfe" stroke-width="1"/>
        <line x1="42" y1="10" x2="42" y2="35" stroke="#bfdbfe" stroke-width="1"/>
      </g>
    </g>

    <text x="112" y="145" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-weight="800" font-size="15" fill="#1e293b">Physical Storage</text>
    <text x="112" y="165" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="11" fill="#64748b">• Relational Tables &amp; Rows</text>
    <text x="112" y="182" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="11" fill="#64748b">• B-Tree Indexes</text>
    <text x="112" y="199" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="11" fill="#64748b">• Transaction Logs</text>

    <rect x="25" y="208" width="175" height="20" rx="4" fill="#f1f5f9"/>
    <text x="112" y="222" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-weight="700" font-size="10" fill="#0284c7">Locates: 30,000,000 Total</text>
  </g>

  <!-- STEP 5 / Return Result Card -->
  <g transform="translate(730, 375)">
    <rect width="225" height="175" rx="12" fill="#ecfdf5" stroke="#10b981" stroke-width="2" filter="url(#cardShadow)"/>
    <circle cx="35" cy="35" r="16" fill="url(#step2Grad)"/>
    <text x="35" y="40" text-anchor="middle" class="step-num">5</text>
    <text x="65" y="40" class="step-title" fill="#065f46">Result Returned</text>

    <!-- Big Result Value Box -->
    <rect x="25" y="65" width="175" height="55" rx="8" fill="#10b981"/>
    <text x="112" y="102" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-weight="900" font-size="28" fill="#ffffff" letter-spacing="1">30M</text>

    <text x="112" y="142" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-weight="700" font-size="12" fill="#047857">Instant &amp; Formatted</text>
    <text x="112" y="158" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="10" fill="#059669">Delivered back to Client in ~12ms</text>
  </g>

  <!-- Curved Return Arrow from Result back to Client at the bottom -->
  <path d="M 730 465 C 500 585, 300 585, 150 555" fill="none" stroke="#10b981" stroke-width="2.5" stroke-dasharray="6 4" marker-end="url(#arrowGreen)"/>
  <rect x="360" y="558" width="220" height="24" rx="6" fill="#10b981"/>
  <text x="470" y="574" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-weight="700" font-size="11" fill="#ffffff">Step 5: Clean Result Sent to Client ➔</text>
</svg>
