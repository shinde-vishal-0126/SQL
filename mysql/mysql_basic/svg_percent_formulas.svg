<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 200">
    <rect width="600" height="200" fill="#1E1E1E" rx="10"/>
    <text x="300" y="30" font-family="Arial" font-size="18" font-weight="bold" fill="#DCDCAA" text-anchor="middle">Percentage-Based Rank Formulas</text>
    
    <!-- CUME_DIST -->
    <rect x="50" y="60" width="220" height="100" fill="#2D2D30" stroke="#4FC1FF" stroke-width="2"/>
    <rect x="110" y="50" width="100" height="20" fill="#4FC1FF"/>
    <text x="160" y="64" font-family="Courier New" font-size="14" font-weight="bold" fill="#1E1E1E" text-anchor="middle">CUME_DIST</text>
    
    <text x="160" y="100" font-family="Courier New" font-size="16" fill="#E0E0E0" text-anchor="middle">Position Nr</text>
    <path d="M 90 115 L 230 115" stroke="#3E3E42" stroke-width="2"/>
    <text x="160" y="140" font-family="Courier New" font-size="16" fill="#E0E0E0" text-anchor="middle">Number of Rows</text>

    <!-- PERCENT_RANK -->
    <rect x="330" y="60" width="220" height="100" fill="#2D2D30" stroke="#4EC9B0" stroke-width="2"/>
    <rect x="380" y="50" width="120" height="20" fill="#4EC9B0"/>
    <text x="440" y="64" font-family="Courier New" font-size="14" font-weight="bold" fill="#1E1E1E" text-anchor="middle">PERCENT_RANK</text>
    
    <text x="440" y="100" font-family="Courier New" font-size="16" fill="#E0E0E0" text-anchor="middle">Position Nr - 1</text>
    <path d="M 370 115 L 510 115" stroke="#3E3E42" stroke-width="2"/>
    <text x="440" y="140" font-family="Courier New" font-size="16" fill="#E0E0E0" text-anchor="middle">Number of Rows - 1</text>

</svg>