<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 350">
    <rect width="600" height="350" fill="#1E1E1E" rx="10"/>
    <text x="300" y="30" font-family="Arial" font-size="20" font-weight="bold" fill="#DCDCAA" text-anchor="middle">WINDOW RANK FUNCTIONS SUMMARY</text>
    
    <!-- Types Box -->
    <rect x="50" y="60" width="230" height="120" fill="#2D2D30" stroke="#4FC1FF" stroke-width="2"/>
    <text x="165" y="80" font-family="Arial" font-size="16" font-weight="bold" fill="#4FC1FF" text-anchor="middle">Types</text>
    <text x="60" y="110" font-family="Arial" font-size="14" fill="#E0E0E0">â€¢ Integer-based:</text>
    <text x="70" y="130" font-family="Courier New" font-size="12" fill="#A0A0A0">ROW_NUMBER, RANK, DENSE_RANK, NTILE</text>
    <text x="60" y="150" font-family="Arial" font-size="14" fill="#E0E0E0">â€¢ Percentage-based:</text>
    <text x="70" y="170" font-family="Courier New" font-size="12" fill="#A0A0A0">PERCENT_RANK, CUME_DIST</text>

    <!-- Rules Box -->
    <rect x="50" y="200" width="230" height="120" fill="#2D2D30" stroke="#F44747" stroke-width="2"/>
    <text x="165" y="220" font-family="Arial" font-size="16" font-weight="bold" fill="#F44747" text-anchor="middle">Rules</text>
    <text x="60" y="250" font-family="Arial" font-size="14" fill="#E0E0E0">â€¢ Expression -> Empty</text>
    <text x="60" y="275" font-family="Arial" font-size="14" fill="#E0E0E0">â€¢ ORDER BY -> Required</text>
    <text x="60" y="300" font-family="Arial" font-size="14" fill="#E0E0E0">â€¢ FRAME -> Not Allowed</text>

    <!-- Use Cases Box -->
    <rect x="320" y="60" width="230" height="260" fill="#2D2D30" stroke="#4EC9B0" stroke-width="2"/>
    <text x="435" y="80" font-family="Arial" font-size="16" font-weight="bold" fill="#4EC9B0" text-anchor="middle">Use Cases</text>
    <text x="330" y="110" font-family="Arial" font-size="14" fill="#E0E0E0">â€¢ Top-N / Bottom-N Analysis</text>
    <text x="330" y="140" font-family="Arial" font-size="14" fill="#E0E0E0">â€¢ Identify &amp; Remove Duplicates</text>
    <text x="330" y="170" font-family="Arial" font-size="14" fill="#E0E0E0">â€¢ Assign Unique ID (Pagination)</text>
    <text x="330" y="200" font-family="Arial" font-size="14" fill="#E0E0E0">â€¢ Data Segmentation (NTILE)</text>
    <text x="330" y="230" font-family="Arial" font-size="14" fill="#E0E0E0">â€¢ Distribution Analysis</text>
    <text x="330" y="260" font-family="Arial" font-size="14" fill="#E0E0E0">â€¢ Equalizing Load Processing</text>

</svg>