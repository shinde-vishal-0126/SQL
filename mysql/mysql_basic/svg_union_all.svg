<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 300">
    <rect width="500" height="300" fill="#1E1E1E" rx="10"/>
    <text x="250" y="40" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#4EC9B0" text-anchor="middle">UNION ALL (All Rows)</text>
    
    <circle cx="200" cy="160" r="80" fill="#4FC1FF" opacity="0.4" stroke="#4FC1FF" stroke-width="3"/>
    <circle cx="300" cy="160" r="80" fill="#4EC9B0" opacity="0.4" stroke="#4EC9B0" stroke-width="3"/>
    
    <!-- Representing duplicates with extra overlapping circles or lines -->
    <circle cx="200" cy="160" r="70" fill="none" stroke="#E0E0E0" stroke-width="1" stroke-dasharray="4,4"/>
    <circle cx="300" cy="160" r="70" fill="none" stroke="#E0E0E0" stroke-width="1" stroke-dasharray="4,4"/>
    
    <text x="160" y="165" font-family="Arial" font-size="16" font-weight="bold" fill="#E0E0E0">Table A</text>
    <text x="340" y="165" font-family="Arial" font-size="16" font-weight="bold" fill="#E0E0E0">Table B</text>
    
    <!-- Text for duplicates -->
    <rect x="180" y="100" width="140" height="30" rx="5" fill="#2D2D30" stroke="#DCDCAA" stroke-width="2"/>
    <text x="250" y="120" font-family="Arial" font-size="12" font-weight="bold" fill="#DCDCAA" text-anchor="middle">KEEPS DUPLICATES</text>
    
    <text x="250" y="270" font-family="Arial" font-size="14" fill="#A0A0A0" text-anchor="middle">Combines everything as-is. Faster because no filtering.</text>
</svg>