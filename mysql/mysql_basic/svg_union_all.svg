<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 300">
    <rect width="500" height="300" fill="#eeeeee" rx="10"/>
    <text x="250" y="40" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#267d6b" text-anchor="middle">UNION ALL (All Rows)</text>
    
    <circle cx="200" cy="160" r="80" fill="#4FC1FF" opacity="0.4" stroke="#0072b0" stroke-width="3"/>
    <circle cx="300" cy="160" r="80" fill="#4EC9B0" opacity="0.4" stroke="#267d6b" stroke-width="3"/>
    
    <!-- Representing duplicates with extra overlapping circles or lines -->
    <circle cx="200" cy="160" r="70" fill="none" stroke="#333333" stroke-width="1" stroke-dasharray="4,4"/>
    <circle cx="300" cy="160" r="70" fill="none" stroke="#333333" stroke-width="1" stroke-dasharray="4,4"/>
    
    <text x="160" y="165" font-family="Arial" font-size="16" font-weight="bold" fill="#1f1f1f">Table A</text>
    <text x="340" y="165" font-family="Arial" font-size="16" font-weight="bold" fill="#1f1f1f">Table B</text>
    
    <!-- Text for duplicates -->
    <rect x="180" y="100" width="140" height="30" rx="5" fill="#e8e8e9" stroke="#575724" stroke-width="2"/>
    <text x="250" y="120" font-family="Arial" font-size="12" font-weight="bold" fill="#575724" text-anchor="middle">KEEPS DUPLICATES</text>
    
    <text x="250" y="270" font-family="Arial" font-size="14" fill="#5f5f5f" text-anchor="middle">Combines everything as-is. Faster because no filtering.</text>
</svg>