<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 840" width="100%" height="100%">
  <defs>
    <!-- Shadows -->
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
    <filter id="topShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000000" flood-opacity="0.18"/>
    </filter>

    <!-- Gradients -->
    <linearGradient id="bgCanvas" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>

    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>

    <linearGradient id="gradGrant" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>

    <linearGradient id="gradRevoke" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#dc2626"/>
      <stop offset="100%" stop-color="#ef4444"/>
    </linearGradient>

    <linearGradient id="gradHierarchy" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>

    <!-- Markers -->
    <marker id="arrowGreen" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L6,3 z" fill="#059669"/>
    </marker>
    <marker id="arrowRed" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L6,3 z" fill="#dc2626"/>
    </marker>
  </defs>

  <style>
    .main-title { font-family: 'Segoe UI', system-ui, sans-serif; font-weight: 900; font-size: 22px; fill: #ffffff; }
    .sub-title { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 13px; fill: #94a3b8; }
    .card-title { font-family: 'Segoe UI', system-ui, sans-serif; font-weight: 800; font-size: 14.5px; fill: #ffffff; }
    .badge { font-family: 'Segoe UI', monospace; font-size: 10px; font-weight: 800; }
    .code-sql { font-family: 'Consolas', monospace; font-size: 11.5px; font-weight: 700; }
    .label-tag { font-family: 'Segoe UI', sans-serif; font-weight: 800; font-size: 11px; }
    .body-desc { font-family: 'Segoe UI', sans-serif; font-size: 11.5px; fill: #334155; line-height: 1.4; }
    .pill-title { font-family: 'Segoe UI', sans-serif; font-weight: 800; font-size: 12px; fill: #1e293b; }
  </style>

  <!-- Background Canvas -->
  <rect width="100%" height="100%" fill="url(#bgCanvas)" rx="16"/>
  <rect width="100%" height="100%" fill="none" stroke="#cbd5e1" stroke-width="2" rx="16"/>

  <!-- Top Banner -->
  <g filter="url(#topShadow)">
    <rect x="25" y="20" width="1150" height="74" rx="12" fill="url(#headerGrad)"/>
    <text x="45" y="50" class="main-title">DCL: DATA CONTROL LANGUAGE &amp; SECURITY ARCHITECTURE</text>
    <text x="45" y="74" class="sub-title">Controlling User Access, Scopes &amp; Privileges in MySQL (GRANT, REVOKE, User Creation &amp; Scopes)</text>
  </g>

  <!-- ================= TOP ROW: GRANT & REVOKE MECHANISM ================= -->

  <!-- CARD 1: GRANT COMMAND (GIVE ACCESS) -->
  <g filter="url(#shadow)">
    <rect x="30" y="112" width="365" height="350" rx="12" fill="#ffffff" stroke="#a7f3d0" stroke-width="2"/>
    <!-- Header -->
    <path d="M 30 124 Q 30 112 42 112 L 383 112 Q 395 112 395 124 L 395 155 L 30 155 Z" fill="url(#gradGrant)"/>
    <text x="45" y="139" class="card-title">GRANT COMMAND</text>
    <rect x="270" y="122" width="115" height="24" rx="6" fill="#ffffff" fill-opacity="0.25"/>
    <text x="278" y="138" class="badge" fill="#ffffff">KEYWORD: TO</text>

    <!-- Definition Box -->
    <rect x="42" y="168" width="341" height="52" rx="6" fill="#f0fdf4" stroke="#dcfce7"/>
    <text x="52" y="186" class="label-tag" fill="#15803d">PURPOSE:</text>
    <text x="52" y="204" class="body-desc" font-weight="700" fill="#166534">Gives permissions &amp; access privileges to users.</text>

    <!-- Syntax Box -->
    <rect x="42" y="230" width="341" height="65" rx="6" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="52" y="248" class="label-tag" fill="#475569">STANDARD SYNTAX:</text>
    <text x="52" y="268" class="code-sql" fill="#065f46">GRANT SELECT, INSERT</text>
    <text x="52" y="284" class="code-sql" fill="#065f46">ON customers TO 'user'@'host';</text>

    <!-- Key Concept -->
    <rect x="42" y="305" width="341" height="95" rx="6" fill="#f1f5f9" stroke="#cbd5e1"/>
    <text x="52" y="323" class="label-tag" fill="#1e293b">BEHAVIOR &amp; PRINCIPLE:</text>
    <text x="52" y="342" class="body-desc">• Adds new privileges without touching existing ones.</text>
    <text x="52" y="360" class="body-desc">• Requires GRANT OPTION or DBA privileges.</text>
    <text x="52" y="380" class="body-desc">• Principle of Least Privilege: Grant only what is needed!</text>
    <text x="52" y="420" class="badge" fill="#059669">Effect: User receives authorized capabilities</text>
  </g>

  <!-- CARD 2: REVOKE COMMAND (REMOVE ACCESS) -->
  <g filter="url(#shadow)">
    <rect x="415" y="112" width="365" height="350" rx="12" fill="#ffffff" stroke="#fecaca" stroke-width="2"/>
    <!-- Header -->
    <path d="M 415 124 Q 415 112 427 112 L 768 112 Q 780 112 780 124 L 780 155 L 415 155 Z" fill="url(#gradRevoke)"/>
    <text x="430" y="139" class="card-title">REVOKE COMMAND</text>
    <rect x="640" y="122" width="130" height="24" rx="6" fill="#ffffff" fill-opacity="0.25"/>
    <text x="648" y="138" class="badge" fill="#ffffff">KEYWORD: FROM</text>

    <!-- Definition Box -->
    <rect x="427" y="168" width="341" height="52" rx="6" fill="#fef2f2" stroke="#fee2e2"/>
    <text x="437" y="186" class="label-tag" fill="#b91c1c">PURPOSE:</text>
    <text x="437" y="204" class="body-desc" font-weight="700" fill="#991b1b">Removes / withdraws access privileges from users.</text>

    <!-- Syntax Box -->
    <rect x="427" y="230" width="341" height="65" rx="6" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="437" y="248" class="label-tag" fill="#475569">STANDARD SYNTAX:</text>
    <text x="437" y="268" class="code-sql" fill="#991b1b">REVOKE INSERT</text>
    <text x="437" y="284" class="code-sql" fill="#991b1b">ON customers FROM 'user'@'host';</text>

    <!-- Key Concept -->
    <rect x="427" y="305" width="341" height="95" rx="6" fill="#f1f5f9" stroke="#cbd5e1"/>
    <text x="437" y="323" class="label-tag" fill="#1e293b">BEHAVIOR &amp; PRINCIPLE:</text>
    <text x="437" y="342" class="body-desc">• Strips target capability while leaving other grants intact.</text>
    <text x="437" y="360" class="body-desc">• Example: Strip DELETE to prevent destructive actions.</text>
    <text x="437" y="380" class="body-desc">• Immediate enforcement across active sessions.</text>
    <text x="437" y="420" class="badge" fill="#dc2626">Effect: User loses targeted capabilities</text>
  </g>

  <!-- CARD 3: PRIVILEGE SCOPE HIERARCHY -->
  <g filter="url(#shadow)">
    <rect x="800" y="112" width="370" height="350" rx="12" fill="#ffffff" stroke="#c7d2fe" stroke-width="2"/>
    <!-- Header -->
    <path d="M 800 124 Q 800 112 812 112 L 1158 112 Q 1170 112 1170 124 L 1170 155 L 800 155 Z" fill="url(#gradHierarchy)"/>
    <text x="815" y="139" class="card-title">PRIVILEGE SCOPES (LEVELS)</text>
    <rect x="1055" y="122" width="105" height="24" rx="6" fill="#ffffff" fill-opacity="0.25"/>
    <text x="1062" y="138" class="badge" fill="#ffffff">4 HIERARCHIES</text>

    <!-- Scope Levels -->
    <rect x="812" y="168" width="346" height="52" rx="6" fill="#eef2ff" stroke="#e0e7ff"/>
    <text x="822" y="186" class="label-tag" fill="#3730a3">1. GLOBAL LEVEL (*.*):</text>
    <text x="822" y="204" class="body-desc">Applies to all databases &amp; tables on MySQL server.</text>

    <rect x="812" y="228" width="346" height="52" rx="6" fill="#f5f3ff" stroke="#ede9fe"/>
    <text x="822" y="246" class="label-tag" fill="#5b21b6">2. DATABASE LEVEL (salesdb.*):</text>
    <text x="822" y="264" class="body-desc">Applies to all tables inside a specific database.</text>

    <rect x="812" y="288" width="346" height="52" rx="6" fill="#eff6ff" stroke="#dbeafe"/>
    <text x="822" y="306" class="label-tag" fill="#1e40af">3. TABLE LEVEL (salesdb.customers):</text>
    <text x="822" y="324" class="body-desc">Applies strictly to one individual table.</text>

    <rect x="812" y="348" width="346" height="52" rx="6" fill="#ecfdf5" stroke="#d1fae5"/>
    <text x="822" y="366" class="label-tag" fill="#065f46">4. COLUMN LEVEL (SELECT (id, score)):</text>
    <text x="822" y="384" class="body-desc">Ultra-granular: user can only see specific columns.</text>

    <text x="822" y="425" class="badge" fill="#4f46e5">Scope cascades downward: Global → DB → Table → Column</text>
  </g>

  <!-- ================= BOTTOM ROW: 6 CORE PRIVILEGE CATEGORIES ================= -->
  <g filter="url(#shadow)">
    <rect x="30" y="480" width="1140" height="295" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
    <!-- Banner -->
    <rect x="30" y="480" width="1140" height="36" rx="12" fill="#1e293b"/>
    <text x="48" y="504" class="card-title">THE 6 MAIN PRIVILEGE CATEGORIES IN MySQL (36+ AVAILABLE TYPES)</text>

    <!-- 6 Columns -->
    <!-- Col 1: Data / DML -->
    <rect x="45" y="530" width="170" height="225" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
    <rect x="45" y="530" width="170" height="28" rx="8" fill="#2563eb"/>
    <text x="55" y="549" class="badge" fill="#ffffff">1. DATA (DML)</text>
    <text x="55" y="575" class="code-sql" fill="#1d4ed8">• SELECT</text>
    <text x="55" y="595" class="code-sql" fill="#1d4ed8">• INSERT</text>
    <text x="55" y="615" class="code-sql" fill="#1d4ed8">• UPDATE</text>
    <text x="55" y="635" class="code-sql" fill="#1d4ed8">• DELETE</text>
    <text x="55" y="670" class="body-desc" font-size="10.5px">Controls reading and modifying row records inside tables.</text>

    <!-- Col 2: Structure / DDL -->
    <rect x="230" y="530" width="170" height="225" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
    <rect x="230" y="530" width="170" height="28" rx="8" fill="#7c3aed"/>
    <text x="240" y="549" class="badge" fill="#ffffff">2. STRUCTURE (DDL)</text>
    <text x="240" y="575" class="code-sql" fill="#6d28d9">• CREATE</text>
    <text x="240" y="595" class="code-sql" fill="#6d28d9">• DROP</text>
    <text x="240" y="615" class="code-sql" fill="#6d28d9">• ALTER</text>
    <text x="240" y="635" class="code-sql" fill="#6d28d9">• INDEX</text>
    <text x="240" y="670" class="body-desc" font-size="10.5px">Controls creating, modifying, and destroying schemas &amp; tables.</text>

    <!-- Col 3: Administration -->
    <rect x="415" y="530" width="170" height="225" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
    <rect x="415" y="530" width="170" height="28" rx="8" fill="#d97706"/>
    <text x="425" y="549" class="badge" fill="#ffffff">3. ADMINISTRATIVE</text>
    <text x="425" y="575" class="code-sql" fill="#b45309">• GRANT OPTION</text>
    <text x="425" y="595" class="code-sql" fill="#b45309">• SUPER</text>
    <text x="425" y="615" class="code-sql" fill="#b45309">• RELOAD</text>
    <text x="425" y="635" class="code-sql" fill="#b45309">• SHUTDOWN</text>
    <text x="425" y="670" class="body-desc" font-size="10.5px">Server management, flush commands, and user delegation.</text>

    <!-- Col 4: Replication -->
    <rect x="600" y="530" width="170" height="225" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
    <rect x="600" y="530" width="170" height="28" rx="8" fill="#0d9488"/>
    <text x="610" y="549" class="badge" fill="#ffffff">4. REPLICATION</text>
    <text x="610" y="575" class="code-sql" fill="#0f766e">• REPL SLAVE</text>
    <text x="610" y="595" class="code-sql" fill="#0f766e">• REPL CLIENT</text>
    <text x="610" y="615" class="code-sql" fill="#0f766e">• BINLOG DUMP</text>
    <text x="610" y="670" class="body-desc" font-size="10.5px">Allows replica nodes to stream binlogs from primary master.</text>

    <!-- Col 5: Security & Processes -->
    <rect x="785" y="530" width="170" height="225" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
    <rect x="785" y="530" width="170" height="28" rx="8" fill="#e11d48"/>
    <text x="795" y="549" class="badge" fill="#ffffff">5. SECURITY &amp; PROCESS</text>
    <text x="795" y="575" class="code-sql" fill="#be123c">• CREATE USER</text>
    <text x="795" y="595" class="code-sql" fill="#be123c">• PROCESS</text>
    <text x="795" y="615" class="code-sql" fill="#be123c">• SHOW DATABASES</text>
    <text x="795" y="670" class="body-desc" font-size="10.5px">User management, process inspection, and listing databases.</text>

    <!-- Col 6: Proxy -->
    <rect x="970" y="530" width="185" height="225" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
    <rect x="970" y="530" width="185" height="28" rx="8" fill="#475569"/>
    <text x="980" y="549" class="badge" fill="#ffffff">6. PROXY PRIVILEGE</text>
    <text x="980" y="575" class="code-sql" fill="#334155">• PROXY</text>
    <text x="980" y="615" class="body-desc" font-size="10.5px" font-weight="700">Impersonation Role:</text>
    <text x="980" y="635" class="body-desc" font-size="10.5px">Allows one user account to assume the identity of another user.</text>
  </g>

  <!-- Bottom Footer Bar -->
  <rect x="30" y="790" width="1140" height="32" rx="6" fill="#e2e8f0"/>
  <text x="45" y="811" class="body-desc" font-weight="700" fill="#334155">💡 CORE RULE: Always execute FLUSH PRIVILEGES after manual privilege changes to ensure the grant tables are immediately reloaded in memory.</text>
</svg>
