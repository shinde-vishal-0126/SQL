<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 250">
    <rect width="600" height="250" fill="#1E1E1E" rx="10"/>
    <text x="300" y="30" font-family="Arial" font-size="18" font-weight="bold" fill="#C586C0" text-anchor="middle">Ranking Functions (Handling Ties)</text>
    
    <text x="50" y="60" font-family="Arial" font-size="12" font-weight="bold" fill="#E0E0E0" text-anchor="start">Data: 100, 100, 80</text>
    
    <!-- ROW_NUMBER -->
    <rect x="30" y="80" width="160" height="140" fill="#2D2D30" stroke="#3E3E42" stroke-width="2"/>
    <text x="110" y="105" font-family="Arial" font-size="14" font-weight="bold" fill="#4FC1FF" text-anchor="middle">ROW_NUMBER()</text>
    <text x="110" y="130" font-family="Courier New" font-size="14" fill="#E0E0E0" text-anchor="middle">100 -> 1</text>
    <text x="110" y="150" font-family="Courier New" font-size="14" fill="#E0E0E0" text-anchor="middle">100 -> 2</text>
    <text x="110" y="170" font-family="Courier New" font-size="14" fill="#E0E0E0" text-anchor="middle"> 80 -> 3</text>
    <text x="110" y="200" font-family="Arial" font-size="10" fill="#F44747" text-anchor="middle">No Ties, Unique</text>

    <!-- RANK -->
    <rect x="220" y="80" width="160" height="140" fill="#2D2D30" stroke="#3E3E42" stroke-width="2"/>
    <text x="300" y="105" font-family="Arial" font-size="14" font-weight="bold" fill="#4EC9B0" text-anchor="middle">RANK()</text>
    <text x="300" y="130" font-family="Courier New" font-size="14" fill="#E0E0E0" text-anchor="middle">100 -> 1</text>
    <text x="300" y="150" font-family="Courier New" font-size="14" fill="#E0E0E0" text-anchor="middle">100 -> 1</text>
    <text x="300" y="170" font-family="Courier New" font-size="14" fill="#E0E0E0" text-anchor="middle"> 80 -> 3</text>
    <text x="300" y="200" font-family="Arial" font-size="10" fill="#F44747" text-anchor="middle">Ties allowed, Skips 2</text>

    <!-- DENSE_RANK -->
    <rect x="410" y="80" width="160" height="140" fill="#2D2D30" stroke="#3E3E42" stroke-width="2"/>
    <text x="490" y="105" font-family="Arial" font-size="14" font-weight="bold" fill="#DCDCAA" text-anchor="middle">DENSE_RANK()</text>
    <text x="490" y="130" font-family="Courier New" font-size="14" fill="#E0E0E0" text-anchor="middle">100 -> 1</text>
    <text x="490" y="150" font-family="Courier New" font-size="14" fill="#E0E0E0" text-anchor="middle">100 -> 1</text>
    <text x="490" y="170" font-family="Courier New" font-size="14" fill="#E0E0E0" text-anchor="middle"> 80 -> 2</text>
    <text x="490" y="200" font-family="Arial" font-size="10" fill="#F44747" text-anchor="middle">Ties allowed, NO Gaps</text>
</svg>