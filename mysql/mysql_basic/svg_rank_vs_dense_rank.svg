<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 250">
    <rect width="600" height="250" fill="#eeeeee" rx="10"/>
    <text x="300" y="30" font-family="Arial" font-size="18" font-weight="bold" fill="#793a74" text-anchor="middle">Ranking Functions (Handling Ties)</text>
    
    <text x="50" y="60" font-family="Arial" font-size="12" font-weight="bold" fill="#1f1f1f" text-anchor="start">Data: 100, 100, 80</text>
    
    <!-- ROW_NUMBER -->
    <rect x="30" y="80" width="160" height="140" fill="#e8e8e9" stroke="#b1b1b6" stroke-width="2"/>
    <text x="110" y="105" font-family="Arial" font-size="14" font-weight="bold" fill="#0072b0" text-anchor="middle">ROW_NUMBER()</text>
    <text x="110" y="130" font-family="Courier New" font-size="14" fill="#1f1f1f" text-anchor="middle">100 -> 1</text>
    <text x="110" y="150" font-family="Courier New" font-size="14" fill="#1f1f1f" text-anchor="middle">100 -> 2</text>
    <text x="110" y="170" font-family="Courier New" font-size="14" fill="#1f1f1f" text-anchor="middle"> 80 -> 3</text>
    <text x="110" y="200" font-family="Arial" font-size="10" fill="#b80b0b" text-anchor="middle">No Ties, Unique</text>

    <!-- RANK -->
    <rect x="220" y="80" width="160" height="140" fill="#e8e8e9" stroke="#b1b1b6" stroke-width="2"/>
    <text x="300" y="105" font-family="Arial" font-size="14" font-weight="bold" fill="#267d6b" text-anchor="middle">RANK()</text>
    <text x="300" y="130" font-family="Courier New" font-size="14" fill="#1f1f1f" text-anchor="middle">100 -> 1</text>
    <text x="300" y="150" font-family="Courier New" font-size="14" fill="#1f1f1f" text-anchor="middle">100 -> 1</text>
    <text x="300" y="170" font-family="Courier New" font-size="14" fill="#1f1f1f" text-anchor="middle"> 80 -> 3</text>
    <text x="300" y="200" font-family="Arial" font-size="10" fill="#b80b0b" text-anchor="middle">Ties allowed, Skips 2</text>

    <!-- DENSE_RANK -->
    <rect x="410" y="80" width="160" height="140" fill="#e8e8e9" stroke="#b1b1b6" stroke-width="2"/>
    <text x="490" y="105" font-family="Arial" font-size="14" font-weight="bold" fill="#575724" text-anchor="middle">DENSE_RANK()</text>
    <text x="490" y="130" font-family="Courier New" font-size="14" fill="#1f1f1f" text-anchor="middle">100 -> 1</text>
    <text x="490" y="150" font-family="Courier New" font-size="14" fill="#1f1f1f" text-anchor="middle">100 -> 1</text>
    <text x="490" y="170" font-family="Courier New" font-size="14" fill="#1f1f1f" text-anchor="middle"> 80 -> 2</text>
    <text x="490" y="200" font-family="Arial" font-size="10" fill="#b80b0b" text-anchor="middle">Ties allowed, NO Gaps</text>
</svg>