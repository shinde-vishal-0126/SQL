<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 250">
    <rect width="600" height="250" fill="#eeeeee" rx="10"/>
    <text x="300" y="30" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#575724" text-anchor="middle">CASE Statement Summary</text>
    
    <text x="50" y="60" font-family="Arial" font-size="14" fill="#1f1f1f" text-anchor="start">Evaluates a list of conditions and returns a value when the FIRST condition is met.</text>
    
    <rect x="50" y="80" width="60" height="20" fill="#F44747" rx="3"/>
    <text x="80" y="94" font-family="Arial" font-size="12" font-weight="bold" fill="#1E1E1E" text-anchor="middle">RULES</text>
    <text x="120" y="94" font-family="Arial" font-size="14" fill="#1f1f1f" text-anchor="start">The data type of the results must be matching.</text>
    <text x="120" y="114" font-family="Arial" font-size="14" fill="#1f1f1f" text-anchor="start">Can be used anywhere in the query (SELECT, ORDER BY).</text>

    <rect x="50" y="130" width="90" height="20" fill="#4EC9B0" rx="3"/>
    <text x="95" y="144" font-family="Arial" font-size="12" font-weight="bold" fill="#1E1E1E" text-anchor="middle">USE CASES</text>
    
    <circle cx="160" cy="160" r="5" fill="#4FC1FF"/>
    <text x="175" y="165" font-family="Courier New" font-size="14" fill="#1f1f1f" text-anchor="start">1. Categorizing Data (High/Med/Low)</text>
    
    <circle cx="160" cy="180" r="5" fill="#4FC1FF"/>
    <text x="175" y="185" font-family="Courier New" font-size="14" fill="#1f1f1f" text-anchor="start">2. Mapping Values (f -> Female)</text>
    
    <circle cx="160" cy="200" r="5" fill="#4FC1FF"/>
    <text x="175" y="205" font-family="Courier New" font-size="14" fill="#1f1f1f" text-anchor="start">3. Handling NULLs</text>
    
    <circle cx="160" cy="220" r="5" fill="#4FC1FF"/>
    <text x="175" y="225" font-family="Courier New" font-size="14" fill="#1f1f1f" text-anchor="start">4. Conditional Aggregations</text>
</svg>