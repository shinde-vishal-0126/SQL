<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1150 620" width="100%" height="100%">
  <defs>
    <linearGradient id="bgDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="50%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <linearGradient id="yellowHeader" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>

    <filter id="shadowFilter" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.5"/>
    </filter>

    <marker id="arrowGold" markerWidth="8" markerHeight="8" refX="5" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#fbbf24"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1150" height="620" rx="16" fill="url(#bgDark)" stroke="#1e293b" stroke-width="2"/>

  <!-- Subtle Blueprint Grid -->
  <g opacity="0.10">
    <path d="M0,70 L1150,70 M0,140 L1150,140 M0,210 L1150,210 M0,280 L1150,280 M0,350 L1150,350 M0,420 L1150,420 M0,490 L1150,490 M0,560 L1150,560" stroke="#475569" stroke-width="1"/>
    <path d="M115,0 L115,620 M230,0 L230,620 M345,0 L345,620 M460,0 L460,620 M575,0 L575,620 M690,0 L690,620 M805,0 L805,620 M920,0 L920,620 M1035,0 L1035,620" stroke="#475569" stroke-width="1"/>
  </g>

  <!-- Title Header -->
  <g transform="translate(575, 45)" text-anchor="middle">
    <text font-family="'Segoe UI', Roboto, sans-serif" font-size="26" font-weight="bold" fill="#f8fafc">SQL WHERE Clause: Operator Taxonomy &amp; Classification</text>
    <text y="25" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" fill="#94a3b8">The WHERE clause filters rows using 5 specialized families of operators to evaluate boolean conditions</text>
  </g>

  <!-- Top Root Node: WHERE Operators -->
  <g transform="translate(450, 105)" filter="url(#shadowFilter)">
    <rect width="250" height="64" rx="10" fill="#1e293b" stroke="#fbbf24" stroke-width="2.5"/>
    <rect x="0" y="0" width="250" height="26" rx="10" fill="url(#yellowHeader)"/>
    <rect x="0" y="16" width="250" height="10" fill="url(#yellowHeader)"/>
    <!-- Filter Funnel Icon -->
    <g transform="translate(20, 16)">
      <path d="M0 0 L16 0 L10 8 L10 15 L6 13 L6 8 Z" fill="#0f172a"/>
    </g>
    <text x="135" y="18" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="bold" fill="#0f172a" text-anchor="middle">WHERE CLAUSE</text>
    <text x="125" y="48" font-family="'Segoe UI', sans-serif" font-size="18" font-weight="bold" fill="#f8fafc" text-anchor="middle">operators</text>
  </g>

  <!-- Tree Branch Connectors -->
  <!-- Center Stem Down -->
  <line x1="575" y1="169" x2="575" y2="200" stroke="#fbbf24" stroke-width="2.5"/>
  <!-- Horizontal Distribution Bus -->
  <line x1="140" y1="200" x2="1010" y2="200" stroke="#64748b" stroke-width="2"/>
  <circle cx="575" cy="200" r="4" fill="#fbbf24"/>

  <!-- Vertical drops to 5 cards -->
  <line x1="140" y1="200" x2="140" y2="235" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrowGold)"/>
  <line x1="357" y1="200" x2="357" y2="235" stroke="#34d399" stroke-width="2" marker-end="url(#arrowGold)"/>
  <line x1="575" y1="200" x2="575" y2="235" stroke="#f59e0b" stroke-width="2" marker-end="url(#arrowGold)"/>
  <line x1="792" y1="200" x2="792" y2="235" stroke="#c084fc" stroke-width="2" marker-end="url(#arrowGold)"/>
  <line x1="1010" y1="200" x2="1010" y2="235" stroke="#f43f5e" stroke-width="2" marker-end="url(#arrowGold)"/>

  <!-- ========================================================================= -->
  <!-- 1. COMPARISON OPERATORS CARD -->
  <!-- ========================================================================= -->
  <g transform="translate(40, 240)" filter="url(#shadowFilter)">
    <rect width="200" height="350" rx="10" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/>
    <!-- Header Banner -->
    <path d="M0,10 Q0,0 10,0 L190,0 Q200,0 200,10 L200,48 L0,48 Z" fill="#0369a1"/>
    <text x="100" y="22" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">Comparison</text>
    <text x="100" y="39" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="bold" fill="#bae6fd" text-anchor="middle">Operators</text>

    <!-- Operators Pills / Rows -->
    <g transform="translate(20, 62)">
      <!-- = -->
      <rect width="160" height="34" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1.2"/>
      <text x="80" y="23" font-family="'Fira Code', monospace" font-size="20" font-weight="bold" fill="#38bdf8" text-anchor="middle">=</text>
      
      <!-- <> != -->
      <g transform="translate(0, 42)">
        <rect width="160" height="34" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1.2"/>
        <text x="80" y="23" font-family="'Fira Code', monospace" font-size="17" font-weight="bold" fill="#38bdf8" text-anchor="middle">&lt;&gt;   !=</text>
      </g>

      <!-- > -->
      <g transform="translate(0, 84)">
        <rect width="160" height="34" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1.2"/>
        <text x="80" y="23" font-family="'Fira Code', monospace" font-size="20" font-weight="bold" fill="#38bdf8" text-anchor="middle">&gt;</text>
      </g>

      <!-- >= -->
      <g transform="translate(0, 126)">
        <rect width="160" height="34" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1.2"/>
        <text x="80" y="23" font-family="'Fira Code', monospace" font-size="18" font-weight="bold" fill="#38bdf8" text-anchor="middle">&gt;=</text>
      </g>

      <!-- < -->
      <g transform="translate(0, 168)">
        <rect width="160" height="34" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1.2"/>
        <text x="80" y="23" font-family="'Fira Code', monospace" font-size="20" font-weight="bold" fill="#38bdf8" text-anchor="middle">&lt;</text>
      </g>

      <!-- <= -->
      <g transform="translate(0, 210)">
        <rect width="160" height="34" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1.2"/>
        <text x="80" y="23" font-family="'Fira Code', monospace" font-size="18" font-weight="bold" fill="#38bdf8" text-anchor="middle">&lt;=</text>
      </g>
    </g>

    <text x="100" y="328" font-family="'Segoe UI', sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">Compare two things / values</text>
  </g>

  <!-- ========================================================================= -->
  <!-- 2. LOGICAL OPERATORS CARD -->
  <!-- ========================================================================= -->
  <g transform="translate(257, 240)" filter="url(#shadowFilter)">
    <rect width="200" height="350" rx="10" fill="#0f172a" stroke="#34d399" stroke-width="2"/>
    <!-- Header Banner -->
    <path d="M0,10 Q0,0 10,0 L190,0 Q200,0 200,10 L200,48 L0,48 Z" fill="#047857"/>
    <text x="100" y="22" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">Logical</text>
    <text x="100" y="39" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="bold" fill="#a7f3d0" text-anchor="middle">Operators</text>

    <!-- Operators Pills -->
    <g transform="translate(20, 75)">
      <!-- AND -->
      <rect width="160" height="42" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1.2"/>
      <text x="80" y="27" font-family="'Fira Code', monospace" font-size="18" font-weight="bold" fill="#34d399" text-anchor="middle">AND</text>
      
      <!-- OR -->
      <g transform="translate(0, 58)">
        <rect width="160" height="42" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1.2"/>
        <text x="80" y="27" font-family="'Fira Code', monospace" font-size="18" font-weight="bold" fill="#34d399" text-anchor="middle">OR</text>
      </g>

      <!-- NOT -->
      <g transform="translate(0, 116)">
        <rect width="160" height="42" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1.2"/>
        <text x="80" y="27" font-family="'Fira Code', monospace" font-size="18" font-weight="bold" fill="#34d399" text-anchor="middle">NOT</text>
      </g>
    </g>

    <text x="100" y="315" font-family="'Segoe UI', sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">Combines multiple conditions</text>
    <text x="100" y="330" font-family="'Segoe UI', sans-serif" font-size="10" fill="#64748b" text-anchor="middle">(Boolean algebra)</text>
  </g>

  <!-- ========================================================================= -->
  <!-- 3. RANGE OPERATOR CARD -->
  <!-- ========================================================================= -->
  <g transform="translate(475, 240)" filter="url(#shadowFilter)">
    <rect width="200" height="350" rx="10" fill="#0f172a" stroke="#f59e0b" stroke-width="2"/>
    <!-- Header Banner -->
    <path d="M0,10 Q0,0 10,0 L190,0 Q200,0 200,10 L200,48 L0,48 Z" fill="#b45309"/>
    <text x="100" y="22" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">Range</text>
    <text x="100" y="39" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="bold" fill="#fde68a" text-anchor="middle">Operator</text>

    <!-- Operators Pills -->
    <g transform="translate(20, 100)">
      <!-- BETWEEN -->
      <rect width="160" height="48" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1.2"/>
      <text x="80" y="30" font-family="'Fira Code', monospace" font-size="18" font-weight="bold" fill="#fbbf24" text-anchor="middle">BETWEEN</text>
    </g>

    <text x="100" y="280" font-family="'Segoe UI', sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">Inclusive range filtering</text>
    <text x="100" y="298" font-family="'Fira Code', monospace" font-size="10" fill="#cbd5e1" text-anchor="middle">val BETWEEN a AND b</text>
    <text x="100" y="325" font-family="'Segoe UI', sans-serif" font-size="10" fill="#64748b" text-anchor="middle">(Includes boundary limits)</text>
  </g>

  <!-- ========================================================================= -->
  <!-- 4. MEMBERSHIP OPERATOR CARD -->
  <!-- ========================================================================= -->
  <g transform="translate(692, 240)" filter="url(#shadowFilter)">
    <rect width="200" height="350" rx="10" fill="#0f172a" stroke="#c084fc" stroke-width="2"/>
    <!-- Header Banner -->
    <path d="M0,10 Q0,0 10,0 L190,0 Q200,0 200,10 L200,48 L0,48 Z" fill="#6b21a8"/>
    <text x="100" y="22" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">Membership</text>
    <text x="100" y="39" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="bold" fill="#e9d5ff" text-anchor="middle">Operator</text>

    <!-- Operators Pills -->
    <g transform="translate(20, 85)">
      <!-- IN -->
      <rect width="160" height="42" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1.2"/>
      <text x="80" y="27" font-family="'Fira Code', monospace" font-size="18" font-weight="bold" fill="#c084fc" text-anchor="middle">IN</text>
      
      <!-- NOT IN -->
      <g transform="translate(0, 60)">
        <rect width="160" height="42" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1.2"/>
        <text x="80" y="27" font-family="'Fira Code', monospace" font-size="17" font-weight="bold" fill="#c084fc" text-anchor="middle">NOT IN</text>
      </g>
    </g>

    <text x="100" y="285" font-family="'Segoe UI', sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">Matches set / list of values</text>
    <text x="100" y="303" font-family="'Fira Code', monospace" font-size="10" fill="#cbd5e1" text-anchor="middle">col IN ('US', 'DE', 'UK')</text>
    <text x="100" y="325" font-family="'Segoe UI', sans-serif" font-size="10" fill="#64748b" text-anchor="middle">(Discrete membership check)</text>
  </g>

  <!-- ========================================================================= -->
  <!-- 5. SEARCH OPERATOR CARD -->
  <!-- ========================================================================= -->
  <g transform="translate(910, 240)" filter="url(#shadowFilter)">
    <rect width="200" height="350" rx="10" fill="#0f172a" stroke="#f43f5e" stroke-width="2"/>
    <!-- Header Banner -->
    <path d="M0,10 Q0,0 10,0 L190,0 Q200,0 200,10 L200,48 L0,48 Z" fill="#9f1239"/>
    <text x="100" y="22" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">Search</text>
    <text x="100" y="39" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="bold" fill="#fecdd3" text-anchor="middle">Operator</text>

    <!-- Operators Pills -->
    <g transform="translate(20, 100)">
      <!-- LIKE -->
      <rect width="160" height="48" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1.2"/>
      <text x="80" y="30" font-family="'Fira Code', monospace" font-size="18" font-weight="bold" fill="#fb7185" text-anchor="middle">LIKE</text>
    </g>

    <text x="100" y="280" font-family="'Segoe UI', sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">Wildcard pattern matching</text>
    <text x="100" y="298" font-family="'Fira Code', monospace" font-size="10" fill="#cbd5e1" text-anchor="middle">% (any) and _ (single)</text>
    <text x="100" y="325" font-family="'Segoe UI', sans-serif" font-size="10" fill="#64748b" text-anchor="middle">(String search predicate)</text>
  </g>
</svg>
