<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 350">
    <rect width="600" height="350" fill="#eeeeee" rx="10"/>
    <text x="300" y="30" font-family="Arial" font-size="20" font-weight="bold" fill="#575724" text-anchor="middle">VALUE FUNCTIONS (Analytics)</text>
    <text x="300" y="50" font-family="Arial" font-size="14" fill="#1f1f1f" text-anchor="middle">Access a value from other Row without JOINs</text>
    
    <!-- Rows -->
    <rect x="50" y="90" width="50" height="40" fill="#e8e8e9" stroke="#b1b1b6"/>
    <text x="75" y="115" font-family="Courier New" font-size="16" fill="#1f1f1f" text-anchor="middle">20</text>
    <text x="75" y="85" font-family="Arial" font-size="12" fill="#0072b0" text-anchor="middle">FIRST</text>

    <rect x="150" y="90" width="50" height="40" fill="#e8e8e9" stroke="#b1b1b6"/>
    <text x="175" y="115" font-family="Courier New" font-size="16" fill="#1f1f1f" text-anchor="middle">10</text>
    <text x="175" y="85" font-family="Arial" font-size="12" fill="#793a74" text-anchor="middle">LAG (Prev)</text>

    <rect x="250" y="90" width="80" height="40" fill="#4EC9B0" stroke="#b1b1b6"/>
    <text x="290" y="115" font-family="Courier New" font-size="16" font-weight="bold" fill="#000000" text-anchor="middle">30</text>
    <text x="290" y="85" font-family="Arial" font-size="12" font-weight="bold" fill="#267d6b" text-anchor="middle">CURRENT</text>

    <rect x="380" y="90" width="50" height="40" fill="#e8e8e9" stroke="#b1b1b6"/>
    <text x="405" y="115" font-family="Courier New" font-size="16" fill="#1f1f1f" text-anchor="middle">5</text>
    <text x="405" y="85" font-family="Arial" font-size="12" fill="#793a74" text-anchor="middle">LEAD (Next)</text>

    <rect x="480" y="90" width="50" height="40" fill="#e8e8e9" stroke="#b1b1b6"/>
    <text x="505" y="115" font-family="Courier New" font-size="16" fill="#1f1f1f" text-anchor="middle">40</text>
    <text x="505" y="85" font-family="Arial" font-size="12" fill="#0072b0" text-anchor="middle">LAST</text>

    <!-- Arrows -->
    <!-- LAG -->
    <path d="M 250 110 Q 212 110 200 110" fill="none" stroke="#793a74" stroke-width="2" marker-end="url(#arrow_purple)"/>
    <!-- LEAD -->
    <path d="M 330 110 Q 355 110 380 110" fill="none" stroke="#793a74" stroke-width="2" marker-end="url(#arrow_purple)"/>
    <!-- FIRST -->
    <path d="M 270 90 Q 170 30 75 90" fill="none" stroke="#0072b0" stroke-width="2" marker-end="url(#arrow_blue)"/>
    <!-- LAST -->
    <path d="M 310 90 Q 400 30 505 90" fill="none" stroke="#0072b0" stroke-width="2" marker-end="url(#arrow_blue)"/>

    <!-- Syntax Rules -->
    <rect x="50" y="170" width="500" height="150" fill="#e8e8e9" stroke="#b1b1b6"/>
    <text x="300" y="190" font-family="Arial" font-size="16" font-weight="bold" fill="#575724" text-anchor="middle">Syntax Rules for Value Functions</text>
    
    <text x="80" y="220" font-family="Courier New" font-size="14" fill="#793a74">LEAD / LAG :</text>
    <text x="250" y="220" font-family="Arial" font-size="14" fill="#1f1f1f">FRAME is NOT allowed</text>

    <text x="80" y="250" font-family="Courier New" font-size="14" fill="#0072b0">FIRST_VALUE :</text>
    <text x="250" y="250" font-family="Arial" font-size="14" fill="#1f1f1f">FRAME is Optional</text>

    <text x="80" y="280" font-family="Courier New" font-size="14" fill="#0072b0">LAST_VALUE :</text>
    <text x="250" y="280" font-family="Arial" font-size="14" fill="#1f1f1f">FRAME Should be used (Default stops at current)</text>

    <text x="300" y="310" font-family="Arial" font-size="14" font-style="italic" fill="#b80b0b" text-anchor="middle">Note: ORDER BY is REQUIRED for all Value Functions</text>

    <defs>
        <marker id="arrow_purple" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
            <path d="M0,0 L0,6 L9,3 z" fill="#C586C0" />
        </marker>
        <marker id="arrow_blue" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
            <path d="M0,0 L0,6 L9,3 z" fill="#4FC1FF" />
        </marker>
    </defs>
</svg>