<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
    <rect width="800" height="400" fill="#1E1E1E" rx="10"/>
    <text x="400" y="40" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#DCDCAA" text-anchor="middle">JOINs vs SET Operators</text>
    
    <!-- JOIN SIDE (Left) -->
    <rect x="50" y="70" width="300" height="300" rx="10" fill="#2D2D30" stroke="#4FC1FF" stroke-width="2"/>
    <text x="200" y="100" font-family="Arial" font-size="18" font-weight="bold" fill="#4FC1FF" text-anchor="middle">JOIN (Horizontal Merging)</text>
    <text x="200" y="125" font-family="Arial" font-size="12" fill="#A0A0A0" text-anchor="middle">Combines Columns side-by-side</text>
    
    <!-- Table A -->
    <rect x="90" y="150" width="60" height="80" fill="#1E1E1E" stroke="#3E3E42" stroke-width="2"/>
    <rect x="90" y="150" width="60" height="20" fill="#4FC1FF" opacity="0.3"/>
    
    <!-- Table B -->
    <rect x="170" y="150" width="60" height="80" fill="#1E1E1E" stroke="#3E3E42" stroke-width="2"/>
    <rect x="170" y="150" width="60" height="20" fill="#4EC9B0" opacity="0.3"/>
    
    <!-- Plus and Equals -->
    <text x="160" y="195" font-family="Arial" font-size="20" font-weight="bold" fill="#E0E0E0" text-anchor="middle">+</text>
    <text x="250" y="195" font-family="Arial" font-size="20" font-weight="bold" fill="#E0E0E0" text-anchor="middle">=</text>
    
    <!-- Result JOIN -->
    <rect x="270" y="150" width="60" height="80" fill="#1E1E1E" stroke="#3E3E42" stroke-width="2"/>
    <rect x="270" y="150" width="30" height="80" fill="#4FC1FF" opacity="0.3"/>
    <rect x="300" y="150" width="30" height="80" fill="#4EC9B0" opacity="0.3"/>
    
    <text x="200" y="270" font-family="Arial" font-size="14" fill="#E0E0E0" text-anchor="middle">Requires PK/FK Relationship</text>
    <text x="200" y="295" font-family="Arial" font-size="14" fill="#E0E0E0" text-anchor="middle">Table becomes WIDER</text>

    <!-- SET SIDE (Right) -->
    <rect x="450" y="70" width="300" height="300" rx="10" fill="#2D2D30" stroke="#C586C0" stroke-width="2"/>
    <text x="600" y="100" font-family="Arial" font-size="18" font-weight="bold" fill="#C586C0" text-anchor="middle">SET (Vertical Stacking)</text>
    <text x="600" y="125" font-family="Arial" font-size="12" fill="#A0A0A0" text-anchor="middle">Combines Rows top-to-bottom</text>

    <!-- Query A -->
    <rect x="490" y="150" width="80" height="40" fill="#1E1E1E" stroke="#3E3E42" stroke-width="2"/>
    <rect x="490" y="150" width="80" height="15" fill="#C586C0" opacity="0.3"/>
    
    <!-- Query B -->
    <rect x="490" y="210" width="80" height="40" fill="#1E1E1E" stroke="#3E3E42" stroke-width="2"/>
    <rect x="490" y="210" width="80" height="15" fill="#DCDCAA" opacity="0.3"/>
    
    <!-- Plus and Equals -->
    <text x="530" y="205" font-family="Arial" font-size="20" font-weight="bold" fill="#E0E0E0" text-anchor="middle">+</text>
    <text x="600" y="195" font-family="Arial" font-size="20" font-weight="bold" fill="#E0E0E0" text-anchor="middle">=</text>
    
    <!-- Result SET -->
    <rect x="630" y="150" width="80" height="80" fill="#1E1E1E" stroke="#3E3E42" stroke-width="2"/>
    <rect x="630" y="150" width="80" height="40" fill="#C586C0" opacity="0.3"/>
    <rect x="630" y="190" width="80" height="40" fill="#DCDCAA" opacity="0.3"/>

    <text x="600" y="270" font-family="Arial" font-size="14" fill="#E0E0E0" text-anchor="middle">NO Relationship Required</text>
    <text x="600" y="295" font-family="Arial" font-size="14" fill="#E0E0E0" text-anchor="middle">Table becomes LONGER</text>
</svg>