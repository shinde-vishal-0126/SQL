<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600">
    <rect width="900" height="600" fill="#1E1E1E" rx="10"/>
    
    <!-- Title -->
    <text x="450" y="40" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#FFD700" text-anchor="middle">3-Tier Database Architecture</text>
    
    <!-- View Level (External) -->
    <rect x="150" y="80" width="600" height="120" fill="#2D2D30" stroke="#C586C0" stroke-width="3" rx="10"/>
    <text x="450" y="110" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#C586C0" text-anchor="middle">1. View Level (External Layer)</text>
    <text x="450" y="135" font-family="Arial, sans-serif" font-size="16" fill="#E0E0E0" text-anchor="middle">Highest Level of Abstraction</text>
    <rect x="250" y="150" width="100" height="30" fill="#3E3E42" rx="5"/>
    <text x="300" y="170" font-family="Arial, sans-serif" font-size="14" fill="#E0E0E0" text-anchor="middle">View 1</text>
    <rect x="400" y="150" width="100" height="30" fill="#3E3E42" rx="5"/>
    <text x="450" y="170" font-family="Arial, sans-serif" font-size="14" fill="#E0E0E0" text-anchor="middle">View 2</text>
    <rect x="550" y="150" width="100" height="30" fill="#3E3E42" rx="5"/>
    <text x="600" y="170" font-family="Arial, sans-serif" font-size="14" fill="#E0E0E0" text-anchor="middle">View 3</text>
    
    <!-- Connector 1 -->
    <path d="M 450 200 L 450 240" fill="none" stroke="#E0E0E0" stroke-width="2" stroke-dasharray="5,5"/>
    <polygon points="450,240 445,230 455,230" fill="#E0E0E0"/>
    <polygon points="450,200 445,210 455,210" fill="#E0E0E0"/>
    
    <!-- Logical Level (Conceptual) -->
    <rect x="150" y="240" width="600" height="120" fill="#2D2D30" stroke="#4EC9B0" stroke-width="3" rx="10"/>
    <text x="450" y="270" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#4EC9B0" text-anchor="middle">2. Logical Level (Conceptual Layer)</text>
    <text x="450" y="295" font-family="Arial, sans-serif" font-size="16" fill="#E0E0E0" text-anchor="middle">Data Model, Structure &amp; Relationships</text>
    <rect x="200" y="310" width="120" height="30" fill="#3E3E42" rx="5"/>
    <text x="260" y="330" font-family="Arial, sans-serif" font-size="14" fill="#E0E0E0" text-anchor="middle">Tables</text>
    <rect x="340" y="310" width="120" height="30" fill="#3E3E42" rx="5"/>
    <text x="400" y="330" font-family="Arial, sans-serif" font-size="14" fill="#E0E0E0" text-anchor="middle">Indexes</text>
    <rect x="480" y="310" width="120" height="30" fill="#3E3E42" rx="5"/>
    <text x="540" y="330" font-family="Arial, sans-serif" font-size="14" fill="#E0E0E0" text-anchor="middle">Foreign Keys</text>
    <rect x="620" y="310" width="120" height="30" fill="#3E3E42" rx="5"/>
    <text x="680" y="330" font-family="Arial, sans-serif" font-size="14" fill="#E0E0E0" text-anchor="middle">Procedures</text>
    
    <!-- Connector 2 -->
    <path d="M 450 360 L 450 400" fill="none" stroke="#E0E0E0" stroke-width="2" stroke-dasharray="5,5"/>
    <polygon points="450,400 445,390 455,390" fill="#E0E0E0"/>
    <polygon points="450,360 445,370 455,370" fill="#E0E0E0"/>
    
    <!-- Physical Level (Internal) -->
    <rect x="150" y="400" width="600" height="120" fill="#2D2D30" stroke="#F44747" stroke-width="3" rx="10"/>
    <text x="450" y="430" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#F44747" text-anchor="middle">3. Physical Level (Internal Layer)</text>
    <text x="450" y="455" font-family="Arial, sans-serif" font-size="16" fill="#E0E0E0" text-anchor="middle">Lowest Level - Actual Physical Storage</text>
    <rect x="250" y="470" width="100" height="30" fill="#3E3E42" rx="5"/>
    <text x="300" y="490" font-family="Arial, sans-serif" font-size="14" fill="#E0E0E0" text-anchor="middle">Data Files</text>
    <rect x="400" y="470" width="100" height="30" fill="#3E3E42" rx="5"/>
    <text x="450" y="490" font-family="Arial, sans-serif" font-size="14" fill="#E0E0E0" text-anchor="middle">Logs/Blocks</text>
    <rect x="550" y="470" width="100" height="30" fill="#3E3E42" rx="5"/>
    <text x="600" y="490" font-family="Arial, sans-serif" font-size="14" fill="#E0E0E0" text-anchor="middle">Partitions</text>
    
    <!-- User/Admin Text -->
    <text x="60" y="140" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#C586C0" text-anchor="middle">End Users</text>
    <text x="60" y="160" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#C586C0" text-anchor="middle">&amp; Apps</text>
    
    <text x="60" y="300" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#4EC9B0" text-anchor="middle">Application</text>
    <text x="60" y="320" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#4EC9B0" text-anchor="middle">Developers</text>
    
    <text x="60" y="460" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#F44747" text-anchor="middle">Database</text>
    <text x="60" y="480" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#F44747" text-anchor="middle">Admins (DBA)</text>
    
</svg>
