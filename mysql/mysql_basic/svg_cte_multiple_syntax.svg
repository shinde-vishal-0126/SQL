<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
    <rect width="800" height="400" fill="#eeeeee" rx="10"/>
    
    <rect x="250" y="10" width="300" height="40" fill="#FFD700" stroke="#bebebe" stroke-width="2" rx="5"/>
    <text x="400" y="35" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#1E1E1E" text-anchor="middle">Multiple Standalone CTEs Syntax</text>
    
    <!-- CTE 1 -->
    <rect x="150" y="70" width="300" height="90" fill="#e8e8e9" stroke="#0072b0" stroke-width="2" rx="5"/>
    <text x="170" y="95" font-family="Consolas, monospace" font-size="16" font-weight="bold" fill="#0072b0">WITH</text>
    <rect x="220" y="80" width="100" height="20" fill="#eeeeee" stroke="#333333" stroke-width="1"/>
    <text x="270" y="95" font-family="Consolas, monospace" font-size="14" fill="#1f1f1f" text-anchor="middle">CTE-Name1</text>
    <text x="330" y="95" font-family="Consolas, monospace" font-size="16" font-weight="bold" fill="#0072b0">AS (</text>
    
    <text x="190" y="120" font-family="Consolas, monospace" font-size="14" font-weight="bold" fill="#267d6b">SELECT ...</text>
    <text x="170" y="145" font-family="Consolas, monospace" font-size="16" font-weight="bold" fill="#0072b0">)</text>
    
    <!-- CTE 2 -->
    <rect x="150" y="170" width="300" height="90" fill="#e8e8e9" stroke="#0072b0" stroke-width="2" rx="5"/>
    <text x="170" y="195" font-family="Consolas, monospace" font-size="16" font-weight="bold" fill="#0072b0">,</text>
    <rect x="190" y="180" width="100" height="20" fill="#eeeeee" stroke="#333333" stroke-width="1"/>
    <text x="240" y="195" font-family="Consolas, monospace" font-size="14" fill="#1f1f1f" text-anchor="middle">CTE-Name2</text>
    <text x="300" y="195" font-family="Consolas, monospace" font-size="16" font-weight="bold" fill="#0072b0">AS (</text>
    
    <text x="190" y="220" font-family="Consolas, monospace" font-size="14" font-weight="bold" fill="#267d6b">SELECT ...</text>
    <text x="170" y="245" font-family="Consolas, monospace" font-size="16" font-weight="bold" fill="#0072b0">)</text>
    
    <!-- Main Query -->
    <rect x="150" y="280" width="300" height="80" fill="#e8e8e9" stroke="#a38a00" stroke-width="2" rx="5"/>
    <text x="170" y="310" font-family="Consolas, monospace" font-size="14" font-weight="bold" fill="#267d6b">SELECT ...</text>
    <text x="170" y="330" font-family="Consolas, monospace" font-size="14" font-weight="bold" fill="#267d6b">FROM</text>
    <rect x="220" y="315" width="100" height="20" fill="#eeeeee" stroke="#333333" stroke-width="1"/>
    <text x="270" y="330" font-family="Consolas, monospace" font-size="14" fill="#1f1f1f" text-anchor="middle">CTE-Name1</text>
    
    <!-- Labels -->
    <text x="500" y="115" font-family="Arial" font-size="14" font-weight="bold" fill="#0072b0">CTE Query 1</text>
    <text x="500" y="215" font-family="Arial" font-size="14" font-weight="bold" fill="#0072b0">CTE Query 2</text>
    <text x="500" y="315" font-family="Arial" font-size="14" font-weight="bold" fill="#a38a00">Main Query</text>
    
    <!-- Connection Arc -->
    <path d="M 330 95 Q 450 200 330 320" fill="none" stroke="#793a74" stroke-dasharray="4,4" stroke-width="2" marker-end="url(#arrow)"/>
    <polygon points="330,320 338,315 338,325" fill="#C586C0"/>
</svg>
