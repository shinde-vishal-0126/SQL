<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500">
    <rect width="1000" height="500" fill="#1E1E1E" rx="10"/>
    <text x="500" y="40" font-family="Arial" font-size="24" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Rowstore vs Columnstore Index</text>
    
    <!-- Rowstore side -->
    <text x="250" y="90" font-family="Arial" font-size="20" font-weight="bold" fill="#4FC1FF" text-anchor="middle">Rowstore Index (Default)</text>
    <rect x="50" y="110" width="400" height="350" fill="#2D2D30" stroke="#4FC1FF" stroke-width="2" rx="10"/>
    
    <text x="250" y="140" font-family="Arial" font-size="16" fill="#A0A0A0" text-anchor="middle">Table Data (Logical)</text>
    <rect x="100" y="150" width="300" height="40" fill="#3D3D40"/>
    <rect x="100" y="150" width="75" height="40" fill="#4FC1FF" fill-opacity="0.3" stroke="#4FC1FF"/>
    <rect x="175" y="150" width="75" height="40" fill="#4FC1FF" fill-opacity="0.3" stroke="#4FC1FF"/>
    <rect x="250" y="150" width="75" height="40" fill="#4FC1FF" fill-opacity="0.3" stroke="#4FC1FF"/>
    <rect x="325" y="150" width="75" height="40" fill="#4FC1FF" fill-opacity="0.3" stroke="#4FC1FF"/>
    
    <text x="70" y="215" font-family="Arial" font-size="14" font-weight="bold" fill="#DCDCAA">Row 1</text>
    <rect x="100" y="200" width="180" height="25" fill="#E0E0E0" stroke="#A0A0A0"/>
    
    <text x="70" y="245" font-family="Arial" font-size="14" font-weight="bold" fill="#DCDCAA">Row 2</text>
    <rect x="100" y="230" width="180" height="25" fill="#E0E0E0" stroke="#A0A0A0"/>
    
    <text x="70" y="275" font-family="Arial" font-size="14" font-weight="bold" fill="#DCDCAA">Row 3</text>
    <rect x="100" y="260" width="180" height="25" fill="#E0E0E0" stroke="#A0A0A0"/>
    
    <!-- Rowstore Data Pages -->
    <path d="M 290 215 L 340 215" stroke="#A0A0A0" stroke-width="2" marker-end="url(#arrow_gray)"/>
    <path d="M 290 275 L 340 275" stroke="#A0A0A0" stroke-width="2" marker-end="url(#arrow_gray)"/>
    
    <rect x="350" y="180" width="80" height="60" fill="#F0F0F0" rx="5"/>
    <rect x="355" y="185" width="70" height="10" fill="#4FC1FF"/>
    <rect x="355" y="200" width="70" height="15" fill="#A0A0A0"/>
    <rect x="355" y="220" width="70" height="15" fill="#A0A0A0"/>
    <text x="390" y="255" font-family="Arial" font-size="12" font-weight="bold" fill="#000000" text-anchor="middle">Data Page</text>

    <rect x="350" y="270" width="80" height="60" fill="#F0F0F0" rx="5"/>
    <rect x="355" y="275" width="70" height="10" fill="#4FC1FF"/>
    <rect x="355" y="290" width="70" height="15" fill="#A0A0A0"/>
    <rect x="355" y="310" width="70" height="15" fill="#A0A0A0"/>
    <text x="390" y="345" font-family="Arial" font-size="12" font-weight="bold" fill="#000000" text-anchor="middle">Data Page</text>
    
    <text x="250" y="400" font-family="Arial" font-size="14" font-style="italic" fill="#E0E0E0" text-anchor="middle">Rows are stored entirely together.</text>
    <text x="250" y="420" font-family="Arial" font-size="14" font-style="italic" fill="#E0E0E0" text-anchor="middle">Great for specific point-lookups.</text>


    <!-- Columnstore side -->
    <text x="750" y="90" font-family="Arial" font-size="20" font-weight="bold" fill="#4EC9B0" text-anchor="middle">Columnstore Index (Analytics)</text>
    <rect x="550" y="110" width="400" height="350" fill="#2D2D30" stroke="#4EC9B0" stroke-width="2" rx="10"/>

    <text x="750" y="140" font-family="Arial" font-size="16" fill="#A0A0A0" text-anchor="middle">Table Data (Logical)</text>
    
    <!-- Column 1 -->
    <rect x="600" y="150" width="50" height="30" fill="#4EC9B0" fill-opacity="0.5" stroke="#4EC9B0"/>
    <rect x="600" y="180" width="50" height="90" fill="#E0E0E0" stroke="#A0A0A0"/>
    <path d="M 625 270 L 625 320" stroke="#A0A0A0" stroke-width="2" marker-end="url(#arrow_gray)"/>
    <rect x="590" y="325" width="70" height="50" fill="#F0F0F0" rx="5"/>
    <rect x="600" y="340" width="20" height="25" fill="#4EC9B0"/>
    <text x="625" y="388" font-family="Arial" font-size="11" font-weight="bold" fill="#000000" text-anchor="middle">Data Page</text>

    <!-- Column 2 -->
    <rect x="670" y="150" width="50" height="30" fill="#4EC9B0" fill-opacity="0.5" stroke="#4EC9B0"/>
    <rect x="670" y="180" width="50" height="90" fill="#E0E0E0" stroke="#A0A0A0"/>
    <path d="M 695 270 L 695 320" stroke="#A0A0A0" stroke-width="2" marker-end="url(#arrow_gray)"/>
    <rect x="660" y="325" width="70" height="50" fill="#F0F0F0" rx="5"/>
    <rect x="670" y="340" width="20" height="25" fill="#4EC9B0"/>
    <text x="695" y="388" font-family="Arial" font-size="11" font-weight="bold" fill="#000000" text-anchor="middle">Data Page</text>

    <!-- Column 3 -->
    <rect x="740" y="150" width="50" height="30" fill="#4EC9B0" fill-opacity="0.5" stroke="#4EC9B0"/>
    <rect x="740" y="180" width="50" height="90" fill="#E0E0E0" stroke="#A0A0A0"/>
    <path d="M 765 270 L 765 320" stroke="#A0A0A0" stroke-width="2" marker-end="url(#arrow_gray)"/>
    <rect x="730" y="325" width="70" height="50" fill="#F0F0F0" rx="5"/>
    <rect x="740" y="340" width="20" height="25" fill="#4EC9B0"/>
    <text x="765" y="388" font-family="Arial" font-size="11" font-weight="bold" fill="#000000" text-anchor="middle">Data Page</text>

    <!-- Column 4 -->
    <rect x="810" y="150" width="50" height="30" fill="#4EC9B0" fill-opacity="0.5" stroke="#4EC9B0"/>
    <rect x="810" y="180" width="50" height="90" fill="#E0E0E0" stroke="#A0A0A0"/>
    <path d="M 835 270 L 835 320" stroke="#A0A0A0" stroke-width="2" marker-end="url(#arrow_gray)"/>
    <rect x="800" y="325" width="70" height="50" fill="#F0F0F0" rx="5"/>
    <rect x="810" y="340" width="20" height="25" fill="#4EC9B0"/>
    <text x="835" y="388" font-family="Arial" font-size="11" font-weight="bold" fill="#000000" text-anchor="middle">Data Page</text>

    <text x="750" y="420" font-family="Arial" font-size="14" font-style="italic" fill="#E0E0E0" text-anchor="middle">Each column is stored independently in its own pages.</text>

    <defs>
        <marker id="arrow_gray" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
            <path d="M 0 0 L 10 5 L 0 10 z" fill="#A0A0A0"/>
        </marker>
    </defs>
</svg>
