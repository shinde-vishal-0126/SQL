<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 680" width="100%" height="100%">
  <defs>
    <!-- Shadows -->
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
    <filter id="topShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000000" flood-opacity="0.18"/>
    </filter>

    <!-- Gradients -->
    <linearGradient id="bgCanvas" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>

    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>

    <linearGradient id="gradWildcard" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>

    <linearGradient id="gradProject" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>

    <!-- Markers -->
    <marker id="arrowBlue" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L6,3 z" fill="#2563eb"/>
    </marker>
    <marker id="arrowGreen" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L6,3 z" fill="#059669"/>
    </marker>
  </defs>

  <style>
    .main-title { font-family: 'Segoe UI', system-ui, sans-serif; font-weight: 900; font-size: 22px; fill: #ffffff; }
    .sub-title { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 13px; fill: #94a3b8; }
    .card-title { font-family: 'Segoe UI', system-ui, sans-serif; font-weight: 800; font-size: 15px; fill: #ffffff; }
    .badge { font-family: 'Segoe UI', monospace; font-size: 10px; font-weight: 800; }
    .code-sql { font-family: 'Consolas', monospace; font-size: 12px; font-weight: 700; }
    .tbl-hdr { font-family: 'Segoe UI', sans-serif; font-weight: 800; font-size: 10.5px; fill: #ffffff; }
    .cell-txt { font-family: 'Segoe UI', sans-serif; font-size: 10.5px; fill: #1e293b; }
    .body-desc { font-family: 'Segoe UI', sans-serif; font-size: 12px; fill: #334155; line-height: 1.4; }
    .callout-title { font-family: 'Segoe UI', sans-serif; font-weight: 800; font-size: 11px; }
  </style>

  <!-- Background -->
  <rect width="100%" height="100%" fill="url(#bgCanvas)" rx="16"/>
  <rect width="100%" height="100%" fill="none" stroke="#cbd5e1" stroke-width="2" rx="16"/>

  <!-- Top Banner -->
  <g filter="url(#topShadow)">
    <rect x="25" y="20" width="1110" height="72" rx="12" fill="url(#headerGrad)"/>
    <text x="45" y="48" class="main-title">DQL: DATA QUERY LANGUAGE — THE TWO WAYS TO SELECT DATA</text>
    <text x="45" y="72" class="sub-title">Visualizing Whole Table Retrieval (SELECT *) vs. Specific Column Projection (SELECT column1, column2)</text>
  </g>

  <!-- ================= LEFT CARD: WHOLE DATA (SELECT *) ================= -->
  <g filter="url(#shadow)">
    <rect x="30" y="112" width="530" height="520" rx="12" fill="#ffffff" stroke="#bfdbfe" stroke-width="2"/>
    <!-- Card Header -->
    <path d="M 30 124 Q 30 112 42 112 L 548 112 Q 560 112 560 124 L 560 155 L 30 155 Z" fill="url(#gradWildcard)"/>
    <text x="48" y="140" class="card-title">1. GET WHOLE DATA (ALL COLUMNS)</text>
    <rect x="420" y="122" width="125" height="24" rx="6" fill="#ffffff" fill-opacity="0.25"/>
    <text x="430" y="138" class="badge" fill="#ffffff">WILDCARD (*)</text>

    <!-- Query Display Box -->
    <rect x="45" y="170" width="500" height="55" rx="8" fill="#eff6ff" stroke="#bfdbfe"/>
    <text x="60" y="190" class="badge" fill="#1d4ed8">SQL QUERY:</text>
    <text x="60" y="210" class="code-sql" fill="#1e40af">SELECT * FROM CUSTOMERS;</text>

    <!-- Visual Table Representation -->
    <rect x="45" y="238" width="500" height="150" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
    <!-- Table Header Row -->
    <rect x="45" y="238" width="500" height="28" rx="8" fill="#1e293b"/>
    <text x="60" y="256" class="tbl-hdr">ID</text>
    <text x="110" y="256" class="tbl-hdr">FIRST_NAME</text>
    <text x="215" y="256" class="tbl-hdr">LAST_NAME</text>
    <text x="315" y="256" class="tbl-hdr">COUNTRY</text>
    <text x="410" y="256" class="tbl-hdr">SCORE</text>
    <text x="480" y="256" class="tbl-hdr">STATUS</text>

    <!-- Table Rows -->
    <rect x="45" y="266" width="500" height="26" fill="#f8fafc"/>
    <text x="60" y="283" class="cell-txt" font-weight="700">1</text>
    <text x="110" y="283" class="cell-txt">Vishal</text>
    <text x="215" y="283" class="cell-txt">Sharma</text>
    <text x="315" y="283" class="cell-txt">India</text>
    <text x="410" y="283" class="cell-txt">950</text>
    <text x="480" y="283" class="cell-txt" fill="#16a34a" font-weight="700">Active</text>

    <rect x="45" y="292" width="500" height="26" fill="#ffffff"/>
    <text x="60" y="309" class="cell-txt" font-weight="700">2</text>
    <text x="110" y="309" class="cell-txt">Amit</text>
    <text x="215" y="309" class="cell-txt">Patel</text>
    <text x="315" y="309" class="cell-txt">India</text>
    <text x="410" y="309" class="cell-txt">820</text>
    <text x="480" y="309" class="cell-txt" fill="#16a34a" font-weight="700">Active</text>

    <rect x="45" y="318" width="500" height="26" fill="#f8fafc"/>
    <text x="60" y="335" class="cell-txt" font-weight="700">3</text>
    <text x="110" y="335" class="cell-txt">Neha</text>
    <text x="215" y="335" class="cell-txt">Verma</text>
    <text x="315" y="335" class="cell-txt">UK</text>
    <text x="410" y="335" class="cell-txt">710</text>
    <text x="480" y="335" class="cell-txt" fill="#64748b">Inactive</text>

    <rect x="45" y="344" width="500" height="26" fill="#ffffff"/>
    <text x="60" y="361" class="cell-txt" font-weight="700">4</text>
    <text x="110" y="361" class="cell-txt">Rahul</text>
    <text x="215" y="361" class="cell-txt">Singh</text>
    <text x="315" y="361" class="cell-txt">USA</text>
    <text x="410" y="361" class="cell-txt">600</text>
    <text x="480" y="361" class="cell-txt" fill="#16a34a" font-weight="700">Active</text>

    <!-- Characteristics Box -->
    <rect x="45" y="400" width="500" height="115" rx="8" fill="#f1f5f9" stroke="#cbd5e1"/>
    <text x="58" y="418" class="callout-title" fill="#1e3a8a">HOW IT WORKS &amp; BEHAVIOR:</text>
    <text x="58" y="438" class="body-desc">• The asterisk (*) instructs the engine to fetch ALL columns in schema order.</text>
    <text x="58" y="458" class="body-desc">• Great for quick data exploration, debugging, and schema inspection.</text>
    <text x="58" y="478" class="body-desc">• ⚠️ Not recommended in production: transfers unneeded columns over network.</text>
    <text x="58" y="500" class="badge" fill="#2563eb">Result Set: 100% of all table attributes returned</text>
  </g>

  <!-- ================= RIGHT CARD: SPECIFIC COLUMNS (PROJECTION) ================= -->
  <g filter="url(#shadow)">
    <rect x="600" y="112" width="530" height="520" rx="12" fill="#ffffff" stroke="#a7f3d0" stroke-width="2"/>
    <!-- Card Header -->
    <path d="M 600 124 Q 600 112 612 112 L 1118 112 Q 1130 112 1130 124 L 1130 155 L 600 155 Z" fill="url(#gradProject)"/>
    <text x="618" y="140" class="card-title">2. GET ONLY REQUIRED DATA (PROJECTION)</text>
    <rect x="980" y="122" width="135" height="24" rx="6" fill="#ffffff" fill-opacity="0.25"/>
    <text x="990" y="138" class="badge" fill="#ffffff">BEST PRACTICE</text>

    <!-- Query Display Box -->
    <rect x="615" y="170" width="500" height="55" rx="8" fill="#f0fdf4" stroke="#bbf7d0"/>
    <text x="630" y="190" class="badge" fill="#15803d">SQL QUERY:</text>
    <text x="630" y="210" class="code-sql" fill="#166534">SELECT ID, FIRST_NAME, COUNTRY, SCORE FROM CUSTOMERS;</text>

    <!-- Visual Table Representation (Projected Columns Only) -->
    <rect x="615" y="238" width="500" height="150" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
    <!-- Table Header Row -->
    <rect x="615" y="238" width="500" height="28" rx="8" fill="#065f46"/>
    <text x="635" y="256" class="tbl-hdr">ID</text>
    <text x="710" y="256" class="tbl-hdr">FIRST_NAME</text>
    <text x="840" y="256" class="tbl-hdr">COUNTRY</text>
    <text x="980" y="256" class="tbl-hdr">SCORE</text>

    <!-- Table Rows -->
    <rect x="615" y="266" width="500" height="26" fill="#f0fdf4"/>
    <text x="635" y="283" class="cell-txt" font-weight="700">1</text>
    <text x="710" y="283" class="cell-txt">Vishal</text>
    <text x="840" y="283" class="cell-txt">India</text>
    <text x="980" y="283" class="cell-txt">950</text>

    <rect x="615" y="292" width="500" height="26" fill="#ffffff"/>
    <text x="635" y="309" class="cell-txt" font-weight="700">2</text>
    <text x="710" y="309" class="cell-txt">Amit</text>
    <text x="840" y="309" class="cell-txt">India</text>
    <text x="980" y="309" class="cell-txt">820</text>

    <rect x="615" y="318" width="500" height="26" fill="#f0fdf4"/>
    <text x="635" y="335" class="cell-txt" font-weight="700">3</text>
    <text x="710" y="335" class="cell-txt">Neha</text>
    <text x="840" y="335" class="cell-txt">UK</text>
    <text x="980" y="335" class="cell-txt">710</text>

    <rect x="615" y="344" width="500" height="26" fill="#ffffff"/>
    <text x="635" y="361" class="cell-txt" font-weight="700">4</text>
    <text x="710" y="361" class="cell-txt">Rahul</text>
    <text x="840" y="361" class="cell-txt">USA</text>
    <text x="980" y="361" class="cell-txt">600</text>

    <!-- Characteristics Box -->
    <rect x="615" y="400" width="500" height="115" rx="8" fill="#f1f5f9" stroke="#cbd5e1"/>
    <text x="628" y="418" class="callout-title" fill="#065f46">HOW IT WORKS &amp; BEHAVIOR:</text>
    <text x="628" y="438" class="body-desc">• Fetches ONLY the columns explicitly listed, ignoring LAST_NAME &amp; STATUS.</text>
    <text x="628" y="458" class="body-desc">• Dramatically reduces I/O, network latency, and client memory allocation.</text>
    <text x="628" y="478" class="body-desc">• Enables index-only query optimizations (Covering Indexes).</text>
    <text x="628" y="500" class="badge" fill="#059669">Result Set: Precise projection tailored to consumer needs</text>
  </g>

  <!-- Bottom Comparison Banner -->
  <rect x="30" y="642" width="1100" height="26" rx="6" fill="#e2e8f0"/>
  <text x="45" y="659" class="body-desc" font-weight="700" fill="#334155">KEY TAKEAWAY: DQL (Data Query Language) performs read-only data extraction. SELECT * is for exploration; explicit column selection is the golden standard in production.</text>
</svg>
