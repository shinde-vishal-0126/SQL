<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300">
    <rect width="800" height="300" fill="#eeeeee" rx="10"/>
    <text x="400" y="40" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#575724" text-anchor="middle">Subquery in WHERE Clause: ANY Operator</text>
    
    <rect x="50" y="80" width="700" height="130" fill="#e8e8e9" stroke="#333333" stroke-width="2" rx="5"/>
    
    <text x="80" y="120" font-family="Courier New, monospace" font-size="16" font-weight="bold" fill="#296fa9">SELECT</text>
    <text x="160" y="120" font-family="Courier New, monospace" font-size="16" fill="#1f1f1f">column1, column2, ...</text>
    
    <text x="80" y="150" font-family="Courier New, monospace" font-size="16" font-weight="bold" fill="#296fa9">FROM</text>
    <text x="130" y="150" font-family="Courier New, monospace" font-size="16" fill="#1f1f1f">table1</text>
    
    <text x="80" y="180" font-family="Courier New, monospace" font-size="16" font-weight="bold" fill="#296fa9">WHERE</text>
    <text x="140" y="180" font-family="Courier New, monospace" font-size="16" fill="#1f1f1f">column</text>
    <text x="210" y="180" font-family="Courier New, monospace" font-size="18" font-weight="bold" fill="#267d6b">&lt; ANY</text>
    
    <text x="270" y="180" font-family="Courier New, monospace" font-size="16" font-weight="bold" fill="#793a74">( </text>
    <rect x="290" y="155" width="450" height="40" fill="#eeeeee" stroke="#793a74" stroke-width="1"/>
    
    <text x="300" y="180" font-family="Courier New, monospace" font-size="14" font-weight="bold" fill="#296fa9">SELECT</text>
    <text x="360" y="180" font-family="Courier New, monospace" font-size="14" fill="#1f1f1f">column</text>
    <text x="420" y="180" font-family="Courier New, monospace" font-size="14" font-weight="bold" fill="#296fa9">FROM</text>
    <text x="460" y="180" font-family="Courier New, monospace" font-size="14" fill="#1f1f1f">table2</text>
    <text x="520" y="180" font-family="Courier New, monospace" font-size="14" font-weight="bold" fill="#296fa9">WHERE</text>
    <text x="570" y="180" font-family="Courier New, monospace" font-size="14" fill="#1f1f1f">condition</text>
    
    <text x="750" y="180" font-family="Courier New, monospace" font-size="16" font-weight="bold" fill="#793a74"> )</text>
</svg>
