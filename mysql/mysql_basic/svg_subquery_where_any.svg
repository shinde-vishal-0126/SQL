<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300">
    <rect width="800" height="300" fill="#1E1E1E" rx="10"/>
    <text x="400" y="40" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#DCDCAA" text-anchor="middle">Subquery in WHERE Clause: ANY Operator</text>
    
    <rect x="50" y="80" width="700" height="130" fill="#2D2D30" stroke="#E0E0E0" stroke-width="2" rx="5"/>
    
    <text x="80" y="120" font-family="Courier New, monospace" font-size="16" font-weight="bold" fill="#569CD6">SELECT</text>
    <text x="160" y="120" font-family="Courier New, monospace" font-size="16" fill="#E0E0E0">column1, column2, ...</text>
    
    <text x="80" y="150" font-family="Courier New, monospace" font-size="16" font-weight="bold" fill="#569CD6">FROM</text>
    <text x="130" y="150" font-family="Courier New, monospace" font-size="16" fill="#E0E0E0">table1</text>
    
    <text x="80" y="180" font-family="Courier New, monospace" font-size="16" font-weight="bold" fill="#569CD6">WHERE</text>
    <text x="140" y="180" font-family="Courier New, monospace" font-size="16" fill="#E0E0E0">column</text>
    <text x="210" y="180" font-family="Courier New, monospace" font-size="18" font-weight="bold" fill="#4EC9B0">&lt; ANY</text>
    
    <text x="270" y="180" font-family="Courier New, monospace" font-size="16" font-weight="bold" fill="#C586C0">( </text>
    <rect x="290" y="155" width="450" height="40" fill="#1E1E1E" stroke="#C586C0" stroke-width="1"/>
    
    <text x="300" y="180" font-family="Courier New, monospace" font-size="14" font-weight="bold" fill="#569CD6">SELECT</text>
    <text x="360" y="180" font-family="Courier New, monospace" font-size="14" fill="#E0E0E0">column</text>
    <text x="420" y="180" font-family="Courier New, monospace" font-size="14" font-weight="bold" fill="#569CD6">FROM</text>
    <text x="460" y="180" font-family="Courier New, monospace" font-size="14" fill="#E0E0E0">table2</text>
    <text x="520" y="180" font-family="Courier New, monospace" font-size="14" font-weight="bold" fill="#569CD6">WHERE</text>
    <text x="570" y="180" font-family="Courier New, monospace" font-size="14" fill="#E0E0E0">condition</text>
    
    <text x="750" y="180" font-family="Courier New, monospace" font-size="16" font-weight="bold" fill="#C586C0"> )</text>
</svg>
