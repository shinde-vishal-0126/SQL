<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 250">
    <rect width="600" height="250" fill="#1E1E1E" rx="10"/>
    <text x="300" y="30" font-family="Courier New" font-size="18" font-weight="bold" fill="#DCDCAA" text-anchor="middle">How CASE Works (Execution Flow)</text>
    <text x="300" y="55" font-family="Arial" font-size="14" fill="#E0E0E0" text-anchor="middle">SQL stops execution once the FIRST condition is met.</text>
    
    <!-- Flowchart -->
    <text x="100" y="100" font-family="Courier New" font-size="14" fill="#4FC1FF" text-anchor="middle">CASE</text>
    <path d="M 100 110 L 100 130" fill="none" stroke="#3E3E42" stroke-width="2" marker-end="url(#arrow)"/>
    
    <polygon points="100,130 160,160 100,190 40,160" fill="#2D2D30" stroke="#4EC9B0" stroke-width="2"/>
    <text x="100" y="165" font-family="Arial" font-size="12" fill="#E0E0E0" text-anchor="middle">Sales > 50?</text>

    <!-- True Branch 1 -->
    <path d="M 100 190 L 100 210 L 150 210" fill="none" stroke="#4EC9B0" stroke-width="2" marker-end="url(#arrow_green)"/>
    <text x="120" y="205" font-family="Arial" font-size="12" font-weight="bold" fill="#4EC9B0" text-anchor="middle">True</text>
    <rect x="150" y="195" width="60" height="30" fill="#2D2D30" stroke="#4FC1FF" stroke-width="2"/>
    <text x="180" y="215" font-family="Courier New" font-size="14" fill="#E0E0E0" text-anchor="middle">'High'</text>

    <!-- False Branch 1 -->
    <path d="M 160 160 L 250 160" fill="none" stroke="#F44747" stroke-width="2" marker-end="url(#arrow_red)"/>
    <text x="205" y="155" font-family="Arial" font-size="12" font-weight="bold" fill="#F44747" text-anchor="middle">False</text>

    <!-- Condition 2 -->
    <polygon points="310,130 370,160 310,190 250,160" fill="#2D2D30" stroke="#DCDCAA" stroke-width="2"/>
    <text x="310" y="165" font-family="Arial" font-size="12" fill="#E0E0E0" text-anchor="middle">Sales > 20?</text>

    <!-- True Branch 2 -->
    <path d="M 310 190 L 310 210 L 360 210" fill="none" stroke="#4EC9B0" stroke-width="2" marker-end="url(#arrow_green)"/>
    <text x="330" y="205" font-family="Arial" font-size="12" font-weight="bold" fill="#4EC9B0" text-anchor="middle">True</text>
    <rect x="360" y="195" width="80" height="30" fill="#2D2D30" stroke="#4FC1FF" stroke-width="2"/>
    <text x="400" y="215" font-family="Courier New" font-size="14" fill="#E0E0E0" text-anchor="middle">'Medium'</text>

    <!-- End Node -->
    <path d="M 210 210 L 280 210 L 280 230" fill="none" stroke="#3E3E42" stroke-width="2"/>
    <path d="M 440 210 L 500 210 L 500 230 L 280 230" fill="none" stroke="#3E3E42" stroke-width="2"/>
    <circle cx="280" cy="235" r="5" fill="#3E3E42"/>
    <text x="280" y="250" font-family="Arial" font-size="12" fill="#A0A0A0" text-anchor="middle">END</text>

    <defs>
        <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
            <path d="M0,0 L0,6 L9,3 z" fill="#3E3E42" />
        </marker>
        <marker id="arrow_green" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
            <path d="M0,0 L0,6 L9,3 z" fill="#4EC9B0" />
        </marker>
        <marker id="arrow_red" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
            <path d="M0,0 L0,6 L9,3 z" fill="#F44747" />
        </marker>
    </defs>
</svg>