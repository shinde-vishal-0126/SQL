<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 250">
    <rect width="600" height="250" fill="#1E1E1E" rx="10"/>
    <text x="300" y="30" font-family="Courier New" font-size="18" font-weight="bold" fill="#E0E0E0" text-anchor="middle">CASE: Full Form vs Quick Form</text>
    
    <!-- Full Form -->
    <rect x="50" y="60" width="220" height="130" fill="#2D2D30" stroke="#3E3E42" stroke-width="2"/>
    <text x="160" y="50" font-family="Arial" font-size="14" font-weight="bold" fill="#DCDCAA" text-anchor="middle">Full Form (Searched)</text>
    <text x="60" y="80" font-family="Courier New" font-size="12" fill="#4FC1FF" text-anchor="start">CASE</text>
    <text x="70" y="100" font-family="Courier New" font-size="12" fill="#E0E0E0" text-anchor="start">WHEN Country = 'Germany'</text>
    <text x="70" y="120" font-family="Courier New" font-size="12" fill="#E0E0E0" text-anchor="start">WHEN Country = 'India'</text>
    <text x="70" y="140" font-family="Courier New" font-size="12" fill="#E0E0E0" text-anchor="start">ELSE 'N/A'</text>
    <text x="60" y="160" font-family="Courier New" font-size="12" fill="#4FC1FF" text-anchor="start">END</text>
    <text x="160" y="180" font-family="Arial" font-size="10" fill="#A0A0A0" text-anchor="middle">Allows multiple complex conditions</text>

    <!-- Quick Form -->
    <rect x="330" y="60" width="220" height="130" fill="#2D2D30" stroke="#3E3E42" stroke-width="2"/>
    <text x="440" y="50" font-family="Arial" font-size="14" font-weight="bold" fill="#4EC9B0" text-anchor="middle">Quick Form (Simple)</text>
    <text x="340" y="80" font-family="Courier New" font-size="12" fill="#4FC1FF" text-anchor="start">CASE Country</text>
    <text x="350" y="100" font-family="Courier New" font-size="12" fill="#E0E0E0" text-anchor="start">WHEN 'Germany' THEN 'GE'</text>
    <text x="350" y="120" font-family="Courier New" font-size="12" fill="#E0E0E0" text-anchor="start">WHEN 'India' THEN 'IN'</text>
    <text x="350" y="140" font-family="Courier New" font-size="12" fill="#E0E0E0" text-anchor="start">ELSE 'N/A'</text>
    <text x="340" y="160" font-family="Courier New" font-size="12" fill="#4FC1FF" text-anchor="start">END</text>
    <text x="440" y="180" font-family="Arial" font-size="10" fill="#A0A0A0" text-anchor="middle">Column name evaluated only once</text>
</svg>