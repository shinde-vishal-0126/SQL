<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" font-family="Segoe UI, Arial, sans-serif">
  <rect width="1000" height="520" fill="#f8fafc" rx="12"/>
  <text x="500" y="38" text-anchor="middle" font-size="24" font-weight="800" fill="#0f172a">Autocommit, Explicit &amp; Implicit Commit (MySQL)</text>
  <text x="500" y="62" text-anchor="middle" font-size="13" fill="#64748b">SELECT @@autocommit;  → 1 by default</text>

  <!-- autocommit ON -->
  <rect x="20" y="80" width="310" height="300" rx="12" fill="#ffffff" stroke="#93c5fd" stroke-width="2"/>
  <rect x="20" y="80" width="310" height="44" rx="12" fill="#dbeafe"/>
  <text x="175" y="108" text-anchor="middle" font-size="15" font-weight="800" fill="#1d4ed8">autocommit = 1 (ON, default)</text>
  <text x="38" y="150" font-size="12" font-family="Consolas, monospace" fill="#334155">UPDATE accounts</text>
  <text x="38" y="168" font-size="12" font-family="Consolas, monospace" fill="#334155">SET balance = balance + 500</text>
  <text x="38" y="186" font-size="12" font-family="Consolas, monospace" fill="#334155">WHERE account_id = 2;</text>
  <rect x="38" y="200" width="274" height="34" rx="6" fill="#dcfce7" stroke="#16a34a"/>
  <text x="175" y="222" text-anchor="middle" font-size="12" font-weight="700" fill="#15803d">✔ saved immediately (auto COMMIT)</text>
  <text x="38" y="262" font-size="12" font-family="Consolas, monospace" fill="#334155">ROLLBACK;</text>
  <rect x="38" y="274" width="274" height="34" rx="6" fill="#fee2e2" stroke="#dc2626"/>
  <text x="175" y="296" text-anchor="middle" font-size="12" font-weight="700" fill="#b91c1c">✖ nothing to undo — too late</text>
  <text x="175" y="340" text-anchor="middle" font-size="12" fill="#334155">Each statement = its own transaction</text>
  <text x="175" y="362" text-anchor="middle" font-size="11" fill="#64748b">SET autocommit = 1;</text>

  <!-- autocommit OFF -->
  <rect x="345" y="80" width="310" height="300" rx="12" fill="#ffffff" stroke="#fcd34d" stroke-width="2"/>
  <rect x="345" y="80" width="310" height="44" rx="12" fill="#fef3c7"/>
  <text x="500" y="108" text-anchor="middle" font-size="15" font-weight="800" fill="#b45309">autocommit = 0 (OFF)</text>
  <text x="363" y="150" font-size="12" font-family="Consolas, monospace" fill="#334155">SET autocommit = 0;</text>
  <text x="363" y="168" font-size="12" font-family="Consolas, monospace" fill="#334155">UPDATE accounts SET balance =</text>
  <text x="363" y="186" font-size="12" font-family="Consolas, monospace" fill="#334155">balance - 500 WHERE account_id=1;</text>
  <rect x="363" y="200" width="274" height="34" rx="6" fill="#fef9c3" stroke="#ca8a04"/>
  <text x="500" y="222" text-anchor="middle" font-size="12" font-weight="700" fill="#854d0e">⏳ pending — not permanent yet</text>
  <rect x="363" y="248" width="130" height="60" rx="6" fill="#dcfce7" stroke="#16a34a"/>
  <text x="428" y="272" text-anchor="middle" font-size="12" font-family="Consolas, monospace" font-weight="700" fill="#15803d">COMMIT;</text>
  <text x="428" y="292" text-anchor="middle" font-size="11" fill="#14532d">make permanent</text>
  <rect x="507" y="248" width="130" height="60" rx="6" fill="#fee2e2" stroke="#dc2626"/>
  <text x="572" y="272" text-anchor="middle" font-size="12" font-family="Consolas, monospace" font-weight="700" fill="#b91c1c">ROLLBACK;</text>
  <text x="572" y="292" text-anchor="middle" font-size="11" fill="#7f1d1d">undo the change</text>
  <text x="500" y="340" text-anchor="middle" font-size="12" fill="#334155">YOU decide when the transaction ends</text>

  <!-- explicit -->
  <rect x="670" y="80" width="310" height="300" rx="12" fill="#ffffff" stroke="#86efac" stroke-width="2"/>
  <rect x="670" y="80" width="310" height="44" rx="12" fill="#dcfce7"/>
  <text x="825" y="108" text-anchor="middle" font-size="15" font-weight="800" fill="#15803d">Explicit transaction</text>
  <text x="688" y="150" font-size="12" font-family="Consolas, monospace" font-weight="700" fill="#15803d">START TRANSACTION;</text>
  <text x="688" y="170" font-size="12" font-family="Consolas, monospace" fill="#334155">UPDATE A ... - 1000;</text>
  <text x="688" y="190" font-size="12" font-family="Consolas, monospace" fill="#334155">UPDATE B ... + 1000;</text>
  <text x="688" y="210" font-size="12" font-family="Consolas, monospace" font-weight="700" fill="#15803d">COMMIT;  -- or ROLLBACK;</text>
  <text x="688" y="248" font-size="12" fill="#334155">• Works even when autocommit = 1</text>
  <text x="688" y="268" font-size="12" fill="#334155">• autocommit is paused until</text>
  <text x="688" y="286" font-size="12" fill="#334155">  COMMIT / ROLLBACK</text>
  <text x="688" y="306" font-size="12" fill="#334155">• Both updates saved together</text>
  <text x="688" y="326" font-size="12" fill="#334155">  or undone together</text>

  <!-- implicit -->
  <rect x="20" y="395" width="960" height="110" rx="12" fill="#fef2f2" stroke="#fca5a5"/>
  <text x="40" y="422" font-size="15" font-weight="800" fill="#b91c1c">Implicit commit (MySQL does it for you)</text>
  <text x="40" y="446" font-size="12" fill="#334155">DDL — CREATE, ALTER, DROP, TRUNCATE, RENAME — and START TRANSACTION, LOCK TABLES, GRANT commit automatically, even inside a transaction.</text>
  <text x="40" y="470" font-size="12" font-family="Consolas, monospace" fill="#334155">START TRANSACTION; DELETE FROM orders WHERE order_id = 10; <tspan fill="#b91c1c" font-weight="700">CREATE TABLE t (id INT);</tspan> ROLLBACK;</text>
  <text x="40" y="492" font-size="12" fill="#b91c1c">→ the DELETE is already committed by CREATE TABLE; ROLLBACK cannot bring order 10 back. (PostgreSQL / SQL Server can roll back DDL.)</text>
</svg>
