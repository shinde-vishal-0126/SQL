<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800">
    <rect width="1200" height="800" fill="#1e1e2e" rx="20"/>
    <text x="600" y="60" font-family="Arial, sans-serif" font-size="36" font-weight="bold" fill="#00ffcc" text-anchor="middle">SQL Joins - Execution &amp; Architecture</text>
    <text x="600" y="100" font-family="Arial, sans-serif" font-size="20" fill="#a6accd" text-anchor="middle">How data is physically combined</text>

    <!-- Define Gradients and Styles -->
    <defs>
        <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#00ffcc" stop-opacity="0.8"/>
            <stop offset="100%" stop-color="#0066ff" stop-opacity="0.8"/>
        </linearGradient>
        <linearGradient id="secondaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#ff00cc" stop-opacity="0.8"/>
            <stop offset="100%" stop-color="#ff6600" stop-opacity="0.8"/>
        </linearGradient>
    </defs>

    <!-- SECTION 1: Rows vs Columns (SET Operators vs JOINs) -->
    <g transform="translate(100, 150)">
        <text x="200" y="0" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#ffffff">1. Combining Rows vs Columns</text>
        
        <!-- SET Operator (Rows) -->
        <g transform="translate(50, 40)">
            <text x="50" y="0" font-family="Arial, sans-serif" font-size="18" fill="#00ffcc">SET Operator (e.g. UNION)</text>
            <rect x="0" y="20" width="100" height="60" fill="url(#primaryGrad)" rx="5"/>
            <text x="50" y="55" font-family="Arial, sans-serif" font-size="16" fill="#fff" text-anchor="middle">Table A</text>
            
            <text x="50" y="105" font-family="Arial, sans-serif" font-size="20" fill="#fff" text-anchor="middle">+</text>
            
            <rect x="0" y="120" width="100" height="60" fill="url(#secondaryGrad)" rx="5"/>
            <text x="50" y="155" font-family="Arial, sans-serif" font-size="16" fill="#fff" text-anchor="middle">Table B</text>

            <path d="M 120,100 L 170,100" stroke="#a6accd" stroke-width="2" marker-end="url(#arrow)"/>

            <rect x="190" y="50" width="100" height="130" fill="none" stroke="#ffff00" stroke-width="2" stroke-dasharray="5,5" rx="5"/>
            <rect x="195" y="55" width="90" height="55" fill="url(#primaryGrad)" rx="3"/>
            <rect x="195" y="115" width="90" height="55" fill="url(#secondaryGrad)" rx="3"/>
            <text x="240" y="210" font-family="Arial, sans-serif" font-size="16" fill="#a6accd" text-anchor="middle">Makes Table LONGER</text>
        </g>

        <!-- JOIN (Columns) -->
        <g transform="translate(600, 40)">
            <text x="150" y="0" font-family="Arial, sans-serif" font-size="18" fill="#ff00cc">JOIN Operator</text>
            
            <rect x="0" y="50" width="100" height="100" fill="url(#primaryGrad)" rx="5"/>
            <text x="50" y="105" font-family="Arial, sans-serif" font-size="16" fill="#fff" text-anchor="middle">Table A</text>

            <text x="120" y="105" font-family="Arial, sans-serif" font-size="20" fill="#fff" text-anchor="middle">+</text>

            <rect x="140" y="50" width="100" height="100" fill="url(#secondaryGrad)" rx="5"/>
            <text x="190" y="105" font-family="Arial, sans-serif" font-size="16" fill="#fff" text-anchor="middle">Table B</text>

            <path d="M 260,100 L 310,100" stroke="#a6accd" stroke-width="2" marker-end="url(#arrow)"/>

            <rect x="330" y="45" width="210" height="110" fill="none" stroke="#ffff00" stroke-width="2" stroke-dasharray="5,5" rx="5"/>
            <rect x="335" y="50" width="95" height="100" fill="url(#primaryGrad)" rx="3"/>
            <rect x="435" y="50" width="95" height="100" fill="url(#secondaryGrad)" rx="3"/>
            <text x="435" y="180" font-family="Arial, sans-serif" font-size="16" fill="#a6accd" text-anchor="middle">Makes Table WIDER</text>
        </g>
    </g>

    <!-- SECTION 2: Multi-Table Join Execution -->
    <g transform="translate(100, 450)">
        <text x="200" y="0" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#ffffff">2. Multi-Table Join Architecture (Master Table Concept)</text>
        
        <!-- Multi-Table Flow -->
        <g transform="translate(50, 60)">
            <rect x="0" y="50" width="150" height="150" fill="url(#primaryGrad)" rx="10"/>
            <text x="75" y="110" font-family="Arial, sans-serif" font-size="18" fill="#fff" text-anchor="middle" font-weight="bold">Table A</text>
            <text x="75" y="130" font-family="Arial, sans-serif" font-size="14" fill="#a6accd" text-anchor="middle">(Master / Starting)</text>

            <!-- Table B -->
            <path d="M 160,80 C 220,80 250,50 300,50" stroke="#00ffcc" stroke-width="3" fill="none"/>
            <rect x="310" y="20" width="120" height="60" fill="url(#secondaryGrad)" rx="5"/>
            <text x="370" y="55" font-family="Arial, sans-serif" font-size="16" fill="#fff" text-anchor="middle">Table B (LEFT JOIN)</text>

            <!-- Table C -->
            <path d="M 160,125 L 300,125" stroke="#ff00cc" stroke-width="3" fill="none"/>
            <rect x="310" y="95" width="120" height="60" fill="none" stroke="#ff00cc" stroke-width="3" rx="5"/>
            <text x="370" y="130" font-family="Arial, sans-serif" font-size="16" fill="#fff" text-anchor="middle">Table C (LEFT JOIN)</text>

            <!-- Table D -->
            <path d="M 160,170 C 220,170 250,200 300,200" stroke="#ffff00" stroke-width="3" fill="none"/>
            <rect x="310" y="170" width="120" height="60" fill="none" stroke="#ffff00" stroke-width="3" rx="5"/>
            <text x="370" y="205" font-family="Arial, sans-serif" font-size="16" fill="#fff" text-anchor="middle">Table D (LEFT JOIN)</text>

            <!-- Final Result Box -->
            <path d="M 450,125 L 530,125" stroke="#a6accd" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
            <rect x="550" y="20" width="300" height="210" fill="none" stroke="#fff" stroke-width="2" stroke-dasharray="10,5" rx="10"/>
            <rect x="560" y="30" width="280" height="190" fill="#1e1e2e" rx="5"/>
            <!-- Flat Data Representation -->
            <rect x="570" y="40" width="60" height="170" fill="url(#primaryGrad)" rx="2"/>
            <rect x="635" y="40" width="60" height="170" fill="url(#secondaryGrad)" rx="2"/>
            <rect x="700" y="40" width="60" height="170" fill="none" stroke="#ff00cc" stroke-width="2" rx="2"/>
            <rect x="765" y="40" width="60" height="170" fill="none" stroke="#ffff00" stroke-width="2" rx="2"/>
            <text x="700" y="260" font-family="Arial, sans-serif" font-size="18" fill="#00ffcc" text-anchor="middle">Complete Flat Wide Result Set</text>
        </g>
    </g>
</svg>
