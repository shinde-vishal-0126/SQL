<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 220">
    <rect width="600" height="220" fill="#eeeeee" rx="10"/>
    <text x="300" y="40" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#0072b0" text-anchor="middle">DATEDIFF() Concept</text>
    
    <text x="150" y="80" font-family="Courier New" font-size="16" fill="#5f5f5f" text-anchor="middle">Order Date</text>
    <text x="150" y="100" font-family="Courier New" font-size="20" font-weight="bold" fill="#1f1f1f" text-anchor="middle">2025-08-20</text>
    
    <text x="450" y="80" font-family="Courier New" font-size="16" fill="#5f5f5f" text-anchor="middle">Shipping Date</text>
    <text x="450" y="100" font-family="Courier New" font-size="20" font-weight="bold" fill="#1f1f1f" text-anchor="middle">2026-02-01</text>
    
    <rect x="250" y="75" width="100" height="30" rx="5" fill="#e8e8e9" stroke="#0072b0" stroke-width="2"/>
    <text x="300" y="95" font-family="Arial" font-size="14" font-weight="bold" fill="#0072b0" text-anchor="middle">DATEDIFF</text>
    
    <!-- Lines to results -->
    <path d="M 300 105 L 200 135" fill="none" stroke="#b1b1b6" stroke-width="2"/>
    <path d="M 300 105 L 300 135" fill="none" stroke="#b1b1b6" stroke-width="2"/>
    <path d="M 300 105 L 400 135" fill="none" stroke="#b1b1b6" stroke-width="2"/>
    
    <circle cx="200" cy="150" r="25" fill="#eeeeee" stroke="#267d6b" stroke-width="2"/>
    <text x="200" y="155" font-family="Arial" font-size="12" fill="#267d6b" text-anchor="middle">YEAR</text>
    <rect x="180" y="180" width="40" height="25" fill="#e8e8e9" stroke="#b1b1b6" stroke-width="1"/>
    <text x="200" y="197" font-family="Courier New" font-size="14" fill="#1f1f1f" text-anchor="middle">0</text>

    <circle cx="300" cy="150" r="25" fill="#eeeeee" stroke="#793a74" stroke-width="2"/>
    <text x="300" y="155" font-family="Arial" font-size="12" fill="#793a74" text-anchor="middle">MONTH</text>
    <rect x="280" y="180" width="40" height="25" fill="#e8e8e9" stroke="#b1b1b6" stroke-width="1"/>
    <text x="300" y="197" font-family="Courier New" font-size="14" fill="#1f1f1f" text-anchor="middle">5</text>

    <circle cx="400" cy="150" r="25" fill="#eeeeee" stroke="#575724" stroke-width="2"/>
    <text x="400" y="155" font-family="Arial" font-size="12" fill="#575724" text-anchor="middle">DAY</text>
    <rect x="380" y="180" width="40" height="25" fill="#e8e8e9" stroke="#b1b1b6" stroke-width="1"/>
    <text x="400" y="197" font-family="Courier New" font-size="14" fill="#1f1f1f" text-anchor="middle">165</text>
</svg>