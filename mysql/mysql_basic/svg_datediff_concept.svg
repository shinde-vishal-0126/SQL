<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 220">
    <rect width="600" height="220" fill="#1E1E1E" rx="10"/>
    <text x="300" y="40" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#4FC1FF" text-anchor="middle">DATEDIFF() Concept</text>
    
    <text x="150" y="80" font-family="Courier New" font-size="16" fill="#A0A0A0" text-anchor="middle">Order Date</text>
    <text x="150" y="100" font-family="Courier New" font-size="20" font-weight="bold" fill="#E0E0E0" text-anchor="middle">2025-08-20</text>
    
    <text x="450" y="80" font-family="Courier New" font-size="16" fill="#A0A0A0" text-anchor="middle">Shipping Date</text>
    <text x="450" y="100" font-family="Courier New" font-size="20" font-weight="bold" fill="#E0E0E0" text-anchor="middle">2026-02-01</text>
    
    <rect x="250" y="75" width="100" height="30" rx="5" fill="#2D2D30" stroke="#4FC1FF" stroke-width="2"/>
    <text x="300" y="95" font-family="Arial" font-size="14" font-weight="bold" fill="#4FC1FF" text-anchor="middle">DATEDIFF</text>
    
    <!-- Lines to results -->
    <path d="M 300 105 L 200 135" fill="none" stroke="#3E3E42" stroke-width="2"/>
    <path d="M 300 105 L 300 135" fill="none" stroke="#3E3E42" stroke-width="2"/>
    <path d="M 300 105 L 400 135" fill="none" stroke="#3E3E42" stroke-width="2"/>
    
    <circle cx="200" cy="150" r="25" fill="#1E1E1E" stroke="#4EC9B0" stroke-width="2"/>
    <text x="200" y="155" font-family="Arial" font-size="12" fill="#4EC9B0" text-anchor="middle">YEAR</text>
    <rect x="180" y="180" width="40" height="25" fill="#2D2D30" stroke="#3E3E42" stroke-width="1"/>
    <text x="200" y="197" font-family="Courier New" font-size="14" fill="#E0E0E0" text-anchor="middle">0</text>

    <circle cx="300" cy="150" r="25" fill="#1E1E1E" stroke="#C586C0" stroke-width="2"/>
    <text x="300" y="155" font-family="Arial" font-size="12" fill="#C586C0" text-anchor="middle">MONTH</text>
    <rect x="280" y="180" width="40" height="25" fill="#2D2D30" stroke="#3E3E42" stroke-width="1"/>
    <text x="300" y="197" font-family="Courier New" font-size="14" fill="#E0E0E0" text-anchor="middle">5</text>

    <circle cx="400" cy="150" r="25" fill="#1E1E1E" stroke="#DCDCAA" stroke-width="2"/>
    <text x="400" y="155" font-family="Arial" font-size="12" fill="#DCDCAA" text-anchor="middle">DAY</text>
    <rect x="380" y="180" width="40" height="25" fill="#2D2D30" stroke="#3E3E42" stroke-width="1"/>
    <text x="400" y="197" font-family="Courier New" font-size="14" fill="#E0E0E0" text-anchor="middle">165</text>
</svg>