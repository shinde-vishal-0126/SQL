<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450">
    <rect width="800" height="450" fill="#1E1E1E" rx="10"/>
    
    <rect x="250" y="10" width="300" height="40" fill="#FFD700" stroke="#1E1E1E" stroke-width="2" rx="5"/>
    <text x="400" y="35" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#1E1E1E" text-anchor="middle">Recursive CTE Syntax</text>
    
    <!-- CTE Definition Box -->
    <rect x="150" y="70" width="300" height="260" fill="#2D2D30" stroke="#4FC1FF" stroke-width="2" rx="5"/>
    <text x="170" y="95" font-family="Consolas, monospace" font-size="16" font-weight="bold" fill="#4FC1FF">WITH</text>
    <rect x="220" y="80" width="100" height="20" fill="#1E1E1E" stroke="#E0E0E0" stroke-width="1"/>
    <text x="270" y="95" font-family="Consolas, monospace" font-size="14" fill="#E0E0E0" text-anchor="middle">CTE-Name</text>
    <text x="330" y="95" font-family="Consolas, monospace" font-size="16" font-weight="bold" fill="#4FC1FF">AS (</text>
    
    <!-- Anchor Query -->
    <text x="190" y="125" font-family="Consolas, monospace" font-size="14" font-weight="bold" fill="#4EC9B0">SELECT ...</text>
    <text x="190" y="145" font-family="Consolas, monospace" font-size="14" font-weight="bold" fill="#4EC9B0">FROM ...</text>
    <text x="190" y="165" font-family="Consolas, monospace" font-size="14" font-weight="bold" fill="#4EC9B0">WHERE ...</text>
    
    <!-- UNION ALL -->
    <path d="M 170 185 L 430 185" fill="none" stroke="#E0E0E0" stroke-dasharray="2,2"/>
    <text x="190" y="205" font-family="Consolas, monospace" font-size="16" font-weight="bold" fill="#4FC1FF">UNION ALL</text>
    <path d="M 170 220 L 430 220" fill="none" stroke="#E0E0E0" stroke-dasharray="2,2"/>
    
    <!-- Recursive Query -->
    <text x="190" y="245" font-family="Consolas, monospace" font-size="14" font-weight="bold" fill="#4EC9B0">SELECT ...</text>
    <text x="190" y="265" font-family="Consolas, monospace" font-size="14" font-weight="bold" fill="#4EC9B0">FROM</text>
    <rect x="240" y="250" width="100" height="20" fill="#1E1E1E" stroke="#E0E0E0" stroke-width="1"/>
    <text x="290" y="265" font-family="Consolas, monospace" font-size="14" fill="#E0E0E0" text-anchor="middle">CTE-Name</text>
    <text x="190" y="285" font-family="Consolas, monospace" font-size="14" font-weight="bold" fill="#4EC9B0">WHERE [Break Condition]</text>
    
    <text x="170" y="315" font-family="Consolas, monospace" font-size="16" font-weight="bold" fill="#4FC1FF">)</text>
    
    <!-- Main Query Usage Box -->
    <path d="M 150 335 L 450 335" fill="none" stroke="#F44747" stroke-width="3" stroke-dasharray="5,5"/>
    
    <rect x="150" y="350" width="300" height="80" fill="#2D2D30" stroke="#FFD700" stroke-width="2" rx="5"/>
    <text x="170" y="380" font-family="Consolas, monospace" font-size="14" font-weight="bold" fill="#4EC9B0">SELECT ...</text>
    <text x="170" y="400" font-family="Consolas, monospace" font-size="14" font-weight="bold" fill="#4EC9B0">FROM</text>
    <rect x="220" y="385" width="100" height="20" fill="#1E1E1E" stroke="#E0E0E0" stroke-width="1"/>
    <text x="270" y="400" font-family="Consolas, monospace" font-size="14" fill="#E0E0E0" text-anchor="middle">CTE-Name</text>
    <text x="170" y="420" font-family="Consolas, monospace" font-size="14" font-weight="bold" fill="#4EC9B0">WHERE ...</text>

    <!-- Side Brackets and Labels -->
    <path d="M 460 110 L 470 110 L 470 170 L 460 170" fill="none" stroke="#F44747" stroke-width="2"/>
    <text x="480" y="135" font-family="Arial" font-size="14" font-weight="bold" fill="#F44747">Anchor</text>
    <text x="480" y="155" font-family="Arial" font-size="14" font-weight="bold" fill="#F44747">Query</text>
    
    <path d="M 460 230 L 470 230 L 470 290 L 460 290" fill="none" stroke="#F44747" stroke-width="2"/>
    <text x="480" y="255" font-family="Arial" font-size="14" font-weight="bold" fill="#F44747">Recursive</text>
    <text x="480" y="275" font-family="Arial" font-size="14" font-weight="bold" fill="#F44747">Query</text>
    
    <!-- Connection Arc from Anchor to CTE-Name in Recursive Query -->
    <path d="M 330 95 Q 500 180 350 260" fill="none" stroke="#C586C0" stroke-dasharray="4,4" stroke-width="2" marker-end="url(#arrow)"/>
    <polygon points="350,260 358,255 358,265" fill="#C586C0"/>
    
    <!-- Connection Arc from Recursive Query to Main Query -->
    <path d="M 310 280 Q 550 330 330 395" fill="none" stroke="#C586C0" stroke-dasharray="4,4" stroke-width="2" marker-end="url(#arrow)"/>
    <polygon points="330,395 338,390 338,400" fill="#C586C0"/>
</svg>
