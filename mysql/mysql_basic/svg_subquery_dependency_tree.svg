<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300">
    <rect width="600" height="300" fill="#1E1E1E" rx="10"/>
    
    <rect x="200" y="50" width="200" height="50" fill="#4EC9B0" stroke="#E0E0E0" stroke-width="2" rx="10"/>
    <text x="300" y="80" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#1E1E1E" text-anchor="middle">Dependency</text>
    
    <path d="M 300 100 L 300 150" stroke="#E0E0E0" stroke-width="3"/>
    <path d="M 150 150 L 450 150" stroke="#E0E0E0" stroke-width="3"/>
    
    <path d="M 150 150 L 150 180" stroke="#E0E0E0" stroke-width="3"/>
    <polygon points="150,180 142,170 158,170" fill="#E0E0E0"/>
    
    <rect x="50" y="180" width="200" height="60" fill="#2D2D30" stroke="#E0E0E0" stroke-width="2" rx="5"/>
    <text x="150" y="210" font-family="Arial" font-size="16" font-weight="bold" fill="#E0E0E0" text-anchor="middle">Non-Correlated</text>
    <text x="150" y="230" font-family="Arial" font-size="14" fill="#E0E0E0" text-anchor="middle">Subquery</text>
    
    <path d="M 450 150 L 450 180" stroke="#E0E0E0" stroke-width="3"/>
    <polygon points="450,180 442,170 458,170" fill="#E0E0E0"/>
    
    <rect x="350" y="180" width="200" height="60" fill="#2D2D30" stroke="#E0E0E0" stroke-width="2" rx="5"/>
    <text x="450" y="210" font-family="Arial" font-size="16" font-weight="bold" fill="#E0E0E0" text-anchor="middle">Correlated</text>
    <text x="450" y="230" font-family="Arial" font-size="14" fill="#E0E0E0" text-anchor="middle">Subquery</text>
</svg>
