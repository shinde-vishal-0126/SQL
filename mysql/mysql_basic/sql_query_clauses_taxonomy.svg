<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1150 720" width="100%" height="100%">
  <defs>
    <linearGradient id="bgDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="50%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <linearGradient id="primaryCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <marker id="arrowWhite" markerWidth="8" markerHeight="8" refX="5" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#94a3b8"/>
    </marker>
    <marker id="arrowCyan" markerWidth="8" markerHeight="8" refX="5" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#38bdf8"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1150" height="720" rx="16" fill="url(#bgDark)" stroke="#1e293b" stroke-width="2"/>

  <!-- Grid overlay -->
  <g opacity="0.12">
    <path d="M0,80 L1150,80 M0,160 L1150,160 M0,240 L1150,240 M0,320 L1150,320 M0,400 L1150,400 M0,480 L1150,480 M0,560 L1150,560 M0,640 L1150,640" stroke="#475569" stroke-width="1"/>
    <path d="M115,0 L115,720 M230,0 L230,720 M345,0 L345,720 M460,0 L460,720 M575,0 L575,720 M690,0 L690,720 M805,0 L805,720 M920,0 L920,720 M1035,0 L1035,720" stroke="#475569" stroke-width="1"/>
  </g>

  <!-- Title -->
  <g transform="translate(575, 45)" text-anchor="middle">
    <text font-family="'Segoe UI', Roboto, sans-serif" font-size="26" font-weight="bold" fill="#f8fafc">The 9 Essential SQL Query Clauses</text>
    <text y="25" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" fill="#94a3b8">Complete classification of DQL building blocks for constructing queries</text>
  </g>

  <!-- LEFT: Central "SQL Query" Box with Magnifying Glass -->
  <g transform="translate(100, 310)">
    <!-- Magnifying glass icon on the left -->
    <g transform="translate(-65, 30)">
      <circle cx="25" cy="25" r="18" fill="none" stroke="#f8fafc" stroke-width="3.5"/>
      <line x1="38" y1="38" x2="52" y2="52" stroke="#f8fafc" stroke-width="4.5" stroke-linecap="round"/>
      <circle cx="21" cy="21" r="5" fill="#38bdf8" opacity="0.8"/>
    </g>
    
    <!-- Central box -->
    <rect x="0" y="0" width="220" height="100" rx="12" fill="#0f172a" stroke="#f8fafc" stroke-width="2.5"/>
    <text x="110" y="44" font-family="'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="bold" fill="#ffffff" text-anchor="middle">SQL</text>
    <text x="110" y="78" font-family="'Segoe UI', Roboto, sans-serif" font-size="26" font-weight="bold" fill="#fbbf24" text-anchor="middle" text-decoration="underline">Query</text>
  </g>

  <!-- Branching Connectors from Central Box (x: 320, y: 360) to 9 Clauses -->
  <!-- 1. SELECT -->
  <path d="M 320 330 C 450 300, 520 100, 600 100" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrowCyan)"/>
  <!-- 2. DISTINCT -->
  <path d="M 320 335 C 450 310, 520 165, 600 165" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrowCyan)"/>
  <!-- 3. TOP / LIMIT -->
  <path d="M 320 345 C 450 325, 520 230, 600 230" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrowCyan)"/>
  <!-- 4. FROM -->
  <path d="M 320 355 C 450 340, 520 295, 600 295" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrowCyan)"/>
  <!-- 5. JOIN -->
  <path d="M 320 360 C 450 360, 520 360, 600 360" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrowCyan)"/>
  <!-- 6. WHERE -->
  <path d="M 320 365 C 450 380, 520 425, 600 425" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrowCyan)"/>
  <!-- 7. GROUP BY -->
  <path d="M 320 375 C 450 400, 520 490, 600 490" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrowCyan)"/>
  <!-- 8. HAVING -->
  <path d="M 320 385 C 450 415, 520 555, 600 555" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrowCyan)"/>
  <!-- 9. ORDER BY -->
  <path d="M 320 390 C 450 430, 520 620, 600 620" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrowCyan)"/>

  <!-- 9 CLAUSE CARDS ON THE RIGHT -->

  <!-- 1. SELECT -->
  <g transform="translate(610, 78)">
    <rect width="210" height="44" rx="6" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/>
    <text x="105" y="29" font-family="'Fira Code', monospace" font-size="19" font-weight="bold" fill="#38bdf8" text-anchor="middle">SELECT</text>
    <!-- Icon: Split branches -->
    <g transform="translate(230, 8)">
      <path d="M 0 14 L 18 14 M 18 14 L 30 5 M 18 14 L 30 23" stroke="#fbbf24" stroke-width="2.5" fill="none"/>
    </g>
    <!-- Description -->
    <text x="280" y="28" font-family="'Segoe UI', sans-serif" font-size="13" fill="#cbd5e1">Specifies which columns to retrieve</text>
  </g>

  <!-- 2. DISTINCT -->
  <g transform="translate(610, 143)">
    <rect width="210" height="44" rx="6" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/>
    <text x="105" y="29" font-family="'Fira Code', monospace" font-size="19" font-weight="bold" fill="#38bdf8" text-anchor="middle">DISTINCT</text>
    <!-- Icon: Geometric shapes -->
    <g transform="translate(230, 10)">
      <circle cx="8" cy="12" r="6" fill="none" stroke="#fbbf24" stroke-width="2"/>
      <rect x="20" y="6" width="12" height="12" fill="none" stroke="#fbbf24" stroke-width="2"/>
    </g>
    <text x="280" y="28" font-family="'Segoe UI', sans-serif" font-size="13" fill="#cbd5e1">Removes duplicate rows from results</text>
  </g>

  <!-- 3. TOP / LIMIT -->
  <g transform="translate(610, 208)">
    <rect width="210" height="44" rx="6" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/>
    <text x="105" y="29" font-family="'Fira Code', monospace" font-size="17" font-weight="bold" fill="#38bdf8" text-anchor="middle">TOP / LIMIT</text>
    <!-- Icon: Stacked horizontal bars -->
    <g transform="translate(230, 8)">
      <rect x="0" y="4" width="28" height="5" rx="2" fill="#fbbf24"/>
      <rect x="0" y="13" width="28" height="5" rx="2" fill="#fbbf24"/>
      <rect x="0" y="22" width="28" height="5" rx="2" fill="#64748b"/>
    </g>
    <text x="280" y="28" font-family="'Segoe UI', sans-serif" font-size="13" fill="#cbd5e1">Limits the maximum number of rows returned</text>
  </g>

  <!-- 4. FROM -->
  <g transform="translate(610, 273)">
    <rect width="210" height="44" rx="6" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/>
    <text x="105" y="29" font-family="'Fira Code', monospace" font-size="19" font-weight="bold" fill="#38bdf8" text-anchor="middle">FROM</text>
    <!-- Icon: Grid table -->
    <g transform="translate(230, 8)">
      <rect x="0" y="2" width="28" height="24" rx="2" fill="none" stroke="#fbbf24" stroke-width="2"/>
      <line x1="0" y1="10" x2="28" y2="10" stroke="#fbbf24" stroke-width="1.5"/>
      <line x1="14" y1="2" x2="14" y2="26" stroke="#fbbf24" stroke-width="1.5"/>
    </g>
    <text x="280" y="28" font-family="'Segoe UI', sans-serif" font-size="13" fill="#cbd5e1">Designates the source table(s) to read</text>
  </g>

  <!-- 5. JOIN -->
  <g transform="translate(610, 338)">
    <rect width="210" height="44" rx="6" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/>
    <text x="105" y="29" font-family="'Fira Code', monospace" font-size="19" font-weight="bold" fill="#38bdf8" text-anchor="middle">JOIN</text>
    <!-- Icon: Venn Intersecting rings -->
    <g transform="translate(230, 8)">
      <circle cx="10" cy="14" r="9" fill="none" stroke="#fbbf24" stroke-width="2"/>
      <circle cx="20" cy="14" r="9" fill="none" stroke="#fbbf24" stroke-width="2"/>
    </g>
    <text x="280" y="28" font-family="'Segoe UI', sans-serif" font-size="13" fill="#cbd5e1">Combines data from multiple related tables</text>
  </g>

  <!-- 6. WHERE -->
  <g transform="translate(610, 403)">
    <rect width="210" height="44" rx="6" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/>
    <text x="105" y="29" font-family="'Fira Code', monospace" font-size="19" font-weight="bold" fill="#38bdf8" text-anchor="middle">WHERE</text>
    <!-- Icon: Funnel Filter -->
    <g transform="translate(230, 8)">
      <path d="M 2 4 L 26 4 L 16 16 L 16 26 L 12 24 L 12 16 Z" fill="none" stroke="#fbbf24" stroke-width="2"/>
    </g>
    <text x="280" y="28" font-family="'Segoe UI', sans-serif" font-size="13" fill="#cbd5e1">Filters individual rows by condition</text>
  </g>

  <!-- 7. GROUP BY -->
  <g transform="translate(610, 468)">
    <rect width="210" height="44" rx="6" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/>
    <text x="105" y="29" font-family="'Fira Code', monospace" font-size="18" font-weight="bold" fill="#38bdf8" text-anchor="middle">GROUP BY</text>
    <!-- Icon: Sigma & bars -->
    <g transform="translate(230, 8)">
      <text x="5" y="22" font-family="serif" font-size="20" font-weight="bold" fill="#fbbf24">∑</text>
      <line x1="20" y1="8" x2="30" y2="8" stroke="#fbbf24" stroke-width="2"/>
      <line x1="20" y1="14" x2="27" y2="14" stroke="#fbbf24" stroke-width="2"/>
      <line x1="20" y1="20" x2="30" y2="20" stroke="#fbbf24" stroke-width="2"/>
    </g>
    <text x="280" y="28" font-family="'Segoe UI', sans-serif" font-size="13" fill="#cbd5e1">Groups rows having identical values</text>
  </g>

  <!-- 8. HAVING -->
  <g transform="translate(610, 533)">
    <rect width="210" height="44" rx="6" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/>
    <text x="105" y="29" font-family="'Fira Code', monospace" font-size="19" font-weight="bold" fill="#38bdf8" text-anchor="middle">HAVING</text>
    <!-- Icon: Funnel on aggregates -->
    <g transform="translate(230, 8)">
      <path d="M 2 4 L 26 4 L 16 16 L 16 26 L 12 24 L 12 16 Z" fill="none" stroke="#fbbf24" stroke-width="2"/>
      <line x1="6" y1="8" x2="22" y2="8" stroke="#fbbf24" stroke-width="1.5"/>
    </g>
    <text x="280" y="28" font-family="'Segoe UI', sans-serif" font-size="13" fill="#cbd5e1">Filters aggregated groups (post GROUP BY)</text>
  </g>

  <!-- 9. ORDER BY -->
  <g transform="translate(610, 598)">
    <rect width="210" height="44" rx="6" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/>
    <text x="105" y="29" font-family="'Fira Code', monospace" font-size="19" font-weight="bold" fill="#38bdf8" text-anchor="middle">ORDER BY</text>
    <!-- Icon: Up and Down sorting arrows -->
    <g transform="translate(230, 8)">
      <path d="M 8 24 L 8 4 M 4 9 L 8 4 L 12 9" stroke="#fbbf24" stroke-width="2.5" fill="none"/>
      <path d="M 22 4 L 22 24 M 18 19 L 22 24 L 26 19" stroke="#fbbf24" stroke-width="2.5" fill="none"/>
    </g>
    <text x="280" y="28" font-family="'Segoe UI', sans-serif" font-size="13" fill="#cbd5e1">Sorts the output rows (ASC / DESC)</text>
  </g>

  <!-- Bottom rule note -->
  <g transform="translate(575, 688)" text-anchor="middle">
    <text font-family="'Segoe UI', Roboto, sans-serif" font-size="13" fill="#94a3b8">
      📌 <tspan fill="#38bdf8" font-weight="bold">Note on MySQL:</tspan> MySQL uses <tspan fill="#fbbf24" font-weight="bold">LIMIT</tspan> instead of <tspan fill="#fbbf24" font-weight="bold">TOP</tspan> (which is used in SQL Server / MS Access).
    </text>
  </g>
</svg>
