<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 200">
    <rect width="600" height="200" fill="#1E1E1E" rx="10"/>
    <text x="300" y="30" font-family="Courier New" font-size="20" font-weight="bold" fill="#4FC1FF" text-anchor="middle">MOD(x, y) - Find Remainders</text>
    <text x="300" y="55" font-family="Arial" font-size="14" fill="#A0A0A0" text-anchor="middle">Interview Favorite: Finding Even / Odd rows</text>
    
    <!-- Even -->
    <rect x="100" y="80" width="180" height="80" rx="5" fill="#2D2D30" stroke="#4EC9B0" stroke-width="2"/>
    <text x="190" y="105" font-family="Arial" font-size="16" font-weight="bold" fill="#4EC9B0" text-anchor="middle">EVEN Numbers</text>
    <text x="190" y="140" font-family="Courier New" font-size="14" fill="#E0E0E0" text-anchor="middle">MOD(id, 2) = 0</text>

    <!-- Odd -->
    <rect x="320" y="80" width="180" height="80" rx="5" fill="#2D2D30" stroke="#DCDCAA" stroke-width="2"/>
    <text x="410" y="105" font-family="Arial" font-size="16" font-weight="bold" fill="#DCDCAA" text-anchor="middle">ODD Numbers</text>
    <text x="410" y="140" font-family="Courier New" font-size="14" fill="#E0E0E0" text-anchor="middle">MOD(id, 2) = 1</text>
</svg>