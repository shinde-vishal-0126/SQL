<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 580" width="100%" height="100%">
  <defs>
    <!-- Filter Shadows -->
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
    <filter id="topShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000000" flood-opacity="0.18"/>
    </filter>

    <!-- Gradients -->
    <linearGradient id="bgCanvas" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>

    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>

    <linearGradient id="replaceHeader" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#dc2626"/>
      <stop offset="100%" stop-color="#ef4444"/>
    </linearGradient>

    <linearGradient id="duplicateHeader" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>

    <!-- Markers -->
    <marker id="arrowRed" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L6,3 z" fill="#dc2626"/>
    </marker>
    <marker id="arrowGreen" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L6,3 z" fill="#059669"/>
    </marker>
  </defs>

  <style>
    .main-title { font-family: 'Segoe UI', system-ui, sans-serif; font-weight: 900; font-size: 21px; fill: #ffffff; }
    .sub-title { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 12.5px; fill: #94a3b8; }
    .col-title { font-family: 'Segoe UI', system-ui, sans-serif; font-weight: 800; font-size: 15px; fill: #ffffff; }
    .step-title { font-family: 'Segoe UI', sans-serif; font-weight: 800; font-size: 12px; }
    .body-text { font-family: 'Segoe UI', sans-serif; font-size: 11.5px; fill: #1e293b; line-height: 1.4; }
    .code-snippet { font-family: 'Consolas', monospace; font-size: 11px; font-weight: 700; }
    .badge { font-family: 'Segoe UI', monospace; font-size: 10px; font-weight: 800; }
  </style>

  <!-- Background -->
  <rect width="100%" height="100%" fill="url(#bgCanvas)" rx="16"/>
  <rect width="100%" height="100%" fill="none" stroke="#cbd5e1" stroke-width="2" rx="16"/>

  <!-- Top Banner -->
  <g filter="url(#topShadow)">
    <rect x="25" y="20" width="1050" height="70" rx="12" fill="url(#headerGrad)"/>
    <text x="45" y="48" class="main-title">REPLACE INTO vs. INSERT ... ON DUPLICATE KEY UPDATE</text>
    <text x="45" y="72" class="sub-title">How MySQL handles duplicate Primary Key / Unique Key conflicts during data insertion</text>
  </g>

  <!-- ================= LEFT PANEL: REPLACE INTO ================= -->
  <g filter="url(#shadow)">
    <rect x="30" y="110" width="505" height="425" rx="12" fill="#ffffff" stroke="#fecaca" stroke-width="2"/>
    <!-- Header -->
    <path d="M 30 122 Q 30 110 42 110 L 523 110 Q 535 110 535 122 L 535 155 L 30 155 Z" fill="url(#replaceHeader)"/>
    <text x="48" y="139" class="col-title">METHOD 1: REPLACE INTO</text>
    <rect x="365" y="121" width="155" height="24" rx="6" fill="#ffffff" fill-opacity="0.25"/>
    <text x="375" y="137" class="badge" fill="#ffffff">DELETE + INSERT CYCLE</text>

    <!-- Query Box -->
    <rect x="45" y="168" width="475" height="60" rx="6" fill="#fef2f2" stroke="#fee2e2"/>
    <text x="55" y="186" class="code-snippet" fill="#991b1b">REPLACE INTO customers</text>
    <text x="55" y="204" class="code-snippet" fill="#991b1b">VALUES (6, 'SHINDE...', 'UK', 890);</text>
    <text x="55" y="221" class="body-text" font-size="10.5px" fill="#b91c1c">Target: If key 6 already exists in the table...</text>

    <!-- Step 1 Box -->
    <rect x="45" y="238" width="475" height="64" rx="6" fill="#fff1f2" stroke="#fecdd3"/>
    <text x="55" y="256" class="step-title" fill="#be123c">Step 1: PHYSICAL DELETION OF OLD ROW</text>
    <text x="55" y="274" class="body-text">The database engine finds the conflicting key (id = 6) and</text>
    <text x="55" y="291" class="body-text" font-weight="700" fill="#e11d48">completely DELETES the existing row from storage pages.</text>

    <!-- Step 2 Box -->
    <rect x="45" y="312" width="475" height="64" rx="6" fill="#fef2f2" stroke="#fecaca"/>
    <text x="55" y="330" class="step-title" fill="#991b1b">Step 2: INSERTION OF BRAND NEW ROW</text>
    <text x="55" y="348" class="body-text">A brand new row with the replacement data is inserted.</text>
    <text x="55" y="365" class="body-text" fill="#7f1d1d">⚠️ Any omitted columns are wiped to NULL or default value!</text>

    <!-- Key Takeaway -->
    <rect x="45" y="386" width="475" height="52" rx="6" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="55" y="404" class="step-title" fill="#475569">SIDE EFFECTS:</text>
    <text x="55" y="422" class="body-text" fill="#0f172a">• Fires DELETE + INSERT triggers  • Auto-Increment increases</text>
    <text x="55" y="450" class="badge" fill="#dc2626">Result: Total destruction and recreation of the row</text>
  </g>

  <!-- ================= RIGHT PANEL: INSERT ... ON DUPLICATE KEY UPDATE ================= -->
  <g filter="url(#shadow)">
    <rect x="565" y="110" width="505" height="425" rx="12" fill="#ffffff" stroke="#a7f3d0" stroke-width="2"/>
    <!-- Header -->
    <path d="M 565 122 Q 565 110 577 110 L 1058 110 Q 1070 110 1070 122 L 1070 155 L 565 155 Z" fill="url(#duplicateHeader)"/>
    <text x="583" y="139" class="col-title">METHOD 2: ON DUPLICATE KEY UPDATE</text>
    <rect x="910" y="121" width="145" height="24" rx="6" fill="#ffffff" fill-opacity="0.25"/>
    <text x="920" y="137" class="badge" fill="#ffffff">IN-PLACE UPDATE</text>

    <!-- Query Box -->
    <rect x="580" y="168" width="475" height="60" rx="6" fill="#f0fdf4" stroke="#dcfce7"/>
    <text x="590" y="186" class="code-snippet" fill="#166534">INSERT INTO customers VALUES (8, 'DEF', 'IND', 800)</text>
    <text x="590" y="204" class="code-snippet" fill="#166534">ON DUPLICATE KEY UPDATE FIRST_NAME = 'SHINDE';</text>
    <text x="590" y="221" class="body-text" font-size="10.5px" fill="#15803d">Target: If key 8 already exists in the table...</text>

    <!-- Step 1 Box -->
    <rect x="580" y="238" width="475" height="64" rx="6" fill="#ecfdf5" stroke="#a7f3d0"/>
    <text x="590" y="256" class="step-title" fill="#047857">Step 1: DETECT DUPLICATE WITHOUT DELETION</text>
    <text x="590" y="274" class="body-text">The database engine detects conflicting key (id = 8).</text>
    <text x="590" y="291" class="body-text" font-weight="700" fill="#059669">It DOES NOT delete the existing row from storage.</text>

    <!-- Step 2 Box -->
    <rect x="580" y="312" width="475" height="64" rx="6" fill="#f0fdf4" stroke="#bbf7d0"/>
    <text x="590" y="330" class="step-title" fill="#166534">Step 2: IN-PLACE CELL MODIFICATION</text>
    <text x="590" y="348" class="body-text">Only the specified column (FIRST_NAME = 'SHINDE') is updated.</text>
    <text x="590" y="365" class="body-text" fill="#15803d">✓ All other existing columns (country, score) remain completely preserved!</text>

    <!-- Key Takeaway -->
    <rect x="580" y="386" width="475" height="52" rx="6" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="590" y="404" class="step-title" fill="#475569">EFFICIENCY BENEFITS:</text>
    <text x="590" y="422" class="body-text" fill="#0f172a">• Fires UPDATE triggers only  • Preserves Auto-Increment sequence</text>
    <text x="590" y="450" class="badge" fill="#059669">Result: Safe in-place modification without wiping other data</text>
  </g>

  <!-- Bottom Comparison Bar -->
  <rect x="30" y="545" width="1040" height="25" rx="6" fill="#e2e8f0"/>
  <text x="45" y="562" class="body-text" font-weight="700" fill="#334155">Summary: Use ON DUPLICATE KEY UPDATE when modifying partial columns. Use REPLACE only when a full overwrite/reset of the row is desired.</text>
</svg>
