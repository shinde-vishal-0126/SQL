<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 250">
    <rect width="600" height="250" fill="#1E1E1E" rx="10"/>
    <text x="300" y="30" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#E0E0E0" text-anchor="middle">NULL vs Empty String vs Blank Space</text>
    
    <!-- Headers -->
    <text x="150" y="70" font-family="Courier New" font-size="16" font-weight="bold" fill="#F44747" text-anchor="middle">NULL</text>
    <text x="300" y="70" font-family="Courier New" font-size="16" font-weight="bold" fill="#4FC1FF" text-anchor="middle">'' (Empty)</text>
    <text x="450" y="70" font-family="Courier New" font-size="16" font-weight="bold" fill="#DCDCAA" text-anchor="middle">' ' (Space)</text>

    <!-- Meaning -->
    <text x="150" y="110" font-family="Arial" font-size="14" fill="#E0E0E0" text-anchor="middle">Unknown</text>
    <text x="300" y="110" font-family="Arial" font-size="14" fill="#E0E0E0" text-anchor="middle">Known (Empty)</text>
    <text x="450" y="110" font-family="Arial" font-size="14" fill="#E0E0E0" text-anchor="middle">Known (Space)</text>

    <!-- DataType -->
    <text x="150" y="140" font-family="Arial" font-size="14" fill="#A0A0A0" text-anchor="middle">Special Marker</text>
    <text x="300" y="140" font-family="Arial" font-size="14" fill="#A0A0A0" text-anchor="middle">String (0)</text>
    <text x="450" y="140" font-family="Arial" font-size="14" fill="#A0A0A0" text-anchor="middle">String (1+)</text>

    <!-- Storage / Perf -->
    <text x="150" y="170" font-family="Arial" font-size="14" fill="#4EC9B0" text-anchor="middle">Minimal / Best</text>
    <text x="300" y="170" font-family="Arial" font-size="14" fill="#DCDCAA" text-anchor="middle">Occupies Mem / Fast</text>
    <text x="450" y="170" font-family="Arial" font-size="14" fill="#F44747" text-anchor="middle">Occupies Mem / Slow</text>

    <!-- Comparison -->
    <text x="150" y="200" font-family="Courier New" font-size="14" font-weight="bold" fill="#4FC1FF" text-anchor="middle">IS NULL</text>
    <text x="300" y="200" font-family="Courier New" font-size="14" font-weight="bold" fill="#4FC1FF" text-anchor="middle">=''</text>
    <text x="450" y="200" font-family="Courier New" font-size="14" font-weight="bold" fill="#4FC1FF" text-anchor="middle">=' '</text>

    <!-- Grid lines -->
    <path d="M 225 50 L 225 210" fill="none" stroke="#3E3E42" stroke-width="1"/>
    <path d="M 375 50 L 375 210" fill="none" stroke="#3E3E42" stroke-width="1"/>
</svg>