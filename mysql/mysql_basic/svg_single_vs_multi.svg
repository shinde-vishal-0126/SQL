<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 300">
    <rect width="700" height="300" fill="#eeeeee" rx="10"/>
    <text x="350" y="40" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#0072b0" text-anchor="middle">Single-Row vs Multi-Row Functions</text>
    
    <!-- Single Row -->
    <text x="150" y="90" font-family="Arial" font-size="18" font-weight="bold" fill="#793a74" text-anchor="middle">1. Single-Row Functions</text>
    <text x="150" y="110" font-family="Arial" font-size="12" fill="#5f5f5f" text-anchor="middle">1 Input Row = 1 Output Row</text>
    
    <text x="70" y="150" font-family="Courier New" font-size="16" fill="#1f1f1f">'MARIA'</text>
    <path d="M 140 145 L 180 145" fill="none" stroke="#b1b1b6" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="190" y="125" width="80" height="40" rx="5" fill="#e8e8e9" stroke="#0072b0" stroke-width="2"/>
    <text x="230" y="150" font-family="Arial" font-size="14" font-weight="bold" fill="#0072b0" text-anchor="middle">LOWER()</text>
    <path d="M 280 145 L 320 145" fill="none" stroke="#b1b1b6" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="330" y="150" font-family="Courier New" font-size="16" fill="#267d6b">'maria'</text>
    
    <!-- Multi Row -->
    <text x="150" y="210" font-family="Arial" font-size="18" font-weight="bold" fill="#575724" text-anchor="middle">2. Multi-Row Functions (Aggregates)</text>
    <text x="150" y="230" font-family="Arial" font-size="12" fill="#5f5f5f" text-anchor="middle">Multiple Input Rows = 1 Summarized Output</text>
    
    <text x="90" y="250" font-family="Courier New" font-size="14" fill="#1f1f1f">30</text>
    <text x="90" y="265" font-family="Courier New" font-size="14" fill="#1f1f1f">10</text>
    <text x="90" y="280" font-family="Courier New" font-size="14" fill="#1f1f1f">20</text>
    
    <path d="M 120 250 L 180 260" fill="none" stroke="#b1b1b6" stroke-width="2" marker-end="url(#arrow)"/>
    <path d="M 120 265 L 180 265" fill="none" stroke="#b1b1b6" stroke-width="2" marker-end="url(#arrow)"/>
    <path d="M 120 280 L 180 270" fill="none" stroke="#b1b1b6" stroke-width="2" marker-end="url(#arrow)"/>
    
    <rect x="190" y="245" width="80" height="40" rx="5" fill="#e8e8e9" stroke="#0072b0" stroke-width="2"/>
    <text x="230" y="270" font-family="Arial" font-size="14" font-weight="bold" fill="#0072b0" text-anchor="middle">SUM()</text>
    
    <path d="M 280 265 L 320 265" fill="none" stroke="#b1b1b6" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="330" y="270" font-family="Courier New" font-size="16" font-weight="bold" fill="#267d6b">60</text>

    <!-- Def -->
    <defs>
        <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
            <path d="M0,0 L0,6 L9,3 z" fill="#e3e3e5" />
        </marker>
    </defs>
</svg>