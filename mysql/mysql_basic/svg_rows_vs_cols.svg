    </defs><text x='300' y='40' font-family='Arial' font-size='24' font-weight='bold' fill='#00ffcc' text-anchor='middle'>Rows vs Columns (SET vs JOIN)</text><g transform='translate(0, 50)'><rect x='150' y='20' width='80' height='50' fill='url(#left)'/><rect x='150' y='75' width='80' height='50' fill='url(#right)'/><text x='190' y='150' fill='#fff' text-anchor='middle'>SET (Longer)</text><rect x='350' y='40' width='80' height='80' fill='url(#left)'/><rect x='435' y='40' width='80' height='80' fill='url(#right)'/><text x='425' y='150' fill='#fff' text-anchor='middle'>JOIN (Wider)</text></g></svg>
