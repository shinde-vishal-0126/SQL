<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 350">
    <rect width="800" height="350" fill="#eeeeee" rx="10"/>
    <text x="400" y="40" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#575724" text-anchor="middle">String Functions Mastery</text>
    
    <!-- Manipulation -->
    <rect x="50" y="80" width="200" height="40" rx="5" fill="#e8e8e9" stroke="#0072b0" stroke-width="2"/>
    <text x="150" y="105" font-family="Arial" font-size="16" font-weight="bold" fill="#0072b0" text-anchor="middle">Manipulation</text>
    
    <text x="60" y="140" font-family="Courier New" font-size="14" fill="#1f1f1f">CONCAT()</text>
    <text x="150" y="140" font-family="Arial" font-size="12" fill="#5f5f5f">Combines strings</text>
    
    <text x="60" y="170" font-family="Courier New" font-size="14" fill="#1f1f1f">UPPER()</text>
    <text x="150" y="170" font-family="Arial" font-size="12" fill="#5f5f5f">To UPPERCASE</text>
    
    <text x="60" y="200" font-family="Courier New" font-size="14" fill="#1f1f1f">LOWER()</text>
    <text x="150" y="200" font-family="Arial" font-size="12" fill="#5f5f5f">To lowercase</text>
    
    <text x="60" y="230" font-family="Courier New" font-size="14" fill="#1f1f1f">TRIM()</text>
    <text x="150" y="230" font-family="Arial" font-size="12" fill="#5f5f5f">Removes spaces</text>
    
    <text x="60" y="260" font-family="Courier New" font-size="14" fill="#1f1f1f">REPLACE()</text>
    <text x="150" y="260" font-family="Arial" font-size="12" fill="#5f5f5f">Swaps characters</text>
    
    <!-- Calculation -->
    <rect x="300" y="80" width="200" height="40" rx="5" fill="#e8e8e9" stroke="#267d6b" stroke-width="2"/>
    <text x="400" y="105" font-family="Arial" font-size="16" font-weight="bold" fill="#267d6b" text-anchor="middle">Calculation</text>
    
    <text x="310" y="140" font-family="Courier New" font-size="14" fill="#1f1f1f">LENGTH()</text>
    <text x="400" y="140" font-family="Arial" font-size="12" fill="#5f5f5f">Counts characters</text>
    <text x="310" y="170" font-family="Courier New" font-size="14" fill="#1f1f1f">LEN()</text>
    <text x="400" y="170" font-family="Arial" font-size="12" fill="#5f5f5f">(SQL Server)</text>
    
    <!-- Extraction -->
    <rect x="550" y="80" width="200" height="40" rx="5" fill="#e8e8e9" stroke="#793a74" stroke-width="2"/>
    <text x="650" y="105" font-family="Arial" font-size="16" font-weight="bold" fill="#793a74" text-anchor="middle">Extraction</text>
    
    <text x="560" y="140" font-family="Courier New" font-size="14" fill="#1f1f1f">LEFT(str, N)</text>
    <text x="660" y="140" font-family="Arial" font-size="12" fill="#5f5f5f">First N chars</text>
    
    <text x="560" y="170" font-family="Courier New" font-size="14" fill="#1f1f1f">RIGHT(str, N)</text>
    <text x="660" y="170" font-family="Arial" font-size="12" fill="#5f5f5f">Last N chars</text>
    
    <text x="560" y="200" font-family="Courier New" font-size="14" fill="#1f1f1f">SUBSTRING()</text>
    <text x="660" y="200" font-family="Arial" font-size="12" fill="#5f5f5f">Extract from middle</text>
    
    <text x="560" y="220" font-family="Courier New" font-size="12" fill="#1f1f1f">(str, start, length)</text>
</svg>