<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
    <rect width="800" height="400" fill="#1E1E1E" rx="10"/>

    <!-- Grid Background -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
        <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#333" stroke-width="1"/>
    </pattern>
    <rect width="800" height="400" fill="url(#grid)" rx="10"/>
    
    <!-- Title -->
    <rect x="250" y="30" width="300" height="60" fill="#FFCC00" stroke="#000" stroke-width="4" rx="5"/>
    <rect x="254" y="34" width="300" height="60" fill="#000" rx="5" opacity="0.3"/> <!-- Shadow -->
    <text x="400" y="65" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#000" text-anchor="middle">VIEW</text>
    <text x="400" y="80" font-family="Arial, sans-serif" font-size="14" fill="#000" text-anchor="middle">syntax</text>

    <!-- Content Box -->
    <rect x="230" y="140" width="450" height="200" fill="#F0F0F0" stroke="#CCC" stroke-width="2" rx="5"/>
    <!-- Slight Shadow -->
    <rect x="235" y="145" width="450" height="200" fill="#000" rx="5" opacity="0.2"/>

    <!-- Syntax Text -->
    <text x="250" y="180" font-family="Consolas, monospace" font-size="22" font-weight="bold" fill="#0000FF">CREATE VIEW <tspan fill="#000">VIEW-NAME</tspan> AS</text>
    <text x="250" y="210" font-family="Consolas, monospace" font-size="22" font-weight="bold" fill="#0000FF">(</text>
    
    <!-- Inner Query Box -->
    <rect x="280" y="230" width="180" height="80" fill="#FFF" stroke="#DDD" stroke-width="1" rx="5"/>
    <text x="290" y="255" font-family="Consolas, monospace" font-size="18" font-weight="bold" fill="#0000FF">SELECT <tspan fill="#000">...</tspan></text>
    <text x="290" y="275" font-family="Consolas, monospace" font-size="18" font-weight="bold" fill="#0000FF">FROM <tspan fill="#000">...</tspan></text>
    <text x="290" y="295" font-family="Consolas, monospace" font-size="18" font-weight="bold" fill="#0000FF">WHERE <tspan fill="#000">...</tspan></text>
    
    <text x="250" y="330" font-family="Consolas, monospace" font-size="22" font-weight="bold" fill="#0000FF">)</text>

    <!-- Labels -->
    <text x="140" y="160" font-family="Arial, sans-serif" font-size="24" fill="#FFF" text-anchor="middle">DDL</text>
    <text x="140" y="180" font-family="Arial, sans-serif" font-size="18" fill="#888" text-anchor="middle">Command</text>
    <path d="M 190 170 Q 220 170 240 175" stroke="#F44747" stroke-width="2" fill="none" stroke-dasharray="5,5" marker-end="url(#arrow_red)"/>

    <text x="160" y="275" font-family="Arial, sans-serif" font-size="20" fill="#FFF" text-anchor="middle">Query</text>
    <path d="M 200 270 Q 240 270 270 265" stroke="#F44747" stroke-width="2" fill="none" stroke-dasharray="5,5" marker-end="url(#arrow_red)"/>

    <defs>
        <marker id="arrow_red" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#F44747" /></marker>
    </defs>
</svg>
