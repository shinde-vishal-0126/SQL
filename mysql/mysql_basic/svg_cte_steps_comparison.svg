<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450">
    <rect width="800" height="450" fill="#1E1E1E" rx="10"/>
    
    <!-- SUBQUERY SIDE (Left) -->
    <text x="200" y="40" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#4FC1FF" text-anchor="middle">SUBQUERY</text>
    
    <!-- Arrow Bottom-Up -->
    <path d="M 350 400 L 350 80" fill="none" stroke="#F44747" stroke-width="8" marker-end="url(#arrow)"/>
    <polygon points="350,80 340,95 360,95" fill="#F44747"/>
    
    <!-- Step 1 -->
    <text x="100" y="360" font-family="Arial" font-size="14" font-weight="bold" fill="#4FC1FF">STEP 1</text>
    <rect x="150" y="340" width="150" height="40" fill="#FFB7B2" stroke="#F44747" stroke-width="2" rx="5"/>
    <text x="225" y="365" font-family="Arial" font-size="16" font-weight="bold" fill="#1E1E1E" text-anchor="middle">JOIN</text>
    <path d="M 225 340 L 225 320" fill="none" stroke="#E0E0E0" stroke-width="2" marker-end="url(#arrow)"/>
    
    <!-- Step 2 -->
    <text x="100" y="290" font-family="Arial" font-size="14" font-weight="bold" fill="#4FC1FF">STEP 2</text>
    <rect x="150" y="270" width="150" height="40" fill="#E0E0E0" stroke="#1E1E1E" stroke-width="2" rx="5"/>
    <text x="225" y="290" font-family="Arial" font-size="14" font-weight="bold" fill="#1E1E1E" text-anchor="middle">AGGREGATIONS</text>
    <text x="225" y="305" font-family="Arial" font-size="12" fill="#1E1E1E" text-anchor="middle">(SUM)</text>
    <path d="M 225 270 L 225 250" fill="none" stroke="#E0E0E0" stroke-width="2" marker-end="url(#arrow)"/>
    
    <!-- Step 3 -->
    <text x="100" y="220" font-family="Arial" font-size="14" font-weight="bold" fill="#4FC1FF">STEP 3</text>
    <rect x="150" y="200" width="150" height="40" fill="#FFB7B2" stroke="#F44747" stroke-width="2" rx="5" stroke-dasharray="5,5"/>
    <text x="225" y="225" font-family="Arial" font-size="16" font-weight="bold" fill="#1E1E1E" text-anchor="middle">JOIN</text>
    <path d="M 225 200 L 225 180" fill="none" stroke="#E0E0E0" stroke-width="2" marker-end="url(#arrow)"/>
    
    <!-- Step 4 -->
    <text x="100" y="150" font-family="Arial" font-size="14" font-weight="bold" fill="#4FC1FF">STEP 4</text>
    <rect x="150" y="130" width="150" height="40" fill="#E0E0E0" stroke="#1E1E1E" stroke-width="2" rx="5"/>
    <text x="225" y="150" font-family="Arial" font-size="14" font-weight="bold" fill="#1E1E1E" text-anchor="middle">AGGREGATIONS</text>
    <text x="225" y="165" font-family="Arial" font-size="12" fill="#1E1E1E" text-anchor="middle">(AVG)</text>

    <!-- Divider -->
    <path d="M 400 50 L 400 400" fill="none" stroke="#808080" stroke-width="2" stroke-dasharray="5,5"/>

    <!-- CTE SIDE (Right) -->
    <text x="600" y="40" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#4FC1FF" text-anchor="middle">CTE</text>
    
    <!-- Arrow Top-Down -->
    <path d="M 450 80 L 450 400" fill="none" stroke="#4EC9B0" stroke-width="8" marker-end="url(#arrow)"/>
    <polygon points="450,400 440,385 460,385" fill="#4EC9B0"/>
    
    <!-- Step 1 -->
    <text x="480" y="120" font-family="Arial" font-size="14" font-weight="bold" fill="#4FC1FF">STEP 1</text>
    <rect x="540" y="100" width="150" height="40" fill="#B2FFCC" stroke="#4EC9B0" stroke-width="2" rx="5"/>
    <text x="615" y="125" font-family="Arial" font-size="16" font-weight="bold" fill="#1E1E1E" text-anchor="middle">JOIN</text>
    
    <rect x="710" y="90" width="70" height="60" fill="#2D2D30" stroke="#4EC9B0" stroke-width="2" rx="5"/>
    <text x="745" y="115" font-family="Arial" font-size="14" font-weight="bold" fill="#4EC9B0" text-anchor="middle">CTE</text>
    <text x="745" y="135" font-family="Arial" font-size="14" font-weight="bold" fill="#4EC9B0" text-anchor="middle">Query</text>
    
    <!-- Flow arrows from Join -->
    <path d="M 615 140 L 615 170" fill="none" stroke="#4EC9B0" stroke-width="2" marker-end="url(#arrow)"/>
    <path d="M 690 120 Q 750 180 750 220" fill="none" stroke="#4EC9B0" stroke-width="2" marker-end="url(#arrow)"/>
    
    <!-- Step 2 -->
    <text x="480" y="190" font-family="Arial" font-size="14" font-weight="bold" fill="#4FC1FF">STEP 2</text>
    <rect x="540" y="170" width="150" height="40" fill="#E0E0E0" stroke="#1E1E1E" stroke-width="2" rx="5"/>
    <text x="615" y="190" font-family="Arial" font-size="14" font-weight="bold" fill="#1E1E1E" text-anchor="middle">AGGREGATIONS</text>
    <text x="615" y="205" font-family="Arial" font-size="12" fill="#1E1E1E" text-anchor="middle">(SUM)</text>
    <path d="M 615 210 L 615 250" fill="none" stroke="#E0E0E0" stroke-width="2" marker-end="url(#arrow)"/>
    
    <!-- Step 3 -->
    <text x="480" y="270" font-family="Arial" font-size="14" font-weight="bold" fill="#4FC1FF">STEP 3</text>
    <rect x="540" y="250" width="150" height="40" fill="#E0E0E0" stroke="#1E1E1E" stroke-width="2" rx="5"/>
    <text x="615" y="270" font-family="Arial" font-size="14" font-weight="bold" fill="#1E1E1E" text-anchor="middle">AGGREGATIONS</text>
    <text x="615" y="285" font-family="Arial" font-size="12" fill="#1E1E1E" text-anchor="middle">(AVG)</text>
    
    <!-- Main Query Enclosure -->
    <rect x="710" y="220" width="80" height="100" fill="#2D2D30" stroke="#FFD700" stroke-width="2" rx="5"/>
    <text x="750" y="270" font-family="Arial" font-size="14" font-weight="bold" fill="#FFD700" text-anchor="middle">MAIN</text>
    <text x="750" y="290" font-family="Arial" font-size="14" font-weight="bold" fill="#FFD700" text-anchor="middle">Query</text>
</svg>
