<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650">
    <rect width="1000" height="650" fill="#1E1E1E" rx="10"/>
    
    <!-- Title -->
    <rect x="350" y="20" width="300" height="50" fill="#FFD700" stroke="#1E1E1E" stroke-width="3" rx="5"/>
    <text x="500" y="55" font-family="Comic Sans MS, cursive, sans-serif" font-size="28" font-weight="bold" fill="#1E1E1E" text-anchor="middle">CTE SUMMARY</text>
    
    <!-- Definition -->
    <text x="50" y="110" font-family="Arial, sans-serif" font-size="18" fill="#E0E0E0">Common Table Expression (CTE) is a <tspan fill="#4FC1FF" font-weight="bold">Temporary, named result set</tspan></text>
    <text x="50" y="140" font-family="Arial, sans-serif" font-size="18" fill="#E0E0E0">that can be used <tspan fill="#4EC9B0" font-weight="bold">multiple Times</tspan> within the Query.</text>
    
    <!-- Advantages Section -->
    <rect x="50" y="170" width="160" height="35" fill="#4EC9B0" stroke="#1E1E1E" stroke-width="2" rx="5"/>
    <text x="130" y="195" font-family="Arial" font-size="18" font-weight="bold" fill="#1E1E1E" text-anchor="middle">Advantages</text>
    
    <path d="M 130 205 L 130 350" fill="none" stroke="#E0E0E0" stroke-width="2"/>
    
    <!-- Advantage 1 -->
    <circle cx="130" cy="240" r="8" fill="#4EC9B0"/>
    <text x="150" y="245" font-family="Arial" font-size="18" font-weight="bold" fill="#4EC9B0">Readability:</text>
    <text x="260" y="245" font-family="Arial" font-size="16" fill="#E0E0E0">Breaks down Complex Queries into smaller Pieces.</text>
    
    <!-- Advantage 2 -->
    <circle cx="130" cy="280" r="8" fill="#4EC9B0"/>
    <text x="150" y="285" font-family="Arial" font-size="18" font-weight="bold" fill="#4EC9B0">Modularity:</text>
    <text x="260" y="285" font-family="Arial" font-size="16" fill="#E0E0E0">Pieces are easy to manage, develop, and self-Contained.</text>
    
    <!-- Advantage 3 -->
    <circle cx="130" cy="320" r="8" fill="#4EC9B0"/>
    <text x="150" y="325" font-family="Arial" font-size="18" font-weight="bold" fill="#4EC9B0">Reusability:</text>
    <text x="260" y="325" font-family="Arial" font-size="16" fill="#E0E0E0">Reduce Redundancy in Query.</text>
    
    <!-- Advantage 4 -->
    <circle cx="130" cy="360" r="8" fill="#4EC9B0"/>
    <text x="150" y="365" font-family="Arial" font-size="18" font-weight="bold" fill="#4EC9B0">Recursive:</text>
    <text x="250" y="365" font-family="Arial" font-size="16" fill="#E0E0E0">Iterations &amp; looping in SQL.</text>
    
    <!-- Note Box -->
    <rect x="50" y="410" width="20" height="20" fill="#F44747" stroke="#E0E0E0" stroke-width="1"/>
    <text x="90" y="426" font-family="Arial" font-size="18" fill="#E0E0E0">Result of CTE is like Table <tspan fill="#F44747" font-weight="bold">but can't be used from multiple Queries.</tspan></text>
    
    <!-- Tip Box -->
    <circle cx="65" cy="475" r="25" fill="#4FC1FF"/>
    <text x="65" y="482" font-family="Arial" font-size="18" font-weight="bold" fill="#1E1E1E" text-anchor="middle">TIP</text>
    <text x="110" y="482" font-family="Arial" font-size="18" fill="#E0E0E0">Don't create more than <tspan fill="#F44747" font-size="24" font-weight="bold" text-decoration="underline">5</tspan> CTEs in One Query.</text>
    
    <!-- Divider -->
    <path d="M 50 510 L 950 510" fill="none" stroke="#2D2D30" stroke-width="4"/>
    
    <!-- Bottom Flow Comparisons -->
    <!-- STANDALONE -->
    <text x="200" y="540" font-family="Arial" font-size="16" font-weight="bold" fill="#4EC9B0" text-anchor="middle">STANDALONE</text>
    <rect x="150" y="550" width="100" height="30" fill="#2D2D30" stroke="#E0E0E0" stroke-width="2" rx="3"/>
    <text x="200" y="571" font-family="Arial" font-size="14" font-weight="bold" fill="#4FC1FF" text-anchor="middle">CTE</text>
    <rect x="150" y="600" width="100" height="30" fill="#2D2D30" stroke="#FFD700" stroke-width="2" rx="3"/>
    <text x="200" y="621" font-family="Arial" font-size="14" font-weight="bold" fill="#FFD700" text-anchor="middle">MAIN</text>
    <path d="M 260 565 C 310 565, 310 615, 260 615" fill="none" stroke="#F44747" stroke-width="3" marker-end="url(#arrow)"/>
    <polygon points="260,615 268,610 268,620" fill="#F44747"/>

    <!-- Separator -->
    <path d="M 370 520 L 370 640" fill="none" stroke="#2D2D30" stroke-width="2" stroke-dasharray="5,5"/>
    
    <!-- NESTED -->
    <text x="500" y="540" font-family="Arial" font-size="16" font-weight="bold" fill="#4EC9B0" text-anchor="middle">NESTED</text>
    <rect x="450" y="550" width="100" height="25" fill="#2D2D30" stroke="#E0E0E0" stroke-width="2" rx="3"/>
    <text x="500" y="568" font-family="Arial" font-size="12" font-weight="bold" fill="#4FC1FF" text-anchor="middle">1 CTE</text>
    <rect x="450" y="585" width="100" height="25" fill="#2D2D30" stroke="#E0E0E0" stroke-width="2" rx="3"/>
    <text x="500" y="603" font-family="Arial" font-size="12" font-weight="bold" fill="#4FC1FF" text-anchor="middle">2 CTE</text>
    <rect x="450" y="620" width="100" height="25" fill="#2D2D30" stroke="#FFD700" stroke-width="2" rx="3"/>
    <text x="500" y="638" font-family="Arial" font-size="12" font-weight="bold" fill="#FFD700" text-anchor="middle">MAIN</text>
    
    <path d="M 560 562 C 610 562, 610 597, 560 597" fill="none" stroke="#F44747" stroke-width="3" marker-end="url(#arrow)"/>
    <polygon points="560,597 568,592 568,602" fill="#F44747"/>
    <path d="M 560 597 C 610 597, 610 632, 560 632" fill="none" stroke="#F44747" stroke-width="3" marker-end="url(#arrow)"/>
    <polygon points="560,632 568,627 568,637" fill="#F44747"/>

    <!-- Separator -->
    <path d="M 670 520 L 670 640" fill="none" stroke="#2D2D30" stroke-width="2" stroke-dasharray="5,5"/>
    
    <!-- RECURSIVE -->
    <text x="800" y="540" font-family="Arial" font-size="16" font-weight="bold" fill="#4EC9B0" text-anchor="middle">RECURSIVE</text>
    <rect x="750" y="550" width="100" height="30" fill="#2D2D30" stroke="#E0E0E0" stroke-width="2" rx="3"/>
    <text x="800" y="571" font-family="Arial" font-size="14" font-weight="bold" fill="#4FC1FF" text-anchor="middle">CTE</text>
    <!-- Recursive Loop -->
    <path d="M 770 550 C 770 520, 830 520, 830 550" fill="none" stroke="#F44747" stroke-width="3" marker-end="url(#arrow)"/>
    <polygon points="830,550 825,542 835,542" fill="#F44747"/>
    
    <rect x="750" y="600" width="100" height="30" fill="#2D2D30" stroke="#FFD700" stroke-width="2" rx="3"/>
    <text x="800" y="621" font-family="Arial" font-size="14" font-weight="bold" fill="#FFD700" text-anchor="middle">MAIN</text>
    <path d="M 860 565 C 910 565, 910 615, 860 615" fill="none" stroke="#F44747" stroke-width="3" marker-end="url(#arrow)"/>
    <polygon points="860,615 868,610 868,620" fill="#F44747"/>
</svg>
