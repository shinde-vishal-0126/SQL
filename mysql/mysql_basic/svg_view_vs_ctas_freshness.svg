<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650">
    <rect width="1000" height="650" fill="#1E1E1E" rx="10"/>

    <text x="500" y="40" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#FFCC00" text-anchor="middle">VIEW vs CTAS (Data Freshness Comparison)</text>

    <!-- Base Table that gets updated -->
    <text x="150" y="240" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#FFF" text-anchor="middle">BASE TABLE</text>
    
    <rect x="90" y="260" width="120" height="80" fill="#FFF" stroke="#000" stroke-width="3"/>
    <rect x="90" y="260" width="120" height="20" fill="#4FC1FF" stroke="#000" stroke-width="1"/>
    <!-- Grid -->
    <line x1="90" y1="280" x2="210" y2="280" stroke="#000" stroke-width="1"/>
    <line x1="90" y1="300" x2="210" y2="300" stroke="#000" stroke-width="1"/>
    <line x1="90" y1="320" x2="210" y2="320" stroke="#000" stroke-width="1"/>
    <line x1="130" y1="260" x2="130" y2="340" stroke="#000" stroke-width="1"/>
    <line x1="170" y1="260" x2="170" y2="340" stroke="#000" stroke-width="1"/>
    <!-- Data -->
    <text x="110" y="275" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#000" text-anchor="middle">A</text>
    <text x="150" y="275" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#000" text-anchor="middle">B</text>
    <text x="190" y="275" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#000" text-anchor="middle">C</text>

    <text x="110" y="295" font-family="Arial, sans-serif" font-size="12" fill="#000" text-anchor="middle">1</text>
    <text x="150" y="295" font-family="Arial, sans-serif" font-size="12" fill="#000" text-anchor="middle">AA</text>
    <text x="190" y="295" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#F44747" text-anchor="middle">80</text> <!-- Updated value -->

    <text x="110" y="315" font-family="Arial, sans-serif" font-size="12" fill="#000" text-anchor="middle">2</text>
    <text x="150" y="315" font-family="Arial, sans-serif" font-size="12" fill="#000" text-anchor="middle">BB</text>
    <text x="190" y="315" font-family="Arial, sans-serif" font-size="12" fill="#000" text-anchor="middle">30</text>
    
    <text x="110" y="335" font-family="Arial, sans-serif" font-size="12" fill="#000" text-anchor="middle">3</text>
    <text x="150" y="335" font-family="Arial, sans-serif" font-size="12" fill="#000" text-anchor="middle">DD</text>
    <text x="190" y="335" font-family="Arial, sans-serif" font-size="12" fill="#000" text-anchor="middle">40</text>

    <!-- Update Arrow -->
    <path d="M 50 180 Q 90 150 130 240" stroke="#F44747" stroke-width="3" fill="none" marker-end="url(#arrow_red)"/>
    <text x="80" y="160" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#F44747" transform="rotate(-30 80,160)">UPDATE</text>

    <!-- Center Line -->
    <line x1="280" y1="80" x2="280" y2="580" stroke="#555" stroke-width="2" stroke-dasharray="5,5"/>


    <!-- TOP SECTION: VIEW -->
    
    <!-- DDL Arrow -->
    <path d="M 230 280 L 320 180" stroke="#FF8C00" stroke-width="3" fill="none" marker-end="url(#arrow_orange)"/>
    
    <text x="450" y="130" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#FFF" text-anchor="middle">VIEW</text>
    
    <!-- View Definition -->
    <rect x="360" y="150" width="80" height="60" fill="#FFF" stroke="#000" stroke-width="2"/>
    <text x="400" y="170" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#000" text-anchor="middle">QUERY</text>
    <text x="400" y="185" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#0000FF" text-anchor="middle">SELECT</text>
    <text x="400" y="195" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#0000FF" text-anchor="middle">FROM ...</text>
    
    <rect x="440" y="140" width="90" height="60" fill="#FFF" stroke="#000" stroke-width="2"/>
    <rect x="440" y="140" width="90" height="15" fill="#FFCC00" stroke="#000" stroke-width="1"/>
    <line x1="440" y1="155" x2="530" y2="155" stroke="#000" stroke-width="1"/>
    <line x1="440" y1="170" x2="530" y2="170" stroke="#000" stroke-width="1"/>
    <line x1="440" y1="185" x2="530" y2="185" stroke="#000" stroke-width="1"/>
    <line x1="470" y1="140" x2="470" y2="200" stroke="#000" stroke-width="1"/>
    <line x1="500" y1="140" x2="500" y2="200" stroke="#000" stroke-width="1"/>
    
    <text x="455" y="152" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#000" text-anchor="middle">A</text>
    <text x="485" y="152" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#000" text-anchor="middle">B</text>
    <text x="515" y="152" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#000" text-anchor="middle">C</text>
    
    <!-- User querying View -->
    <path d="M 550 170 L 620 170" stroke="#4EC9B0" stroke-width="3" fill="none" marker-end="url(#arrow_green)"/>
    <rect x="630" y="140" width="90" height="60" fill="#FFF" stroke="#000" stroke-width="2"/>
    <text x="675" y="130" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#FFF" text-anchor="middle">USER QUERY</text>
    <text x="675" y="165" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#0000FF" text-anchor="middle">SELECT</text>
    <text x="675" y="185" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#0000FF" text-anchor="middle">FROM View</text>
    
    <!-- Arrow back to table internally -->
    <path d="M 675 200 C 675 300 300 450 210 320" stroke="#4FC1FF" stroke-width="2" stroke-dasharray="5,5" fill="none" marker-end="url(#arrow_blue)"/>
    <text x="500" y="280" font-family="Arial, sans-serif" font-size="12" fill="#4FC1FF">Fetches on the fly</text>

    <path d="M 730 170 L 800 170" stroke="#4EC9B0" stroke-width="3" fill="none" marker-end="url(#arrow_green)"/>
    
    <!-- View Result (Fresh) -->
    <text x="850" y="100" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#4EC9B0" transform="rotate(-15 850,100)" text-anchor="middle">FRESH DATA</text>
    <text x="850" y="130" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#FFF" text-anchor="middle">RESULT</text>
    <rect x="810" y="140" width="90" height="60" fill="#FFF" stroke="#000" stroke-width="2"/>
    <line x1="810" y1="160" x2="900" y2="160" stroke="#000" stroke-width="1"/>
    <line x1="810" y1="180" x2="900" y2="180" stroke="#000" stroke-width="1"/>
    <line x1="840" y1="140" x2="840" y2="200" stroke="#000" stroke-width="1"/>
    <line x1="870" y1="140" x2="870" y2="200" stroke="#000" stroke-width="1"/>
    <text x="885" y="155" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#F44747" text-anchor="middle">80</text> <!-- Sees 80 -->
    <text x="825" y="155" font-family="Arial, sans-serif" font-size="10" fill="#000" text-anchor="middle">1</text>
    <text x="855" y="155" font-family="Arial, sans-serif" font-size="10" fill="#000" text-anchor="middle">AA</text>


    <!-- BOTTOM SECTION: CTAS -->
    
    <path d="M 230 320 L 320 420" stroke="#FF8C00" stroke-width="3" fill="none" marker-end="url(#arrow_orange)"/>
    
    <text x="450" y="370" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#FFF" text-anchor="middle">CTAS (PHYSICAL TABLE)</text>
    
    <!-- CTAS Definition -->
    <rect x="360" y="390" width="80" height="60" fill="#FFF" stroke="#000" stroke-width="2"/>
    <text x="400" y="410" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#000" text-anchor="middle">QUERY</text>
    <text x="400" y="425" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#0000FF" text-anchor="middle">SELECT</text>
    <text x="400" y="435" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#0000FF" text-anchor="middle">FROM ...</text>
    
    <!-- CTAS Table -->
    <rect x="440" y="380" width="90" height="60" fill="#FFF" stroke="#000" stroke-width="2"/>
    <rect x="440" y="380" width="90" height="15" fill="#4FC1FF" stroke="#000" stroke-width="1"/>
    <line x1="440" y1="395" x2="530" y2="395" stroke="#000" stroke-width="1"/>
    <line x1="440" y1="410" x2="530" y2="410" stroke="#000" stroke-width="1"/>
    <line x1="440" y1="425" x2="530" y2="425" stroke="#000" stroke-width="1"/>
    <line x1="470" y1="380" x2="470" y2="440" stroke="#000" stroke-width="1"/>
    <line x1="500" y1="380" x2="500" y2="440" stroke="#000" stroke-width="1"/>
    
    <!-- It has OLD data -->
    <text x="455" y="392" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#000" text-anchor="middle">A</text>
    <text x="485" y="392" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#000" text-anchor="middle">B</text>
    <text x="515" y="392" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#000" text-anchor="middle">C</text>
    
    <text x="455" y="407" font-family="Arial, sans-serif" font-size="10" fill="#000" text-anchor="middle">1</text>
    <text x="485" y="407" font-family="Arial, sans-serif" font-size="10" fill="#000" text-anchor="middle">AA</text>
    <text x="515" y="407" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#000" text-anchor="middle">20</text> <!-- OLD Data -->


    <!-- User querying CTAS Table -->
    <path d="M 550 410 L 620 410" stroke="#4EC9B0" stroke-width="3" fill="none" marker-end="url(#arrow_green)"/>
    <rect x="630" y="380" width="90" height="60" fill="#FFF" stroke="#000" stroke-width="2"/>
    <text x="675" y="370" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#FFF" text-anchor="middle">USER QUERY</text>
    <text x="675" y="405" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#0000FF" text-anchor="middle">SELECT</text>
    <text x="675" y="425" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#0000FF" text-anchor="middle">FROM Table</text>

    <!-- CTAS does NOT go back to original table, it just queries the physical table -->

    <path d="M 730 410 L 800 410" stroke="#4EC9B0" stroke-width="3" fill="none" marker-end="url(#arrow_green)"/>
    
    <!-- CTAS Result (Stale/Old) -->
    <text x="850" y="340" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#F44747" transform="rotate(15 850,340)" text-anchor="middle">OLD DATA</text>
    <text x="850" y="370" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#FFF" text-anchor="middle">RESULT</text>
    <rect x="810" y="380" width="90" height="60" fill="#FFF" stroke="#000" stroke-width="2"/>
    <line x1="810" y1="400" x2="900" y2="400" stroke="#000" stroke-width="1"/>
    <line x1="810" y1="420" x2="900" y2="420" stroke="#000" stroke-width="1"/>
    <line x1="840" y1="380" x2="840" y2="440" stroke="#000" stroke-width="1"/>
    <line x1="870" y1="380" x2="870" y2="440" stroke="#000" stroke-width="1"/>
    <text x="885" y="395" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#F44747" text-anchor="middle">20</text> <!-- Sees 20 because it was snapshotted before update -->
    <text x="825" y="395" font-family="Arial, sans-serif" font-size="10" fill="#000" text-anchor="middle">1</text>
    <text x="855" y="395" font-family="Arial, sans-serif" font-size="10" fill="#000" text-anchor="middle">AA</text>

    <defs>
        <marker id="arrow_red" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#F44747" /></marker>
        <marker id="arrow_orange" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#FF8C00" /></marker>
        <marker id="arrow_green" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#4EC9B0" /></marker>
        <marker id="arrow_blue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#4FC1FF" /></marker>
    </defs>
</svg>
