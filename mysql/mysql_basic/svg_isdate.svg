<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 150">
    <rect width="600" height="150" fill="#1E1E1E" rx="10"/>
    <text x="300" y="40" font-family="Courier New" font-size="24" font-weight="bold" fill="#4FC1FF" text-anchor="middle">ISDATE()</text>
    
    <text x="300" y="80" font-family="Arial" font-size="16" fill="#E0E0E0" text-anchor="middle">Checks if a value is a valid date.</text>
    
    <rect x="250" y="100" width="100" height="30" rx="5" fill="#2D2D30" stroke="#4EC9B0" stroke-width="2"/>
    <text x="300" y="120" font-family="Courier New" font-size="14" font-weight="bold" fill="#4EC9B0" text-anchor="middle">Returns 1</text>
    <text x="360" y="120" font-family="Arial" font-size="14" fill="#A0A0A0" text-anchor="start">if the string value is a valid date.</text>
</svg>