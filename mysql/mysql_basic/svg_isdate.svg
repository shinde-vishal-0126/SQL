<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 150">
    <rect width="600" height="150" fill="#eeeeee" rx="10"/>
    <text x="300" y="40" font-family="Courier New" font-size="24" font-weight="bold" fill="#0072b0" text-anchor="middle">ISDATE()</text>
    
    <text x="300" y="80" font-family="Arial" font-size="16" fill="#1f1f1f" text-anchor="middle">Checks if a value is a valid date.</text>
    
    <rect x="250" y="100" width="100" height="30" rx="5" fill="#e8e8e9" stroke="#267d6b" stroke-width="2"/>
    <text x="300" y="120" font-family="Courier New" font-size="14" font-weight="bold" fill="#267d6b" text-anchor="middle">Returns 1</text>
    <text x="360" y="120" font-family="Arial" font-size="14" fill="#5f5f5f" text-anchor="start">if the string value is a valid date.</text>
</svg>