<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300">
    <rect width="800" height="300" fill="#1E1E1E" rx="10"/>
    <text x="400" y="40" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#DCDCAA" text-anchor="middle">Execution Plan Types</text>
    
    <g transform="translate(50, 80)">
        <rect width="200" height="120" fill="#2D2D30" stroke="#4FC1FF" stroke-width="2" rx="5"/>
        <text x="100" y="30" font-family="Arial" font-size="14" font-weight="bold" fill="#4FC1FF" text-anchor="middle">Estimated Plan</text>
        <text x="100" y="55" font-family="Arial" font-size="12" fill="#E0E0E0" text-anchor="middle">Prediction (Guess)</text>
        <text x="100" y="75" font-family="Arial" font-size="12" fill="#F44747" font-weight="bold" text-anchor="middle">Query is NOT executed</text>
        <text x="100" y="95" font-family="Arial" font-size="12" fill="#A0A0A0" text-anchor="middle">Command: EXPLAIN</text>
    </g>
    
    <path d="M 260 140 L 290 140" stroke="#A0A0A0" stroke-width="2" marker-end="url(#arrow)"/>
    
    <g transform="translate(300, 80)">
        <rect width="200" height="120" fill="#2D2D30" stroke="#4EC9B0" stroke-width="2" rx="5"/>
        <text x="100" y="30" font-family="Arial" font-size="14" font-weight="bold" fill="#4EC9B0" text-anchor="middle">Actual Plan</text>
        <text x="100" y="55" font-family="Arial" font-size="12" fill="#E0E0E0" text-anchor="middle">Real performance stats</text>
        <text x="100" y="75" font-family="Arial" font-size="12" fill="#4EC9B0" font-weight="bold" text-anchor="middle">Query IS executed</text>
        <text x="100" y="95" font-family="Arial" font-size="12" fill="#A0A0A0" text-anchor="middle">Command: EXPLAIN ANALYZE</text>
    </g>
    
    <path d="M 510 140 L 540 140" stroke="#A0A0A0" stroke-width="2" marker-end="url(#arrow)"/>

    <g transform="translate(550, 80)">
        <rect width="200" height="120" fill="#2D2D30" stroke="#C586C0" stroke-width="2" rx="5"/>
        <text x="100" y="30" font-family="Arial" font-size="14" font-weight="bold" fill="#C586C0" text-anchor="middle">Live Statistics</text>
        <text x="100" y="55" font-family="Arial" font-size="12" fill="#E0E0E0" text-anchor="middle">Shows live progress</text>
        <text x="100" y="75" font-family="Arial" font-size="12" fill="#C586C0" font-weight="bold" text-anchor="middle">In Real-Time</text>
        <text x="100" y="95" font-family="Arial" font-size="12" fill="#A0A0A0" text-anchor="middle">Used for long queries</text>
    </g>
</svg>
