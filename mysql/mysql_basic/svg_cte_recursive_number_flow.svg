<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
    <rect width="800" height="500" fill="#eeeeee" rx="10"/>
    
    <text x="400" y="30" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#a38a00" text-anchor="middle">Number Sequence Flowchart (1 to 20)</text>
    
    <!-- START -->
    <circle cx="400" cy="70" r="20" fill="#E0E0E0" stroke="#bebebe" stroke-width="2"/>
    <text x="400" y="45" font-family="Arial" font-size="12" font-weight="bold" fill="#1f1f1f" text-anchor="middle">START</text>
    
    <path d="M 400 90 L 400 120" fill="none" stroke="#333333" stroke-width="2" marker-end="url(#arrow)"/>
    
    <!-- Anchor Query -->
    <rect x="320" y="120" width="160" height="50" fill="#e8e8e9" stroke="#bebebe" stroke-width="2" rx="5"/>
    <text x="400" y="140" font-family="Arial" font-size="14" font-weight="bold" fill="#1f1f1f" text-anchor="middle">RUN</text>
    <text x="400" y="160" font-family="Arial" font-size="14" font-weight="bold" fill="#793a74" text-anchor="middle">Anchor Query</text>
    
    <path d="M 400 170 L 400 220" fill="none" stroke="#333333" stroke-width="2" marker-end="url(#arrow)"/>
    
    <!-- Recursive Query -->
    <rect x="320" y="220" width="160" height="50" fill="#e8e8e9" stroke="#bebebe" stroke-width="2" rx="5"/>
    <text x="400" y="240" font-family="Arial" font-size="14" font-weight="bold" fill="#1f1f1f" text-anchor="middle">Run</text>
    <text x="400" y="260" font-family="Arial" font-size="14" font-weight="bold" fill="#793a74" text-anchor="middle">Recursive Query</text>
    
    <path d="M 400 270 L 400 320" fill="none" stroke="#333333" stroke-width="2" marker-end="url(#arrow)"/>
    
    <!-- Condition -->
    <polygon points="400,320 460,350 400,380 340,350" fill="#e8e8e9" stroke="#bebebe" stroke-width="2"/>
    <text x="400" y="345" font-family="Arial" font-size="12" font-weight="bold" fill="#1f1f1f" text-anchor="middle">MyNumber</text>
    <text x="400" y="360" font-family="Arial" font-size="12" font-weight="bold" fill="#1f1f1f" text-anchor="middle">&lt; 20 ?</text>
    
    <!-- Loop Back (TRUE) -->
    <path d="M 460 350 L 520 350 L 520 245 L 480 245" fill="none" stroke="#267d6b" stroke-width="3" marker-end="url(#arrow)"/>
    <text x="540" y="300" font-family="Arial" font-size="14" font-weight="bold" fill="#267d6b">TRUE</text>
    <polygon points="480,245 490,240 490,250" fill="#4EC9B0"/>
    
    <!-- End (FALSE) -->
    <path d="M 400 380 L 400 440" fill="none" stroke="#b80b0b" stroke-width="3" marker-end="url(#arrow)"/>
    <text x="425" y="415" font-family="Arial" font-size="14" font-weight="bold" fill="#b80b0b">FALSE</text>
    <circle cx="400" cy="460" r="20" fill="#E0E0E0" stroke="#bebebe" stroke-width="2"/>
    <text x="400" y="495" font-family="Arial" font-size="12" font-weight="bold" fill="#1f1f1f" text-anchor="middle">END</text>
    <polygon points="400,440 395,430 405,430" fill="#F44747"/>
    
    <!-- Output Table Example -->
    <text x="200" y="100" font-family="Arial" font-size="14" font-weight="bold" fill="#0072b0" text-anchor="middle">Result Set Generation</text>
    <rect x="150" y="120" width="100" height="25" fill="#E0E0E0" stroke="#bebebe" stroke-width="1"/>
    <text x="200" y="138" font-family="Arial" font-size="14" font-weight="bold" fill="#1E1E1E" text-anchor="middle">MyNumber</text>
    
    <rect x="150" y="150" width="100" height="25" fill="#e8e8e9" stroke="#333333" stroke-width="1"/>
    <text x="200" y="168" font-family="Arial" font-size="14" fill="#1f1f1f" text-anchor="middle">1</text>
    
    <rect x="150" y="180" width="100" height="25" fill="#e8e8e9" stroke="#333333" stroke-width="1"/>
    <text x="200" y="198" font-family="Arial" font-size="14" fill="#1f1f1f" text-anchor="middle">2</text>
    
    <rect x="150" y="210" width="100" height="25" fill="#e8e8e9" stroke="#333333" stroke-width="1"/>
    <text x="200" y="228" font-family="Arial" font-size="14" fill="#1f1f1f" text-anchor="middle">3</text>
    
    <text x="200" y="258" font-family="Arial" font-size="14" fill="#1f1f1f" text-anchor="middle">...</text>
    
    <rect x="150" y="270" width="100" height="25" fill="#e8e8e9" stroke="#333333" stroke-width="1"/>
    <text x="200" y="288" font-family="Arial" font-size="14" fill="#1f1f1f" text-anchor="middle">20</text>
</svg>
