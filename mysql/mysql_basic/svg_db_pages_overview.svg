<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
    <rect width="800" height="400" fill="#eeeeee"/>
    <text x="400" y="40" fill="#1f1f1f" font-family="Arial" font-size="24" font-weight="bold" text-anchor="middle">Data File (.mdf / .ibd) Overview</text>
    <text x="400" y="70" fill="#5f5f5f" font-family="Arial" font-size="16" text-anchor="middle">Database stores data in fixed-size blocks called Pages (usually 8KB / 16KB)</text>
    
    <!-- Outer File Container -->
    <rect x="50" y="100" width="700" height="260" rx="10" fill="none" stroke="#0072b0" stroke-width="3" stroke-dasharray="10,5"/>
    <text x="70" y="130" fill="#0072b0" font-family="Arial" font-size="20" font-weight="bold">Physical Data File</text>

    <!-- Data Pages Group -->
    <rect x="100" y="150" width="250" height="180" rx="10" fill="#e8e8e9" stroke="#267d6b" stroke-width="2"/>
    <text x="225" y="180" fill="#267d6b" font-family="Arial" font-size="18" font-weight="bold" text-anchor="middle">Data Pages</text>
    <rect x="130" y="200" width="190" height="110" rx="5" fill="#e2e2e3"/>
    <line x1="145" y1="220" x2="210" y2="220" stroke="#575724" stroke-width="4" stroke-linecap="round"/>
    <line x1="145" y1="240" x2="290" y2="240" stroke="#575724" stroke-width="4" stroke-linecap="round"/>
    <line x1="145" y1="260" x2="250" y2="260" stroke="#575724" stroke-width="4" stroke-linecap="round"/>
    <line x1="145" y1="280" x2="270" y2="280" stroke="#575724" stroke-width="4" stroke-linecap="round"/>
    <text x="225" y="335" fill="#5f5f5f" font-family="Arial" font-size="14" text-anchor="middle">Store actual table rows</text>

    <!-- Index Pages Group -->
    <rect x="450" y="150" width="250" height="180" rx="10" fill="#e8e8e9" stroke="#793a74" stroke-width="2"/>
    <text x="575" y="180" fill="#793a74" font-family="Arial" font-size="18" font-weight="bold" text-anchor="middle">Index Pages</text>
    <rect x="480" y="200" width="190" height="110" rx="5" fill="#e2e2e3"/>
    <line x1="495" y1="220" x2="620" y2="220" stroke="#874a31" stroke-width="4" stroke-linecap="round"/>
    <line x1="495" y1="240" x2="550" y2="240" stroke="#874a31" stroke-width="4" stroke-linecap="round"/>
    <line x1="495" y1="260" x2="640" y2="260" stroke="#874a31" stroke-width="4" stroke-linecap="round"/>
    <line x1="495" y1="280" x2="580" y2="280" stroke="#874a31" stroke-width="4" stroke-linecap="round"/>
    <text x="575" y="335" fill="#5f5f5f" font-family="Arial" font-size="14" text-anchor="middle">Store pointers/B-Tree structure</text>
</svg>
