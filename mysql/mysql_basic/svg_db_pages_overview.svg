<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
    <rect width="800" height="400" fill="#1E1E1E"/>
    <text x="400" y="40" fill="#FFFFFF" font-family="Arial" font-size="24" font-weight="bold" text-anchor="middle">Data File (.mdf / .ibd) Overview</text>
    <text x="400" y="70" fill="#A0A0A0" font-family="Arial" font-size="16" text-anchor="middle">Database stores data in fixed-size blocks called Pages (usually 8KB / 16KB)</text>
    
    <!-- Outer File Container -->
    <rect x="50" y="100" width="700" height="260" rx="10" fill="none" stroke="#4FC1FF" stroke-width="3" stroke-dasharray="10,5"/>
    <text x="70" y="130" fill="#4FC1FF" font-family="Arial" font-size="20" font-weight="bold">Physical Data File</text>

    <!-- Data Pages Group -->
    <rect x="100" y="150" width="250" height="180" rx="10" fill="#2D2D30" stroke="#4EC9B0" stroke-width="2"/>
    <text x="225" y="180" fill="#4EC9B0" font-family="Arial" font-size="18" font-weight="bold" text-anchor="middle">Data Pages</text>
    <rect x="130" y="200" width="190" height="110" rx="5" fill="#3D3D40"/>
    <line x1="145" y1="220" x2="210" y2="220" stroke="#DCDCAA" stroke-width="4" stroke-linecap="round"/>
    <line x1="145" y1="240" x2="290" y2="240" stroke="#DCDCAA" stroke-width="4" stroke-linecap="round"/>
    <line x1="145" y1="260" x2="250" y2="260" stroke="#DCDCAA" stroke-width="4" stroke-linecap="round"/>
    <line x1="145" y1="280" x2="270" y2="280" stroke="#DCDCAA" stroke-width="4" stroke-linecap="round"/>
    <text x="225" y="335" fill="#A0A0A0" font-family="Arial" font-size="14" text-anchor="middle">Store actual table rows</text>

    <!-- Index Pages Group -->
    <rect x="450" y="150" width="250" height="180" rx="10" fill="#2D2D30" stroke="#C586C0" stroke-width="2"/>
    <text x="575" y="180" fill="#C586C0" font-family="Arial" font-size="18" font-weight="bold" text-anchor="middle">Index Pages</text>
    <rect x="480" y="200" width="190" height="110" rx="5" fill="#3D3D40"/>
    <line x1="495" y1="220" x2="620" y2="220" stroke="#CE9178" stroke-width="4" stroke-linecap="round"/>
    <line x1="495" y1="240" x2="550" y2="240" stroke="#CE9178" stroke-width="4" stroke-linecap="round"/>
    <line x1="495" y1="260" x2="640" y2="260" stroke="#CE9178" stroke-width="4" stroke-linecap="round"/>
    <line x1="495" y1="280" x2="580" y2="280" stroke="#CE9178" stroke-width="4" stroke-linecap="round"/>
    <text x="575" y="335" fill="#A0A0A0" font-family="Arial" font-size="14" text-anchor="middle">Store pointers/B-Tree structure</text>
</svg>
