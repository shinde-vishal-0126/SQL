<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 150">
    <rect width="600" height="150" fill="#1E1E1E" rx="10"/>
    <text x="300" y="30" font-family="Courier New" font-size="20" font-weight="bold" fill="#4FC1FF" text-anchor="middle">IF() Function (MySQL)</text>
    <text x="300" y="60" font-family="Arial" font-size="14" fill="#A0A0A0" text-anchor="middle">Shorthand for simple CASE statements.</text>
    
    <rect x="20" y="80" width="560" height="40" rx="5" fill="#2D2D30" stroke="#3E3E42" stroke-width="2"/>
    <text x="30" y="105" font-family="Courier New" font-size="16" fill="#4FC1FF" text-anchor="start">IF(</text>
    <text x="70" y="105" font-family="Courier New" font-size="16" fill="#E0E0E0" text-anchor="start">score > 50,</text>
    <text x="200" y="105" font-family="Courier New" font-size="16" fill="#4EC9B0" text-anchor="start">'Pass',</text>
    <text x="280" y="105" font-family="Courier New" font-size="16" fill="#F44747" text-anchor="start">'Fail'</text>
    <text x="350" y="105" font-family="Courier New" font-size="16" fill="#4FC1FF" text-anchor="start">)</text>
    
    <text x="70" y="135" font-family="Arial" font-size="10" fill="#A0A0A0" text-anchor="start">Condition</text>
    <text x="200" y="135" font-family="Arial" font-size="10" fill="#A0A0A0" text-anchor="start">If TRUE</text>
    <text x="280" y="135" font-family="Arial" font-size="10" fill="#A0A0A0" text-anchor="start">If FALSE</text>
</svg>