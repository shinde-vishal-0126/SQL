<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300">
    <rect width="600" height="300" fill="#eeeeee" rx="10"/>
    <text x="300" y="30" font-family="Arial" font-size="20" font-weight="bold" fill="#575724" text-anchor="middle">RUNNING TOTAL vs ROLLING TOTAL</text>
    <text x="300" y="50" font-family="Arial" font-size="14" fill="#1f1f1f" text-anchor="middle">ANALYSIS OVER TIME (Tracking sequences)</text>
    
    <!-- Running Total -->
    <rect x="20" y="80" width="270" height="180" fill="#e8e8e9" stroke="#0072b0" stroke-width="2"/>
    <rect x="20" y="80" width="270" height="30" fill="#4FC1FF"/>
    <text x="155" y="100" font-family="Arial" font-size="16" font-weight="bold" fill="#000000" text-anchor="middle">RUNNING TOTAL</text>
    
    <text x="30" y="130" font-family="Arial" font-size="13" fill="#1f1f1f">• From beginning to current point</text>
    <text x="30" y="150" font-family="Arial" font-size="13" fill="#1f1f1f">• Without dropping older data</text>
    
    <rect x="30" y="170" width="250" height="40" fill="#eeeeee" stroke="#b1b1b6"/>
    <text x="155" y="185" font-family="Courier New" font-size="12" fill="#0072b0" text-anchor="middle">ORDER BY Month</text>
    <text x="155" y="200" font-family="Courier New" font-size="10" fill="#5f5f5f" text-anchor="middle">(UNBOUNDED PRECEDING TO CURRENT)</text>

    <!-- Rolling Total -->
    <rect x="310" y="80" width="270" height="180" fill="#e8e8e9" stroke="#267d6b" stroke-width="2"/>
    <rect x="310" y="80" width="270" height="30" fill="#4EC9B0"/>
    <text x="445" y="100" font-family="Arial" font-size="16" font-weight="bold" fill="#000000" text-anchor="middle">ROLLING TOTAL</text>
    
    <text x="320" y="130" font-family="Arial" font-size="13" fill="#1f1f1f">• Within a fixed time window</text>
    <text x="320" y="150" font-family="Arial" font-size="13" fill="#1f1f1f">• Oldest data point is dropped</text>
    
    <rect x="320" y="170" width="250" height="40" fill="#eeeeee" stroke="#b1b1b6"/>
    <text x="445" y="185" font-family="Courier New" font-size="12" fill="#267d6b" text-anchor="middle">ORDER BY Month</text>
    <text x="445" y="200" font-family="Courier New" font-size="11" fill="#5f5f5f" text-anchor="middle">ROWS 2 PRECEDING</text>
</svg>