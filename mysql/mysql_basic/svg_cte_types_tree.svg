<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
    <rect width="800" height="400" fill="#eeeeee" rx="10"/>
    <text x="400" y="40" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#a38a00" text-anchor="middle">CTE Types</text>
    
    <!-- Root -->
    <rect x="330" y="60" width="140" height="40" fill="#FFD700" stroke="#333333" stroke-width="2" rx="5"/>
    <text x="400" y="85" font-family="Arial" font-size="16" font-weight="bold" fill="#1E1E1E" text-anchor="middle">CTE TYPES</text>
    
    <path d="M 400 100 L 400 130" stroke="#333333" stroke-width="3"/>
    <path d="M 200 130 L 600 130" stroke="#333333" stroke-width="3"/>
    
    <!-- Left Branch: Non-Recursive -->
    <path d="M 200 130 L 200 160" stroke="#333333" stroke-width="3"/>
    <polygon points="200,160 195,150 205,150" fill="#E0E0E0"/>
    
    <rect x="100" y="160" width="200" height="40" fill="#4EC9B0" stroke="#333333" stroke-width="2" rx="5"/>
    <text x="200" y="185" font-family="Arial" font-size="16" font-weight="bold" fill="#1E1E1E" text-anchor="middle">Non-Recursive CTE</text>
    
    <path d="M 200 200 L 200 230" stroke="#333333" stroke-width="3"/>
    <path d="M 120 230 L 280 230" stroke="#333333" stroke-width="3"/>
    
    <!-- Standalone -->
    <path d="M 120 230 L 120 260" stroke="#333333" stroke-width="3"/>
    <polygon points="120,260 115,250 125,250" fill="#E0E0E0"/>
    <rect x="40" y="260" width="160" height="40" fill="#e8e8e9" stroke="#b80b0b" stroke-width="3" rx="5"/>
    <text x="120" y="285" font-family="Arial" font-size="14" font-weight="bold" fill="#1f1f1f" text-anchor="middle">Standalone CTE</text>
    
    <!-- Nested -->
    <path d="M 280 230 L 280 260" stroke="#333333" stroke-width="3"/>
    <polygon points="280,260 275,250 285,250" fill="#E0E0E0"/>
    <rect x="200" y="260" width="160" height="40" fill="#e8e8e9" stroke="#0072b0" stroke-width="3" rx="5"/>
    <text x="280" y="285" font-family="Arial" font-size="14" font-weight="bold" fill="#1f1f1f" text-anchor="middle">Nested CTE</text>
    
    <!-- Right Branch: Recursive -->
    <path d="M 600 130 L 600 160" stroke="#333333" stroke-width="3"/>
    <polygon points="600,160 595,150 605,150" fill="#E0E0E0"/>
    
    <rect x="500" y="160" width="200" height="40" fill="#4FC1FF" stroke="#333333" stroke-width="2" rx="5"/>
    <text x="600" y="185" font-family="Arial" font-size="16" font-weight="bold" fill="#1E1E1E" text-anchor="middle">Recursive CTE</text>
    
    <rect x="450" y="230" width="300" height="80" fill="#e8e8e9" stroke="#0072b0" stroke-width="2" rx="5"/>
    <text x="600" y="255" font-family="Arial" font-size="14" font-style="italic" fill="#1f1f1f" text-anchor="middle">Used for Hierarchies, Trees,</text>
    <text x="600" y="275" font-family="Arial" font-size="14" font-style="italic" fill="#1f1f1f" text-anchor="middle">Number Sequences (Looping)</text>
</svg>
