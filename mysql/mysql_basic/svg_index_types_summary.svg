<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450">
    <rect width="800" height="450" fill="#1E1E1E" rx="10"/>
    <text x="400" y="40" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#DCDCAA" text-anchor="middle">Index Types: When &amp; How To Use</text>
    
    <g transform="translate(50, 70)">
        <rect width="220" height="100" fill="#2D2D30" stroke="#4FC1FF" stroke-width="2" rx="5"/>
        <text x="160" y="25" font-family="Arial" font-size="14" font-weight="bold" fill="#4FC1FF" text-anchor="middle">Clustered Index</text>
        <text x="160" y="45" font-family="Arial" font-size="12" fill="#E0E0E0" text-anchor="middle">Primary Keys (OLTP)</text>
        <text x="160" y="65" font-family="Arial" font-size="11" fill="#A0A0A0" text-anchor="middle">Sorts physical data</text>
        <text x="160" y="85" font-family="Arial" font-size="11" font-weight="bold" fill="#F44747" text-anchor="middle">Max 1 per table</text>
    </g>

    <g transform="translate(290, 70)">
        <rect width="220" height="100" fill="#2D2D30" stroke="#4EC9B0" stroke-width="2" rx="5"/>
        <text x="160" y="25" font-family="Arial" font-size="14" font-weight="bold" fill="#4EC9B0" text-anchor="middle">Non-Clustered Index</text>
        <text x="160" y="45" font-family="Arial" font-size="12" fill="#E0E0E0" text-anchor="middle">WHERE filters, Joins, FKs</text>
        <text x="160" y="65" font-family="Arial" font-size="11" fill="#A0A0A0" text-anchor="middle">Secondary pointers</text>
        <text x="160" y="85" font-family="Arial" font-size="11" font-weight="bold" fill="#F44747" text-anchor="middle">Many per table</text>
    </g>
    
    <g transform="translate(530, 70)">
        <rect width="220" height="100" fill="#2D2D30" stroke="#C586C0" stroke-width="2" rx="5"/>
        <text x="160" y="25" font-family="Arial" font-size="14" font-weight="bold" fill="#C586C0" text-anchor="middle">Unique Index</text>
        <text x="160" y="45" font-family="Arial" font-size="12" fill="#E0E0E0" text-anchor="middle">Email, SSN, Usernames</text>
        <text x="160" y="65" font-family="Arial" font-size="11" fill="#A0A0A0" text-anchor="middle">Enforces data integrity</text>
        <text x="160" y="85" font-family="Arial" font-size="11" font-weight="bold" fill="#F44747" text-anchor="middle">No Duplicates Allowed</text>
    </g>

    <g transform="translate(50, 190)">
        <rect width="220" height="100" fill="#2D2D30" stroke="#DCDCAA" stroke-width="2" rx="5"/>
        <text x="160" y="25" font-family="Arial" font-size="14" font-weight="bold" fill="#DCDCAA" text-anchor="middle">Composite Index</text>
        <text x="160" y="45" font-family="Arial" font-size="12" fill="#E0E0E0" text-anchor="middle">Multiple column filters</text>
        <text x="160" y="65" font-family="Arial" font-size="11" fill="#A0A0A0" text-anchor="middle">Combines (col1, col2)</text>
        <text x="160" y="85" font-family="Arial" font-size="11" font-weight="bold" fill="#F44747" text-anchor="middle">Leftmost Prefix Rule!</text>
    </g>

    <g transform="translate(290, 190)">
        <rect width="220" height="100" fill="#2D2D30" stroke="#4FC1FF" stroke-width="2" rx="5"/>
        <text x="160" y="25" font-family="Arial" font-size="14" font-weight="bold" fill="#4FC1FF" text-anchor="middle">Filtered Index</text>
        <text x="160" y="45" font-family="Arial" font-size="12" fill="#E0E0E0" text-anchor="middle">Specific subsets (Active users)</text>
        <text x="160" y="65" font-family="Arial" font-size="11" fill="#A0A0A0" text-anchor="middle">Reduces size &amp; maintenance</text>
        <text x="160" y="85" font-family="Arial" font-size="11" font-weight="bold" fill="#F44747" text-anchor="middle">Uses WHERE clause</text>
    </g>

    <g transform="translate(530, 190)">
        <rect width="220" height="100" fill="#2D2D30" stroke="#4EC9B0" stroke-width="2" rx="5"/>
        <text x="160" y="25" font-family="Arial" font-size="14" font-weight="bold" fill="#4EC9B0" text-anchor="middle">Columnstore Index</text>
        <text x="160" y="45" font-family="Arial" font-size="12" fill="#E0E0E0" text-anchor="middle">Data Warehouses (OLAP)</text>
        <text x="160" y="65" font-family="Arial" font-size="11" fill="#A0A0A0" text-anchor="middle">Stores data by column</text>
        <text x="160" y="85" font-family="Arial" font-size="11" font-weight="bold" fill="#F44747" text-anchor="middle">Heavy Aggregations</text>
    </g>

    <g transform="translate(170, 310)">
        <rect width="220" height="100" fill="#2D2D30" stroke="#C586C0" stroke-width="2" rx="5"/>
        <text x="160" y="25" font-family="Arial" font-size="14" font-weight="bold" fill="#C586C0" text-anchor="middle">Full-Text Index</text>
        <text x="160" y="45" font-family="Arial" font-size="12" fill="#E0E0E0" text-anchor="middle">Large text / Articles</text>
        <text x="160" y="65" font-family="Arial" font-size="11" fill="#A0A0A0" text-anchor="middle">Keyword searches</text>
        <text x="160" y="85" font-family="Arial" font-size="11" font-weight="bold" fill="#F44747" text-anchor="middle">MATCH() AGAINST()</text>
    </g>

    <g transform="translate(410, 310)">
        <rect width="220" height="100" fill="#2D2D30" stroke="#DCDCAA" stroke-width="2" rx="5"/>
        <text x="160" y="25" font-family="Arial" font-size="14" font-weight="bold" fill="#DCDCAA" text-anchor="middle">Spatial Index</text>
        <text x="160" y="45" font-family="Arial" font-size="12" fill="#E0E0E0" text-anchor="middle">GPS, Geometry, Maps</text>
        <text x="160" y="65" font-family="Arial" font-size="11" fill="#A0A0A0" text-anchor="middle">Polygon/Point intersections</text>
        <text x="160" y="85" font-family="Arial" font-size="11" font-weight="bold" fill="#F44747" text-anchor="middle">GIS Systems</text>
    </g>

</svg>
