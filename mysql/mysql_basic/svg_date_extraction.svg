<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 200">
    <rect width="600" height="200" fill="#1E1E1E" rx="10"/>
    <text x="300" y="40" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#4FC1FF" text-anchor="middle">Extracting Date Parts</text>
    
    <rect x="220" y="70" width="160" height="40" rx="5" fill="#2D2D30" stroke="#3E3E42" stroke-width="2"/>
    <text x="300" y="95" font-family="Courier New" font-size="20" font-weight="bold" fill="#E0E0E0" text-anchor="middle">2025-08-20</text>
    
    <!-- YEAR -->
    <path d="M 250 110 L 150 130" fill="none" stroke="#3E3E42" stroke-width="2"/>
    <rect x="100" y="130" width="80" height="30" rx="5" fill="#4FC1FF" opacity="0.2" stroke="#4FC1FF" stroke-width="2"/>
    <text x="140" y="150" font-family="Arial" font-size="12" font-weight="bold" fill="#4FC1FF" text-anchor="middle">YEAR()</text>
    <text x="140" y="180" font-family="Courier New" font-size="16" fill="#E0E0E0" text-anchor="middle">2025</text>
    
    <!-- MONTH -->
    <path d="M 300 110 L 300 130" fill="none" stroke="#3E3E42" stroke-width="2"/>
    <rect x="260" y="130" width="80" height="30" rx="5" fill="#4EC9B0" opacity="0.2" stroke="#4EC9B0" stroke-width="2"/>
    <text x="300" y="150" font-family="Arial" font-size="12" font-weight="bold" fill="#4EC9B0" text-anchor="middle">MONTH()</text>
    <text x="300" y="180" font-family="Courier New" font-size="16" fill="#E0E0E0" text-anchor="middle">08</text>
    
    <!-- DAY -->
    <path d="M 350 110 L 450 130" fill="none" stroke="#3E3E42" stroke-width="2"/>
    <rect x="420" y="130" width="80" height="30" rx="5" fill="#C586C0" opacity="0.2" stroke="#C586C0" stroke-width="2"/>
    <text x="460" y="150" font-family="Arial" font-size="12" font-weight="bold" fill="#C586C0" text-anchor="middle">DAY()</text>
    <text x="460" y="180" font-family="Courier New" font-size="16" fill="#E0E0E0" text-anchor="middle">20</text>
</svg>