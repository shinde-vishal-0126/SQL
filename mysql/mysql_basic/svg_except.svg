<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 300">
    <rect width="500" height="300" fill="#1E1E1E" rx="10"/>
    <text x="250" y="40" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#F44747" text-anchor="middle">EXCEPT / MINUS (Difference)</text>
    
    <!-- Clip path to subtract intersection -->
    <defs>
        <mask id="exceptMask">
            <rect width="500" height="300" fill="white"/>
            <circle cx="300" cy="160" r="80" fill="black"/>
        </mask>
    </defs>
    
    <circle cx="200" cy="160" r="80" fill="#F44747" opacity="0.6" mask="url(#exceptMask)"/>
    
    <circle cx="200" cy="160" r="80" fill="none" stroke="#4FC1FF" stroke-width="3"/>
    <circle cx="300" cy="160" r="80" fill="none" stroke="#A0A0A0" stroke-width="3" stroke-dasharray="5,5"/>
    
    <text x="160" y="165" font-family="Arial" font-size="16" font-weight="bold" fill="#E0E0E0">Query A</text>
    <text x="340" y="165" font-family="Arial" font-size="14" font-weight="bold" fill="#A0A0A0">Query B</text>
    
    <text x="250" y="270" font-family="Arial" font-size="14" fill="#A0A0A0" text-anchor="middle">Returns rows from Query A that are NOT in Query B</text>
</svg>