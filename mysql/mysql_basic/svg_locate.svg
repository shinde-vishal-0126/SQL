<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 150">
    <rect width="600" height="150" fill="#1E1E1E" rx="10"/>
    <text x="300" y="30" font-family="Courier New" font-size="20" font-weight="bold" fill="#4FC1FF" text-anchor="middle">LOCATE() / CHARINDEX()</text>
    
    <text x="300" y="60" font-family="Arial" font-size="14" fill="#E0E0E0" text-anchor="middle">Finds the starting position of a substring.</text>

    <!-- Example -->
    <rect x="50" y="80" width="500" height="40" rx="5" fill="#2D2D30" stroke="#3E3E42" stroke-width="2"/>
    <text x="70" y="105" font-family="Courier New" font-size="16" fill="#E0E0E0" text-anchor="start">LOCATE('@', 'vishal@gmail.com')</text>
    <path d="M 370 100 L 410 100" fill="none" stroke="#3E3E42" stroke-width="3" marker-end="url(#arrow_gray)"/>
    <text x="430" y="105" font-family="Courier New" font-size="20" font-weight="bold" fill="#4EC9B0" text-anchor="start">7</text>

    <defs>
        <marker id="arrow_gray" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
            <path d="M0,0 L0,6 L9,3 z" fill="#3E3E42" />
        </marker>
    </defs>
</svg>