<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400">
    <rect width="1000" height="400" fill="#1E1E1E" rx="10"/>
    <text x="500" y="40" font-family="Arial" font-size="24" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Columnstore Creation Process</text>
    
    <!-- Step 1: Row Groups -->
    <text x="200" y="80" font-family="Arial" font-size="18" font-weight="bold" fill="#CE9178" text-anchor="middle">#1 Row Groups</text>
    <rect x="100" y="100" width="200" height="200" fill="#2D2D30" stroke="#CE9178" stroke-width="2"/>
    <line x1="100" y1="130" x2="300" y2="130" stroke="#CE9178"/>
    <line x1="100" y1="160" x2="300" y2="160" stroke="#CE9178"/>
    <line x1="100" y1="190" x2="300" y2="190" stroke="#CE9178"/>
    <line x1="100" y1="220" x2="300" y2="220" stroke="#CE9178"/>
    
    <line x1="166" y1="100" x2="166" y2="300" stroke="#A0A0A0" stroke-dasharray="5,5"/>
    <line x1="233" y1="100" x2="233" y2="300" stroke="#A0A0A0" stroke-dasharray="5,5"/>
    <text x="133" y="120" font-family="Arial" font-size="14" fill="#E0E0E0" text-anchor="middle">ID</text>
    <text x="200" y="120" font-family="Arial" font-size="14" fill="#E0E0E0" text-anchor="middle">Name</text>
    <text x="266" y="120" font-family="Arial" font-size="14" fill="#E0E0E0" text-anchor="middle">Status</text>
    <text x="200" y="330" font-family="Arial" font-size="14" fill="#A0A0A0" text-anchor="middle">Table is divided horizontally</text>
    <text x="200" y="350" font-family="Arial" font-size="14" fill="#A0A0A0" text-anchor="middle">into Row Groups (up to 1M rows)</text>

    <!-- Arrow -->
    <path d="M 320 200 L 360 200" stroke="#A0A0A0" stroke-width="3" marker-end="url(#arrow)"/>

    <!-- Step 2: Column Segments -->
    <text x="500" y="80" font-family="Arial" font-size="18" font-weight="bold" fill="#4FC1FF" text-anchor="middle">#2 Column Segments</text>
    <rect x="400" y="100" width="50" height="200" fill="#2D2D30" stroke="#4FC1FF" stroke-width="2"/>
    <rect x="475" y="100" width="50" height="200" fill="#2D2D30" stroke="#4FC1FF" stroke-width="2"/>
    <rect x="550" y="100" width="50" height="200" fill="#2D2D30" stroke="#4FC1FF" stroke-width="2"/>
    <text x="425" y="120" font-family="Arial" font-size="14" fill="#E0E0E0" text-anchor="middle">ID</text>
    <text x="500" y="120" font-family="Arial" font-size="14" fill="#E0E0E0" text-anchor="middle">Name</text>
    <text x="575" y="120" font-family="Arial" font-size="14" fill="#E0E0E0" text-anchor="middle">Status</text>
    <line x1="400" y1="130" x2="450" y2="130" stroke="#4FC1FF"/>
    <line x1="475" y1="130" x2="525" y2="130" stroke="#4FC1FF"/>
    <line x1="550" y1="130" x2="600" y2="130" stroke="#4FC1FF"/>
    <text x="500" y="330" font-family="Arial" font-size="14" fill="#A0A0A0" text-anchor="middle">Each Row Group is divided vertically</text>
    <text x="500" y="350" font-family="Arial" font-size="14" fill="#A0A0A0" text-anchor="middle">into independent Column Segments</text>

    <!-- Arrow -->
    <path d="M 620 200 L 660 200" stroke="#A0A0A0" stroke-width="3" marker-end="url(#arrow)"/>

    <!-- Step 3: Compression -->
    <text x="800" y="80" font-family="Arial" font-size="18" font-weight="bold" fill="#4EC9B0" text-anchor="middle">#3 Compression (Dictionary)</text>
    <rect x="700" y="100" width="70" height="200" fill="#2D2D30" stroke="#4EC9B0" stroke-width="2"/>
    <text x="735" y="120" font-family="Arial" font-size="14" fill="#E0E0E0" text-anchor="middle">Status</text>
    <text x="735" y="145" font-family="Arial" font-size="12" fill="#E0E0E0" text-anchor="middle">Active</text>
    <text x="735" y="170" font-family="Arial" font-size="12" fill="#E0E0E0" text-anchor="middle">Inactive</text>
    <text x="735" y="195" font-family="Arial" font-size="12" fill="#E0E0E0" text-anchor="middle">Active</text>
    
    <path d="M 770 170 L 810 170" stroke="#4EC9B0" stroke-width="2" marker-end="url(#arrow_green)"/>
    
    <rect x="820" y="130" width="120" height="80" fill="#3D3D40" stroke="#4EC9B0"/>
    <text x="880" y="150" font-family="Arial" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Dictionary</text>
    <text x="880" y="175" font-family="Arial" font-size="12" fill="#4EC9B0" text-anchor="middle">'Active' → 1</text>
    <text x="880" y="195" font-family="Arial" font-size="12" fill="#CE9178" text-anchor="middle">'Inactive' → 2</text>
    
    <text x="800" y="330" font-family="Arial" font-size="14" fill="#A0A0A0" text-anchor="middle">Data is heavily compressed</text>
    <text x="800" y="350" font-family="Arial" font-size="14" fill="#A0A0A0" text-anchor="middle">using Run-Length/Dictionary</text>

    <defs>
        <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
            <path d="M 0 0 L 10 5 L 0 10 z" fill="#A0A0A0"/>
        </marker>
        <marker id="arrow_green" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
            <path d="M 0 0 L 10 5 L 0 10 z" fill="#4EC9B0"/>
        </marker>
    </defs>
</svg>
