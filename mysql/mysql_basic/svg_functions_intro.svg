<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 250">
    <rect width="600" height="250" fill="#1E1E1E" rx="10"/>
    <text x="300" y="40" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#DCDCAA" text-anchor="middle">What is a SQL Function?</text>
    
    <!-- Input -->
    <rect x="50" y="100" width="100" height="50" rx="5" fill="#2D2D30" stroke="#4FC1FF" stroke-width="2"/>
    <text x="100" y="130" font-family="Arial" font-size="16" font-weight="bold" fill="#E0E0E0" text-anchor="middle">Input Value</text>
    
    <!-- Arrow 1 -->
    <path d="M 160 125 L 230 125" fill="none" stroke="#3E3E42" stroke-width="3" marker-end="url(#arrow)"/>
    
    <!-- Function Box -->
    <rect x="240" y="90" width="120" height="70" rx="10" fill="#DCDCAA" opacity="0.9"/>
    <text x="300" y="130" font-family="Arial" font-size="18" font-weight="bold" fill="#000000" text-anchor="middle">FUNCTION</text>
    
    <!-- Arrow 2 -->
    <path d="M 370 125 L 440 125" fill="none" stroke="#3E3E42" stroke-width="3" marker-end="url(#arrow)"/>
    
    <!-- Output -->
    <rect x="450" y="100" width="100" height="50" rx="5" fill="#2D2D30" stroke="#4EC9B0" stroke-width="2"/>
    <text x="500" y="130" font-family="Arial" font-size="16" font-weight="bold" fill="#E0E0E0" text-anchor="middle">Output Value</text>
    
    <!-- Description -->
    <text x="300" y="200" font-family="Arial" font-size="14" fill="#A0A0A0" text-anchor="middle">A built-in SQL code that accepts an input, processes it, and returns an output.</text>

    <!-- Def -->
    <defs>
        <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
            <path d="M0,0 L0,6 L9,3 z" fill="#3E3E42" />
        </marker>
    </defs>
</svg>