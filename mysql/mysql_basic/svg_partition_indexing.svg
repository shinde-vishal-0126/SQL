<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
    <rect width="800" height="400" fill="#1E1E1E" rx="10"/>
    <text x="400" y="30" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#DCDCAA" text-anchor="middle">Partitioned Indexing (Smaller &amp; Faster)</text>
    
    <!-- Partitions -->
    <text x="300" y="80" font-family="Arial" font-size="16" font-weight="bold" fill="#4FC1FF" text-anchor="middle">PARTITIONS</text>
    <text x="600" y="80" font-family="Arial" font-size="16" font-weight="bold" fill="#4EC9B0" text-anchor="middle">SMALL INDEXES</text>
    
    <!-- Block 1 -->
    <text x="50" y="130" font-family="Arial" font-size="12" fill="#E0E0E0">Partition 2023</text>
    <rect x="200" y="100" width="150" height="50" fill="#2D2D30" stroke="#4FC1FF" stroke-width="2"/>
    <circle cx="600" cy="110" r="8" fill="#4EC9B0"/>
    <path d="M 600 118 L 580 140 M 600 118 L 620 140" stroke="#4EC9B0" stroke-width="2"/>
    <rect x="575" y="140" width="10" height="10" fill="#4EC9B0"/>
    <rect x="615" y="140" width="10" height="10" fill="#4EC9B0"/>

    <!-- Block 2 -->
    <text x="50" y="210" font-family="Arial" font-size="12" fill="#E0E0E0">Partition 2024</text>
    <rect x="200" y="180" width="150" height="50" fill="#2D2D30" stroke="#4FC1FF" stroke-width="2"/>
    <circle cx="600" cy="190" r="8" fill="#4EC9B0"/>
    <path d="M 600 198 L 580 220 M 600 198 L 620 220" stroke="#4EC9B0" stroke-width="2"/>
    <rect x="575" y="220" width="10" height="10" fill="#4EC9B0"/>
    <rect x="615" y="220" width="10" height="10" fill="#4EC9B0"/>
    
    <!-- Block 3 -->
    <text x="50" y="300" font-family="Arial" font-size="12" fill="#E0E0E0">Partition 2025</text>
    <rect x="200" y="260" width="150" height="70" fill="#2D2D30" stroke="#4FC1FF" stroke-width="2"/>
    <circle cx="600" cy="270" r="8" fill="#C586C0"/>
    <path d="M 600 278 L 580 310 M 600 278 L 620 310" stroke="#C586C0" stroke-width="2"/>
    <rect x="570" y="310" width="20" height="15" fill="#C586C0"/>
    <rect x="610" y="310" width="20" height="15" fill="#C586C0"/>
    
    <text x="600" y="350" font-family="Arial" font-size="14" fill="#C586C0" text-anchor="middle" font-weight="bold">NEW DATA WRITES</text>
    <text x="600" y="370" font-family="Arial" font-size="12" fill="#C586C0" text-anchor="middle">Only updates this small index!</text>
</svg>
