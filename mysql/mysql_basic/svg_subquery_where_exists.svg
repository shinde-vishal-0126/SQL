<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 350">
    <rect width="800" height="350" fill="#1E1E1E" rx="10"/>
    <text x="400" y="40" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#DCDCAA" text-anchor="middle">Correlated Subquery in WHERE Clause: EXISTS Operator</text>
    
    <rect x="50" y="80" width="700" height="220" fill="#2D2D30" stroke="#E0E0E0" stroke-width="2" rx="5"/>
    
    <text x="80" y="120" font-family="Courier New, monospace" font-size="16" font-weight="bold" fill="#569CD6">SELECT</text>
    <text x="160" y="120" font-family="Courier New, monospace" font-size="16" fill="#E0E0E0">column1, column2, ...</text>
    
    <text x="80" y="160" font-family="Courier New, monospace" font-size="16" font-weight="bold" fill="#569CD6">FROM</text>
    <text x="140" y="160" font-family="Courier New, monospace" font-size="16" font-weight="bold" fill="#4EC9B0">Table2</text>
    
    <text x="80" y="200" font-family="Courier New, monospace" font-size="16" font-weight="bold" fill="#569CD6">WHERE</text>
    <text x="140" y="200" font-family="Courier New, monospace" font-size="18" font-weight="bold" fill="#4FC1FF">EXISTS</text>
    
    <text x="220" y="200" font-family="Courier New, monospace" font-size="16" font-weight="bold" fill="#C586C0">( </text>
    <rect x="250" y="180" width="350" height="100" fill="#1E1E1E" stroke="#C586C0" stroke-width="1"/>
    
    <text x="270" y="210" font-family="Courier New, monospace" font-size="14" font-weight="bold" fill="#569CD6">SELECT</text>
    <text x="330" y="210" font-family="Courier New, monospace" font-size="14" fill="#E0E0E0">1</text>
    
    <text x="270" y="240" font-family="Courier New, monospace" font-size="14" font-weight="bold" fill="#569CD6">FROM</text>
    <text x="320" y="240" font-family="Courier New, monospace" font-size="14" fill="#E0E0E0">Table1</text>
    
    <text x="270" y="270" font-family="Courier New, monospace" font-size="14" font-weight="bold" fill="#569CD6">WHERE</text>
    <text x="320" y="270" font-family="Courier New, monospace" font-size="14" fill="#E0E0E0">Table1.ID = </text>
    <text x="420" y="270" font-family="Courier New, monospace" font-size="14" font-weight="bold" fill="#4EC9B0">Table2.ID</text>
    
    <text x="610" y="270" font-family="Courier New, monospace" font-size="16" font-weight="bold" fill="#C586C0"> )</text>
    
    <!-- Correlated Arrow -->
    <path d="M 215 165 Q 450 160 450 250" fill="none" stroke="#F44747" stroke-width="2" stroke-dasharray="5,5"/>
    <polygon points="450,250 445,240 455,240" fill="#F44747"/>
    <text x="380" y="150" font-family="Arial" font-size="12" font-style="italic" fill="#F44747">Correlated Reference (Runs row-by-row)</text>
</svg>
