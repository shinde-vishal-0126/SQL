<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300">
    <rect width="800" height="300" fill="#1E1E1E" rx="10"/>
    <text x="400" y="30" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#DCDCAA" text-anchor="middle">Partition Boundaries (LEFT vs RIGHT)</text>
    
    <text x="400" y="70" font-family="Arial" font-size="16" font-weight="bold" fill="#4FC1FF" text-anchor="middle">Boundary: 2023-12-31</text>
    
    <!-- LEFT -->
    <text x="200" y="110" font-family="Arial" font-size="16" font-weight="bold" fill="#4EC9B0" text-anchor="middle">LEFT Partitioning (MySQL Default)</text>
    <path d="M 50 150 L 350 150" stroke="#A0A0A0" stroke-width="4"/>
    <path d="M 200 130 L 200 170" stroke="#F44747" stroke-width="4"/>
    <text x="200" y="190" font-family="Arial" font-size="12" fill="#E0E0E0" text-anchor="middle">2023-12-31</text>
    <!-- Left marker -->
    <path d="M 200 145 Q 150 120 150 160" fill="none" stroke="#4EC9B0" stroke-width="2"/>
    <polygon points="145,155 155,165 155,155" fill="#4EC9B0"/>
    <text x="120" y="220" font-family="Arial" font-size="12" fill="#4EC9B0" text-anchor="middle">Boundary goes to</text>
    <text x="120" y="240" font-family="Arial" font-size="12" fill="#4EC9B0" font-weight="bold" text-anchor="middle">Partition 1 (Left)</text>
    
    <!-- RIGHT -->
    <text x="600" y="110" font-family="Arial" font-size="16" font-weight="bold" fill="#C586C0" text-anchor="middle">RIGHT Partitioning (SQL Server)</text>
    <path d="M 450 150 L 750 150" stroke="#A0A0A0" stroke-width="4"/>
    <path d="M 600 130 L 600 170" stroke="#F44747" stroke-width="4"/>
    <text x="600" y="190" font-family="Arial" font-size="12" fill="#E0E0E0" text-anchor="middle">2023-12-31</text>
    <!-- Right marker -->
    <path d="M 600 145 Q 650 120 650 160" fill="none" stroke="#C586C0" stroke-width="2"/>
    <polygon points="645,155 655,165 655,155" fill="#C586C0"/>
    <text x="680" y="220" font-family="Arial" font-size="12" fill="#C586C0" text-anchor="middle">Boundary goes to</text>
    <text x="680" y="240" font-family="Arial" font-size="12" fill="#C586C0" font-weight="bold" text-anchor="middle">Partition 2 (Right)</text>
</svg>
