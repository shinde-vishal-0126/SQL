<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 200">
    <rect width="600" height="200" fill="#1E1E1E" rx="10"/>
    <text x="300" y="30" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#E0E0E0" text-anchor="middle">COALESCE / ISNULL in JOIN Condition</text>
    
    <text x="300" y="60" font-family="Courier New" font-size="14" fill="#4FC1FF" text-anchor="middle">Handling NULLs before joining tables ensures matches aren't missed.</text>
    
    <rect x="100" y="90" width="400" height="80" rx="5" fill="#2D2D30" stroke="#3E3E42" stroke-width="2"/>
    <text x="120" y="115" font-family="Courier New" font-size="14" fill="#E0E0E0" text-anchor="start">SELECT a.type, b.sales FROM Table1 a</text>
    <text x="120" y="135" font-family="Courier New" font-size="14" fill="#4FC1FF" text-anchor="start">JOIN Table2 b ON a.year = b.year </text>
    <text x="120" y="155" font-family="Courier New" font-size="14" font-weight="bold" fill="#DCDCAA" text-anchor="start">AND IFNULL(a.type, '') = IFNULL(b.type, '')</text>
</svg>