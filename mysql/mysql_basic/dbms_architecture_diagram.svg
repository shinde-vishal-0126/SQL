<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 620" width="100%" height="100%">
  <defs>
    <!-- Card & Drop Shadows -->
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
    <filter id="gearShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0284c7" flood-opacity="0.25"/>
    </filter>

    <!-- Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </linearGradient>

    <linearGradient id="serverGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>

    <linearGradient id="dbmsGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="50%" stop-color="#0369a1"/>
      <stop offset="100%" stop-color="#075985"/>
    </linearGradient>

    <linearGradient id="dbGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="50%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>

    <linearGradient id="pillGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e0f2fe"/>
      <stop offset="100%" stop-color="#bae6fd"/>
    </linearGradient>
  </defs>

  <style>
    .main-title { font-family: 'Segoe UI', system-ui, sans-serif; font-weight: 800; font-size: 24px; fill: #0f172a; }
    .server-title { font-family: 'Segoe UI', system-ui, sans-serif; font-weight: 800; font-size: 20px; fill: #334155; letter-spacing: 2px; }
    .dbms-title { font-family: 'Segoe UI', system-ui, sans-serif; font-weight: 900; font-size: 18px; fill: #0284c7; letter-spacing: 1px; }
    .dbms-vertical-text { font-family: 'Segoe UI', system-ui, sans-serif; font-weight: 700; font-size: 13px; fill: #ffffff; letter-spacing: 3px; }
    .header-tag { font-family: 'Segoe UI', system-ui, sans-serif; font-weight: 800; font-size: 18px; fill: #0284c7; }
    .header-sub { font-family: 'Segoe UI', system-ui, sans-serif; font-weight: 600; font-size: 16px; fill: #1e293b; }
    .client-title { font-family: 'Segoe UI', system-ui, sans-serif; font-weight: 700; font-size: 13px; fill: #1e293b; }
    .sql-badge { font-family: 'Segoe UI', system-ui, sans-serif; font-weight: 800; font-size: 11px; fill: #0284c7; }
    .badge-247 { font-family: 'Segoe UI', system-ui, sans-serif; font-weight: 900; font-size: 14px; fill: #dc2626; }
  </style>

  <!-- Board Outline -->
  <rect x="15" y="15" width="990" height="590" rx="16" fill="url(#bgGrad)" stroke="#cbd5e1" stroke-width="2" filter="url(#shadow)"/>

  <!-- ==================== LEFT AREA: SERVER ENVIRONMENT ==================== -->
  <!-- Cloud Icon (Top Left of Server) -->
  <g transform="translate(45, 45)">
    <path d="M 25 35 A 15 15 0 0 1 50 22 A 20 20 0 0 1 85 25 A 14 14 0 0 1 95 38 A 12 12 0 0 1 88 50 L 25 50 A 12 12 0 0 1 25 35 Z" fill="#e0f2fe" stroke="#38bdf8" stroke-width="2"/>
    <text x="58" y="42" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-weight="700" font-size="11" fill="#0284c7">Cloud</text>
  </g>

  <!-- Server Boundary Box (Dashed) -->
  <rect x="75" y="70" width="415" height="495" rx="12" fill="url(#serverGrad)" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6 6"/>

  <!-- Server Header -->
  <g transform="translate(100, 95)">
    <!-- Server Hardware Icon -->
    <rect width="45" height="14" rx="2" fill="#334155"/>
    <circle cx="8" cy="7" r="2" fill="#22c55e"/>
    <circle cx="16" cy="7" r="2" fill="#38bdf8"/>
    <rect y="18" width="45" height="14" rx="2" fill="#334155"/>
    <circle cx="8" cy="25" r="2" fill="#22c55e"/>
    <circle cx="16" cy="25" r="2" fill="#38bdf8"/>
    <text x="60" y="24" class="server-title">SERVER</text>
  </g>

  <!-- 24/7 Operational Badge -->
  <g transform="translate(105, 505)">
    <circle cx="20" cy="20" r="18" fill="#fee2e2" stroke="#ef4444" stroke-width="2"/>
    <path d="M 8 20 A 12 12 0 1 1 32 20" fill="none" stroke="#ef4444" stroke-width="2"/>
    <polygon points="32,15 36,21 30,21" fill="#ef4444"/>
    <text x="20" y="25" text-anchor="middle" class="badge-247">24/7</text>
  </g>

  <!-- Database Container (Cylinder) -->
  <g transform="translate(145, 175)">
    <text x="90" y="-15" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-weight="800" font-size="19" fill="#1e293b" letter-spacing="1">DATABASE</text>
    
    <!-- Cylinder Body -->
    <path d="M 10 30 L 10 240 C 10 265, 170 265, 170 240 L 170 30 Z" fill="#f8fafc" stroke="#1e3a8a" stroke-width="2"/>
    <!-- Depth contour rings -->
    <path d="M 10 100 C 10 120, 170 120, 170 100" fill="none" stroke="#93c5fd" stroke-width="1.5"/>
    <path d="M 10 170 C 10 190, 170 190, 170 170" fill="none" stroke="#93c5fd" stroke-width="1.5"/>
    <!-- Top Lid -->
    <ellipse cx="90" cy="30" rx="80" ry="22" fill="#3b82f6" stroke="#1e3a8a" stroke-width="2"/>
    <ellipse cx="90" cy="30" rx="72" ry="18" fill="#60a5fa"/>

    <!-- Mini Relational Tables inside Database -->
    <!-- Table 1 (Top) -->
    <g transform="translate(30, 60)">
      <rect width="65" height="42" rx="3" fill="#ffffff" stroke="#2563eb" stroke-width="1.2"/>
      <rect width="65" height="12" rx="2" fill="#3b82f6"/>
      <line x1="22" y1="12" x2="22" y2="42" stroke="#bfdbfe" stroke-width="1"/>
      <line x1="44" y1="12" x2="44" y2="42" stroke="#bfdbfe" stroke-width="1"/>
      <line x1="0" y1="27" x2="65" y2="27" stroke="#bfdbfe" stroke-width="1"/>
    </g>

    <!-- Table 2 (Bottom Left) -->
    <g transform="translate(25, 130)">
      <rect width="60" height="42" rx="3" fill="#ffffff" stroke="#059669" stroke-width="1.2"/>
      <rect width="60" height="12" rx="2" fill="#10b981"/>
      <line x1="20" y1="12" x2="20" y2="42" stroke="#a7f3d0" stroke-width="1"/>
      <line x1="40" y1="12" x2="40" y2="42" stroke="#a7f3d0" stroke-width="1"/>
      <line x1="0" y1="27" x2="60" y2="27" stroke="#a7f3d0" stroke-width="1"/>
    </g>

    <!-- Table 3 (Right) -->
    <g transform="translate(105, 110)">
      <rect width="45" height="65" rx="3" fill="#ffffff" stroke="#d97706" stroke-width="1.2"/>
      <rect width="45" height="12" rx="2" fill="#f59e0b"/>
      <line x1="15" y1="12" x2="15" y2="65" stroke="#fde68a" stroke-width="1"/>
      <line x1="30" y1="12" x2="30" y2="65" stroke="#fde68a" stroke-width="1"/>
      <line x1="0" y1="28" x2="45" y2="28" stroke="#fde68a" stroke-width="1"/>
      <line x1="0" y1="45" x2="45" y2="45" stroke="#fde68a" stroke-width="1"/>
    </g>

    <!-- Link relations between tables -->
    <path d="M 95 80 L 105 125" fill="none" stroke="#ef4444" stroke-width="1.5"/>
    <circle cx="95" cy="80" r="2.5" fill="#ef4444"/>
    <circle cx="105" cy="125" r="2.5" fill="#ef4444"/>

    <path d="M 55 102 L 55 130" fill="none" stroke="#ef4444" stroke-width="1.5"/>
    <circle cx="55" cy="102" r="2.5" fill="#ef4444"/>
    <circle cx="55" cy="130" r="2.5" fill="#ef4444"/>
  </g>

  <!-- Bidirectional Arrows (Database <-> DBMS) -->
  <g transform="translate(325, 230)">
    <line x1="5" y1="30" x2="60" y2="30" stroke="#f59e0b" stroke-width="2.5"/>
    <polygon points="5,26 -2,30 5,34" fill="#f59e0b"/>
    <polygon points="60,26 67,30 60,34" fill="#f59e0b"/>

    <line x1="5" y1="65" x2="60" y2="65" stroke="#f59e0b" stroke-width="2.5"/>
    <polygon points="5,61 -2,65 5,69" fill="#f59e0b"/>
    <polygon points="60,61 67,65 60,69" fill="#f59e0b"/>

    <line x1="5" y1="100" x2="60" y2="100" stroke="#f59e0b" stroke-width="2.5"/>
    <polygon points="5,96 -2,100 5,104" fill="#f59e0b"/>
    <polygon points="60,96 67,100 60,104" fill="#f59e0b"/>

    <line x1="5" y1="135" x2="60" y2="135" stroke="#f59e0b" stroke-width="2.5"/>
    <polygon points="5,131 -2,135 5,139" fill="#f59e0b"/>
    <polygon points="60,131 67,135 60,139" fill="#f59e0b"/>
  </g>

  <!-- DBMS Component (Vertical Controller Bar) -->
  <g transform="translate(400, 105)">
    <text x="24" y="-12" text-anchor="middle" class="dbms-title">DBMS</text>
    <!-- Pillar -->
    <rect width="48" height="380" rx="8" fill="url(#dbmsGrad)" stroke="#0369a1" stroke-width="1.5" filter="url(#shadow)"/>
    
    <!-- Rotated Text along Pillar -->
    <text transform="translate(30, 290) rotate(-90)" class="dbms-vertical-text">DATABASE MANAGEMENT SYSTEM</text>

    <!-- Gear/Settings Icon at bottom of DBMS pillar -->
    <g transform="translate(24, 415)" filter="url(#gearShadow)">
      <circle cx="0" cy="0" r="15" fill="#0284c7" stroke="#ffffff" stroke-width="2"/>
      <circle cx="0" cy="0" r="6" fill="#ffffff"/>
      <!-- Cog teeth -->
      <line x1="0" y1="-19" x2="0" y2="-15" stroke="#0284c7" stroke-width="4" stroke-linecap="round"/>
      <line x1="0" y1="15" x2="0" y2="19" stroke="#0284c7" stroke-width="4" stroke-linecap="round"/>
      <line x1="-19" y1="0" x2="-15" y2="0" stroke="#0284c7" stroke-width="4" stroke-linecap="round"/>
      <line x1="15" y1="0" x2="19" y2="0" stroke="#0284c7" stroke-width="4" stroke-linecap="round"/>
      <line x1="-13" y1="-13" x2="-10" y2="-10" stroke="#0284c7" stroke-width="4" stroke-linecap="round"/>
      <line x1="10" y1="10" x2="13" y2="13" stroke="#0284c7" stroke-width="4" stroke-linecap="round"/>
      <line x1="13" y1="-13" x2="10" y2="-10" stroke="#0284c7" stroke-width="4" stroke-linecap="round"/>
      <line x1="-10" y1="10" x2="-13" y2="13" stroke="#0284c7" stroke-width="4" stroke-linecap="round"/>
    </g>
  </g>


  <!-- ==================== MIDDLE-RIGHT: INCOMING CLIENT INTERACTIONS ==================== -->
  
  <!-- 1. People / Users -->
  <g transform="translate(565, 80)">
    <!-- Users Icon -->
    <circle cx="45" cy="18" r="10" fill="#fed7aa" stroke="#ea580c" stroke-width="1.5"/>
    <circle cx="30" cy="24" r="8" fill="#fed7aa" stroke="#ea580c" stroke-width="1.5"/>
    <circle cx="60" cy="24" r="8" fill="#fed7aa" stroke="#ea580c" stroke-width="1.5"/>
    <text x="45" y="46" text-anchor="middle" class="client-title">Users &amp; Developers</text>

    <!-- SQL Tickets floating from Users -->
    <g transform="translate(-80, -5)">
      <rect width="40" height="24" rx="4" fill="#ffffff" stroke="#0284c7" stroke-width="1.5"/>
      <text x="20" y="16" text-anchor="middle" class="sql-badge">SQL</text>
      <!-- Arrow to DBMS -->
      <path d="M -5 12 L -25 35" fill="none" stroke="#f59e0b" stroke-width="1.5" marker-end="url(#arrow)"/>
    </g>
    <g transform="translate(-80, 25)">
      <rect width="40" height="24" rx="4" fill="#ffffff" stroke="#0284c7" stroke-width="1.5"/>
      <text x="20" y="16" text-anchor="middle" class="sql-badge">SQL</text>
      <path d="M -5 12 L -25 25" fill="none" stroke="#f59e0b" stroke-width="1.5"/>
    </g>
  </g>

  <!-- 2. Application (APP </>) -->
  <g transform="translate(565, 230)">
    <!-- Browser/App Card -->
    <rect width="85" height="65" rx="5" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/>
    <rect width="85" height="15" rx="4" fill="#f1f5f9"/>
    <circle cx="8" cy="8" r="2.5" fill="#ef4444"/>
    <circle cx="16" cy="8" r="2.5" fill="#f59e0b"/>
    <circle cx="24" cy="8" r="2.5" fill="#10b981"/>
    <text x="60" y="11" font-size="8" font-family="'Segoe UI', monospace" font-weight="700" fill="#475569">APP &lt;/&gt;</text>
    <!-- App UI Mock -->
    <rect x="8" y="24" width="69" height="15" rx="2" fill="#e2e8f0"/>
    <rect x="8" y="44" width="18" height="14" rx="2" fill="#93c5fd"/>
    <rect x="32" y="44" width="18" height="14" rx="2" fill="#93c5fd"/>
    <rect x="56" y="44" width="18" height="14" rx="2" fill="#93c5fd"/>

    <!-- SQL Tickets from App -->
    <g transform="translate(-80, -2)">
      <rect width="40" height="24" rx="4" fill="#ffffff" stroke="#0284c7" stroke-width="1.5"/>
      <text x="20" y="16" text-anchor="middle" class="sql-badge">SQL</text>
      <path d="M -5 12 L -25 12" fill="none" stroke="#f59e0b" stroke-width="1.5"/>
    </g>
    <g transform="translate(-80, 26)">
      <rect width="40" height="24" rx="4" fill="#ffffff" stroke="#0284c7" stroke-width="1.5"/>
      <text x="20" y="16" text-anchor="middle" class="sql-badge">SQL</text>
      <path d="M -5 12 L -25 12" fill="none" stroke="#f59e0b" stroke-width="1.5"/>
    </g>
  </g>

  <!-- 3. BI / Reporting Tool (Power BI / Dashboards) -->
  <g transform="translate(565, 395)">
    <!-- Dashboard Card -->
    <rect width="85" height="65" rx="5" fill="#ffffff" stroke="#eab308" stroke-width="1.5"/>
    <rect width="85" height="15" rx="4" fill="#fef9c3"/>
    <text x="42" y="11" text-anchor="middle" font-size="8" font-family="'Segoe UI', sans-serif" font-weight="800" fill="#a16207">Power BI / Dashboards</text>
    <!-- Pie & Bar Chart Mock -->
    <circle cx="24" cy="40" r="14" fill="#fde047" stroke="#ca8a04" stroke-width="1"/>
    <path d="M 24 40 L 24 26 A 14 14 0 0 1 38 40 Z" fill="#ca8a04"/>
    <rect x="46" y="42" width="6" height="14" fill="#22c55e"/>
    <rect x="56" y="34" width="6" height="22" fill="#3b82f6"/>
    <rect x="66" y="28" width="6" height="28" fill="#f59e0b"/>

    <!-- SQL Tickets from Analytics -->
    <g transform="translate(-80, -2)">
      <rect width="40" height="24" rx="4" fill="#ffffff" stroke="#0284c7" stroke-width="1.5"/>
      <text x="20" y="16" text-anchor="middle" class="sql-badge">SQL</text>
      <path d="M -5 12 L -25 -5" fill="none" stroke="#f59e0b" stroke-width="1.5"/>
    </g>
    <g transform="translate(-80, 26)">
      <rect width="40" height="24" rx="4" fill="#ffffff" stroke="#0284c7" stroke-width="1.5"/>
      <text x="20" y="16" text-anchor="middle" class="sql-badge">SQL</text>
      <path d="M -5 12 L -25 0" fill="none" stroke="#f59e0b" stroke-width="1.5"/>
    </g>
  </g>


  <!-- ==================== RIGHT SIDE: 4 CORE SUMMARY PILLARS ==================== -->
  <g transform="translate(730, 90)">
    <!-- Header -->
    <rect width="250" height="475" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="125" y="40" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-weight="800" font-size="16" fill="#0f172a">Core Architecture</text>
    <line x1="20" y1="55" x2="230" y2="55" stroke="#f1f5f9" stroke-width="2"/>

    <!-- Item 1: Database -->
    <g transform="translate(25, 75)">
      <rect width="200" height="65" rx="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
      <text x="15" y="26" class="header-tag">Database</text>
      <text x="15" y="48" class="header-sub">Stores Data</text>
    </g>

    <!-- Item 2: SQL -->
    <g transform="translate(25, 160)">
      <rect width="200" height="65" rx="8" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
      <text x="15" y="26" class="header-tag" fill="#16a34a">SQL</text>
      <text x="15" y="48" class="header-sub">Speak to Database</text>
    </g>

    <!-- Item 3: DBMS -->
    <g transform="translate(25, 245)">
      <rect width="200" height="65" rx="8" fill="#fef3c7" stroke="#fde68a" stroke-width="1"/>
      <text x="15" y="26" class="header-tag" fill="#d97706">DBMS</text>
      <text x="15" y="48" class="header-sub">Manages Database</text>
    </g>

    <!-- Item 4: Server -->
    <g transform="translate(25, 330)">
      <rect width="200" height="65" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="15" y="26" class="header-tag" fill="#475569">Server</text>
      <text x="15" y="48" class="header-sub">Where Database Lives</text>
    </g>

    <!-- Bottom note -->
    <text x="125" y="435" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="600" fill="#64748b">⚡ Priority • Concurrency • Security</text>
  </g>
</svg>
