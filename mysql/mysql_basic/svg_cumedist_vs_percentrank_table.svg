<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300">
    <rect width="600" height="300" fill="#eeeeee" rx="10"/>
    <text x="300" y="30" font-family="Arial" font-size="18" font-weight="bold" fill="#575724" text-anchor="middle">CUME_DIST vs PERCENT_RANK</text>
    
    <!-- Table Headers -->
    <rect x="50" y="50" width="80" height="30" fill="#e8e8e9" stroke="#b1b1b6" stroke-width="2"/>
    <text x="90" y="70" font-family="Arial" font-size="14" font-weight="bold" fill="#1f1f1f" text-anchor="middle">Sales</text>

    <rect x="140" y="50" width="80" height="30" fill="#e8e8e9" stroke="#0072b0" stroke-width="2"/>
    <text x="180" y="70" font-family="Arial" font-size="14" font-weight="bold" fill="#0072b0" text-anchor="middle">DIST</text>

    <rect x="230" y="50" width="80" height="30" fill="#e8e8e9" stroke="#267d6b" stroke-width="2"/>
    <text x="270" y="70" font-family="Arial" font-size="14" font-weight="bold" fill="#267d6b" text-anchor="middle">PER</text>

    <!-- Row 1 (100) -->
    <rect x="50" y="90" width="80" height="30" fill="#e8e8e9" stroke="#b1b1b6"/>
    <text x="90" y="110" font-family="Courier New" font-size="14" fill="#1f1f1f" text-anchor="middle">100</text>
    <rect x="140" y="90" width="80" height="30" fill="#e8e8e9" stroke="#0072b0"/>
    <text x="180" y="110" font-family="Courier New" font-size="14" fill="#1f1f1f" text-anchor="middle">0.2</text>
    <rect x="230" y="90" width="80" height="30" fill="#e8e8e9" stroke="#267d6b"/>
    <text x="270" y="110" font-family="Courier New" font-size="14" fill="#1f1f1f" text-anchor="middle">0</text>

    <!-- Row 2 (80 - Tie) -->
    <rect x="50" y="130" width="80" height="30" fill="#e8e8e9" stroke="#b80b0b"/>
    <text x="90" y="150" font-family="Courier New" font-size="14" fill="#1f1f1f" text-anchor="middle">80</text>
    <rect x="140" y="130" width="80" height="30" fill="#e8e8e9" stroke="#0072b0"/>
    <text x="180" y="150" font-family="Courier New" font-size="14" font-weight="bold" fill="#1f1f1f" text-anchor="middle">0.6</text>
    <rect x="230" y="130" width="80" height="30" fill="#e8e8e9" stroke="#267d6b"/>
    <text x="270" y="150" font-family="Courier New" font-size="14" font-weight="bold" fill="#1f1f1f" text-anchor="middle">0.25</text>

    <!-- Row 3 (80 - Tie) -->
    <rect x="50" y="170" width="80" height="30" fill="#e8e8e9" stroke="#b80b0b"/>
    <text x="90" y="190" font-family="Courier New" font-size="14" fill="#1f1f1f" text-anchor="middle">80</text>
    <rect x="140" y="170" width="80" height="30" fill="#e8e8e9" stroke="#0072b0"/>
    <text x="180" y="190" font-family="Courier New" font-size="14" font-weight="bold" fill="#1f1f1f" text-anchor="middle">0.6</text>
    <rect x="230" y="170" width="80" height="30" fill="#e8e8e9" stroke="#267d6b"/>
    <text x="270" y="190" font-family="Courier New" font-size="14" font-weight="bold" fill="#1f1f1f" text-anchor="middle">0.25</text>

    <!-- Row 4 (50) -->
    <rect x="50" y="210" width="80" height="30" fill="#e8e8e9" stroke="#b1b1b6"/>
    <text x="90" y="230" font-family="Courier New" font-size="14" fill="#1f1f1f" text-anchor="middle">50</text>
    <rect x="140" y="210" width="80" height="30" fill="#e8e8e9" stroke="#0072b0"/>
    <text x="180" y="230" font-family="Courier New" font-size="14" fill="#1f1f1f" text-anchor="middle">0.8</text>
    <rect x="230" y="210" width="80" height="30" fill="#e8e8e9" stroke="#267d6b"/>
    <text x="270" y="230" font-family="Courier New" font-size="14" fill="#1f1f1f" text-anchor="middle">0.75</text>

    <!-- Row 5 (30) -->
    <rect x="50" y="250" width="80" height="30" fill="#e8e8e9" stroke="#b1b1b6"/>
    <text x="90" y="270" font-family="Courier New" font-size="14" fill="#1f1f1f" text-anchor="middle">30</text>
    <rect x="140" y="250" width="80" height="30" fill="#e8e8e9" stroke="#0072b0"/>
    <text x="180" y="270" font-family="Courier New" font-size="14" fill="#1f1f1f" text-anchor="middle">1</text>
    <rect x="230" y="250" width="80" height="30" fill="#e8e8e9" stroke="#267d6b"/>
    <text x="270" y="270" font-family="Courier New" font-size="14" fill="#1f1f1f" text-anchor="middle">1</text>

    <!-- Tie Rule Text -->
    <text x="450" y="100" font-family="Arial" font-size="14" font-weight="bold" fill="#575724" text-anchor="middle">CUME_DIST (Inclusive)</text>
    <text x="450" y="120" font-family="Arial" font-size="12" fill="#5f5f5f" text-anchor="middle">Current row is included</text>
    
    <text x="450" y="180" font-family="Arial" font-size="14" font-weight="bold" fill="#575724" text-anchor="middle">PERCENT_RANK (Exclusive)</text>
    <text x="450" y="200" font-family="Arial" font-size="12" fill="#5f5f5f" text-anchor="middle">Current row is excluded</text>

    <path d="M 320 150 L 350 150" fill="none" stroke="#b80b0b" stroke-width="2" marker-end="url(#arrow_red)"/>
    <text x="450" y="155" font-family="Arial" font-size="12" font-weight="bold" fill="#b80b0b" text-anchor="middle">TIES share same percentage</text>
    <text x="450" y="250" font-family="Arial" font-size="11" fill="#1f1f1f" text-anchor="middle">Both measure contribution to overall distribution</text>

    <defs>
        <marker id="arrow_red" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
            <path d="M0,0 L0,6 L9,3 z" fill="#F44747" />
        </marker>
    </defs>
</svg>