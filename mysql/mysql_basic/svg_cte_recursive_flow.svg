<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450">
    <rect width="800" height="450" fill="#eeeeee" rx="10"/>
    
    <!-- Title -->
    <text x="400" y="40" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#a38a00" text-anchor="middle">Recursive CTE Execution Flow</text>
    
    <rect x="250" y="80" width="300" height="320" fill="#e8e8e9" stroke="#0072b0" stroke-width="2" rx="10"/>
    <text x="400" y="110" font-family="Arial" font-size="18" font-weight="bold" fill="#a38a00" text-anchor="middle">WITH RECURSIVE</text>
    
    <!-- Anchor Member -->
    <rect x="300" y="130" width="200" height="40" fill="#4EC9B0" rx="5"/>
    <text x="400" y="155" font-family="Arial" font-size="14" font-weight="bold" fill="#1E1E1E" text-anchor="middle">1. Anchor Member</text>
    <text x="520" y="155" font-family="Arial" font-size="12" fill="#1f1f1f">(Runs Once)</text>
    
    <!-- UNION ALL -->
    <rect x="350" y="200" width="100" height="30" fill="#F44747" rx="15"/>
    <text x="400" y="220" font-family="Arial" font-size="14" font-weight="bold" fill="#1E1E1E" text-anchor="middle">UNION ALL</text>
    
    <path d="M 400 170 L 400 200" fill="none" stroke="#333333" stroke-width="2" marker-end="url(#arrow)"/>
    <path d="M 400 230 L 400 260" fill="none" stroke="#333333" stroke-width="2" marker-end="url(#arrow)"/>
    
    <!-- Recursive Member -->
    <rect x="300" y="260" width="200" height="40" fill="#4FC1FF" rx="5"/>
    <text x="400" y="285" font-family="Arial" font-size="14" font-weight="bold" fill="#1E1E1E" text-anchor="middle">2. Recursive Member</text>
    
    <!-- Looping arrow -->
    <path d="M 500 280 Q 650 280 650 210 T 500 150" fill="none" stroke="#b80b0b" stroke-width="3" stroke-dasharray="5,5" marker-end="url(#arrow)"/>
    <text x="620" y="190" font-family="Arial" font-size="12" font-weight="bold" fill="#b80b0b">Loops until condition</text>
    <text x="620" y="205" font-family="Arial" font-size="12" font-weight="bold" fill="#b80b0b">is met (No rows)</text>
    
    <path d="M 400 300 L 400 350" fill="none" stroke="#333333" stroke-width="2" marker-end="url(#arrow)"/>
    
    <!-- Main Query -->
    <rect x="300" y="350" width="200" height="40" fill="#FFD700" rx="5"/>
    <text x="400" y="375" font-family="Arial" font-size="14" font-weight="bold" fill="#1E1E1E" text-anchor="middle">3. Main Query</text>
</svg>
