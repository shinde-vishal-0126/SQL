<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
    <rect width="800" height="400" fill="#1E1E1E" rx="10"/>
    <text x="400" y="30" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#DCDCAA" text-anchor="middle">The Solution: Table Partitioning</text>
    
    <!-- Partitions -->
    <text x="200" y="80" font-family="Arial" font-size="16" font-weight="bold" fill="#4FC1FF" text-anchor="middle">PHYSICAL PARTITIONS</text>
    
    <!-- p2023 -->
    <text x="50" y="130" font-family="Arial" font-size="12" fill="#E0E0E0">Partition 2023</text>
    <rect x="150" y="100" width="150" height="60" fill="#2D2D30" stroke="#4EC9B0" stroke-width="2"/>
    <path d="M 150 130 L 300 130 M 200 100 L 200 160 M 250 100 L 250 160" stroke="#A0A0A0" stroke-width="1"/>
    
    <!-- p2024 -->
    <text x="50" y="210" font-family="Arial" font-size="12" fill="#E0E0E0">Partition 2024</text>
    <rect x="150" y="180" width="150" height="60" fill="#2D2D30" stroke="#4EC9B0" stroke-width="2"/>
    <path d="M 150 210 L 300 210 M 200 180 L 200 240 M 250 180 L 250 240" stroke="#A0A0A0" stroke-width="1"/>
    
    <!-- p2025 -->
    <text x="50" y="300" font-family="Arial" font-size="12" fill="#E0E0E0" font-weight="bold">Partition 2025</text>
    <rect x="150" y="260" width="150" height="80" fill="#2D2D30" stroke="#4FC1FF" stroke-width="3"/>
    <path d="M 150 300 L 300 300 M 200 260 L 200 340 M 250 260 L 250 340" stroke="#A0A0A0" stroke-width="1"/>
    
    <!-- Logical Table -->
    <text x="600" y="160" font-family="Arial" font-size="16" font-weight="bold" fill="#C586C0" text-anchor="middle">LOGICAL TABLE</text>
    <rect x="550" y="180" width="100" height="120" fill="#2D2D30" stroke="#C586C0" stroke-width="2"/>
    
    <!-- Connections -->
    <path d="M 310 130 L 540 200" stroke="#A0A0A0" stroke-dasharray="5,5" stroke-width="2"/>
    <path d="M 310 210 L 540 240" stroke="#A0A0A0" stroke-dasharray="5,5" stroke-width="2"/>
    <path d="M 310 300 L 540 280" stroke="#A0A0A0" stroke-dasharray="5,5" stroke-width="2"/>
    
    <!-- Query Target -->
    <text x="600" y="330" font-family="Arial" font-size="14" fill="#F44747" text-anchor="middle">Query: WHERE Year = 2025</text>
    <path d="M 500 325 L 320 300" stroke="#F44747" stroke-width="3"/>
    <polygon points="320,300 330,295 330,305" fill="#F44747"/>
    <text x="420" y="340" font-family="Arial" font-size="12" fill="#F44747" text-anchor="middle">Scans ONLY 2025!</text>
</svg>
