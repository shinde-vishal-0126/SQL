<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 300">
    <rect width="500" height="300" fill="#eeeeee" rx="10"/>
    <text x="250" y="40" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#0072b0" text-anchor="middle">UNION (Unique Rows)</text>
    
    <circle cx="200" cy="160" r="80" fill="#4FC1FF" opacity="0.3" stroke="#0072b0" stroke-width="3"/>
    <circle cx="300" cy="160" r="80" fill="#4EC9B0" opacity="0.3" stroke="#267d6b" stroke-width="3"/>
    
    <text x="160" y="165" font-family="Arial" font-size="16" font-weight="bold" fill="#1f1f1f">Table A</text>
    <text x="340" y="165" font-family="Arial" font-size="16" font-weight="bold" fill="#1f1f1f">Table B</text>
    <text x="250" y="165" font-family="Arial" font-size="14" font-weight="bold" fill="#1f1f1f" text-anchor="middle">Common</text>
    
    <text x="250" y="270" font-family="Arial" font-size="14" fill="#5f5f5f" text-anchor="middle">Combines everything, but REMOVES duplicates</text>
