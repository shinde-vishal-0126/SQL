    <circle cx="200" cy="160" r="80" fill="#4FC1FF" opacity="0.3" stroke="#4FC1FF" stroke-width="3"/>
    <circle cx="300" cy="160" r="80" fill="#4EC9B0" opacity="0.3" stroke="#4EC9B0" stroke-width="3"/>
    
    <text x="160" y="165" font-family="Arial" font-size="16" font-weight="bold" fill="#E0E0E0">Table A</text>
