<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 820" width="100%" height="100%">
  <defs>
    <!-- Card Drop Shadows -->
    <filter id="cardShadow" x="-5%" y="-5%" width="110%" height="112%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
    <filter id="topShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000000" flood-opacity="0.18"/>
    </filter>

    <!-- Gradients -->
    <linearGradient id="bgCanvas" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>

    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>

    <!-- Accent Header Gradients for Cards -->
    <linearGradient id="gradCascadeDel" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#dc2626"/>
      <stop offset="100%" stop-color="#ef4444"/>
    </linearGradient>
    <linearGradient id="gradCascadeUpd" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="gradSetNull" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="gradRestrict" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="gradNoAction" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0d9488"/>
      <stop offset="100%" stop-color="#14b8a6"/>
    </linearGradient>
    <linearGradient id="gradSetDefault" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>
  </defs>

  <style>
    .title-main { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; font-weight: 900; font-size: 23px; fill: #ffffff; }
    .title-sub { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 13px; fill: #94a3b8; }
    .card-title { font-family: 'Segoe UI', system-ui, sans-serif; font-weight: 800; font-size: 15px; fill: #ffffff; }
    .card-badge { font-family: 'Segoe UI', monospace, sans-serif; font-weight: 700; font-size: 10px; }
    .label-tag { font-family: 'Segoe UI', sans-serif; font-weight: 800; font-size: 11px; fill: #475569; }
    .val-text { font-family: 'Segoe UI', sans-serif; font-size: 12px; fill: #0f172a; line-height: 1.4; }
    .val-code { font-family: 'Consolas', monospace; font-size: 11.5px; font-weight: 700; }
    .note-text { font-family: 'Segoe UI', sans-serif; font-size: 11px; font-style: italic; }
    .footer-text { font-family: 'Segoe UI', sans-serif; font-size: 12px; font-weight: 700; fill: #334155; }
  </style>

  <!-- Background Canvas -->
  <rect width="100%" height="100%" fill="url(#bgCanvas)" rx="16"/>
  <rect width="100%" height="100%" fill="none" stroke="#cbd5e1" stroke-width="2" rx="16"/>

  <!-- Top Banner Header -->
  <g filter="url(#topShadow)">
    <rect x="25" y="22" width="1150" height="74" rx="12" fill="url(#headerGrad)"/>
    <text x="50" y="52" class="title-main">FOREIGN KEY REFERENTIAL ACTIONS IN MySQL — SUMMARY DECISION MATRIX</text>
    <text x="50" y="76" class="title-sub">Defines how MySQL maintains Referential Integrity when Parent records are DELETED or UPDATED</text>
  </g>

  <!-- ================= GRID ROW 1: CASCADE & SET NULL (Y = 115) ================= -->

  <!-- CARD 1: ON DELETE CASCADE -->
  <g filter="url(#cardShadow)">
    <rect x="30" y="115" width="365" height="315" rx="12" fill="#ffffff" stroke="#fecaca" stroke-width="2"/>
    <!-- Card Header -->
    <path d="M 30 127 Q 30 115 42 115 L 383 115 Q 395 115 395 127 L 395 160 L 30 160 Z" fill="url(#gradCascadeDel)"/>
    <text x="45" y="145" class="card-title">1. ON DELETE CASCADE</text>
    <rect x="255" y="128" width="128" height="22" rx="6" fill="#ffffff" fill-opacity="0.25"/>
    <text x="262" y="143" class="card-badge" fill="#ffffff">AUTO-DELETE CHILD</text>

    <!-- Content Box -->
    <rect x="42" y="172" width="341" height="62" rx="6" fill="#fef2f2" stroke="#fee2e2"/>
    <text x="52" y="190" class="label-tag" fill="#991b1b">ACTION TRIGGERED:</text>
    <text x="52" y="208" class="val-text" font-weight="700" fill="#991b1b">When Parent row is DELETED:</text>
    <text x="52" y="224" class="val-text" fill="#7f1d1d">All related Child rows are automatically deleted.</text>

    <!-- Use Case Box -->
    <rect x="42" y="244" width="341" height="60" rx="6" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="52" y="262" class="label-tag">PRIMARY USE CASE:</text>
    <text x="52" y="280" class="val-text" font-weight="600">Child data has NO meaning without Parent</text>
    <text x="52" y="295" class="val-text" fill="#64748b">(e.g., Order Items deleted when Order is deleted)</text>

    <!-- Engine Support -->
    <rect x="42" y="314" width="341" height="52" rx="6" fill="#f1f5f9" stroke="#cbd5e1"/>
    <text x="52" y="332" class="label-tag">BEHAVIOR &amp; SAFETY:</text>
    <text x="52" y="350" class="val-text" fill="#0f172a">Prevents orphan child records from accumulating.</text>
    <text x="52" y="375" class="note-text" fill="#dc2626" font-weight="700">InnoDB Support: Fully Supported &amp; Common</text>
  </g>

  <!-- CARD 2: ON UPDATE CASCADE -->
  <g filter="url(#cardShadow)">
    <rect x="415" y="115" width="365" height="315" rx="12" fill="#ffffff" stroke="#bfdbfe" stroke-width="2"/>
    <!-- Card Header -->
    <path d="M 415 127 Q 415 115 427 115 L 768 115 Q 780 115 780 127 L 780 160 L 415 160 Z" fill="url(#gradCascadeUpd)"/>
    <text x="430" y="145" class="card-title">2. ON UPDATE CASCADE</text>
    <rect x="645" y="128" width="125" height="22" rx="6" fill="#ffffff" fill-opacity="0.25"/>
    <text x="653" y="143" class="card-badge" fill="#ffffff">AUTO-SYNC KEYS</text>

    <!-- Content Box -->
    <rect x="427" y="172" width="341" height="62" rx="6" fill="#eff6ff" stroke="#dbeafe"/>
    <text x="437" y="190" class="label-tag" fill="#1e40af">ACTION TRIGGERED:</text>
    <text x="437" y="208" class="val-text" font-weight="700" fill="#1e40af">When Parent Primary Key is UPDATED:</text>
    <text x="437" y="224" class="val-text" fill="#1e3a8a">Child Foreign Key values are updated automatically.</text>

    <!-- Use Case Box -->
    <rect x="427" y="244" width="341" height="60" rx="6" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="437" y="262" class="label-tag">PRIMARY USE CASE:</text>
    <text x="437" y="280" class="val-text" font-weight="600">Parent Key values may change over time</text>
    <text x="437" y="295" class="val-text" fill="#64748b">(e.g., Department ID changed from 1 to 101)</text>

    <!-- Engine Support -->
    <rect x="427" y="314" width="341" height="52" rx="6" fill="#f1f5f9" stroke="#cbd5e1"/>
    <text x="437" y="332" class="label-tag">BEHAVIOR &amp; SAFETY:</text>
    <text x="437" y="350" class="val-text" fill="#0f172a">Keeps Parent &amp; Child tables permanently synchronized.</text>
    <text x="437" y="375" class="note-text" fill="#2563eb" font-weight="700">InnoDB Support: Fully Supported &amp; Reliable</text>
  </g>

  <!-- CARD 3: ON DELETE SET NULL -->
  <g filter="url(#cardShadow)">
    <rect x="800" y="115" width="365" height="315" rx="12" fill="#ffffff" stroke="#fde68a" stroke-width="2"/>
    <!-- Card Header -->
    <path d="M 800 127 Q 800 115 812 115 L 1153 115 Q 1165 115 1165 127 L 1165 160 L 800 160 Z" fill="url(#gradSetNull)"/>
    <text x="815" y="145" class="card-title">3. ON DELETE SET NULL</text>
    <rect x="1035" y="128" width="118" height="22" rx="6" fill="#ffffff" fill-opacity="0.25"/>
    <text x="1042" y="143" class="card-badge" fill="#ffffff">SET FK TO NULL</text>

    <!-- Content Box -->
    <rect x="812" y="172" width="341" height="62" rx="6" fill="#fffbeb" stroke="#fef3c7"/>
    <text x="822" y="190" class="label-tag" fill="#92400e">ACTION TRIGGERED:</text>
    <text x="822" y="208" class="val-text" font-weight="700" fill="#92400e">When Parent row is DELETED:</text>
    <text x="822" y="224" class="val-text" fill="#78350f">Child foreign key is set to NULL (Child record remains).</text>

    <!-- Use Case Box -->
    <rect x="812" y="244" width="341" height="60" rx="6" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="822" y="262" class="label-tag">PRIMARY USE CASE:</text>
    <text x="822" y="280" class="val-text" font-weight="600">Child can exist without a Parent</text>
    <text x="822" y="295" class="val-text" fill="#64748b">(e.g., Employee keeps job if Dept is dissolved)</text>

    <!-- Engine Support -->
    <rect x="812" y="314" width="341" height="52" rx="6" fill="#f1f5f9" stroke="#cbd5e1"/>
    <text x="822" y="332" class="label-tag">PREREQUISITE RULE:</text>
    <text x="822" y="350" class="val-text" fill="#0f172a">Child FK column MUST allow NULL values (Not NOT NULL).</text>
    <text x="822" y="375" class="note-text" fill="#b45309" font-weight="700">InnoDB Support: Fully Supported (Nullable FK)</text>
  </g>

  <!-- ================= GRID ROW 2: RESTRICT, NO ACTION & SET DEFAULT (Y = 455) ================= -->

  <!-- CARD 4: ON DELETE RESTRICT (DEFAULT) -->
  <g filter="url(#cardShadow)">
    <rect x="30" y="455" width="365" height="305" rx="12" fill="#ffffff" stroke="#ddd6fe" stroke-width="2"/>
    <!-- Card Header -->
    <path d="M 30 467 Q 30 455 42 455 L 383 455 Q 395 455 395 467 L 395 500 L 30 500 Z" fill="url(#gradRestrict)"/>
    <text x="45" y="485" class="card-title">4. ON DELETE RESTRICT</text>
    <rect x="255" y="468" width="128" height="22" rx="6" fill="#ffffff" fill-opacity="0.25"/>
    <text x="262" y="483" class="card-badge" fill="#ffffff">MYSQL DEFAULT</text>

    <!-- Content Box -->
    <rect x="42" y="512" width="341" height="58" rx="6" fill="#f5f3ff" stroke="#ede9fe"/>
    <text x="52" y="530" class="label-tag" fill="#5b21b6">ACTION TRIGGERED:</text>
    <text x="52" y="548" class="val-text" font-weight="700" fill="#5b21b6">Parent deletion is STRICTLY BLOCKED:</text>
    <text x="52" y="563" class="val-text" fill="#4c1d95">Throws Error 1451 if any child record references parent.</text>

    <!-- Use Case Box -->
    <rect x="42" y="580" width="341" height="58" rx="6" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="52" y="598" class="label-tag">PRIMARY USE CASE:</text>
    <text x="52" y="615" class="val-text" font-weight="600">Strong Data Protection Required</text>
    <text x="52" y="630" class="val-text" fill="#64748b">Must manually delete child records before parent.</text>

    <!-- Engine Support -->
    <rect x="42" y="648" width="341" height="48" rx="6" fill="#f1f5f9" stroke="#cbd5e1"/>
    <text x="52" y="666" class="label-tag">DEFAULT SETTING:</text>
    <text x="52" y="683" class="val-text" fill="#0f172a">Applied automatically if no action is specified.</text>
    <text x="52" y="707" class="note-text" fill="#6d28d9" font-weight="700">InnoDB Support: Built-in Default Safety Net</text>
  </g>

  <!-- CARD 5: ON DELETE NO ACTION -->
  <g filter="url(#cardShadow)">
    <rect x="415" y="455" width="365" height="305" rx="12" fill="#ffffff" stroke="#99f6e4" stroke-width="2"/>
    <!-- Card Header -->
    <path d="M 415 467 Q 415 455 427 455 L 768 455 Q 780 455 780 467 L 780 500 L 415 500 Z" fill="url(#gradNoAction)"/>
    <text x="430" y="485" class="card-title">5. ON DELETE NO ACTION</text>
    <rect x="645" y="468" width="125" height="22" rx="6" fill="#ffffff" fill-opacity="0.25"/>
    <text x="653" y="483" class="card-badge" fill="#ffffff">SAME AS RESTRICT</text>

    <!-- Content Box -->
    <rect x="427" y="512" width="341" height="58" rx="6" fill="#f0fdfa" stroke="#ccfbf1"/>
    <text x="437" y="530" class="label-tag" fill="#115e59">ACTION TRIGGERED:</text>
    <text x="437" y="548" class="val-text" font-weight="700" fill="#115e59">Same as RESTRICT in MySQL:</text>
    <text x="437" y="563" class="val-text" fill="#134e4a">Deletion is prevented if child rows exist.</text>

    <!-- Use Case Box -->
    <rect x="427" y="580" width="341" height="58" rx="6" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="437" y="598" class="label-tag">PRIMARY USE CASE:</text>
    <text x="437" y="615" class="val-text" font-weight="600">Standard ANSI SQL Compliance</text>
    <text x="437" y="630" class="val-text" fill="#64748b">Prevents accidental data loss across relational tables.</text>

    <!-- Engine Support -->
    <rect x="427" y="648" width="341" height="48" rx="6" fill="#f1f5f9" stroke="#cbd5e1"/>
    <text x="437" y="666" class="label-tag">TECHNICAL BEHAVIOR:</text>
    <text x="437" y="683" class="val-text" fill="#0f172a">In MySQL InnoDB, evaluated immediately as RESTRICT.</text>
    <text x="437" y="707" class="note-text" fill="#0f766e" font-weight="700">InnoDB Support: Identical to RESTRICT</text>
  </g>

  <!-- CARD 6: ON DELETE SET DEFAULT -->
  <g filter="url(#cardShadow)">
    <rect x="800" y="455" width="365" height="305" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <!-- Card Header -->
    <path d="M 800 467 Q 800 455 812 455 L 1153 455 Q 1165 455 1165 467 L 1165 500 L 800 500 Z" fill="url(#gradSetDefault)"/>
    <text x="815" y="485" class="card-title">6. ON DELETE SET DEFAULT</text>
    <rect x="1035" y="468" width="118" height="22" rx="6" fill="#fee2e2"/>
    <text x="1040" y="483" class="card-badge" fill="#991b1b">RARE IN MYSQL</text>

    <!-- Content Box -->
    <rect x="812" y="512" width="341" height="58" rx="6" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="822" y="530" class="label-tag" fill="#475569">ACTION TRIGGERED:</text>
    <text x="822" y="548" class="val-text" font-weight="700" fill="#334155">Child Foreign Key set to Default value:</text>
    <text x="822" y="563" class="val-text" fill="#475569">Sets child FK to its predefined default column value.</text>

    <!-- Use Case Box -->
    <rect x="812" y="580" width="341" height="58" rx="6" fill="#fef2f2" stroke="#fee2e2"/>
    <text x="822" y="598" class="label-tag" fill="#dc2626">CRITICAL INNODB LIMITATION:</text>
    <text x="822" y="615" class="val-text" font-weight="700" fill="#b91c1c">NOT Supported by MySQL InnoDB Engine!</text>
    <text x="822" y="630" class="val-text" fill="#7f1d1d">MySQL parser rejects this or treats as RESTRICT.</text>

    <!-- Engine Support -->
    <rect x="812" y="648" width="341" height="48" rx="6" fill="#f1f5f9" stroke="#cbd5e1"/>
    <text x="822" y="666" class="label-tag">ENGINE COMPATIBILITY:</text>
    <text x="822" y="683" class="val-text" fill="#0f172a">Common in SQL Server / PostgreSQL, but invalid in InnoDB.</text>
    <text x="822" y="707" class="note-text" fill="#ef4444" font-weight="700">InnoDB Support: ❌ Unsupported (Throws Error)</text>
  </g>

  <!-- ================= BOTTOM FOOTER BAR (Y = 772) ================= -->
  <rect x="30" y="772" width="1135" height="34" rx="8" fill="#e2e8f0"/>
  <text x="45" y="794" class="footer-text">💡 ARCHITECTURAL RULE: By default, MySQL uses RESTRICT. Use CASCADE only when child entities cannot exist without parent. Ensure FK column is nullable for SET NULL.</text>
</svg>
