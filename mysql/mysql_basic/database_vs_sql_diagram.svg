<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="100%" height="100%">
  <defs>
    <!-- Background & Shadow filters -->
    <filter id="cardShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Gradients -->
    <linearGradient id="boardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </linearGradient>

    <linearGradient id="dbGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>

    <linearGradient id="tableGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#eff6ff"/>
    </linearGradient>

    <linearGradient id="bubbleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
  </defs>

  <style>
    .title-text { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; font-weight: 800; font-size: 26px; fill: #0f172a; }
    .vs-text { font-family: 'Segoe UI', system-ui, sans-serif; font-weight: 700; font-size: 16px; fill: #64748b; }
    .label { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 13px; font-weight: 600; fill: #334155; }
    .badge-text { font-family: 'Segoe UI', system-ui, sans-serif; font-weight: 700; font-size: 12px; fill: #ffffff; }
    .bubble-text { font-family: 'Segoe UI', system-ui, sans-serif; font-weight: 700; font-size: 14px; fill: #0f172a; }
    .stat-text { font-family: 'Segoe UI', system-ui, sans-serif; font-weight: 900; font-size: 22px; fill: #ffffff; }
    .desc-text { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 12px; fill: #64748b; }
    .status-badge { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 13px; font-weight: 700; }
  </style>

  <!-- Board Frame -->
  <rect x="15" y="15" width="970" height="530" rx="16" fill="url(#boardBg)" stroke="#cbd5e1" stroke-width="2" filter="url(#cardShadow)"/>

  <!-- Top Headers -->
  <text x="250" y="55" text-anchor="middle" class="title-text" fill="#b91c1c">Without Database</text>
  
  <rect x="475" y="36" width="50" height="28" rx="14" fill="#e2e8f0"/>
  <text x="500" y="55" text-anchor="middle" class="vs-text">VS</text>
  
  <text x="750" y="55" text-anchor="middle" class="title-text" fill="#1d4ed8">With Database &amp; SQL</text>

  <!-- Center Divider Line -->
  <line x1="500" y1="80" x2="500" y2="480" stroke="#e2e8f0" stroke-width="2" stroke-dasharray="6 6"/>

  <!-- ==================== LEFT SIDE: WITHOUT DATABASE ==================== -->
  <g id="leftSide">
    <!-- Question Bubble -->
    <path d="M 120 120 Q 120 100 150 100 L 230 100 Q 260 100 260 120 L 260 145 Q 260 165 240 165 L 210 165 L 190 185 L 195 165 L 150 165 Q 120 165 120 145 Z" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/>
    <text x="190" y="128" text-anchor="middle" class="bubble-text" fill="#991b1b">Total Spending?</text>
    <text x="190" y="148" text-anchor="middle" class="desc-text" fill="#b91c1c">= 120 + 450 + ...?</text>

    <!-- Scattered Files & Sheets -->
    <!-- TXT File 1 -->
    <g transform="translate(60, 190)">
      <rect width="45" height="55" rx="4" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
      <path d="M 30 0 L 45 15 L 30 15 Z" fill="#e2e8f0"/>
      <rect x="8" y="20" width="28" height="3" rx="1" fill="#cbd5e1"/>
      <rect x="8" y="27" width="22" height="3" rx="1" fill="#cbd5e1"/>
      <rect x="8" y="34" width="25" height="3" rx="1" fill="#cbd5e1"/>
      <text x="22" y="48" text-anchor="middle" font-size="9" font-weight="700" fill="#64748b">.TXT</text>
    </g>

    <!-- Excel File 1 -->
    <g transform="translate(130, 180) rotate(-12)">
      <rect width="50" height="60" rx="4" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/>
      <rect x="0" y="0" width="50" height="15" rx="3" fill="#16a34a"/>
      <text x="25" y="11" text-anchor="middle" font-size="9" font-weight="800" fill="#ffffff">XLSX</text>
      <!-- Grid -->
      <line x1="8" y1="26" x2="42" y2="26" stroke="#bbf7d0" stroke-width="1"/>
      <line x1="8" y1="38" x2="42" y2="38" stroke="#bbf7d0" stroke-width="1"/>
      <line x1="25" y1="18" x2="25" y2="52" stroke="#bbf7d0" stroke-width="1"/>
    </g>

    <!-- Yellow Note -->
    <g transform="translate(320, 150) rotate(15)">
      <rect width="50" height="50" rx="2" fill="#fef08a" stroke="#facc15" stroke-width="1"/>
      <line x1="8" y1="15" x2="42" y2="15" stroke="#ca8a04" stroke-width="1.5" stroke-linecap="round"/>
      <line x1="8" y1="25" x2="35" y2="25" stroke="#ca8a04" stroke-width="1.5" stroke-linecap="round"/>
      <line x1="8" y1="35" x2="40" y2="35" stroke="#ca8a04" stroke-width="1.5" stroke-linecap="round"/>
    </g>

    <!-- Excel File 2 -->
    <g transform="translate(350, 220) rotate(8)">
      <rect width="52" height="62" rx="4" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/>
      <rect x="0" y="0" width="52" height="15" rx="3" fill="#16a34a"/>
      <text x="26" y="11" text-anchor="middle" font-size="9" font-weight="800" fill="#ffffff">EXPENSES</text>
      <line x1="8" y1="28" x2="44" y2="28" stroke="#bbf7d0" stroke-width="1"/>
      <line x1="8" y1="42" x2="44" y2="42" stroke="#bbf7d0" stroke-width="1"/>
    </g>

    <!-- Magnifying Glass 1 -->
    <g transform="translate(195, 205)">
      <circle cx="14" cy="14" r="12" fill="none" stroke="#ea580c" stroke-width="2.5"/>
      <line x1="23" y1="23" x2="35" y2="35" stroke="#ea580c" stroke-width="3.5" stroke-linecap="round"/>
    </g>

    <!-- Magnifying Glass 2 -->
    <g transform="translate(290, 215)">
      <circle cx="14" cy="14" r="11" fill="none" stroke="#2563eb" stroke-width="2.5"/>
      <line x1="22" y1="22" x2="32" y2="32" stroke="#2563eb" stroke-width="3.5" stroke-linecap="round"/>
    </g>

    <!-- Confused User at Laptop -->
    <!-- Head -->
    <circle cx="240" cy="290" r="24" fill="#fed7aa" stroke="#ea580c" stroke-width="1.5"/>
    <!-- Hair -->
    <path d="M 218 285 Q 240 260 262 285 Q 250 270 230 272 Z" fill="#78350f"/>
    <!-- Sad Eyes & Mouth -->
    <circle cx="233" cy="288" r="2" fill="#1e293b"/>
    <circle cx="247" cy="288" r="2" fill="#1e293b"/>
    <path d="M 235 302 Q 240 297 245 302" fill="none" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round"/>
    <!-- Body -->
    <path d="M 210 350 L 210 325 Q 210 315 240 315 Q 270 315 270 325 L 270 350 Z" fill="#60a5fa"/>
    <!-- Desk & Laptop -->
    <line x1="150" y1="380" x2="330" y2="380" stroke="#cbd5e1" stroke-width="4" stroke-linecap="round"/>
    <!-- Laptop screen -->
    <polygon points="215,376 265,376 260,345 220,345" fill="#334155"/>
    <polygon points="210,380 270,380 265,376 215,376" fill="#94a3b8"/>

    <!-- Bottom Status Callout -->
    <rect x="60" y="420" width="370" height="50" rx="10" fill="#fef2f2" stroke="#fecaca" stroke-width="1.5"/>
    <text x="245" y="442" text-anchor="middle" class="status-badge" fill="#dc2626">&#10008; Disorganized &amp; Scattered</text>
    <text x="245" y="458" text-anchor="middle" class="desc-text" fill="#991b1b">Hard to search, prone to calculation errors &amp; data duplication</text>
  </g>

  <!-- ==================== RIGHT SIDE: WITH DATABASE & SQL ==================== -->
  <g id="rightSide">
    <!-- Input Streams on Top -->
    <!-- Feed 1: Users -->
    <g transform="translate(560, 95)">
      <circle cx="16" cy="16" r="14" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
      <circle cx="16" cy="12" r="4" fill="#0284c7"/>
      <path d="M 9 24 Q 16 18 23 24" fill="none" stroke="#0284c7" stroke-width="1.5"/>
      <text x="16" y="40" text-anchor="middle" font-size="10" font-weight="600" fill="#475569">Users</text>
      <path d="M 28 32 L 65 55" fill="none" stroke="#0284c7" stroke-width="1.5" stroke-dasharray="3 3" marker-end="url(#arrow)"/>
    </g>

    <!-- Feed 2: Files -->
    <g transform="translate(670, 85)">
      <rect width="32" height="38" rx="3" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/>
      <text x="16" y="24" text-anchor="middle" font-size="9" font-weight="800" fill="#16a34a">XLSX</text>
      <path d="M 16 42 L 16 65" fill="none" stroke="#16a34a" stroke-width="1.5" stroke-dasharray="3 3"/>
    </g>

    <!-- Feed 3: Sales -->
    <g transform="translate(775, 95)">
      <circle cx="16" cy="16" r="14" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
      <text x="16" y="21" text-anchor="middle" font-size="12" font-weight="900" fill="#d97706">$</text>
      <text x="16" y="40" text-anchor="middle" font-size="10" font-weight="600" fill="#475569">Sales</text>
      <path d="M 5 32 L -35 55" fill="none" stroke="#d97706" stroke-width="1.5" stroke-dasharray="3 3"/>
    </g>

    <!-- Central Database Cylinder -->
    <g transform="translate(605, 155)">
      <!-- Cylinder Body -->
      <path d="M 0 35 L 0 170 C 0 190, 160 190, 160 170 L 160 35 Z" fill="#f1f5f9" stroke="#1e40af" stroke-width="2"/>
      <!-- Lower Cylinder Curves for depth -->
      <path d="M 0 80 C 0 95, 160 95, 160 80" fill="none" stroke="#93c5fd" stroke-width="1.5"/>
      <path d="M 0 125 C 0 140, 160 140, 160 125" fill="none" stroke="#93c5fd" stroke-width="1.5"/>
      <!-- Cylinder Top Cap -->
      <ellipse cx="80" cy="35" rx="80" ry="22" fill="#3b82f6" stroke="#1e40af" stroke-width="2"/>
      <ellipse cx="80" cy="35" rx="72" ry="18" fill="#60a5fa"/>
      
      <!-- Label on Cylinder Top -->
      <text x="80" y="39" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-weight="900" font-size="13" fill="#ffffff" letter-spacing="1">DATABASE</text>

      <!-- Tables Inside Database Container -->
      <!-- Table A (Top) -->
      <g transform="translate(20, 65)">
        <rect width="60" height="40" rx="3" fill="#ffffff" stroke="#2563eb" stroke-width="1.2"/>
        <rect width="60" height="12" rx="2" fill="#3b82f6"/>
        <line x1="20" y1="12" x2="20" y2="40" stroke="#bfdbfe" stroke-width="1"/>
        <line x1="40" y1="12" x2="40" y2="40" stroke="#bfdbfe" stroke-width="1"/>
        <line x1="0" y1="26" x2="60" y2="26" stroke="#bfdbfe" stroke-width="1"/>
      </g>

      <!-- Table B (Right) -->
      <g transform="translate(95, 80)">
        <rect width="45" height="42" rx="3" fill="#ffffff" stroke="#059669" stroke-width="1.2"/>
        <rect width="45" height="12" rx="2" fill="#10b981"/>
        <line x1="15" y1="12" x2="15" y2="42" stroke="#a7f3d0" stroke-width="1"/>
        <line x1="30" y1="12" x2="30" y2="42" stroke="#a7f3d0" stroke-width="1"/>
        <line x1="0" y1="27" x2="45" y2="27" stroke="#a7f3d0" stroke-width="1"/>
      </g>

      <!-- Table C (Bottom) -->
      <g transform="translate(35, 125)">
        <rect width="65" height="38" rx="3" fill="#ffffff" stroke="#d97706" stroke-width="1.2"/>
        <rect width="65" height="12" rx="2" fill="#f59e0b"/>
        <line x1="22" y1="12" x2="22" y2="38" stroke="#fde68a" stroke-width="1"/>
        <line x1="44" y1="12" x2="44" y2="38" stroke="#fde68a" stroke-width="1"/>
        <line x1="0" y1="25" x2="65" y2="25" stroke="#fde68a" stroke-width="1"/>
      </g>

      <!-- Connecting Relationship Lines between tables -->
      <path d="M 80 85 L 95 95" fill="none" stroke="#dc2626" stroke-width="1.8"/>
      <circle cx="80" cy="85" r="2" fill="#dc2626"/>
      <circle cx="95" cy="95" r="2" fill="#dc2626"/>

      <path d="M 50 105 L 50 125" fill="none" stroke="#dc2626" stroke-width="1.8"/>
      <circle cx="50" cy="105" r="2" fill="#dc2626"/>
      <circle cx="50" cy="125" r="2" fill="#dc2626"/>
    </g>

    <!-- Instant Result Bubble (30M) -->
    <g transform="translate(805, 230)">
      <rect width="80" height="46" rx="23" fill="url(#bubbleGrad)" filter="url(#cardShadow)"/>
      <text x="40" y="31" text-anchor="middle" class="stat-text">30M</text>
      <!-- Arrow from DB -->
      <path d="M -30 23 L -5 23" fill="none" stroke="#10b981" stroke-width="3" stroke-linecap="round"/>
      <polygon points="-5,17 3,23 -5,29" fill="#10b981"/>
    </g>

    <!-- User Asking Question -->
    <!-- Happy User -->
    <circle cx="880" cy="340" r="22" fill="#fed7aa" stroke="#0284c7" stroke-width="1.5"/>
    <path d="M 860 335 Q 880 315 900 335 Q 890 322 870 325 Z" fill="#1e293b"/>
    <!-- Smiling face -->
    <circle cx="873" cy="338" r="2" fill="#1e293b"/>
    <circle cx="887" cy="338" r="2" fill="#1e293b"/>
    <path d="M 875 348 Q 880 353 885 348" fill="none" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round"/>
    <!-- Body -->
    <path d="M 855 390 L 855 372 Q 855 362 880 362 Q 905 362 905 372 L 905 390 Z" fill="#10b981"/>

    <!-- User Question Bubble -->
    <rect x="735" y="340" width="105" height="34" rx="17" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/>
    <text x="787" y="362" text-anchor="middle" font-size="11" font-weight="700" fill="#1e293b">Total Spending?</text>

    <!-- SQL Engine Cloud / Bubble -->
    <g transform="translate(565, 335)">
      <!-- Cloud/Speech bubble -->
      <rect width="145" height="55" rx="27" fill="#ffffff" stroke="#2563eb" stroke-width="2" filter="url(#cardShadow)"/>
      <text x="72" y="27" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-weight="900" font-size="18" fill="#2563eb" letter-spacing="1">SQL</text>
      <text x="72" y="44" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-weight="600" font-size="9" fill="#64748b">Structured Query Language</text>
      <!-- Query Arrow pointing up to Database -->
      <path d="M 72 0 L 72 -30" fill="none" stroke="#2563eb" stroke-width="2.5" stroke-linecap="round"/>
      <polygon points="66,-30 72,-40 78,-30" fill="#2563eb"/>
    </g>

    <!-- Bottom Status Callout -->
    <rect x="560" y="420" width="370" height="50" rx="10" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.5"/>
    <text x="745" y="442" text-anchor="middle" class="status-badge" fill="#16a34a">&#10004; Organized, Centralized &amp; Instant</text>
    <text x="745" y="458" text-anchor="middle" class="desc-text" fill="#15803d">Tables with relationships allow SQL to retrieve 30M records in milliseconds</text>
  </g>
</svg>
