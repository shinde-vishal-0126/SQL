<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700">
    <!-- Background -->
    <rect width="1000" height="700" fill="#1E1E1E" rx="10"/>

    <!-- Left Arrow (Abstraction Level) -->
    <path d="M 80 620 L 80 120" stroke="#FFF" stroke-width="20" fill="none" marker-end="url(#arrow_big_white)"/>
    <text x="80" y="80" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#FF8C00" text-anchor="middle">HIGH</text>
    <text x="80" y="660" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#4EC9B0" text-anchor="middle">LOW</text>
    <text x="60" y="380" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#F44747" transform="rotate(-90 60,380)" text-anchor="middle" letter-spacing="4">ABSTRACTION</text>

    <!-- Horizontal Separators -->
    <path d="M 150 250 L 950 250" stroke="#555" stroke-width="2" stroke-dasharray="10,5"/>
    <path d="M 150 480 L 950 480" stroke="#555" stroke-width="2" stroke-dasharray="10,5"/>

    <!-- LAYER 1: VIEW LAYER (External) -->
    <rect x="750" y="80" width="200" height="150" fill="none"/>
    <text x="850" y="130" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#FFF" text-anchor="middle">VIEW</text>
    <text x="850" y="160" font-family="Arial, sans-serif" font-size="18" fill="#FFF" text-anchor="middle">LAYER</text>
    <text x="850" y="190" font-family="Arial, sans-serif" font-size="16" fill="#888" text-anchor="middle">(EXTERNAL)</text>

    <!-- Users -->
    <text x="250" y="110" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#4EC9B0" text-anchor="middle">Business</text>
    <text x="250" y="130" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#4EC9B0" text-anchor="middle">Analysts</text>
    <circle cx="330" cy="110" r="10" fill="#FFF"/>
    <circle cx="360" cy="110" r="10" fill="#F44747"/>
    <circle cx="390" cy="110" r="10" fill="#FFF"/>

    <rect x="470" y="90" width="60" height="40" fill="none" stroke="#FFD700" stroke-width="3"/>
    <rect x="480" y="100" width="10" height="30" fill="#FFD700"/>
    <rect x="495" y="110" width="10" height="20" fill="#4EC9B0"/>
    <rect x="510" y="105" width="10" height="25" fill="#4FC1FF"/>
    <text x="500" y="75" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#FFF" text-anchor="middle">Power BI</text>

    <circle cx="630" cy="110" r="10" fill="#FFF"/>
    <circle cx="660" cy="110" r="10" fill="#F44747"/>
    <circle cx="690" cy="110" r="10" fill="#FFF"/>
    <text x="730" y="110" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#4EC9B0" text-anchor="middle">END</text>
    <text x="730" y="130" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#4EC9B0" text-anchor="middle">USERS</text>

    <!-- Views -->
    <rect x="280" y="180" width="120" height="40" fill="#FFF" stroke="#4EC9B0" stroke-width="3"/>
    <text x="340" y="207" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#000" text-anchor="middle">VIEW 1</text>
    <path d="M 340 220 L 440 310" stroke="#555" stroke-width="5" marker-end="url(#arrow_gray)"/>

    <rect x="440" y="180" width="120" height="40" fill="#FFF" stroke="#4EC9B0" stroke-width="3"/>
    <text x="500" y="207" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#000" text-anchor="middle">VIEW 2</text>
    <path d="M 500 220 L 500 310" stroke="#555" stroke-width="5" marker-end="url(#arrow_gray)"/>
    <path d="M 500 310 L 500 220" stroke="#555" stroke-width="5" marker-end="url(#arrow_gray)"/>

    <rect x="600" y="180" width="120" height="40" fill="#FFF" stroke="#4EC9B0" stroke-width="3"/>
    <text x="660" y="207" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#000" text-anchor="middle">VIEW N</text>
    <path d="M 660 220 L 560 310" stroke="#555" stroke-width="5" marker-end="url(#arrow_gray)"/>


    <!-- LAYER 2: LOGICAL LAYER (Conceptual) -->
    <rect x="750" y="300" width="200" height="150" fill="none"/>
    <text x="850" y="340" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#FFF" text-anchor="middle">LOGICAL</text>
    <text x="850" y="370" font-family="Arial, sans-serif" font-size="18" fill="#FFF" text-anchor="middle">LAYER</text>
    <text x="850" y="400" font-family="Arial, sans-serif" font-size="16" fill="#888" text-anchor="middle">(CONCEPTUAL)</text>

    <text x="220" y="320" font-family="Arial, sans-serif" font-size="16" fill="#FFF">TABLES</text>
    <text x="220" y="345" font-family="Arial, sans-serif" font-size="16" fill="#FFF">RELATIONSHIPS</text>
    <text x="220" y="370" font-family="Arial, sans-serif" font-size="16" fill="#FFF">VIEWS</text>
    <text x="220" y="395" font-family="Arial, sans-serif" font-size="16" fill="#FFF">INDEXES</text>
    <text x="220" y="420" font-family="Arial, sans-serif" font-size="16" fill="#FFF">PROCEDURES</text>
    <text x="220" y="445" font-family="Arial, sans-serif" font-size="16" fill="#FFF">FUNCTIONS</text>

    <!-- Logical Level Box -->
    <rect x="420" y="310" width="160" height="70" fill="#FFF" stroke="#FFD700" stroke-width="4" rx="5"/>
    <text x="500" y="345" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#000" text-anchor="middle">LOGICAL</text>
    <text x="500" y="365" font-family="Arial, sans-serif" font-size="16" fill="#000" text-anchor="middle">LEVEL</text>

    <!-- App Developer -->
    <circle cx="680" cy="310" r="15" fill="#FFD700"/>
    <path d="M 665 340 Q 680 320 695 340 L 690 370 L 670 370 Z" fill="#FFF"/>
    <text x="680" y="390" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#4EC9B0" text-anchor="middle">APP Developer</text>
    <text x="680" y="410" font-family="Arial, sans-serif" font-size="14" fill="#888" text-anchor="middle">(Data Engineer)</text>

    <!-- Interaction Arrow -->
    <path d="M 500 380 L 500 490" stroke="#555" stroke-width="6" marker-start="url(#arrow_gray_rev)" marker-end="url(#arrow_gray)"/>


    <!-- LAYER 3: PHYSICAL LAYER (Internal) -->
    <rect x="750" y="520" width="200" height="150" fill="none"/>
    <text x="850" y="560" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#FFF" text-anchor="middle">PHYSICAL</text>
    <text x="850" y="590" font-family="Arial, sans-serif" font-size="18" fill="#FFF" text-anchor="middle">LAYER</text>
    <text x="850" y="620" font-family="Arial, sans-serif" font-size="16" fill="#888" text-anchor="middle">(INTERNAL)</text>

    <text x="220" y="530" font-family="Arial, sans-serif" font-size="16" fill="#FFF">DATA FILES</text>
    <text x="220" y="560" font-family="Arial, sans-serif" font-size="16" fill="#FFF">PARTITIONS</text>
    <text x="220" y="590" font-family="Arial, sans-serif" font-size="16" fill="#FFF">LOGS</text>
    <text x="220" y="620" font-family="Arial, sans-serif" font-size="16" fill="#FFF">CATALOG</text>
    <text x="220" y="650" font-family="Arial, sans-serif" font-size="16" fill="#FFF">BLOCKS</text>
    <text x="220" y="680" font-family="Arial, sans-serif" font-size="16" fill="#FFF">CACHES</text>

    <!-- Physical Level Box -->
    <rect x="420" y="500" width="160" height="70" fill="#FFF" stroke="#FF8C00" stroke-width="4" rx="5"/>
    <text x="500" y="535" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#000" text-anchor="middle">PHYSICAL</text>
    <text x="500" y="555" font-family="Arial, sans-serif" font-size="16" fill="#000" text-anchor="middle">LEVEL</text>

    <path d="M 500 570 L 500 630" stroke="#555" stroke-width="6" marker-start="url(#arrow_gray_rev)" marker-end="url(#arrow_gray)"/>

    <!-- DB Cylinder -->
    <path d="M 460 640 C 460 630 540 630 540 640 L 540 680 C 540 690 460 690 460 680 Z" fill="#FFF" stroke="#000" stroke-width="3"/>
    <path d="M 460 640 C 460 650 540 650 540 640" fill="none" stroke="#000" stroke-width="3"/>
    <path d="M 460 660 C 460 670 540 670 540 660" fill="none" stroke="#000" stroke-width="3"/>
    <text x="560" y="665" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#FFF">DB</text>

    <!-- DBA -->
    <circle cx="680" cy="500" r="15" fill="#FF8C00"/>
    <path d="M 665 530 Q 680 510 695 530 L 690 560 L 670 560 Z" fill="#FFF"/>
    <text x="680" y="580" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#F44747" text-anchor="middle">DBA</text>


    <!-- Defs for Markers -->
    <defs>
        <marker id="arrow_big_white" markerWidth="6" markerHeight="6" refX="2" refY="3" orient="auto-start-reverse">
            <path d="M 0 0 L 6 3 L 0 6 Z" fill="#FFF"/>
        </marker>
        <marker id="arrow_gray" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse">
            <path d="M 0 0 L 10 5 L 0 10 Z" fill="#555"/>
        </marker>
        <marker id="arrow_gray_rev" markerWidth="10" markerHeight="10" refX="2" refY="5" orient="auto-start-reverse">
            <path d="M 10 0 L 0 5 L 10 10 Z" fill="#555"/>
        </marker>
    </defs>
</svg>
