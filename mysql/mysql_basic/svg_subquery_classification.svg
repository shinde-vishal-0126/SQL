<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
    <rect width="800" height="400" fill="#eeeeee" rx="10"/>
    <text x="400" y="30" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#575724" text-anchor="middle">Subquery Classification</text>
    
    <!-- 1. Result Types -->
    <rect x="50" y="70" width="300" height="130" fill="#e8e8e9" stroke="#0072b0" stroke-width="2"/>
    <rect x="125" y="80" width="150" height="30" fill="#eeeeee" stroke="#0072b0" stroke-width="2"/>
    <text x="200" y="100" font-family="Arial" font-size="14" font-weight="bold" fill="#1f1f1f" text-anchor="middle">1. By Result Type</text>
    
    <rect x="60" y="140" width="80" height="40" fill="#eeeeee" stroke="#5f5f5f" stroke-width="2"/>
    <text x="100" y="165" font-family="Arial" font-size="12" fill="#1f1f1f" text-anchor="middle">Scalar</text>
    
    <rect x="160" y="140" width="80" height="40" fill="#eeeeee" stroke="#5f5f5f" stroke-width="2"/>
    <text x="200" y="165" font-family="Arial" font-size="12" fill="#1f1f1f" text-anchor="middle">Row</text>
    
    <rect x="260" y="140" width="80" height="40" fill="#eeeeee" stroke="#5f5f5f" stroke-width="2"/>
    <text x="300" y="165" font-family="Arial" font-size="12" fill="#1f1f1f" text-anchor="middle">Table</text>
    
    <path d="M 200 110 L 200 130" stroke="#0072b0" stroke-width="2"/>
    <path d="M 100 130 L 300 130" stroke="#0072b0" stroke-width="2"/>
    <path d="M 100 130 L 100 140" stroke="#0072b0" stroke-width="2"/>
    <path d="M 300 130 L 300 140" stroke="#0072b0" stroke-width="2"/>

    <!-- 2. Dependency -->
    <rect x="450" y="70" width="300" height="130" fill="#e8e8e9" stroke="#267d6b" stroke-width="2"/>
    <rect x="525" y="80" width="150" height="30" fill="#eeeeee" stroke="#267d6b" stroke-width="2"/>
    <text x="600" y="100" font-family="Arial" font-size="14" font-weight="bold" fill="#1f1f1f" text-anchor="middle">2. By Dependency</text>
    
    <rect x="470" y="140" width="120" height="40" fill="#eeeeee" stroke="#5f5f5f" stroke-width="2"/>
    <text x="530" y="165" font-family="Arial" font-size="12" fill="#1f1f1f" text-anchor="middle">Non-Correlated</text>
    
    <rect x="610" y="140" width="120" height="40" fill="#eeeeee" stroke="#5f5f5f" stroke-width="2"/>
    <text x="670" y="165" font-family="Arial" font-size="12" fill="#1f1f1f" text-anchor="middle">Correlated</text>
    
    <path d="M 600 110 L 600 130" stroke="#267d6b" stroke-width="2"/>
    <path d="M 530 130 L 670 130" stroke="#267d6b" stroke-width="2"/>
    <path d="M 530 130 L 530 140" stroke="#267d6b" stroke-width="2"/>
    <path d="M 670 130 L 670 140" stroke="#267d6b" stroke-width="2"/>

    <!-- 3. Location / Clauses -->
    <rect x="150" y="220" width="500" height="160" fill="#e8e8e9" stroke="#793a74" stroke-width="2"/>
    <rect x="325" y="230" width="150" height="30" fill="#eeeeee" stroke="#793a74" stroke-width="2"/>
    <text x="400" y="250" font-family="Arial" font-size="14" font-weight="bold" fill="#1f1f1f" text-anchor="middle">3. By Location (Clause)</text>
    
    <rect x="180" y="290" width="80" height="30" fill="#eeeeee" stroke="#5f5f5f" stroke-width="2"/>
    <text x="220" y="310" font-family="Arial" font-size="12" fill="#1f1f1f" text-anchor="middle">SELECT</text>
    
    <rect x="280" y="290" width="80" height="30" fill="#eeeeee" stroke="#5f5f5f" stroke-width="2"/>
    <text x="320" y="310" font-family="Arial" font-size="12" fill="#1f1f1f" text-anchor="middle">FROM</text>
    
    <rect x="380" y="290" width="80" height="30" fill="#eeeeee" stroke="#5f5f5f" stroke-width="2"/>
    <text x="420" y="310" font-family="Arial" font-size="12" fill="#1f1f1f" text-anchor="middle">JOIN</text>
    
    <rect x="480" y="290" width="150" height="70" fill="#eeeeee" stroke="#5f5f5f" stroke-width="2"/>
    <text x="555" y="310" font-family="Arial" font-size="12" font-weight="bold" fill="#1f1f1f" text-anchor="middle">WHERE</text>
    <text x="555" y="330" font-family="Arial" font-size="10" fill="#5f5f5f" text-anchor="middle">Comparison (=, &gt;, &lt;)</text>
    <text x="555" y="345" font-family="Arial" font-size="10" fill="#5f5f5f" text-anchor="middle">Logical (IN, ANY, EXISTS)</text>
    
    <path d="M 400 260 L 400 280" stroke="#793a74" stroke-width="2"/>
    <path d="M 220 280 L 555 280" stroke="#793a74" stroke-width="2"/>
    <path d="M 220 280 L 220 290" stroke="#793a74" stroke-width="2"/>
    <path d="M 320 280 L 320 290" stroke="#793a74" stroke-width="2"/>
    <path d="M 420 280 L 420 290" stroke="#793a74" stroke-width="2"/>
    <path d="M 555 280 L 555 290" stroke="#793a74" stroke-width="2"/>
</svg>
