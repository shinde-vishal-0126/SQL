<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 350">
    <rect width="800" height="350" fill="#1E1E1E" rx="10"/>
    
    <!-- Title -->
    <rect x="300" y="20" width="200" height="40" fill="#DCDCAA" rx="5"/>
    <text x="400" y="45" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#000000" text-anchor="middle">Index Syntax</text>
    
    <!-- Syntax Box -->
    <rect x="50" y="100" width="700" height="70" fill="#2D2D30" stroke="#3E3E42" stroke-width="2" rx="5"/>
    <text x="70" y="130" font-family="Courier New, monospace" font-size="16" fill="#4FC1FF" font-weight="bold">CREATE <tspan fill="#E0E0E0">[UNIQUE]</tspan> [CLUSTERED | NONCLUSTERED] [COLUMNSTORE] INDEX index_name</text>
    <text x="145" y="155" font-family="Courier New, monospace" font-size="16" fill="#4FC1FF" font-weight="bold">ON <tspan fill="#E0E0E0">table_name (column1, column2, ...)</tspan></text>
    
    <!-- Default Pointer -->
    <path d="M 270 70 L 270 95" fill="none" stroke="#F44747" stroke-width="2" stroke-dasharray="4,4" marker-end="url(#arrow-red)"/>
    <text x="270" y="55" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#E0E0E0" text-anchor="middle">Default is</text>
    <text x="270" y="70" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#F44747" text-anchor="middle">NOT Unique</text>
    
    <!-- Duplicate Examples -->
    <text x="50" y="210" font-family="Arial, sans-serif" font-size="14" fill="#A0A0A0">Index Allows Duplicates:</text>
    <path d="M 210 205 L 240 205" fill="none" stroke="#F44747" stroke-width="2" marker-end="url(#arrow-red)"/>
    <text x="250" y="210" font-family="Courier New, monospace" font-size="16" fill="#4FC1FF" font-weight="bold">CREATE INDEX <tspan fill="#E0E0E0">IX_Customers_Email</tspan> ON <tspan fill="#E0E0E0">Customers (Email)</tspan></text>
    
    <text x="50" y="270" font-family="Arial, sans-serif" font-size="14" fill="#A0A0A0">Duplicates are not allowed:</text>
    <path d="M 230 265 L 260 265" fill="none" stroke="#F44747" stroke-width="2" marker-end="url(#arrow-red)"/>
    <text x="270" y="270" font-family="Courier New, monospace" font-size="16" fill="#4FC1FF" font-weight="bold">CREATE UNIQUE INDEX <tspan fill="#E0E0E0">IX_Customers_Email</tspan> ON <tspan fill="#E0E0E0">Customers (Email)</tspan></text>
    
    <defs>
        <marker id="arrow-red" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
            <path d="M0,0 L0,6 L9,3 z" fill="#F44747" />
        </marker>
    </defs>
</svg>
