<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650">
    <rect width="1000" height="650" fill="#eeeeee" rx="10"/>

    <!-- Labels -->
    <text x="250" y="40" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#1f1f1f" text-anchor="middle">SERVER</text>
    <text x="800" y="40" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#1f1f1f" text-anchor="middle">CLIENT</text>
    <path d="M 600 50 L 600 600" stroke="#adadad" stroke-width="2"/>

    <!-- DB Engine -->
    <rect x="520" y="80" width="40" height="500" fill="#FFF" stroke="#c7c7c7" stroke-width="3"/>
    <text x="540" y="330" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#000" text-anchor="middle" transform="rotate(-90 540,330)">DATABASE ENGINE</text>
    <!-- Gear icon -->
    <circle cx="540" cy="550" r="12" fill="none" stroke="#0072b0" stroke-width="4"/>
    <path d="M 540 532 L 540 568 M 522 550 L 558 550 M 528 538 L 552 562 M 528 562 L 552 538" stroke="#0072b0" stroke-width="3"/>


    <!-- SERVER SIDE (Left) -->
    
    <!-- Cache -->
    <rect x="100" y="80" width="350" height="60" fill="#FFF" stroke="#c7c7c7" stroke-width="3"/>
    <text x="275" y="115" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#000" text-anchor="middle">CACHE</text>
    
    <!-- Disk Area -->
    <rect x="100" y="160" width="350" height="420" fill="#F0F0F0" stroke="#c7c7c7" stroke-width="3"/>
    <text x="275" y="190" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#000" text-anchor="middle">DISK</text>
    
    <!-- Grid inside disk -->
    <path d="M 100 280 L 450 280 M 100 420 L 450 420 M 275 160 L 275 580" stroke="#333333" stroke-width="2" stroke-dasharray="10,10"/>

    <rect x="120" y="210" width="80" height="30" fill="#FFF" stroke="#c7c7c7" stroke-width="2"/>
    <text x="160" y="230" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#000" text-anchor="middle">TEMP</text>

    <rect x="230" y="210" width="100" height="30" fill="#FFF" stroke="#c7c7c7" stroke-width="2"/>
    <text x="280" y="230" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#000" text-anchor="middle">CATALOG</text>

    <rect x="350" y="210" width="80" height="30" fill="#FFF" stroke="#c7c7c7" stroke-width="2"/>
    <text x="390" y="230" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#000" text-anchor="middle">USER</text>

    <!-- Orders Table (Physical) -->
    <text x="390" y="260" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#0072b0" text-anchor="middle">ORDERS</text>
    <rect x="360" y="270" width="60" height="50" fill="#FFF" stroke="#c7c7c7" stroke-width="2"/>
    <path d="M 360 285 L 420 285 M 360 300 L 420 300 M 380 270 L 380 320 M 400 270 L 400 320" stroke="#c7c7c7" stroke-width="1"/>
    
    <!-- Metadata Orders -->
    <text x="280" y="260" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#0072b0" text-anchor="middle">ORDERS</text>
    <rect x="250" y="270" width="60" height="30" fill="#FFF" stroke="#c7c7c7" stroke-width="2"/>
    <text x="280" y="290" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#0072b0" text-anchor="middle">META</text>

    <!-- View TOPN (Virtual) in Catalog -->
    <text x="230" y="340" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#0072b0" text-anchor="middle">TOPN (View)</text>
    <rect x="200" y="350" width="60" height="30" fill="#FFF" stroke="#c7c7c7" stroke-width="2"/>
    <text x="230" y="370" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#0072b0" text-anchor="middle">META</text>

    <rect x="280" y="350" width="60" height="50" fill="#FFF" stroke="#0072b0" stroke-width="2"/>
    <text x="310" y="365" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#0072b0" text-anchor="middle">SELECT</text>
    <text x="310" y="375" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#0072b0" text-anchor="middle">FROM</text>
    <text x="310" y="385" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#0072b0" text-anchor="middle">WHERE</text>


    <!-- CLIENT SIDE (Right) -->
    
    <!-- Data Engineer -->
    <rect x="650" y="100" width="100" height="80" fill="#FFF" stroke="#c7c7c7" stroke-width="3"/>
    <text x="700" y="115" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#000" text-anchor="middle">Query</text>
    <text x="700" y="140" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#000" text-anchor="middle">CREATE</text>
    <text x="700" y="155" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#000" text-anchor="middle">VIEW</text>
    <text x="700" y="170" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#000" text-anchor="middle">TOPN</text>

    <rect x="800" y="130" width="100" height="60" fill="#FFF" stroke="#c7c7c7" stroke-width="2"/>
    <rect x="790" y="190" width="120" height="10" fill="#FFF" stroke="#c7c7c7" stroke-width="2"/>
    <text x="850" y="220" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#1f1f1f" text-anchor="middle">DATA ENGINEER</text>

    <!-- Execution path 1: Create View -->
    <path d="M 650 140 L 560 140" stroke="#0072b0" stroke-width="3" marker-end="url(#arrow_blue)"/>
    <path d="M 520 140 L 460 210" stroke="#0072b0" stroke-width="3" marker-end="url(#arrow_blue)"/>

    
    <!-- Data Analyst -->
    <rect x="650" y="320" width="100" height="80" fill="#FFF" stroke="#c7c7c7" stroke-width="3"/>
    <text x="700" y="335" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#000" text-anchor="middle">Query</text>
    <text x="700" y="360" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#000" text-anchor="middle">SELECT</text>
    <text x="700" y="380" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#000" text-anchor="middle">FROM TOPN</text>

    <rect x="800" y="350" width="100" height="60" fill="#FFF" stroke="#c7c7c7" stroke-width="2"/>
    <rect x="820" y="360" width="60" height="40" fill="#CCC"/>
    <text x="850" y="385" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#000" text-anchor="middle">RESULT</text>
    <rect x="790" y="410" width="120" height="10" fill="#FFF" stroke="#c7c7c7" stroke-width="2"/>
    <text x="850" y="440" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#1f1f1f" text-anchor="middle">DATA ANALYST</text>

    <!-- Execution path 2: Query View -->
    <!-- Analyst to Engine -->
    <path d="M 650 360 L 560 360" stroke="#0072b0" stroke-width="3" marker-end="url(#arrow_blue)"/>
    
    <!-- Engine to Catalog (Fetch View Query) -->
    <path d="M 520 360 L 350 375" stroke="#0072b0" stroke-width="3" marker-end="url(#arrow_blue)"/>
    
    <!-- Engine runs fetched query on Physical Table -->
    <path d="M 520 300 L 430 300" stroke="#0072b0" stroke-width="3" marker-end="url(#arrow_blue)"/>
    <text x="475" y="295" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#1f1f1f" text-anchor="middle">Query 2</text>

    <!-- Table returns data to Engine -->
    <rect x="440" y="380" width="40" height="30" fill="#FFF" stroke="#c7c7c7" stroke-width="1" transform="rotate(-20 440,380)"/>
    <path d="M 430 330 L 510 380" stroke="#a38a00" stroke-width="3" marker-end="url(#arrow_yellow)"/>
    <text x="450" y="360" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#1f1f1f" text-anchor="middle">Result</text>

    <!-- Engine returns data to Analyst -->
    <path d="M 560 380 L 640 380" stroke="#a38a00" stroke-width="3" marker-end="url(#arrow_yellow)"/>


    <defs>
        <marker id="arrow_blue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#4FC1FF" /></marker>
        <marker id="arrow_yellow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#FFD700" /></marker>
    </defs>
</svg>
