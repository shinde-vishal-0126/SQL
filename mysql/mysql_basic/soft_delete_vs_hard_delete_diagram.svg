<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1150 720" width="100%" height="100%">
  <defs>
    <!-- Shadows & Filters -->
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.09"/>
    </filter>
    <filter id="bannerShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000000" flood-opacity="0.18"/>
    </filter>

    <!-- Gradients -->
    <linearGradient id="canvasGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>

    <linearGradient id="topBanner" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>

    <linearGradient id="hardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef2f2"/>
      <stop offset="100%" stop-color="#fee2e2"/>
    </linearGradient>
    <linearGradient id="softGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0fdf4"/>
      <stop offset="100%" stop-color="#dcfce7"/>
    </linearGradient>
  </defs>

  <style>
    .title-main { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; font-weight: 900; font-size: 24px; fill: #ffffff; }
    .title-sub { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 13.5px; fill: #94a3b8; }
    .col-title { font-family: 'Segoe UI', system-ui, sans-serif; font-weight: 800; font-size: 18px; }
    .feature-lbl { font-family: 'Segoe UI', sans-serif; font-weight: 800; font-size: 11.5px; fill: #475569; }
    .feature-val { font-family: 'Segoe UI', sans-serif; font-weight: 700; font-size: 12px; }
    .code-text { font-family: 'Consolas', monospace; font-size: 11px; fill: #0f172a; font-weight: 700; }
  </style>

  <!-- Canvas Outer Background -->
  <rect x="15" y="15" width="1120" height="690" rx="16" fill="url(#canvasGrad)" stroke="#cbd5e1" stroke-width="2"/>

  <!-- Top Banner -->
  <g transform="translate(15, 15)">
    <path d="M 0 16 C 0 7, 7 0, 16 0 L 1104 0 C 1113 0, 1120 7, 1120 16 L 1120 85 L 0 85 Z" fill="url(#topBanner)" filter="url(#bannerShadow)"/>
    <text x="560" y="40" text-anchor="middle" class="title-main">HARD DELETE vs SOFT DELETE ARCHITECTURE</text>
    <text x="560" y="66" text-anchor="middle" class="title-sub">भौतिक हटवणे (Physical Removal) विरुद्ध तार्किक हटवणे (Logical Deletion Flag)</text>
  </g>

  <!-- ==================== LEFT: HARD DELETE (RED) ==================== -->
  <g transform="translate(45, 120)">
    <rect width="515" height="510" rx="12" fill="url(#hardGrad)" stroke="#fca5a5" stroke-width="1.8" filter="url(#shadow)"/>

    <!-- Header -->
    <rect x="20" y="20" width="180" height="34" rx="6" fill="#dc2626"/>
    <text x="110" y="43" text-anchor="middle" class="col-title" fill="#ffffff">🗑️ HARD DELETE</text>
    <text x="215" y="43" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="700" fill="#991b1b">(भौतिक कायमस्वरूपी हटवणे)</text>

    <!-- Table Graphic (Physical Removal) -->
    <g transform="translate(20, 70)">
      <rect width="475" height="105" rx="6" fill="#ffffff" stroke="#fca5a5" stroke-width="1"/>
      <text x="15" y="20" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="800" fill="#991b1b">📊 Physical Disk State (Data completely gone):</text>
      <!-- Rows -->
      <g transform="translate(15, 30)">
        <rect width="445" height="18" fill="#3b82f6" rx="2"/>
        <text x="222" y="13" text-anchor="middle" font-size="9" font-weight="800" fill="#ffffff">ID | NAME | COUNTRY | STATUS</text>
        <rect x="0" y="20" width="445" height="16" fill="#f8fafc" stroke="#e2e8f0"/>
        <text x="222" y="32" text-anchor="middle" font-size="8.5" fill="#334155">1 | Vishal | India | Active</text>
        <!-- Destroyed row gap -->
        <rect x="0" y="38" width="445" height="22" fill="#fee2e2" stroke="#ef4444" stroke-dasharray="4,2"/>
        <text x="222" y="53" text-anchor="middle" font-size="9.5" font-weight="900" fill="#dc2626">❌ ROW DELETED (Physical Bits Wiped from Disk Page)</text>
      </g>
    </g>

    <!-- Properties -->
    <g transform="translate(20, 190)">
      <rect width="475" height="180" rx="6" fill="#ffffff" stroke="#fca5a5" stroke-width="1"/>
      <g transform="translate(15, 20)">
        <text x="0" y="0" class="feature-lbl">1. SQL Command:</text>
        <text x="160" y="0" class="feature-val" fill="#b91c1c">DELETE FROM table WHERE ...</text>
        <text x="0" y="28" class="feature-lbl">2. Data Recovery:</text>
        <text x="160" y="28" class="feature-val" fill="#dc2626">Impossible without backup</text>
        <text x="0" y="56" class="feature-lbl">3. Storage Utilization:</text>
        <text x="160" y="56" class="feature-val" fill="#15803d">Lower (Frees disk space)</text>
        <text x="0" y="84" class="feature-lbl">4. Audit / History:</text>
        <text x="160" y="84" class="feature-val" fill="#dc2626">Historical data lost forever</text>
        <text x="0" y="112" class="feature-lbl">5. Extra Columns:</text>
        <text x="160" y="112" class="feature-val" fill="#475569">No extra schema columns needed</text>
        <text x="0" y="140" class="feature-lbl">6. Best Used For:</text>
        <text x="160" y="140" class="feature-val" fill="#b91c1c">GDPR, compliance, privacy, unneeded data</text>
      </g>
    </g>

    <!-- Code Example -->
    <g transform="translate(20, 385)">
      <rect width="475" height="55" rx="6" fill="#0f172a"/>
      <text x="15" y="22" class="code-text" fill="#f87171">DELETE FROM customers WHERE customer_id = 101;</text>
      <text x="15" y="40" font-family="'Consolas', monospace" font-size="9.5" fill="#94a3b8">-- Row is physically removed from storage</text>
    </g>

    <!-- Marathi Tip -->
    <g transform="translate(20, 450)">
      <rect width="475" height="42" rx="6" fill="#fef2f2" stroke="#fca5a5"/>
      <text x="10" y="18" font-family="'Segoe UI', sans-serif" font-size="10.5" fill="#991b1b"><tspan font-weight="800">मराठी सारांश:</tspan> डेटाबेस मधून रो कायमची नष्ट केली जाते. बॅकअपशिवाय ती कधीही पुन्हा मिळवता येत नाही.</text>
    </g>
  </g>

  <!-- ==================== RIGHT: SOFT DELETE (GREEN) ==================== -->
  <g transform="translate(590, 120)">
    <rect width="515" height="510" rx="12" fill="url(#softGrad)" stroke="#86efac" stroke-width="1.8" filter="url(#shadow)"/>

    <!-- Header -->
    <rect x="20" y="20" width="170" height="34" rx="6" fill="#16a34a"/>
    <text x="105" y="43" text-anchor="middle" class="col-title" fill="#ffffff">🛡️ SOFT DELETE</text>
    <text x="205" y="43" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="700" fill="#15803d">(तार्किक / फ्लॅग द्वारे हटवणे)</text>

    <!-- Table Graphic (Flag-based removal) -->
    <g transform="translate(20, 70)">
      <rect width="475" height="105" rx="6" fill="#ffffff" stroke="#86efac" stroke-width="1"/>
      <text x="15" y="20" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="800" fill="#15803d">📊 Logical Table State (Flag updated, data preserved):</text>
      <!-- Rows -->
      <g transform="translate(15, 30)">
        <rect width="445" height="18" fill="#16a34a" rx="2"/>
        <text x="222" y="13" text-anchor="middle" font-size="9" font-weight="800" fill="#ffffff">ID | NAME | COUNTRY | is_deleted</text>
        <rect x="0" y="20" width="445" height="16" fill="#f8fafc" stroke="#e2e8f0"/>
        <text x="222" y="32" text-anchor="middle" font-size="8.5" fill="#334155">1 | Vishal | India | 0 (Active)</text>
        <!-- Soft deleted row -->
        <rect x="0" y="38" width="445" height="22" fill="#f0fdf4" stroke="#86efac"/>
        <text x="222" y="53" text-anchor="middle" font-size="9.5" font-weight="800" fill="#15803d">✔️ 2 | Amit | India | 1 (Marked Deleted - Still on Disk!)</text>
      </g>
    </g>

    <!-- Properties -->
    <g transform="translate(20, 190)">
      <rect width="475" height="180" rx="6" fill="#ffffff" stroke="#86efac" stroke-width="1"/>
      <g transform="translate(15, 20)">
        <text x="0" y="0" class="feature-lbl">1. SQL Command:</text>
        <text x="160" y="0" class="feature-val" fill="#15803d">UPDATE table SET is_deleted = 1</text>
        <text x="0" y="28" class="feature-lbl">2. Data Recovery:</text>
        <text x="160" y="28" class="feature-val" fill="#15803d">Easy (UPDATE ... SET is_deleted = 0)</text>
        <text x="0" y="56" class="feature-lbl">3. Storage Utilization:</text>
        <text x="160" y="56" class="feature-val" fill="#d97706">Higher (All deleted rows stay in table)</text>
        <text x="0" y="84" class="feature-lbl">4. Audit / History:</text>
        <text x="160" y="84" class="feature-val" fill="#15803d">Maintains complete audit history</text>
        <text x="0" y="112" class="feature-lbl">5. Extra Columns:</text>
        <text x="160" y="112" class="feature-val" fill="#475569">Requires is_deleted, deleted_at, status</text>
        <text x="0" y="140" class="feature-lbl">6. Best Used For:</text>
        <text x="160" y="140" class="feature-val" fill="#15803d">E-commerce, banking, user accounts, audits</text>
      </g>
    </g>

    <!-- Code Example -->
    <g transform="translate(20, 385)">
      <rect width="475" height="55" rx="6" fill="#0f172a"/>
      <text x="15" y="22" class="code-text" fill="#86efac">UPDATE customers SET is_deleted = 1, deleted_at = NOW()</text>
      <text x="15" y="40" class="code-text" fill="#fde047">  WHERE customer_id = 101;</text>
    </g>

    <!-- Marathi Tip -->
    <g transform="translate(20, 450)">
      <rect width="475" height="42" rx="6" fill="#f0fdf4" stroke="#86efac"/>
      <text x="10" y="18" font-family="'Segoe UI', sans-serif" font-size="10.5" fill="#15803d"><tspan font-weight="800">मराठी सारांश:</tspan> डेटा प्रत्यक्ष हटवला जात नाही; फक्त स्टेटस फ्लॅग बदलला जातो. हवा तेव्हा पूर्ववत (Restore) करता येतो.</text>
    </g>
  </g>

  <!-- Bottom Callout -->
  <g transform="translate(45, 642)">
    <rect width="1060" height="45" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.2"/>
    <text x="20" y="28" font-family="'Segoe UI', sans-serif" font-size="11.5" fill="#f8fafc">💡 <tspan font-weight="800" fill="#38bdf8">Querying Soft Deleted Tables:</tspan> All standard SELECT queries must include <tspan font-weight="700" fill="#a7f3d0">WHERE is_deleted = 0</tspan> to exclude deleted records from view.</text>
  </g>
</svg>
