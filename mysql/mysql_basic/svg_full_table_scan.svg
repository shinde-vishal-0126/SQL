<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500">
    <rect width="900" height="500" fill="#1E1E1E"/>
    <text x="450" y="40" fill="#FFFFFF" font-family="Arial" font-size="24" font-weight="bold" text-anchor="middle">Full Table Scan (Searching for ID = 14)</text>
    <text x="450" y="70" fill="#A0A0A0" font-family="Arial" font-size="16" text-anchor="middle">Without an Index, SQL must scan every single page and row</text>

    <!-- Data Pages (Same as Heap but with Scan Path) -->
    <!-- Page 1 -->
    <rect x="50" y="120" width="180" height="250" fill="#2D2D30" stroke="#CE9178" stroke-width="2"/>
    <text x="140" y="145" fill="#A0A0A0" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle">Page 1:100</text>
    <line x1="60" y1="185" x2="220" y2="185" stroke="#CE9178" stroke-width="2" opacity="0.7"/>
    <line x1="60" y1="215" x2="220" y2="215" stroke="#CE9178" stroke-width="2" opacity="0.7"/>
    <line x1="60" y1="245" x2="220" y2="245" stroke="#CE9178" stroke-width="2" opacity="0.7"/>
    <line x1="60" y1="275" x2="220" y2="275" stroke="#CE9178" stroke-width="2" opacity="0.7"/>
    <line x1="60" y1="305" x2="220" y2="305" stroke="#CE9178" stroke-width="2" opacity="0.7"/>
    
    <!-- Page 2 -->
    <rect x="250" y="120" width="180" height="250" fill="#2D2D30" stroke="#CE9178" stroke-width="2"/>
    <text x="340" y="145" fill="#A0A0A0" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle">Page 1:101</text>
    <line x1="260" y1="185" x2="420" y2="185" stroke="#CE9178" stroke-width="2" opacity="0.7"/>
    <line x1="260" y1="215" x2="420" y2="215" stroke="#CE9178" stroke-width="2" opacity="0.7"/>
    <line x1="260" y1="245" x2="420" y2="245" stroke="#CE9178" stroke-width="2" opacity="0.7"/>
    <line x1="260" y1="275" x2="420" y2="275" stroke="#CE9178" stroke-width="2" opacity="0.7"/>
    <line x1="260" y1="305" x2="420" y2="305" stroke="#CE9178" stroke-width="2" opacity="0.7"/>

    <!-- Page 3 -->
    <rect x="450" y="120" width="180" height="250" fill="#2D2D30" stroke="#CE9178" stroke-width="2"/>
    <text x="540" y="145" fill="#A0A0A0" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle">Page 1:102</text>
    <line x1="460" y1="185" x2="620" y2="185" stroke="#CE9178" stroke-width="2" opacity="0.7"/>
    <line x1="460" y1="215" x2="620" y2="215" stroke="#CE9178" stroke-width="2" opacity="0.7"/>
    <line x1="460" y1="245" x2="620" y2="245" stroke="#CE9178" stroke-width="2" opacity="0.7"/>
    <line x1="460" y1="275" x2="620" y2="275" stroke="#CE9178" stroke-width="2" opacity="0.7"/>
    <line x1="460" y1="305" x2="620" y2="305" stroke="#CE9178" stroke-width="2" opacity="0.7"/>

    <!-- Page 4 -->
    <rect x="650" y="120" width="180" height="250" fill="#2D2D30" stroke="#4EC9B0" stroke-width="3"/>
    <text x="740" y="145" fill="#A0A0A0" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle">Page 1:103</text>
    <text x="740" y="190" fill="#DCDCAA" font-family="Arial" font-size="16" text-anchor="middle">18, Sarah</text>
    <text x="740" y="220" fill="#DCDCAA" font-family="Arial" font-size="16" text-anchor="middle">16, Emma</text>
    <text x="740" y="250" fill="#DCDCAA" font-family="Arial" font-size="16" text-anchor="middle">13, Daniel</text>
    <rect x="680" y="265" width="120" height="25" fill="#4EC9B0" fill-opacity="0.3" stroke="#4EC9B0" stroke-width="2"/>
    <text x="740" y="282" fill="#4FC1FF" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle">14, Sophia (FOUND!)</text>
    <text x="740" y="310" fill="#A0A0A0" font-family="Arial" font-size="16" text-anchor="middle">17, Brain</text>

    <!-- Sequence Arrows -->
    <path d="M 230 245 L 250 245" fill="none" stroke="#CE9178" stroke-width="3" marker-end="url(#arrow_red)"/>
    <path d="M 430 245 L 450 245" fill="none" stroke="#CE9178" stroke-width="3" marker-end="url(#arrow_red)"/>
    <path d="M 630 245 L 650 245" fill="none" stroke="#CE9178" stroke-width="3" marker-end="url(#arrow_red)"/>

    <rect x="250" y="400" width="400" height="60" rx="10" fill="#3D3D40" stroke="#CE9178" stroke-width="2"/>
    <text x="450" y="435" fill="#CE9178" font-family="Arial" font-size="20" font-weight="bold" text-anchor="middle">SQL had to scan 4 pages and 19 rows!</text>

    <defs>
        <marker id="arrow_red" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
            <path d="M 0 0 L 10 5 L 0 10 z" fill="#CE9178"/>
        </marker>
    </defs>
</svg>
