<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 250">
    <rect width="600" height="250" fill="#1E1E1E" rx="10"/>
    <text x="300" y="40" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#4FC1FF" text-anchor="middle">CAST() &amp; CONVERT()</text>
    <text x="300" y="65" font-family="Arial" font-size="14" fill="#A0A0A0" text-anchor="middle">Changing the data type from one to another</text>
    
    <!-- String to Int -->
    <text x="120" y="110" font-family="Courier New" font-size="16" fill="#DCDCAA" text-anchor="middle">String</text>
    <text x="200" y="110" font-family="Courier New" font-size="18" fill="#E0E0E0" text-anchor="middle">'123'</text>
    
    <path d="M 250 105 L 350 105" fill="none" stroke="#F44747" stroke-width="4" marker-end="url(#arrow_red)"/>
    
    <text x="400" y="110" font-family="Courier New" font-size="18" font-weight="bold" fill="#E0E0E0" text-anchor="middle">123</text>
    <text x="480" y="110" font-family="Courier New" font-size="16" fill="#4EC9B0" text-anchor="middle">Number</text>

    <!-- Date to String -->
    <text x="120" y="160" font-family="Courier New" font-size="16" fill="#4EC9B0" text-anchor="middle">Date</text>
    <text x="200" y="160" font-family="Courier New" font-size="18" fill="#E0E0E0" text-anchor="middle">2025-08-20</text>
    
    <path d="M 250 155 L 350 155" fill="none" stroke="#F44747" stroke-width="4" marker-end="url(#arrow_red)"/>
    
    <text x="420" y="160" font-family="Courier New" font-size="18" font-weight="bold" fill="#E0E0E0" text-anchor="middle">'2025-08-20'</text>
    <text x="520" y="160" font-family="Courier New" font-size="16" fill="#DCDCAA" text-anchor="middle">String</text>
    
    <text x="300" y="220" font-family="Courier New" font-size="16" fill="#4FC1FF" text-anchor="middle">CAST(value AS target_type)</text>

    <!-- Def -->
    <defs>
        <marker id="arrow_red" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
            <path d="M0,0 L0,6 L9,3 z" fill="#F44747" />
        </marker>
    </defs>
</svg>