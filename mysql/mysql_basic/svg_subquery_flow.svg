<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
    <rect width="800" height="400" fill="#1E1E1E" rx="10"/>
    <text x="400" y="30" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#DCDCAA" text-anchor="middle">How Subqueries Work</text>

    <!-- DB Table -->
    <rect x="50" y="150" width="120" height="100" fill="#2D2D30" stroke="#4FC1FF" stroke-width="2"/>
    <text x="110" y="140" font-family="Arial" font-size="14" font-weight="bold" fill="#E0E0E0" text-anchor="middle">DB TABLES</text>
    <rect x="50" y="150" width="120" height="25" fill="#4FC1FF"/>
    <text x="110" y="167" font-family="Arial" font-size="14" font-weight="bold" fill="#1E1E1E" text-anchor="middle">ORDERS</text>

    <!-- Main Query Block -->
    <rect x="400" y="60" width="250" height="320" fill="#2D2D30" stroke="#A0A0A0" stroke-width="2"/>
    <text x="525" y="50" font-family="Arial" font-size="16" font-weight="bold" fill="#E0E0E0" text-anchor="middle">QUERY</text>
    <text x="420" y="90" font-family="Arial" font-size="12" font-weight="bold" fill="#DCDCAA">MAIN Query</text>
    
    <text x="430" y="120" font-family="Arial" font-size="16" font-weight="bold" fill="#4FC1FF">SELECT ...</text>
    <text x="430" y="150" font-family="Arial" font-size="16" font-weight="bold" fill="#4FC1FF">FROM ...</text>
    <text x="430" y="180" font-family="Arial" font-size="16" font-weight="bold" fill="#4FC1FF">WHERE ...</text>

    <!-- Subquery Block inside Main -->
    <rect x="450" y="250" width="180" height="100" fill="#1E1E1E" stroke="#4EC9B0" stroke-width="2"/>
    <text x="460" y="240" font-family="Arial" font-size="12" font-weight="bold" fill="#4EC9B0">SubQuery (Inner)</text>
    <text x="470" y="280" font-family="Arial" font-size="14" font-weight="bold" fill="#4EC9B0">SELECT ...</text>
    <text x="470" y="310" font-family="Arial" font-size="14" font-weight="bold" fill="#4EC9B0">FROM ...</text>
    <text x="470" y="340" font-family="Arial" font-size="14" font-weight="bold" fill="#4EC9B0">WHERE ...</text>

    <!-- Intermediate Result -->
    <rect x="580" y="180" width="60" height="50" fill="#1E1E1E" stroke="#C586C0" stroke-width="2"/>
    <text x="610" y="245" font-family="Arial" font-size="12" font-weight="bold" fill="#C586C0" text-anchor="middle">Intermediate</text>
    
    <!-- Arrows -->
    <!-- Table to Subquery -->
    <path d="M 170 200 Q 250 300 440 300" fill="none" stroke="#F44747" stroke-width="2"/>
    <polygon points="440,300 430,295 430,305" fill="#F44747"/>
    
    <!-- Subquery to Result -->
    <path d="M 540 250 Q 560 215 580 205" fill="none" stroke="#C586C0" stroke-width="2"/>
    <polygon points="580,205 570,200 575,212" fill="#C586C0"/>
    
    <!-- Result to Main Query -->
    <path d="M 610 180 Q 560 140 520 180" fill="none" stroke="#C586C0" stroke-width="2"/>
    <polygon points="520,180 528,172 530,185" fill="#C586C0"/>

    <!-- Main Query to Table (Original DB) -->
    <path d="M 400 160 Q 250 150 170 160" fill="none" stroke="#F44747" stroke-width="2"/>
    <polygon points="170,160 180,155 180,165" fill="#F44747"/>

    <!-- Final Result -->
    <rect x="700" y="150" width="60" height="60" fill="#2D2D30" stroke="#4EC9B0" stroke-width="2"/>
    <text x="730" y="140" font-family="Arial" font-size="12" font-weight="bold" fill="#E0E0E0" text-anchor="middle">FINAL RESULT</text>
    <path d="M 650 180 L 690 180" stroke="#F44747" stroke-width="2"/>
    <polygon points="690,180 680,175 680,185" fill="#F44747"/>
</svg>
