<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 250">
    <rect width="600" height="250" fill="#1E1E1E" rx="10"/>
    <text x="300" y="30" font-family="Arial" font-size="18" font-weight="bold" fill="#DCDCAA" text-anchor="middle">Aggregation Functions Overview</text>
    <text x="300" y="55" font-family="Arial" font-size="14" fill="#E0E0E0" text-anchor="middle">Accept multiple rows -> Return a SINGLE summarized value.</text>
    
    <rect x="50" y="80" width="100" height="30" fill="#2D2D30" stroke="#4FC1FF" stroke-width="2"/>
    <text x="100" y="100" font-family="Courier New" font-size="14" font-weight="bold" fill="#E0E0E0" text-anchor="middle">COUNT()</text>
    
    <rect x="250" y="80" width="100" height="30" fill="#2D2D30" stroke="#4EC9B0" stroke-width="2"/>
    <text x="300" y="100" font-family="Courier New" font-size="14" font-weight="bold" fill="#E0E0E0" text-anchor="middle">SUM()</text>

    <rect x="450" y="80" width="100" height="30" fill="#2D2D30" stroke="#C586C0" stroke-width="2"/>
    <text x="500" y="100" font-family="Courier New" font-size="14" font-weight="bold" fill="#E0E0E0" text-anchor="middle">AVG()</text>

    <rect x="50" y="140" width="100" height="30" fill="#2D2D30" stroke="#DCDCAA" stroke-width="2"/>
    <text x="100" y="160" font-family="Courier New" font-size="14" font-weight="bold" fill="#E0E0E0" text-anchor="middle">MIN()</text>

    <rect x="250" y="140" width="100" height="30" fill="#2D2D30" stroke="#F44747" stroke-width="2"/>
    <text x="300" y="160" font-family="Courier New" font-size="14" font-weight="bold" fill="#E0E0E0" text-anchor="middle">MAX()</text>

    <rect x="420" y="140" width="160" height="30" fill="#2D2D30" stroke="#A0A0A0" stroke-width="2"/>
    <text x="500" y="160" font-family="Courier New" font-size="14" font-weight="bold" fill="#E0E0E0" text-anchor="middle">GROUP_CONCAT()</text>
</svg>