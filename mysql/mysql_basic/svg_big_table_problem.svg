<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
    <rect width="800" height="400" fill="#eeeeee" rx="10"/>
    <text x="400" y="30" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#575724" text-anchor="middle">The Problem: Big Tables &amp; Big Indexes</text>
    
    <!-- Big Table -->
    <text x="400" y="80" font-family="Arial" font-size="18" font-weight="bold" fill="#0072b0" text-anchor="middle">BIG TABLE (100M+ Rows)</text>
    <rect x="250" y="100" width="300" height="200" fill="#e8e8e9" stroke="#5f5f5f" stroke-width="2"/>
    <!-- Grid -->
    <path d="M 250 150 L 550 150 M 250 200 L 550 200 M 250 250 L 550 250" stroke="#5f5f5f" stroke-width="1"/>
    <path d="M 350 100 L 350 300 M 450 100 L 450 300" stroke="#5f5f5f" stroke-width="1"/>
    
    <!-- Full Scan Arrow -->
    <path d="M 600 100 L 600 280" stroke="#b80b0b" stroke-width="6"/>
    <polygon points="590,280 610,280 600,300" fill="#F44747"/>
    <text x="600" y="320" font-family="Arial" font-size="14" font-weight="bold" fill="#b80b0b" text-anchor="middle">FULL SCAN</text>
    <text x="600" y="340" font-family="Arial" font-size="12" fill="#b80b0b" text-anchor="middle">(Extremely Slow)</text>
    
    <!-- Big Index -->
    <text x="120" y="80" font-family="Arial" font-size="16" font-weight="bold" fill="#793a74" text-anchor="middle">BIG INDEX</text>
    <circle cx="120" cy="120" r="10" fill="#C586C0"/>
    <path d="M 120 130 L 70 170 M 120 130 L 170 170" stroke="#793a74" stroke-width="2"/>
    <circle cx="70" cy="170" r="10" fill="#C586C0"/>
    <circle cx="170" cy="170" r="10" fill="#C586C0"/>
    <!-- Arrows to table -->
    <path d="M 190 120 Q 220 120 240 150" stroke="#267d6b" stroke-width="2" fill="none"/>
    <polygon points="235,145 245,155 245,145" fill="#4EC9B0"/>
    <text x="160" y="140" font-family="Arial" font-size="12" fill="#267d6b" text-anchor="middle">Insert/Update</text>
    <text x="120" y="210" font-family="Arial" font-size="12" fill="#267d6b" text-anchor="middle">Slow to maintain when writing!</text>
</svg>
