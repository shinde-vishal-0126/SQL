<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker>
    <marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker>
    <marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker>
  </defs>
  <rect width="1000" height="520" fill="#f8fafc" rx="12"/>
  <text x="500" y="38" text-anchor="middle" font-size="24" font-weight="800" fill="#0f172a">Procedure Parameters: IN · OUT · INOUT</text>
  <text x="500" y="62" text-anchor="middle" font-size="13" fill="#64748b">How a value travels between the caller (CALL) and the procedure</text>

  <!-- column headers -->
  <text x="160" y="100" text-anchor="middle" font-size="14" font-weight="800" fill="#334155">CALLER</text>
  <text x="500" y="100" text-anchor="middle" font-size="14" font-weight="800" fill="#334155">DIRECTION</text>
  <text x="840" y="100" text-anchor="middle" font-size="14" font-weight="800" fill="#334155">PROCEDURE</text>

  <!-- IN -->
  <rect x="20" y="115" width="960" height="110" rx="10" fill="#eff6ff" stroke="#93c5fd"/>
  <rect x="40" y="135" width="240" height="70" rx="8" fill="#ffffff" stroke="#93c5fd"/>
  <text x="160" y="162" text-anchor="middle" font-size="13" font-family="Consolas, monospace" font-weight="700" fill="#1d4ed8">CALL GetEmployeesByDept(2);</text>
  <text x="160" y="185" text-anchor="middle" font-size="11" fill="#64748b">value 2 goes in</text>
  <line x1="300" y1="170" x2="690" y2="170" stroke="#2563eb" stroke-width="3" marker-end="url(#b)"/>
  <rect x="440" y="130" width="120" height="28" rx="14" fill="#2563eb"/>
  <text x="500" y="149" text-anchor="middle" font-size="13" font-weight="800" fill="#ffffff">IN (default)</text>
  <text x="500" y="195" text-anchor="middle" font-size="12" fill="#1e3a8a">Input only — caller → procedure</text>
  <rect x="710" y="135" width="250" height="70" rx="8" fill="#ffffff" stroke="#93c5fd"/>
  <text x="835" y="162" text-anchor="middle" font-size="12" font-family="Consolas, monospace" fill="#1d4ed8">IN p_dept_id INT</text>
  <text x="835" y="185" text-anchor="middle" font-size="11" fill="#64748b">WHERE department_id = p_dept_id</text>

  <!-- OUT -->
  <rect x="20" y="240" width="960" height="110" rx="10" fill="#fffbeb" stroke="#fcd34d"/>
  <rect x="40" y="260" width="240" height="70" rx="8" fill="#ffffff" stroke="#fcd34d"/>
  <text x="160" y="284" text-anchor="middle" font-size="12" font-family="Consolas, monospace" font-weight="700" fill="#b45309">CALL GetEmployeeCount(2, @count);</text>
  <text x="160" y="310" text-anchor="middle" font-size="12" font-family="Consolas, monospace" fill="#b45309">SELECT @count;  → 7</text>
  <line x1="690" y1="295" x2="300" y2="295" stroke="#d97706" stroke-width="3" marker-end="url(#o)"/>
  <rect x="455" y="255" width="90" height="28" rx="14" fill="#d97706"/>
  <text x="500" y="274" text-anchor="middle" font-size="13" font-weight="800" fill="#ffffff">OUT</text>
  <text x="500" y="320" text-anchor="middle" font-size="12" fill="#78350f">Output only — procedure → caller (needs @variable)</text>
  <rect x="710" y="260" width="250" height="70" rx="8" fill="#ffffff" stroke="#fcd34d"/>
  <text x="835" y="287" text-anchor="middle" font-size="12" font-family="Consolas, monospace" fill="#b45309">OUT p_emp_count INT</text>
  <text x="835" y="310" text-anchor="middle" font-size="11" fill="#64748b">SELECT COUNT(*) INTO p_emp_count</text>

  <!-- INOUT -->
  <rect x="20" y="365" width="960" height="110" rx="10" fill="#f5f3ff" stroke="#c4b5fd"/>
  <rect x="40" y="385" width="240" height="70" rx="8" fill="#ffffff" stroke="#c4b5fd"/>
  <text x="160" y="405" text-anchor="middle" font-size="12" font-family="Consolas, monospace" fill="#6d28d9">SET @salary = 50000;</text>
  <text x="160" y="424" text-anchor="middle" font-size="12" font-family="Consolas, monospace" font-weight="700" fill="#6d28d9">CALL IncreaseSalary(@salary);</text>
  <text x="160" y="443" text-anchor="middle" font-size="12" font-family="Consolas, monospace" fill="#6d28d9">SELECT @salary; → 55000</text>
  <line x1="300" y1="405" x2="690" y2="405" stroke="#7c3aed" stroke-width="3" marker-end="url(#p)"/>
  <line x1="690" y1="440" x2="300" y2="440" stroke="#7c3aed" stroke-width="3" marker-end="url(#p)"/>
  <rect x="445" y="409" width="110" height="26" rx="13" fill="#7c3aed"/>
  <text x="500" y="427" text-anchor="middle" font-size="13" font-weight="800" fill="#ffffff">INOUT</text>
  <text x="500" y="462" text-anchor="middle" font-size="12" fill="#4c1d95">Goes in, is changed, comes back</text>
  <rect x="710" y="385" width="250" height="70" rx="8" fill="#ffffff" stroke="#c4b5fd"/>
  <text x="835" y="412" text-anchor="middle" font-size="12" font-family="Consolas, monospace" fill="#6d28d9">INOUT emp_salary DECIMAL</text>
  <text x="835" y="435" text-anchor="middle" font-size="11" fill="#64748b">SET emp_salary = emp_salary * 1.10</text>

  <text x="500" y="505" text-anchor="middle" font-size="13" fill="#334155"><tspan font-weight="800" fill="#dc2626">Rules: </tspan>every parameter needs a data type · pass a value for every parameter in CALL · MySQL has no DEFAULT for parameters</text>
</svg>
