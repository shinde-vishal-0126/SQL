<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" font-family="Segoe UI, Arial, sans-serif">
  <rect width="1000" height="500" fill="#f8fafc" rx="12"/>
  <text x="500" y="38" text-anchor="middle" font-size="24" font-weight="800" fill="#0f172a">CAP Theorem — Pick 2 during a Network Partition</text>
  <text x="500" y="62" text-anchor="middle" font-size="13" fill="#64748b">Partitions happen in distributed systems, so the real choice is CP or AP</text>

  <polygon points="500,100 250,420 750,420" fill="#ffffff" stroke="#94a3b8" stroke-width="3"/>

  <circle cx="500" cy="100" r="46" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/>
  <text x="500" y="98" text-anchor="middle" font-size="26" font-weight="800" fill="#1d4ed8">C</text>
  <text x="500" y="118" text-anchor="middle" font-size="11" fill="#1d4ed8">Consistency</text>

  <circle cx="250" cy="420" r="46" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/>
  <text x="250" y="418" text-anchor="middle" font-size="26" font-weight="800" fill="#15803d">A</text>
  <text x="250" y="438" text-anchor="middle" font-size="11" fill="#15803d">Availability</text>

  <circle cx="750" cy="420" r="46" fill="#fef3c7" stroke="#d97706" stroke-width="3"/>
  <text x="750" y="418" text-anchor="middle" font-size="26" font-weight="800" fill="#b45309">P</text>
  <text x="750" y="438" text-anchor="middle" font-size="11" fill="#b45309">Partition tolerance</text>

  <!-- CP edge (C-P right side) -->
  <rect x="640" y="225" width="170" height="64" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <text x="725" y="248" text-anchor="middle" font-size="15" font-weight="800" fill="#1d4ed8">CP</text>
  <text x="725" y="266" text-anchor="middle" font-size="11" fill="#334155">MongoDB, HBase, etcd</text>
  <text x="725" y="281" text-anchor="middle" font-size="11" fill="#334155">MySQL Group Replication</text>

  <!-- AP edge (A-P bottom) -->
  <rect x="415" y="440" width="170" height="50" rx="10" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <text x="500" y="461" text-anchor="middle" font-size="15" font-weight="800" fill="#15803d">AP</text>
  <text x="500" y="479" text-anchor="middle" font-size="11" fill="#334155">Cassandra, DynamoDB, CouchDB</text>

  <!-- CA edge (C-A left) -->
  <rect x="190" y="225" width="170" height="64" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="275" y="248" text-anchor="middle" font-size="15" font-weight="800" fill="#475569">CA</text>
  <text x="275" y="266" text-anchor="middle" font-size="11" fill="#334155">single-server MySQL /</text>
  <text x="275" y="281" text-anchor="middle" font-size="11" fill="#334155">PostgreSQL (no partition)</text>

  <rect x="30" y="90" width="200" height="110" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="45" y="114" font-size="13" font-weight="800" fill="#0f172a">SQL → ACID</text>
  <text x="45" y="134" font-size="11" fill="#334155">strict, correct, relations</text>
  <text x="45" y="162" font-size="13" font-weight="800" fill="#0f172a">NoSQL → BASE</text>
  <text x="45" y="182" font-size="11" fill="#334155">available, eventually consistent</text>

  <rect x="770" y="90" width="200" height="110" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="785" y="114" font-size="13" font-weight="800" fill="#0f172a">Network split?</text>
  <text x="785" y="136" font-size="11" fill="#1d4ed8">CP: refuse → stay correct</text>
  <text x="785" y="156" font-size="11" fill="#15803d">AP: answer → maybe stale</text>
  <text x="785" y="180" font-size="11" fill="#334155">Bank = CP · Likes count = AP</text>
</svg>
