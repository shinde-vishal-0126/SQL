<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 250">
    <rect width="800" height="250" fill="#1E1E1E" rx="10"/>
    
    <text x="400" y="30" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#4EC9B0" text-anchor="middle">STANDALONE CTE (Independent Flow)</text>
    
    <!-- DB -->
    <rect x="50" y="80" width="80" height="100" fill="#2D2D30" stroke="#E0E0E0" stroke-width="2"/>
    <text x="90" y="135" font-family="Arial" font-size="16" font-weight="bold" fill="#E0E0E0" text-anchor="middle">DB</text>
    
    <path d="M 130 130 L 190 130" fill="none" stroke="#F44747" stroke-width="3" marker-end="url(#arrow)"/>
    <polygon points="190,130 180,125 180,135" fill="#F44747"/>
    <path d="M 190 130 L 130 130" fill="none" stroke="#F44747" stroke-width="3" marker-end="url(#arrow)"/>
    
    <!-- CTE -->
    <rect x="200" y="80" width="100" height="100" fill="#1E1E1E" stroke="#4FC1FF" stroke-width="3" rx="5"/>
    <text x="250" y="115" font-family="Arial" font-size="16" font-weight="bold" fill="#4FC1FF" text-anchor="middle">CTE</text>
    <line x1="220" y1="130" x2="280" y2="130" stroke="#E0E0E0" stroke-width="2"/>
    <line x1="220" y1="145" x2="280" y2="145" stroke="#E0E0E0" stroke-width="2"/>
    <line x1="220" y1="160" x2="260" y2="160" stroke="#E0E0E0" stroke-width="2"/>
    
    <path d="M 300 130 L 360 130" fill="none" stroke="#F44747" stroke-width="3" marker-end="url(#arrow)"/>
    <polygon points="360,130 350,125 350,135" fill="#F44747"/>
    
    <!-- Intermediate Result -->
    <rect x="370" y="90" width="100" height="80" fill="#2D2D30" stroke="#FFD700" stroke-width="2"/>
    <text x="420" y="110" font-family="Arial" font-size="12" font-style="italic" fill="#FFD700" text-anchor="middle">Intermediate</text>
    <text x="420" y="130" font-family="Arial" font-size="14" font-weight="bold" fill="#FFD700" text-anchor="middle">RESULT</text>
    <rect x="380" y="140" width="80" height="20" fill="#1E1E1E" stroke="#E0E0E0" stroke-width="1"/>
    
    <path d="M 470 130 L 530 130" fill="none" stroke="#F44747" stroke-width="3" marker-end="url(#arrow)"/>
    <polygon points="530,130 520,125 520,135" fill="#F44747"/>
    <path d="M 530 130 L 470 130" fill="none" stroke="#F44747" stroke-width="3" marker-end="url(#arrow)"/>
    
    <!-- Main Query -->
    <rect x="540" y="80" width="100" height="100" fill="#1E1E1E" stroke="#FFD700" stroke-width="3" rx="5"/>
    <text x="590" y="115" font-family="Arial" font-size="14" font-weight="bold" fill="#FFD700" text-anchor="middle">MAIN QUERY</text>
    <line x1="560" y1="130" x2="620" y2="130" stroke="#E0E0E0" stroke-width="2"/>
    <line x1="560" y1="145" x2="620" y2="145" stroke="#E0E0E0" stroke-width="2"/>
    
    <path d="M 640 130 L 690 130" fill="none" stroke="#F44747" stroke-width="3" marker-end="url(#arrow)"/>
    <polygon points="690,130 680,125 680,135" fill="#F44747"/>
    
    <!-- Final Result -->
    <rect x="700" y="90" width="80" height="80" fill="#2D2D30" stroke="#4EC9B0" stroke-width="2"/>
    <text x="740" y="115" font-family="Arial" font-size="14" font-weight="bold" fill="#4EC9B0" text-anchor="middle">FINAL</text>
    <text x="740" y="135" font-family="Arial" font-size="12" font-weight="bold" fill="#4EC9B0" text-anchor="middle">RESULT</text>
    <rect x="710" y="145" width="60" height="15" fill="#1E1E1E" stroke="#E0E0E0" stroke-width="1"/>
</svg>
