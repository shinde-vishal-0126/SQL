<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 620" width="100%" height="100%">
  <defs>
    <!-- Shadows & Filters -->
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
    <filter id="glow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="5" flood-color="#ea580c" flood-opacity="0.25"/>
    </filter>

    <!-- Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </linearGradient>

    <linearGradient id="whyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ea580c"/>
      <stop offset="100%" stop-color="#c2410c"/>
    </linearGradient>

    <linearGradient id="talkGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>

    <linearGradient id="demandGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>

    <linearGradient id="industryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>

    <!-- Markers -->
    <marker id="arrowOrange" markerWidth="8" markerHeight="8" refX="5" refY="3" orient="auto">
      <path d="M0,0 L0,6 L6,3 z" fill="#ea580c"/>
    </marker>
  </defs>

  <style>
    .title { font-family: 'Segoe UI', system-ui, sans-serif; font-weight: 800; font-size: 22px; fill: #0f172a; }
    .subtitle { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 13px; fill: #64748b; }
    .why-logo { font-family: 'Segoe UI', sans-serif; font-weight: 900; font-size: 28px; fill: #ffffff; letter-spacing: 2px; }
    .why-tag { font-family: 'Segoe UI', sans-serif; font-weight: 900; font-size: 16px; fill: #ea580c; }
    .branch-btn { font-family: 'Segoe UI', sans-serif; font-weight: 800; font-size: 14px; fill: #ffffff; letter-spacing: 1px; }
    .card-title { font-family: 'Segoe UI', system-ui, sans-serif; font-weight: 800; font-size: 14px; fill: #1e293b; }
    .card-desc { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 11px; fill: #475569; }
    .badge-career { font-family: 'Segoe UI', system-ui, sans-serif; font-weight: 700; font-size: 11px; fill: #92400e; }
    .badge-tool { font-family: 'Segoe UI', system-ui, sans-serif; font-weight: 700; font-size: 11px; fill: #166534; }
  </style>

  <!-- Canvas Frame -->
  <rect x="15" y="15" width="990" height="590" rx="16" fill="url(#bgGrad)" stroke="#cbd5e1" stroke-width="2" filter="url(#shadow)"/>

  <!-- Top Title -->
  <text x="510" y="48" text-anchor="middle" class="title">Why Learn &amp; Use SQL? (Core Pillars &amp; Industry Impact)</text>
  <text x="510" y="68" text-anchor="middle" class="subtitle">Standardized Language, Massive Career Demand, and Universal Tool Ecosystem</text>

  <!-- ==================== LEFT: WHY SQL ROOT NODE ==================== -->
  <g transform="translate(60, 260)">
    <!-- "Why?" Annotation -->
    <text x="-15" y="-35" font-family="'Segoe UI', cursive, sans-serif" class="why-tag">Why ?</text>
    
    <!-- Central Oval -->
    <ellipse cx="60" cy="20" rx="75" ry="42" fill="url(#whyGrad)" filter="url(#glow)"/>
    <ellipse cx="60" cy="20" rx="68" ry="36" fill="none" stroke="#fed7aa" stroke-width="2"/>
    <text x="60" y="30" text-anchor="middle" class="why-logo">SQL</text>
  </g>

  <!-- Curved Connecting Branches -->
  <!-- Branch 1 (Up to TALK TO DATA) -->
  <path d="M 195 260 C 230 220, 250 145, 290 145" fill="none" stroke="#ea580c" stroke-width="3" stroke-linecap="round"/>
  
  <!-- Branch 2 (Straight to HIGH DEMAND) -->
  <path d="M 195 280 L 290 280" fill="none" stroke="#ea580c" stroke-width="3" stroke-linecap="round"/>
  
  <!-- Branch 3 (Down to INDUSTRY STANDARD) -->
  <path d="M 195 300 C 230 340, 250 435, 290 435" fill="none" stroke="#ea580c" stroke-width="3" stroke-linecap="round"/>

  <!-- ==================== PILLAR 1: TALK TO DATA (TOP) ==================== -->
  <g transform="translate(290, 100)">
    <!-- Label Pill -->
    <rect width="180" height="38" rx="8" fill="url(#talkGrad)" filter="url(#shadow)"/>
    <text x="90" y="24" text-anchor="middle" class="branch-btn">💬 TALK TO DATA</text>
  </g>

  <!-- Content Card 1 -->
  <g transform="translate(490, 90)">
    <rect width="480" height="135" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#shadow)"/>
    
    <!-- Enterprise & DB Mock -->
    <g transform="translate(20, 20)">
      <!-- Company Building -->
      <rect width="42" height="48" rx="3" fill="#ffffff" stroke="#475569" stroke-width="1.5"/>
      <rect x="6" y="8" width="8" height="6" fill="#94a3b8"/>
      <rect x="18" y="8" width="8" height="6" fill="#94a3b8"/>
      <rect x="30" y="8" width="8" height="6" fill="#94a3b8"/>
      <rect x="6" y="20" width="8" height="6" fill="#94a3b8"/>
      <rect x="18" y="20" width="8" height="6" fill="#94a3b8"/>
      <rect x="30" y="20" width="8" height="6" fill="#94a3b8"/>

      <!-- DBs around -->
      <ellipse cx="-15" cy="12" rx="14" ry="5" fill="#38bdf8"/>
      <ellipse cx="-15" cy="40" rx="14" ry="5" fill="#38bdf8"/>
      <ellipse cx="58" cy="12" rx="14" ry="5" fill="#38bdf8"/>
      <ellipse cx="58" cy="40" rx="14" ry="5" fill="#38bdf8"/>
    </g>

    <text x="95" y="30" class="card-title">Universal Database Communication</text>
    <text x="95" y="48" class="card-desc">• One standard language for MySQL, PostgreSQL, Oracle, MS SQL</text>
    <text x="95" y="65" class="card-desc">• Efficient retrieval: query ONLY what you need (SELECT, WHERE, JOIN)</text>
    <text x="95" y="82" class="card-desc">• Full Data Manipulation: INSERT, UPDATE, DELETE in milliseconds</text>

    <!-- Query Pill -->
    <g transform="translate(95, 95)">
      <rect width="365" height="24" rx="5" fill="#f0f9ff" stroke="#bae6fd" stroke-width="1"/>
      <text x="12" y="16" font-family="monospace" font-weight="700" font-size="10" fill="#0369a1">SELECT name, revenue FROM clients WHERE status = 'Active';</text>
    </g>
  </g>


  <!-- ==================== PILLAR 2: HIGH DEMAND (MIDDLE) ==================== -->
  <g transform="translate(290, 260)">
    <rect width="180" height="38" rx="8" fill="url(#demandGrad)" filter="url(#shadow)"/>
    <text x="90" y="24" text-anchor="middle" class="branch-btn">🔥 HIGH DEMAND</text>
  </g>

  <!-- Content Card 2 -->
  <g transform="translate(490, 245)">
    <rect width="480" height="120" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#shadow)"/>
    
    <text x="20" y="25" class="card-title">Essential Core Skill Across Top Tech Careers</text>
    <text x="20" y="42" class="card-desc">No matter the technical field, SQL is the #1 foundational skill required:</text>

    <!-- 4 Career Role Badges -->
    <g transform="translate(20, 55)">
      <!-- Role 1: Software Developer -->
      <rect width="105" height="48" rx="6" fill="#fef3c7" stroke="#fde68a" stroke-width="1"/>
      <text x="52" y="22" text-anchor="middle" font-size="16">💻</text>
      <text x="52" y="38" text-anchor="middle" class="badge-career">Software Dev</text>

      <!-- Role 2: Data Analyst -->
      <g transform="translate(112, 0)">
        <rect width="105" height="48" rx="6" fill="#fef3c7" stroke="#fde68a" stroke-width="1"/>
        <text x="52" y="22" text-anchor="middle" font-size="16">📊</text>
        <text x="52" y="38" text-anchor="middle" class="badge-career">Data Analyst</text>
      </g>

      <!-- Role 3: Data Engineer -->
      <g transform="translate(224, 0)">
        <rect width="105" height="48" rx="6" fill="#fef3c7" stroke="#fde68a" stroke-width="1"/>
        <text x="52" y="22" text-anchor="middle" font-size="16">⚙️</text>
        <text x="52" y="38" text-anchor="middle" class="badge-career">Data Engineer</text>
      </g>

      <!-- Role 4: Data Scientist -->
      <g transform="translate(336, 0)">
        <rect width="105" height="48" rx="6" fill="#fef3c7" stroke="#fde68a" stroke-width="1"/>
        <text x="52" y="22" text-anchor="middle" font-size="16">🧠</text>
        <text x="52" y="38" text-anchor="middle" class="badge-career">Data Scientist</text>
      </g>
    </g>
  </g>


  <!-- ==================== PILLAR 3: INDUSTRY STANDARD (BOTTOM) ==================== -->
  <g transform="translate(290, 415)">
    <rect width="180" height="38" rx="8" fill="url(#industryGrad)" filter="url(#shadow)"/>
    <text x="90" y="24" text-anchor="middle" class="branch-btn">🌐 INDUSTRY STANDARD</text>
  </g>

  <!-- Content Card 3 -->
  <g transform="translate(490, 385)">
    <rect width="480" height="120" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#shadow)"/>
    
    <text x="20" y="25" class="card-title">Native Integration with Modern Data Platforms</text>
    <text x="20" y="42" class="card-desc">Supported by all enterprise analytics, streaming, and cloud warehouses:</text>

    <!-- 5 Tool Badges -->
    <g transform="translate(20, 55)">
      <!-- Power BI -->
      <rect width="82" height="48" rx="6" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
      <text x="41" y="22" text-anchor="middle" font-size="15">📈</text>
      <text x="41" y="38" text-anchor="middle" class="badge-tool">Power BI</text>

      <!-- Tableau -->
      <g transform="translate(88, 0)">
        <rect width="82" height="48" rx="6" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
        <text x="41" y="22" text-anchor="middle" font-size="15">📉</text>
        <text x="41" y="38" text-anchor="middle" class="badge-tool">Tableau</text>
      </g>

      <!-- Apache Spark -->
      <g transform="translate(176, 0)">
        <rect width="82" height="48" rx="6" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
        <text x="41" y="22" text-anchor="middle" font-size="15">⚡</text>
        <text x="41" y="38" text-anchor="middle" class="badge-tool">Spark</text>
      </g>

      <!-- Apache Kafka -->
      <g transform="translate(264, 0)">
        <rect width="82" height="48" rx="6" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
        <text x="41" y="22" text-anchor="middle" font-size="15">🔄</text>
        <text x="41" y="38" text-anchor="middle" class="badge-tool">Kafka</text>
      </g>

      <!-- Azure Synapse -->
      <g transform="translate(352, 0)">
        <rect width="88" height="48" rx="6" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
        <text x="44" y="22" text-anchor="middle" font-size="15">☁️</text>
        <text x="44" y="38" text-anchor="middle" class="badge-tool">Synapse</text>
      </g>
    </g>
  </g>

  <!-- ==================== FOOTER: TECHNICAL GUARANTEES ==================== -->
  <g transform="translate(45, 525)">
    <rect width="930" height="60" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
    <text x="30" y="26" font-family="'Segoe UI', sans-serif" font-weight="800" font-size="12" fill="#0f172a">🛡️ Built-in Engine Guarantees:</text>
    <text x="30" y="44" font-family="'Segoe UI', sans-serif" font-size="11" fill="#475569">
      <tspan font-weight="700" fill="#0284c7">Data Integrity:</tspan> Constraints (PK, FK, NOT NULL) • 
      <tspan font-weight="700" fill="#059669">ACID Transactions:</tspan> All-or-nothing rollback • 
      <tspan font-weight="700" fill="#d97706">Security:</tspan> GRANT/REVOKE privileges • 
      <tspan font-weight="700" fill="#7c3aed">Scalability:</tspan> Indexes &amp; Query Planning for millions of rows
    </text>
  </g>
</svg>
