<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 250">
    <rect width="600" height="250" fill="#1E1E1E" rx="10"/>
    <text x="300" y="30" font-family="Arial" font-size="18" font-weight="bold" fill="#4FC1FF" text-anchor="middle">GROUP BY vs WINDOW FUNCTIONS</text>
    
    <!-- GROUP BY -->
    <rect x="20" y="60" width="260" height="160" fill="#2D2D30" stroke="#DCDCAA" stroke-width="2"/>
    <text x="150" y="90" font-family="Arial" font-size="16" font-weight="bold" fill="#DCDCAA" text-anchor="middle">GROUP BY</text>
    <text x="150" y="120" font-family="Arial" font-size="14" fill="#E0E0E0" text-anchor="middle">Squashes / Collapses Rows</text>
    <text x="150" y="150" font-family="Arial" font-size="12" fill="#A0A0A0" text-anchor="middle">Loses row-level details</text>
    <text x="150" y="180" font-family="Courier New" font-size="14" fill="#F44747" text-anchor="middle">4 Rows -> 2 Rows</text>

    <!-- WINDOW -->
    <rect x="320" y="60" width="260" height="160" fill="#2D2D30" stroke="#4EC9B0" stroke-width="2"/>
    <text x="450" y="90" font-family="Arial" font-size="16" font-weight="bold" fill="#4EC9B0" text-anchor="middle">WINDOW FUNCTION</text>
    <text x="450" y="120" font-family="Arial" font-size="14" fill="#E0E0E0" text-anchor="middle">Adds a calculation column</text>
    <text x="450" y="150" font-family="Arial" font-size="12" fill="#A0A0A0" text-anchor="middle">Keeps original row details</text>
    <text x="450" y="180" font-family="Courier New" font-size="14" fill="#4FC1FF" text-anchor="middle">4 Rows -> 4 Rows</text>
</svg>