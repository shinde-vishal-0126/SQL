<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600">
    <rect width="900" height="600" fill="#1E1E1E" rx="10"/>
    
    <!-- Title -->
    <text x="450" y="40" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#FFD700" text-anchor="middle">Use Case 5: Multiple Languages Support</text>

    <!-- Base Table (Left) -->
    <text x="200" y="220" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#FFF" text-anchor="middle">TABLE</text>
    <rect x="150" y="240" width="100" height="90" fill="#252526" stroke="#4FC1FF" stroke-width="3"/>
    <rect x="150" y="240" width="100" height="30" fill="#4FC1FF"/>
    <text x="200" y="260" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#000" text-anchor="middle">ORDERS</text>
    <path d="M 150 270 L 250 270 M 150 290 L 250 290 M 150 310 L 250 310 M 183 270 L 183 330 M 216 270 L 216 330" stroke="#555" stroke-width="2"/>

    <!-- Arrows from Table to Views -->
    <path d="M 260 270 L 370 170" stroke="#4FC1FF" stroke-width="4" marker-end="url(#arrow_blue)"/>
    <path d="M 260 300 L 370 430" stroke="#4FC1FF" stroke-width="4" marker-end="url(#arrow_blue)"/>

    <!-- Separator Line -->
    <path d="M 550 80 L 550 550" stroke="#888" stroke-width="2" stroke-dasharray="10,10"/>

    <!-- View 1: German (Top Right) -->
    <text x="450" y="100" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#FFF" text-anchor="middle">VIEW</text>
    <rect x="400" y="120" width="100" height="90" fill="#252526" stroke="#4FC1FF" stroke-width="3"/>
    <rect x="400" y="120" width="100" height="30" fill="#4FC1FF"/>
    <text x="450" y="140" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#000" text-anchor="middle">BESTELLUNG</text>
    <path d="M 400 150 L 500 150 M 400 170 L 500 170 M 400 190 L 500 190 M 433 150 L 433 210 M 466 150 L 466 210" stroke="#555" stroke-width="2"/>
    
    <!-- German Flag -->
    <rect x="510" y="100" width="30" height="6" fill="#000"/>
    <rect x="510" y="106" width="30" height="6" fill="#F00"/>
    <rect x="510" y="112" width="30" height="6" fill="#FFCC00"/>
    <path d="M 510 100 L 510 140" stroke="#FFF" stroke-width="2"/>

    <path d="M 520 160 L 680 160" stroke="#4FC1FF" stroke-width="4" marker-start="url(#arrow_blue_rev)" marker-end="url(#arrow_blue)"/>

    <!-- German User -->
    <rect x="700" y="130" width="100" height="70" fill="#FFF" stroke="#000" stroke-width="3"/>
    <rect x="700" y="130" width="100" height="20" fill="#4FC1FF"/>
    <text x="750" y="145" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#000" text-anchor="middle">BESTELLUNG</text>
    <path d="M 700 160 L 800 160 M 700 180 L 800 180 M 733 150 L 733 200 M 766 150 L 766 200" stroke="#000" stroke-width="1"/>
    <!-- Laptop Base -->
    <path d="M 680 200 L 820 200 L 810 210 L 690 210 Z" fill="#CCC" stroke="#000" stroke-width="2"/>
    <circle cx="750" cy="100" r="15" fill="#FFF"/>
    <path d="M 735 130 Q 750 110 765 130 Z" fill="#FFF"/>
    <rect x="830" y="120" width="20" height="4" fill="#000"/><rect x="830" y="124" width="20" height="4" fill="#F00"/><rect x="830" y="128" width="20" height="4" fill="#FFCC00"/><path d="M 830 120 L 830 140" stroke="#FFF" stroke-width="1"/>


    <!-- View 2: Hindi (Bottom Right) -->
    <text x="450" y="360" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#FFF" text-anchor="middle">VIEW</text>
    <rect x="400" y="380" width="100" height="90" fill="#252526" stroke="#4FC1FF" stroke-width="3"/>
    <rect x="400" y="380" width="100" height="30" fill="#4FC1FF"/>
    <text x="450" y="400" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#000" text-anchor="middle">आदेश</text> <!-- Hindi word for Orders -->
    <path d="M 400 410 L 500 410 M 400 430 L 500 430 M 400 450 L 500 450 M 433 410 L 433 470 M 466 410 L 466 470" stroke="#555" stroke-width="2"/>
    
    <!-- Indian Flag -->
    <rect x="510" y="360" width="30" height="6" fill="#FF9933"/>
    <rect x="510" y="366" width="30" height="6" fill="#FFF"/>
    <rect x="510" y="372" width="30" height="6" fill="#138808"/>
    <circle cx="525" cy="369" r="2" fill="#000080"/>
    <path d="M 510 360 L 510 400" stroke="#FFF" stroke-width="2"/>

    <path d="M 520 420 L 680 420" stroke="#4FC1FF" stroke-width="4" marker-start="url(#arrow_blue_rev)" marker-end="url(#arrow_blue)"/>

    <!-- Indian User -->
    <rect x="700" y="390" width="100" height="70" fill="#FFF" stroke="#000" stroke-width="3"/>
    <rect x="700" y="390" width="100" height="20" fill="#4FC1FF"/>
    <text x="750" y="405" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#000" text-anchor="middle">आदेश</text>
    <path d="M 700 420 L 800 420 M 700 440 L 800 440 M 733 410 L 733 460 M 766 410 L 766 460" stroke="#000" stroke-width="1"/>
    <!-- Laptop Base -->
    <path d="M 680 460 L 820 460 L 810 470 L 690 470 Z" fill="#CCC" stroke="#000" stroke-width="2"/>
    <circle cx="750" cy="360" r="15" fill="#FFF"/>
    <path d="M 735 390 Q 750 370 765 390 Z" fill="#FFF"/>
    <rect x="830" y="380" width="20" height="4" fill="#FF9933"/><rect x="830" y="384" width="20" height="4" fill="#FFF"/><rect x="830" y="388" width="20" height="4" fill="#138808"/><circle cx="840" cy="386" r="1.5" fill="#000080"/><path d="M 830 380 L 830 400" stroke="#FFF" stroke-width="1"/>

    <defs>
        <marker id="arrow_blue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#4FC1FF" /></marker>
        <marker id="arrow_blue_rev" markerWidth="10" markerHeight="10" refX="2" refY="5" orient="auto-start-reverse"><path d="M 10 0 L 0 5 L 10 10 z" fill="#4FC1FF" /></marker>
    </defs>
</svg>
