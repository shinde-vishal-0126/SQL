<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300">
    <rect width="800" height="300" fill="#1E1E1E" rx="10"/>
    <text x="400" y="40" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#E0E0E0" text-anchor="middle">SET Operator Execution Flow</text>
    
    <!-- Query 1 -->
    <rect x="50" y="70" width="220" height="80" rx="5" fill="#2D2D30" stroke="#4FC1FF" stroke-width="2"/>
    <text x="160" y="90" font-family="Courier New, monospace" font-size="14" font-weight="bold" fill="#4FC1FF" text-anchor="middle">SELECT FirstName</text>
    <text x="160" y="110" font-family="Courier New, monospace" font-size="14" fill="#E0E0E0" text-anchor="middle">FROM Customers</text>
    
    <!-- Query 2 -->
    <rect x="50" y="180" width="220" height="80" rx="5" fill="#2D2D30" stroke="#4EC9B0" stroke-width="2"/>
    <text x="160" y="200" font-family="Courier New, monospace" font-size="14" font-weight="bold" fill="#4EC9B0" text-anchor="middle">SELECT FirstName</text>
    <text x="160" y="220" font-family="Courier New, monospace" font-size="14" fill="#E0E0E0" text-anchor="middle">FROM Employees</text>
    
    <!-- Arrows -->
    <path d="M 270 110 L 330 110 L 330 160 L 370 160" fill="none" stroke="#3E3E42" stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M 270 220 L 330 220 L 330 170 L 370 170" fill="none" stroke="#3E3E42" stroke-width="3" marker-end="url(#arrow)"/>
    
    <!-- SET Operator -->
    <rect x="370" y="145" width="100" height="40" rx="20" fill="#C586C0" opacity="0.2"/>
    <rect x="370" y="145" width="100" height="40" rx="20" fill="none" stroke="#C586C0" stroke-width="2"/>
    <text x="420" y="170" font-family="Arial" font-size="16" font-weight="bold" fill="#C586C0" text-anchor="middle">UNION</text>
    
    <!-- Arrow to Result -->
    <path d="M 470 165 L 530 165" fill="none" stroke="#3E3E42" stroke-width="3" marker-end="url(#arrow)"/>
    
    <!-- Result Set -->
    <rect x="530" y="100" width="220" height="130" rx="5" fill="#2D2D30" stroke="#DCDCAA" stroke-width="2"/>
    <text x="640" y="125" font-family="Arial" font-size="14" font-weight="bold" fill="#DCDCAA" text-anchor="middle">Combined Result Set</text>
    <line x1="530" y1="135" x2="750" y2="135" stroke="#3E3E42" stroke-width="1"/>
    <text x="640" y="155" font-family="Courier New, monospace" font-size="14" fill="#E0E0E0" text-anchor="middle">Alice</text>
    <text x="640" y="175" font-family="Courier New, monospace" font-size="14" fill="#E0E0E0" text-anchor="middle">Bob</text>
    <text x="640" y="195" font-family="Courier New, monospace" font-size="14" fill="#E0E0E0" text-anchor="middle">Charlie</text>
    <text x="640" y="215" font-family="Courier New, monospace" font-size="14" fill="#A0A0A0" text-anchor="middle">...</text>
    
    <!-- Def -->
    <defs>
        <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
            <path d="M0,0 L0,6 L9,3 z" fill="#3E3E42" />
        </marker>
    </defs>
</svg>