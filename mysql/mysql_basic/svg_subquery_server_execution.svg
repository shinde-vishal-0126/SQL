<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450">
    <rect width="800" height="450" fill="#1E1E1E" rx="10"/>
    <text x="400" y="30" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#DCDCAA" text-anchor="middle">Subquery Execution: Behind the Scenes</text>
    
    <!-- Client Section -->
    <rect x="600" y="70" width="150" height="300" fill="#2D2D30" stroke="#E0E0E0" stroke-width="2"/>
    <text x="675" y="95" font-family="Arial" font-size="16" font-weight="bold" fill="#E0E0E0" text-anchor="middle">CLIENT</text>
    <rect x="625" y="120" width="100" height="100" fill="#1E1E1E" stroke="#4FC1FF" stroke-width="1"/>
    <text x="675" y="140" font-family="Arial" font-size="12" fill="#4FC1FF" text-anchor="middle">Main Query</text>
    <text x="675" y="170" font-family="Courier New" font-size="10" fill="#E0E0E0" text-anchor="middle">SELECT ...</text>
    <text x="675" y="190" font-family="Courier New" font-size="10" fill="#E0E0E0" text-anchor="middle">FROM (</text>
    <text x="675" y="200" font-family="Courier New" font-size="10" fill="#E0E0E0" text-anchor="middle">  SELECT ...</text>
    <text x="675" y="210" font-family="Courier New" font-size="10" fill="#E0E0E0" text-anchor="middle">)</text>
    
    <!-- Engine Section -->
    <rect x="450" y="70" width="60" height="300" fill="#2D2D30" stroke="#F44747" stroke-width="2"/>
    <text x="480" y="220" font-family="Arial" font-size="14" font-weight="bold" fill="#F44747" transform="rotate(-90 480 220)" text-anchor="middle">DATABASE ENGINE</text>

    <!-- Server Section -->
    <rect x="50" y="70" width="300" height="300" fill="#2D2D30" stroke="#4EC9B0" stroke-width="2"/>
    <text x="200" y="95" font-family="Arial" font-size="16" font-weight="bold" fill="#4EC9B0" text-anchor="middle">SERVER</text>
    
    <!-- Cache -->
    <rect x="70" y="110" width="260" height="60" fill="#1E1E1E" stroke="#E0E0E0" stroke-width="2"/>
    <text x="110" y="145" font-family="Arial" font-size="14" font-weight="bold" fill="#E0E0E0" text-anchor="middle">CACHE</text>
    <rect x="230" y="120" width="80" height="40" fill="#2D2D30" stroke="#C586C0" stroke-width="1"/>
    <text x="270" y="135" font-family="Arial" font-size="10" fill="#C586C0" text-anchor="middle">Subquery</text>
    <text x="270" y="150" font-family="Arial" font-size="10" fill="#C586C0" text-anchor="middle">Result (Temp)</text>
    
    <!-- Disk -->
    <rect x="70" y="190" width="260" height="160" fill="#1E1E1E" stroke="#E0E0E0" stroke-width="2"/>
    <text x="110" y="220" font-family="Arial" font-size="14" font-weight="bold" fill="#E0E0E0" text-anchor="middle">DISK</text>
    <rect x="90" y="240" width="60" height="80" fill="#2D2D30" stroke="#A0A0A0" stroke-width="1"/>
    <text x="120" y="260" font-family="Arial" font-size="10" fill="#E0E0E0" text-anchor="middle">Temp</text>
    <rect x="170" y="240" width="60" height="80" fill="#2D2D30" stroke="#A0A0A0" stroke-width="1"/>
    <text x="200" y="260" font-family="Arial" font-size="10" fill="#E0E0E0" text-anchor="middle">Catalog</text>
    <rect x="250" y="240" width="60" height="80" fill="#2D2D30" stroke="#A0A0A0" stroke-width="1"/>
    <text x="280" y="260" font-family="Arial" font-size="10" fill="#E0E0E0" text-anchor="middle">User</text>
    
    <!-- Arrows -->
    <!-- Client to Engine -->
    <path d="M 600 170 L 510 170" stroke="#E0E0E0" stroke-width="2"/>
    <polygon points="510,170 520,165 520,175" fill="#E0E0E0"/>
    
    <!-- Engine to Disk (Subquery read) -->
    <path d="M 450 280 L 330 280" stroke="#4FC1FF" stroke-width="2"/>
    <polygon points="330,280 340,275 340,285" fill="#4FC1FF"/>
    
    <!-- Disk to Cache (Store Subquery result) -->
    <path d="M 270 240 L 270 160" stroke="#C586C0" stroke-width="2"/>
    <polygon points="270,160 265,170 275,170" fill="#C586C0"/>
    
    <!-- Engine reading from Cache (Main Query) -->
    <path d="M 270 120 Q 350 70 450 140" fill="none" stroke="#F44747" stroke-width="2"/>
    <polygon points="450,140 440,135 440,145" fill="#F44747"/>
    
    <!-- Engine to Client (Final Result) -->
    <path d="M 510 200 L 600 200" stroke="#4EC9B0" stroke-width="2"/>
    <polygon points="600,200 590,195 590,205" fill="#4EC9B0"/>
    
    <text x="550" y="195" font-family="Arial" font-size="12" fill="#4EC9B0" text-anchor="middle">Final Result</text>
</svg>
