<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 250">
    <rect width="600" height="250" fill="#1E1E1E" rx="10"/>
    <text x="300" y="30" font-family="Arial" font-size="18" font-weight="bold" fill="#E0E0E0" text-anchor="middle">Integer-based vs Percentage-based Ranking</text>
    
    <!-- Integer Based -->
    <rect x="50" y="60" width="220" height="160" fill="#2D2D30" stroke="#DCDCAA" stroke-width="2"/>
    <text x="160" y="90" font-family="Arial" font-size="14" font-weight="bold" fill="#DCDCAA" text-anchor="middle">Integer-Based Ranking</text>
    <text x="160" y="110" font-family="Arial" font-size="12" fill="#A0A0A0" text-anchor="middle">(ROW_NUMBER, RANK)</text>
    <text x="160" y="140" font-family="Courier New" font-size="14" fill="#E0E0E0" text-anchor="middle">1, 2, 3, 4, 5</text>
    <text x="160" y="180" font-family="Arial" font-size="12" fill="#4FC1FF" text-anchor="middle">Discrete Values</text>
    <text x="160" y="200" font-family="Arial" font-size="12" fill="#E0E0E0" text-anchor="middle">Top / Bottom N Analysis</text>

    <!-- Percentage Based -->
    <rect x="330" y="60" width="220" height="160" fill="#2D2D30" stroke="#4EC9B0" stroke-width="2"/>
    <text x="440" y="90" font-family="Arial" font-size="14" font-weight="bold" fill="#4EC9B0" text-anchor="middle">Percentage-Based Ranking</text>
    <text x="440" y="110" font-family="Arial" font-size="12" fill="#A0A0A0" text-anchor="middle">(PERCENT_RANK, CUME_DIST)</text>
    <text x="440" y="140" font-family="Courier New" font-size="14" fill="#E0E0E0" text-anchor="middle">0, 0.25, 0.5, 0.75, 1</text>
    <text x="440" y="180" font-family="Arial" font-size="12" fill="#4FC1FF" text-anchor="middle">Continuous Values (0 to 1)</text>
    <text x="440" y="200" font-family="Arial" font-size="12" fill="#E0E0E0" text-anchor="middle">Distribution Analysis</text>
</svg>