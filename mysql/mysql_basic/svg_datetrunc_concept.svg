<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 200">
    <rect width="600" height="200" fill="#1E1E1E" rx="10"/>
    <text x="300" y="40" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#C586C0" text-anchor="middle">DATETRUNC() / DATE_TRUNC()</text>
    
    <text x="300" y="80" font-family="Courier New" font-size="20" fill="#A0A0A0" text-anchor="middle">2025-01-15 14:30:45</text>
    
    <!-- Truncating to YEAR -->
    <path d="M 300 90 L 300 110" fill="none" stroke="#3E3E42" stroke-width="2" marker-end="url(#arrow)"/>
    
    <text x="150" y="120" font-family="Arial" font-size="14" font-weight="bold" fill="#4EC9B0" text-anchor="middle">Keep (Year)</text>
    <text x="450" y="120" font-family="Arial" font-size="14" font-weight="bold" fill="#F44747" text-anchor="middle">Reset (Month, Day, Time)</text>
    
    <rect x="100" y="130" width="100" height="40" fill="#2D2D30" stroke="#4EC9B0" stroke-width="2"/>
    <text x="150" y="155" font-family="Courier New" font-size="20" font-weight="bold" fill="#E0E0E0" text-anchor="middle">2025-</text>
    
    <rect x="200" y="130" width="300" height="40" fill="#2D2D30" stroke="#F44747" stroke-width="2"/>
    <text x="350" y="155" font-family="Courier New" font-size="20" font-weight="bold" fill="#F44747" text-anchor="middle">01-01 00:00:00</text>
    
    <text x="300" y="190" font-family="Arial" font-size="12" fill="#A0A0A0" text-anchor="middle">Truncates date to a specific part, resetting the rest to lowest value.</text>

    <!-- Def -->
    <defs>
        <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
            <path d="M0,0 L0,6 L9,3 z" fill="#3E3E42" />
        </marker>
    </defs>
</svg>