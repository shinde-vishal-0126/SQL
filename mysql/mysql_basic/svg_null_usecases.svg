<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 200">
    <rect width="600" height="200" fill="#1E1E1E" rx="10"/>
    <text x="300" y="30" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#4EC9B0" text-anchor="middle">NULL Functions Use Cases</text>
    
    <rect x="50" y="50" width="500" height="130" rx="5" fill="#2D2D30" stroke="#3E3E42" stroke-width="2"/>
    
    <text x="70" y="75" font-family="Courier New" font-size="14" fill="#4FC1FF" text-anchor="start">1. Data Aggregation (SUM, AVG)</text>
    <text x="70" y="95" font-family="Courier New" font-size="14" fill="#4EC9B0" text-anchor="start">2. Mathematical Operations</text>
    <text x="70" y="115" font-family="Courier New" font-size="14" fill="#C586C0" text-anchor="start">3. Joining Tables</text>
    <text x="70" y="135" font-family="Courier New" font-size="14" fill="#DCDCAA" text-anchor="start">4. Sorting Data (NULLs first/last)</text>
    <text x="70" y="155" font-family="Courier New" font-size="14" fill="#F44747" text-anchor="start">5. Finding Unmatched Data (Anti-Joins)</text>
</svg>