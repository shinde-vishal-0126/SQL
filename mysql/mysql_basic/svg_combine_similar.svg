<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300">
    <rect width="800" height="300" fill="#eeeeee" rx="10"/>
    <text x="400" y="40" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#575724" text-anchor="middle">Combine Similar Information Before Analysis (UNION)</text>
    
    <!-- 4 Source Tables -->
    <rect x="50" y="70" width="120" height="40" rx="5" fill="#e8e8e9" stroke="#0072b0" stroke-width="2"/>
    <text x="110" y="95" font-family="Arial" font-size="14" font-weight="bold" fill="#1f1f1f" text-anchor="middle">Orders 2021</text>
    
    <rect x="50" y="120" width="120" height="40" rx="5" fill="#e8e8e9" stroke="#0072b0" stroke-width="2"/>
    <text x="110" y="145" font-family="Arial" font-size="14" font-weight="bold" fill="#1f1f1f" text-anchor="middle">Orders 2022</text>
    
    <rect x="50" y="170" width="120" height="40" rx="5" fill="#e8e8e9" stroke="#0072b0" stroke-width="2"/>
    <text x="110" y="195" font-family="Arial" font-size="14" font-weight="bold" fill="#1f1f1f" text-anchor="middle">Orders 2023</text>
    
    <rect x="50" y="220" width="120" height="40" rx="5" fill="#e8e8e9" stroke="#0072b0" stroke-width="2"/>
    <text x="110" y="245" font-family="Arial" font-size="14" font-weight="bold" fill="#1f1f1f" text-anchor="middle">Orders 2024</text>
    
    <!-- Arrows to UNION -->
    <path d="M 170 90 L 250 145" fill="none" stroke="#b1b1b6" stroke-width="2" marker-end="url(#arrow)"/>
    <path d="M 170 140 L 250 155" fill="none" stroke="#b1b1b6" stroke-width="2" marker-end="url(#arrow)"/>
    <path d="M 170 190 L 250 165" fill="none" stroke="#b1b1b6" stroke-width="2" marker-end="url(#arrow)"/>
    <path d="M 170 240 L 250 175" fill="none" stroke="#b1b1b6" stroke-width="2" marker-end="url(#arrow)"/>
    
    <!-- UNION Bubble -->
    <circle cx="280" cy="160" r="30" fill="#e8e8e9" stroke="#793a74" stroke-width="3"/>
    <text x="280" y="165" font-family="Arial" font-size="14" font-weight="bold" fill="#793a74" text-anchor="middle">UNION</text>
    
    <!-- Arrow to Combined Table -->
    <path d="M 310 160 L 370 160" fill="none" stroke="#b1b1b6" stroke-width="3" marker-end="url(#arrow)"/>
    
    <!-- Combined Table -->
    <rect x="370" y="120" width="160" height="80" rx="5" fill="#e8e8e9" stroke="#267d6b" stroke-width="2"/>
    <text x="450" y="145" font-family="Arial" font-size="16" font-weight="bold" fill="#267d6b" text-anchor="middle">All_Orders</text>
    <text x="450" y="165" font-family="Arial" font-size="12" fill="#5f5f5f" text-anchor="middle">(Single Master Table)</text>
    
    <!-- Arrow to Query -->
    <path d="M 530 160 L 580 160" fill="none" stroke="#b1b1b6" stroke-width="3" marker-end="url(#arrow)"/>
    
    <!-- Final SQL Query/Analysis -->
    <rect x="580" y="120" width="160" height="80" rx="5" fill="#e8e8e9" stroke="#575724" stroke-width="2"/>
    <text x="660" y="150" font-family="Arial" font-size="14" font-weight="bold" fill="#575724" text-anchor="middle">Data Analysis</text>
    <text x="660" y="170" font-family="Arial" font-size="12" fill="#1f1f1f" text-anchor="middle">(PowerBI / Reports)</text>

    <!-- Def -->
    <defs>
        <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
            <path d="M0,0 L0,6 L9,3 z" fill="#e3e3e5" />
        </marker>
    </defs>
</svg>