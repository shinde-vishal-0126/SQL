<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 680" width="1100" height="680">
  <defs>
    <linearGradient id="dtBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="dtTitleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="50%" stop-color="#ec4899" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <filter id="dtShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>

  <rect width="1100" height="680" fill="url(#dtBg)" />
  <rect x="20" y="20" width="1060" height="640" rx="14" fill="none" stroke="#334155" stroke-width="2" />

  <!-- Title -->
  <text x="550" y="62" text-anchor="middle" font-family="'Segoe UI', Roboto, sans-serif" font-size="26" font-weight="bold" fill="url(#dtTitleGrad)">
    MySQL Comparison: DATETIME vs. TIMESTAMP
  </text>
  <text x="550" y="88" text-anchor="middle" font-family="'Segoe UI', Roboto, sans-serif" font-size="13.5" fill="#94a3b8">
    Architectural Mechanics, Storage Size, Time Zone Handling &amp; Auto-Update Triggers
  </text>

  <!-- Left Card: DATETIME -->
  <g transform="translate(50, 115)">
    <rect x="0" y="0" width="470" height="420" rx="12" fill="#1e293b" stroke="#f59e0b" stroke-width="2" filter="url(#dtShadow)" />
    <path d="M 0 12 Q 0 0 12 0 L 458 0 Q 470 0 470 12 L 470 48 L 0 48 Z" fill="#b45309" />
    <text x="235" y="32" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="18" font-weight="bold" fill="#ffffff">
      📅 DATETIME (Absolute / Literal Timestamp)
    </text>

    <!-- Details List -->
    <g transform="translate(25, 65)">
      <!-- 1. Format -->
      <text x="0" y="20" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="bold" fill="#fbbf24">Format:</text>
      <text x="140" y="20" font-family="'Segoe UI', sans-serif" font-size="13" fill="#f1f5f9">YYYY-MM-DD HH:MM:SS</text>

      <!-- 2. Storage Size -->
      <text x="0" y="55" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="bold" fill="#fbbf24">Storage Size:</text>
      <text x="140" y="55" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="bold" fill="#f87171">8 Bytes (MySQL 5.6+: 5B + fractional)</text>

      <!-- 3. Supported Range -->
      <text x="0" y="90" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="bold" fill="#fbbf24">Date Range:</text>
      <text x="140" y="90" font-family="'Segoe UI', sans-serif" font-size="13" fill="#38bdf8">1000-01-01 00:00:00 to 9999-12-31</text>
      <text x="140" y="108" font-family="'Segoe UI', sans-serif" font-size="11" fill="#94a3b8">(Covers ~9,000 years of past/future history)</text>

      <!-- 4. Time Zone -->
      <text x="0" y="145" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="bold" fill="#fbbf24">Time Zone Conversion:</text>
      <text x="170" y="145" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="bold" fill="#f87171">❌ NO (Stores exact literal input)</text>
      <text x="170" y="163" font-family="'Segoe UI', sans-serif" font-size="11" fill="#94a3b8">Unchanged by server or client time zone shift</text>

      <!-- 5. Auto Update -->
      <text x="0" y="200" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="bold" fill="#fbbf24">Auto-Update Behavior:</text>
      <text x="170" y="200" font-family="'Segoe UI', sans-serif" font-size="13" fill="#cbd5e1">Does not auto-update by default</text>
      <text x="170" y="218" font-family="'Segoe UI', sans-serif" font-size="11" fill="#94a3b8">(Requires explicit DEFAULT / ON UPDATE)</text>

      <!-- 6. Best For -->
      <text x="0" y="255" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="bold" fill="#fbbf24">Best Use Cases:</text>
      <rect x="0" y="268" width="420" height="68" rx="8" fill="#0f172a" stroke="#334155" />
      <text x="15" y="290" font-family="'Segoe UI', sans-serif" font-size="12" fill="#e2e8f0">
        • Birthdays, Historical events, Appointment bookings
      </text>
      <text x="15" y="315" font-family="'Segoe UI', sans-serif" font-size="12" fill="#e2e8f0">
        • Fixed global schedules where time should NOT change
      </text>
    </g>
  </g>

  <!-- Right Card: TIMESTAMP -->
  <g transform="translate(580, 115)">
    <rect x="0" y="0" width="470" height="420" rx="12" fill="#1e293b" stroke="#38bdf8" stroke-width="2" filter="url(#dtShadow)" />
    <path d="M 0 12 Q 0 0 12 0 L 458 0 Q 470 0 470 12 L 470 48 L 0 48 Z" fill="#0284c7" />
    <text x="235" y="32" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="18" font-weight="bold" fill="#ffffff">
      ⏱️ TIMESTAMP (Timezone-Aware Epoch)
    </text>

    <!-- Details List -->
    <g transform="translate(25, 65)">
      <!-- 1. Format -->
      <text x="0" y="20" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="bold" fill="#38bdf8">Format:</text>
      <text x="140" y="20" font-family="'Segoe UI', sans-serif" font-size="13" fill="#f1f5f9">YYYY-MM-DD HH:MM:SS</text>

      <!-- 2. Storage Size -->
      <text x="0" y="55" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="bold" fill="#38bdf8">Storage Size:</text>
      <text x="140" y="55" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="bold" fill="#4ade80">4 Bytes (Compact 50% storage)</text>

      <!-- 3. Supported Range -->
      <text x="0" y="90" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="bold" fill="#38bdf8">Date Range:</text>
      <text x="140" y="90" font-family="'Segoe UI', sans-serif" font-size="13" fill="#f87171">1970-01-01 to 2038-01-19 (UTC)</text>
      <text x="140" y="108" font-family="'Segoe UI', sans-serif" font-size="11" fill="#fbbf24">⚠️ Limited by 32-bit UNIX Epoch (Year 2038 Bug)</text>

      <!-- 4. Time Zone -->
      <text x="0" y="145" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="bold" fill="#38bdf8">Time Zone Conversion:</text>
      <text x="170" y="145" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="bold" fill="#4ade80">✓ YES (Converts to/from UTC)</text>
      <text x="170" y="163" font-family="'Segoe UI', sans-serif" font-size="11" fill="#94a3b8">Converts local $\rightarrow$ UTC on write, UTC $\rightarrow$ local on read</text>

      <!-- 5. Auto Update -->
      <text x="0" y="200" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="bold" fill="#38bdf8">Auto-Update Behavior:</text>
      <text x="170" y="200" font-family="'Segoe UI', sans-serif" font-size="13" fill="#4ade80">Auto-updates on row modifications</text>
      <text x="170" y="218" font-family="'Segoe UI', sans-serif" font-size="11" fill="#94a3b8">DEFAULT CURRENT_TIMESTAMP ON UPDATE</text>

      <!-- 6. Best For -->
      <text x="0" y="255" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="bold" fill="#38bdf8">Best Use Cases:</text>
      <rect x="0" y="268" width="420" height="68" rx="8" fill="#0f172a" stroke="#334155" />
      <text x="15" y="290" font-family="'Segoe UI', sans-serif" font-size="12" fill="#e2e8f0">
        • Audit logs: <tspan font-family="monospace" fill="#38bdf8">created_at</tspan>, <tspan font-family="monospace" fill="#38bdf8">updated_at</tspan> columns
      </text>
      <text x="15" y="315" font-family="'Segoe UI', sans-serif" font-size="12" fill="#e2e8f0">
        • Transaction timestamps in globally distributed apps
      </text>
    </g>
  </g>

  <!-- Bottom Visual: How UTC Works in MySQL -->
  <g transform="translate(50, 555)">
    <rect x="0" y="0" width="1000" height="90" rx="10" fill="#1e293b" stroke="#64748b" stroke-width="1.5" />
    <text x="25" y="25" font-family="'Segoe UI', sans-serif" font-size="13.5" font-weight="bold" fill="#38bdf8">
      🌐 The UTC Pipeline for TIMESTAMP in MySQL:
    </text>
    
    <!-- Flow boxes -->
    <g transform="translate(30, 40)">
      <!-- Client -->
      <rect x="0" y="0" width="220" height="35" rx="6" fill="#0f172a" stroke="#38bdf8" />
      <text x="110" y="22" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="11.5" fill="#f1f5f9">Client Session (IST: UTC+5:30)</text>

      <!-- Arrow 1 -->
      <text x="245" y="22" font-family="'Segoe UI', sans-serif" font-size="16" fill="#38bdf8">→</text>

      <!-- Storage -->
      <rect x="270" y="0" width="280" height="35" rx="6" fill="#0284c7" fill-opacity="0.2" stroke="#38bdf8" stroke-width="2" />
      <text x="410" y="22" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="bold" fill="#38bdf8">MySQL Storage Engine (UTC / 0:00)</text>

      <!-- Arrow 2 -->
      <text x="575" y="22" font-family="'Segoe UI', sans-serif" font-size="16" fill="#38bdf8">→</text>

      <!-- Client 2 -->
      <rect x="600" y="0" width="240" height="35" rx="6" fill="#0f172a" stroke="#a855f7" />
      <text x="720" y="22" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="11.5" fill="#f1f5f9">US Client Read (EST: UTC-5:00)</text>
    </g>
  </g>
</svg>
