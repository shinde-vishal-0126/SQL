<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 620" width="100%" height="100%">
  <defs>
    <!-- Shadows & Filters -->
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
    <filter id="glow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0284c7" flood-opacity="0.2"/>
    </filter>

    <!-- Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </linearGradient>

    <!-- Markers -->
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="5" refY="3" orient="auto">
      <path d="M0,0 L0,6 L6,3 z" fill="#0284c7"/>
    </marker>
    <marker id="arrowRed" markerWidth="8" markerHeight="8" refX="5" refY="3" orient="auto">
      <path d="M0,0 L0,6 L6,3 z" fill="#dc2626"/>
    </marker>
  </defs>

  <style>
    .title { font-family: 'Segoe UI', system-ui, sans-serif; font-weight: 800; font-size: 22px; fill: #0f172a; }
    .subtitle { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 13px; fill: #64748b; }
    .card-title { font-family: 'Segoe UI', sans-serif; font-weight: 800; font-size: 14px; fill: #0f172a; }
    .cmd-name { font-family: 'Consolas', monospace; font-weight: 800; font-size: 13px; fill: #0284c7; }
    .tree-label { font-family: 'Segoe UI', sans-serif; font-weight: 800; font-size: 12px; }
    .tree-sub { font-family: 'Segoe UI', sans-serif; font-size: 11px; fill: #334155; }
  </style>

  <!-- Canvas Frame -->
  <rect x="15" y="15" width="990" height="590" rx="16" fill="url(#bgGrad)" stroke="#cbd5e1" stroke-width="2" filter="url(#shadow)"/>

  <!-- Top Title -->
  <text x="510" y="48" text-anchor="middle" class="title">DDL Architecture: Define Structure &amp; ALTER Operations</text>
  <text x="510" y="68" text-anchor="middle" class="subtitle">How CREATE, ALTER, DROP, and TRUNCATE Shape Database &amp; Table Structures</text>

  <!-- ==================== LEFT: DEFINE STRUCTURE OF DATA (Image 2) ==================== -->
  <g transform="translate(45, 95)">
    <rect width="440" height="485" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="25" y="32" class="card-title">📐 Define Structure of Your Data (DDL)</text>
    <text x="25" y="50" font-family="'Segoe UI', sans-serif" font-size="11" fill="#64748b">Working directly on the Database &amp; Table Blueprint</text>

    <!-- Cylinder Container -->
    <g transform="translate(30, 80)">
      <ellipse cx="65" cy="20" rx="60" ry="16" fill="#60a5fa" stroke="#1d4ed8" stroke-width="1.5"/>
      <path d="M 5 20 L 5 260 C 5 285, 125 285, 125 260 L 125 20 Z" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
      <ellipse cx="65" cy="20" rx="52" ry="12" fill="#93c5fd"/>
      <text x="65" y="24" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-weight="900" font-size="11" fill="#1e40af">DATABASE</text>

      <!-- Table inside DB -->
      <g transform="translate(18, 55)">
        <rect width="94" height="65" rx="3" fill="#ffffff" stroke="#2563eb" stroke-width="1.2"/>
        <rect width="94" height="15" rx="2" fill="#3b82f6"/>
        <text x="47" y="11" text-anchor="middle" font-size="8" font-weight="800" fill="#ffffff">Table</text>
        <line x1="31" y1="15" x2="31" y2="65" stroke="#bfdbfe" stroke-width="1"/>
        <line x1="62" y1="15" x2="62" y2="65" stroke="#bfdbfe" stroke-width="1"/>
        <line x1="0" y1="38" x2="94" y2="38" stroke="#bfdbfe" stroke-width="1"/>
      </g>

      <!-- Dropped Table Graphic (With red X) -->
      <g transform="translate(35, 175)">
        <rect width="60" height="45" rx="3" fill="#fef2f2" stroke="#ef4444" stroke-width="1.2"/>
        <line x1="0" y1="0" x2="60" y2="45" stroke="#dc2626" stroke-width="2.5"/>
        <line x1="60" y1="0" x2="0" y2="45" stroke="#dc2626" stroke-width="2.5"/>
        <text x="30" y="57" text-anchor="middle" font-size="8" font-weight="700" fill="#dc2626">DROP</text>
      </g>
    </g>

    <!-- User / Developer Defining Structure -->
    <g transform="translate(230, 210)">
      <rect width="180" height="90" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.2"/>
      <text x="90" y="30" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-weight="800" font-size="14" fill="#0f172a">🧑‍💻 Developer</text>
      <rect x="40" y="45" width="100" height="28" rx="5" fill="#334155"/>
      <text x="90" y="63" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-weight="700" font-size="11" fill="#ffffff">Define Engine</text>
    </g>

    <!-- Action Arrows from Developer to Database -->
    <!-- 1. CREATE arrow -->
    <path d="M 230 225 C 190 190, 160 145, 145 145" stroke="#16a34a" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
    <text x="185" y="170" text-anchor="middle" font-family="monospace" font-weight="800" font-size="11" fill="#16a34a">CREATE</text>

    <!-- 2. ALTER arrow -->
    <path d="M 230 255 L 145 255" stroke="#0284c7" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
    <text x="185" y="245" text-anchor="middle" font-family="monospace" font-weight="800" font-size="11" fill="#0284c7">ALTER</text>

    <!-- 3. DROP arrow -->
    <path d="M 230 285 C 190 310, 160 340, 115 340" stroke="#dc2626" stroke-width="2" fill="none" marker-end="url(#arrowRed)"/>
    <text x="185" y="325" text-anchor="middle" font-family="monospace" font-weight="800" font-size="11" fill="#dc2626">DROP</text>

    <!-- Bottom Implicit Commit Notice -->
    <rect x="25" y="405" width="390" height="55" rx="8" fill="#fff7ed" stroke="#fed7aa" stroke-width="1.2"/>
    <text x="38" y="426" font-family="'Segoe UI', sans-serif" font-weight="800" font-size="11" fill="#c2410c">⚡ MySQL Implicit Commit Rule:</text>
    <text x="38" y="444" font-family="'Segoe UI', sans-serif" font-size="10" fill="#9a3412">Most DDL commands automatically commit the transaction. Cannot be undone with ROLLBACK!</text>
  </g>


  <!-- ==================== RIGHT: ALTER SCOPE TREE (Image 1) ==================== -->
  <g transform="translate(515, 95)">
    <rect width="460" height="485" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="25" y="32" class="card-title">🌲 Scope of ALTER Commands</text>
    <text x="25" y="50" font-family="'Segoe UI', sans-serif" font-size="11" fill="#64748b">Modifying at the Database Level vs Table Level</text>

    <!-- 1. DATABASE LEVEL -->
    <g transform="translate(25, 75)">
      <rect width="410" height="85" rx="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.2"/>
      <text x="15" y="24" class="tree-label" fill="#1d4ed8">1. DATABASE LEVEL (ALTER DATABASE)</text>
      <line x1="20" y1="36" x2="20" y2="70" stroke="#93c5fd" stroke-width="1.5"/>
      <line x1="20" y1="52" x2="35" y2="52" stroke="#93c5fd" stroke-width="1.5"/>
      <text x="40" y="56" class="tree-sub">├── Change default <tspan font-weight="700">CHARACTER SET</tspan> (e.g., utf8mb4)</text>
      <line x1="20" y1="70" x2="35" y2="70" stroke="#93c5fd" stroke-width="1.5"/>
      <text x="40" y="74" class="tree-sub">└── Change default <tspan font-weight="700">COLLATION</tspan> (e.g., utf8mb4_unicode_ci)</text>
    </g>

    <!-- 2. TABLE LEVEL -->
    <g transform="translate(25, 175)">
      <rect width="410" height="285" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
      <text x="15" y="26" class="tree-label" fill="#0f172a">2. TABLE LEVEL (ALTER TABLE)</text>
      
      <!-- Tree elements -->
      <line x1="25" y1="38" x2="25" y2="265" stroke="#94a3b8" stroke-width="1.5"/>

      <!-- ADD column -->
      <line x1="25" y1="55" x2="40" y2="55" stroke="#94a3b8" stroke-width="1.5"/>
      <text x="45" y="59" class="tree-sub">├── <tspan font-weight="700" fill="#15803d">ADD</tspan> column (default at end, FIRST, AFTER)</text>

      <!-- MODIFY column -->
      <line x1="25" y1="85" x2="40" y2="85" stroke="#94a3b8" stroke-width="1.5"/>
      <text x="45" y="89" class="tree-sub">├── <tspan font-weight="700" fill="#0284c7">MODIFY</tspan> column (change datatype, nullability, default)</text>

      <!-- CHANGE column -->
      <line x1="25" y1="115" x2="40" y2="115" stroke="#94a3b8" stroke-width="1.5"/>
      <text x="45" y="119" class="tree-sub">├── <tspan font-weight="700" fill="#0284c7">CHANGE</tspan> column (rename + change datatype at once)</text>

      <!-- RENAME column -->
      <line x1="25" y1="145" x2="40" y2="145" stroke="#94a3b8" stroke-width="1.5"/>
      <text x="45" y="149" class="tree-sub">├── <tspan font-weight="700" fill="#0284c7">RENAME</tspan> column (MySQL 8.0+ syntax)</text>

      <!-- DROP column -->
      <line x1="25" y1="175" x2="40" y2="175" stroke="#94a3b8" stroke-width="1.5"/>
      <text x="45" y="179" class="tree-sub">├── <tspan font-weight="700" fill="#dc2626">DROP</tspan> column (removes attribute permanently)</text>

      <!-- ADD/DROP constraint -->
      <line x1="25" y1="205" x2="40" y2="205" stroke="#94a3b8" stroke-width="1.5"/>
      <text x="45" y="209" class="tree-sub">├── <tspan font-weight="700">ADD / DROP constraint</tspan> (PK, UNIQUE, FK, CHECK)</text>

      <!-- ADD/DROP index -->
      <line x1="25" y1="235" x2="40" y2="235" stroke="#94a3b8" stroke-width="1.5"/>
      <text x="45" y="239" class="tree-sub">├── <tspan font-weight="700">ADD / DROP index</tspan> (optimizes searches)</text>

      <!-- RENAME table -->
      <line x1="25" y1="265" x2="40" y2="265" stroke="#94a3b8" stroke-width="1.5"/>
      <text x="45" y="269" class="tree-sub">└── <tspan font-weight="700">RENAME table</tspan> (changes existing table name)</text>
    </g>
  </g>
</svg>
