<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" font-family="Segoe UI, Arial, sans-serif">
  <rect width="1000" height="470" fill="#f8fafc" rx="12"/>
  <text x="500" y="38" text-anchor="middle" font-size="24" font-weight="800" fill="#0f172a">Star Schema vs Snowflake Schema</text>
  <text x="500" y="62" text-anchor="middle" font-size="13" fill="#64748b">Fact table (numbers) in the centre · dimension tables (descriptions) around it</text>

  <!-- star -->
  <rect x="20" y="80" width="470" height="370" rx="12" fill="#ffffff" stroke="#fcd34d" stroke-width="2"/>
  <text x="255" y="108" text-anchor="middle" font-size="16" font-weight="800" fill="#b45309">⭐ STAR — one join per dimension</text>
  <g stroke="#94a3b8" stroke-width="2">
    <line x1="255" y1="265" x2="110" y2="170"/><line x1="255" y1="265" x2="400" y2="170"/>
    <line x1="255" y1="265" x2="110" y2="370"/><line x1="255" y1="265" x2="400" y2="370"/>
  </g>
  <rect x="180" y="235" width="150" height="60" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="255" y="260" text-anchor="middle" font-size="13" font-weight="800" fill="#b45309">fact_sales</text>
  <text x="255" y="280" text-anchor="middle" font-size="10" fill="#334155">keys + qty, amount</text>
  <rect x="45" y="145" width="130" height="46" rx="8" fill="#eff6ff" stroke="#2563eb"/><text x="110" y="166" text-anchor="middle" font-size="12" font-weight="700" fill="#1d4ed8">dim_date</text><text x="110" y="182" text-anchor="middle" font-size="10" fill="#334155">day, month, year</text>
  <rect x="335" y="145" width="130" height="46" rx="8" fill="#eff6ff" stroke="#2563eb"/><text x="400" y="166" text-anchor="middle" font-size="12" font-weight="700" fill="#1d4ed8">dim_product</text><text x="400" y="182" text-anchor="middle" font-size="10" fill="#334155">name, category, brand</text>
  <rect x="45" y="347" width="130" height="46" rx="8" fill="#eff6ff" stroke="#2563eb"/><text x="110" y="368" text-anchor="middle" font-size="12" font-weight="700" fill="#1d4ed8">dim_customer</text><text x="110" y="384" text-anchor="middle" font-size="10" fill="#334155">name, city, segment</text>
  <rect x="335" y="347" width="130" height="46" rx="8" fill="#eff6ff" stroke="#2563eb"/><text x="400" y="368" text-anchor="middle" font-size="12" font-weight="700" fill="#1d4ed8">dim_store</text><text x="400" y="384" text-anchor="middle" font-size="10" fill="#334155">store, city, region</text>
  <text x="255" y="428" text-anchor="middle" font-size="12" fill="#334155">Denormalized dims · fewer joins · faster · more duplicate text</text>

  <!-- snowflake -->
  <rect x="510" y="80" width="470" height="370" rx="12" fill="#ffffff" stroke="#93c5fd" stroke-width="2"/>
  <text x="745" y="108" text-anchor="middle" font-size="16" font-weight="800" fill="#1d4ed8">❄️ SNOWFLAKE — dims split further</text>
  <g stroke="#94a3b8" stroke-width="2">
    <line x1="700" y1="265" x2="600" y2="185"/><line x1="700" y1="265" x2="800" y2="185"/>
    <line x1="700" y1="265" x2="600" y2="370"/>
    <line x1="865" y1="185" x2="905" y2="250"/><line x1="905" y1="289" x2="905" y2="345"/>
    <line x1="665" y1="370" x2="735" y2="370"/>
  </g>
  <rect x="630" y="235" width="140" height="60" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="700" y="260" text-anchor="middle" font-size="13" font-weight="800" fill="#b45309">fact_sales</text>
  <text x="700" y="280" text-anchor="middle" font-size="10" fill="#334155">keys + qty, amount</text>
  <rect x="535" y="160" width="130" height="46" rx="8" fill="#eff6ff" stroke="#2563eb"/><text x="600" y="181" text-anchor="middle" font-size="12" font-weight="700" fill="#1d4ed8">dim_date</text><text x="600" y="197" text-anchor="middle" font-size="10" fill="#334155">day, month, year</text>
  <rect x="735" y="160" width="130" height="46" rx="8" fill="#eff6ff" stroke="#2563eb"/><text x="800" y="181" text-anchor="middle" font-size="12" font-weight="700" fill="#1d4ed8">dim_product</text><text x="800" y="197" text-anchor="middle" font-size="10" fill="#334155">name, category_key</text>
  <rect x="845" y="245" width="120" height="44" rx="8" fill="#f0f9ff" stroke="#0284c7"/><text x="905" y="265" text-anchor="middle" font-size="11" font-weight="700" fill="#0369a1">dim_category</text><text x="905" y="280" text-anchor="middle" font-size="10" fill="#334155">category, dept_key</text>
  <rect x="845" y="345" width="120" height="44" rx="8" fill="#f0f9ff" stroke="#0284c7"/><text x="905" y="365" text-anchor="middle" font-size="11" font-weight="700" fill="#0369a1">dim_department</text><text x="905" y="380" text-anchor="middle" font-size="10" fill="#334155">department</text>
  <rect x="535" y="347" width="130" height="46" rx="8" fill="#eff6ff" stroke="#2563eb"/><text x="600" y="368" text-anchor="middle" font-size="12" font-weight="700" fill="#1d4ed8">dim_customer</text><text x="600" y="384" text-anchor="middle" font-size="10" fill="#334155">name, city_key</text>
  <rect x="735" y="347" width="100" height="46" rx="8" fill="#f0f9ff" stroke="#0284c7"/><text x="785" y="368" text-anchor="middle" font-size="11" font-weight="700" fill="#0369a1">dim_city</text><text x="785" y="384" text-anchor="middle" font-size="10" fill="#334155">city, state</text>
  <text x="745" y="428" text-anchor="middle" font-size="12" fill="#334155">Normalized dims · less duplication · more joins · slower</text>
</svg>
