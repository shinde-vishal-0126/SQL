<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 250">
    <rect width="600" height="250" fill="#eeeeee" rx="10"/>
    <text x="300" y="40" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#575724" text-anchor="middle">Anatomy of Date &amp; Time</text>
    
    <!-- Date Section -->
    <rect x="50" y="80" width="220" height="80" rx="5" fill="#e8e8e9" stroke="#0072b0" stroke-width="2"/>
    <text x="160" y="70" font-family="Arial" font-size="16" font-weight="bold" fill="#0072b0" text-anchor="middle">DATE</text>
    <text x="160" y="115" font-family="Courier New" font-size="24" font-weight="bold" fill="#1f1f1f" text-anchor="middle">2025-08-20</text>
    
    <path d="M 90 135 L 90 145 L 140 145 L 140 135" fill="none" stroke="#5f5f5f" stroke-width="2"/>
    <text x="115" y="160" font-family="Arial" font-size="12" fill="#5f5f5f" text-anchor="middle">Year</text>
    
    <path d="M 150 135 L 150 145 L 180 145 L 180 135" fill="none" stroke="#5f5f5f" stroke-width="2"/>
    <text x="165" y="160" font-family="Arial" font-size="12" fill="#5f5f5f" text-anchor="middle">Month</text>
    
    <path d="M 190 135 L 190 145 L 220 145 L 220 135" fill="none" stroke="#5f5f5f" stroke-width="2"/>
    <text x="205" y="160" font-family="Arial" font-size="12" fill="#5f5f5f" text-anchor="middle">Day</text>

    <!-- Time Section -->
    <rect x="330" y="80" width="220" height="80" rx="5" fill="#e8e8e9" stroke="#267d6b" stroke-width="2"/>
    <text x="440" y="70" font-family="Arial" font-size="16" font-weight="bold" fill="#267d6b" text-anchor="middle">TIME</text>
    <text x="440" y="115" font-family="Courier New" font-size="24" font-weight="bold" fill="#1f1f1f" text-anchor="middle">18:55:45</text>

    <path d="M 390 135 L 390 145 L 420 145 L 420 135" fill="none" stroke="#5f5f5f" stroke-width="2"/>
    <text x="405" y="160" font-family="Arial" font-size="12" fill="#5f5f5f" text-anchor="middle">Hour</text>
    
    <path d="M 430 135 L 430 145 L 460 145 L 460 135" fill="none" stroke="#5f5f5f" stroke-width="2"/>
    <text x="445" y="160" font-family="Arial" font-size="12" fill="#5f5f5f" text-anchor="middle">Min</text>
    
    <path d="M 470 135 L 470 145 L 500 145 L 500 135" fill="none" stroke="#5f5f5f" stroke-width="2"/>
    <text x="485" y="160" font-family="Arial" font-size="12" fill="#5f5f5f" text-anchor="middle">Sec</text>

    <!-- Timestamp Combined -->
    <rect x="190" y="190" width="220" height="40" rx="5" fill="#eeeeee" stroke="#793a74" stroke-width="2" stroke-dasharray="4,4"/>
    <text x="300" y="215" font-family="Arial" font-size="14" font-weight="bold" fill="#793a74" text-anchor="middle">TIMESTAMP / DATETIME</text>
</svg>