<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="k" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker>
  </defs>
  <rect width="1000" height="520" fill="#f8fafc" rx="12"/>
  <text x="500" y="38" text-anchor="middle" font-size="24" font-weight="800" fill="#0f172a">Pessimistic vs Optimistic Locking</text>
  <text x="500" y="62" text-anchor="middle" font-size="13" fill="#64748b">Pessimistic = lock first and make others wait · Optimistic = no lock, check a version when saving</text>

  <!-- pessimistic -->
  <rect x="20" y="80" width="960" height="200" rx="12" fill="#ffffff" stroke="#fca5a5" stroke-width="2"/>
  <rect x="20" y="80" width="960" height="40" rx="12" fill="#fee2e2"/>
  <text x="500" y="106" text-anchor="middle" font-size="16" font-weight="800" fill="#b91c1c">🔒 PESSIMISTIC — SELECT ... FOR UPDATE</text>
  <text x="40" y="160" font-size="13" font-weight="700" fill="#334155">T1</text>
  <rect x="80" y="140" width="220" height="32" rx="6" fill="#fef2f2" stroke="#dc2626"/><text x="190" y="161" text-anchor="middle" font-size="11" font-family="Consolas, monospace" fill="#b91c1c">SELECT ... FOR UPDATE</text>
  <rect x="320" y="140" width="200" height="32" rx="6" fill="#ffffff" stroke="#94a3b8"/><text x="420" y="161" text-anchor="middle" font-size="11" font-family="Consolas, monospace" fill="#334155">UPDATE stock = 9</text>
  <rect x="540" y="140" width="110" height="32" rx="6" fill="#dcfce7" stroke="#16a34a"/><text x="595" y="161" text-anchor="middle" font-size="12" font-weight="700" fill="#15803d">COMMIT</text>
  <text x="40" y="225" font-size="13" font-weight="700" fill="#334155">T2</text>
  <rect x="80" y="205" width="570" height="32" rx="6" fill="#fffbeb" stroke="#d97706" stroke-dasharray="5,4"/><text x="365" y="226" text-anchor="middle" font-size="12" fill="#b45309">⏳ SELECT ... FOR UPDATE waits for the T1 lock</text>
  <line x1="652" y1="221" x2="688" y2="221" stroke="#475569" stroke-width="2" marker-end="url(#k)"/>
  <rect x="692" y="205" width="260" height="32" rx="6" fill="#ffffff" stroke="#94a3b8"/><text x="822" y="226" text-anchor="middle" font-size="11" font-family="Consolas, monospace" fill="#334155">reads stock = 9 → UPDATE 8</text>
  <text x="40" y="266" font-size="12" fill="#334155">Best for high contention and short transactions: bank balance, seat booking, stock at checkout.</text>

  <!-- optimistic -->
  <rect x="20" y="300" width="960" height="200" rx="12" fill="#ffffff" stroke="#93c5fd" stroke-width="2"/>
  <rect x="20" y="300" width="960" height="40" rx="12" fill="#dbeafe"/>
  <text x="500" y="326" text-anchor="middle" font-size="16" font-weight="800" fill="#1d4ed8">🔓 OPTIMISTIC — version column</text>
  <text x="40" y="380" font-size="13" font-weight="700" fill="#334155">T1</text>
  <rect x="80" y="360" width="220" height="32" rx="6" fill="#eff6ff" stroke="#2563eb"/><text x="190" y="381" text-anchor="middle" font-size="11" font-family="Consolas, monospace" fill="#1d4ed8">read stock=10, version=3</text>
  <rect x="320" y="360" width="380" height="32" rx="6" fill="#ffffff" stroke="#94a3b8"/><text x="510" y="381" text-anchor="middle" font-size="11" font-family="Consolas, monospace" fill="#334155">UPDATE ... version=4 WHERE version=3</text>
  <rect x="720" y="360" width="230" height="32" rx="6" fill="#dcfce7" stroke="#16a34a"/><text x="835" y="381" text-anchor="middle" font-size="12" font-weight="700" fill="#15803d">✅ 1 row affected</text>
  <text x="40" y="445" font-size="13" font-weight="700" fill="#334155">T2</text>
  <rect x="80" y="425" width="220" height="32" rx="6" fill="#eff6ff" stroke="#2563eb"/><text x="190" y="446" text-anchor="middle" font-size="11" font-family="Consolas, monospace" fill="#1d4ed8">read stock=10, version=3</text>
  <rect x="320" y="425" width="380" height="32" rx="6" fill="#ffffff" stroke="#94a3b8"/><text x="510" y="446" text-anchor="middle" font-size="11" font-family="Consolas, monospace" fill="#334155">UPDATE ... WHERE version=3 (now 4)</text>
  <rect x="720" y="425" width="230" height="32" rx="6" fill="#fef2f2" stroke="#dc2626"/><text x="835" y="446" text-anchor="middle" font-size="12" font-weight="700" fill="#b91c1c">❌ 0 rows → read again, retry</text>
  <text x="40" y="484" font-size="12" fill="#334155">Best for low contention and long "think time": editing a profile, admin forms, REST APIs.</text>
</svg>
