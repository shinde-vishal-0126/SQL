<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300">
    <rect width="800" height="300" fill="#eeeeee" rx="10"/>
    <text x="400" y="30" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#575724" text-anchor="middle">SELECT Clause Subquery</text>
    
    <rect x="50" y="60" width="700" height="150" fill="#e8e8e9" stroke="#333333" stroke-width="2" rx="5"/>
    
    <text x="80" y="90" font-family="Courier New, monospace" font-size="16" font-weight="bold" fill="#296fa9">SELECT</text>
    <text x="160" y="90" font-family="Courier New, monospace" font-size="16" fill="#1f1f1f">column1, </text>
    
    <text x="160" y="130" font-family="Courier New, monospace" font-size="16" font-weight="bold" fill="#793a74">( </text>
    <rect x="180" y="105" width="450" height="40" fill="#eeeeee" stroke="#793a74" stroke-width="1"/>
    
    <text x="190" y="130" font-family="Courier New, monospace" font-size="14" font-weight="bold" fill="#296fa9">SELECT</text>
    <text x="250" y="130" font-family="Courier New, monospace" font-size="14" fill="#1f1f1f">column</text>
    <text x="310" y="130" font-family="Courier New, monospace" font-size="14" font-weight="bold" fill="#296fa9">FROM</text>
    <text x="350" y="130" font-family="Courier New, monospace" font-size="14" fill="#1f1f1f">table1</text>
    <text x="410" y="130" font-family="Courier New, monospace" font-size="14" font-weight="bold" fill="#296fa9">WHERE</text>
    <text x="460" y="130" font-family="Courier New, monospace" font-size="14" fill="#1f1f1f">condition</text>
    
    <text x="640" y="130" font-family="Courier New, monospace" font-size="16" font-weight="bold" fill="#793a74">) AS alias</text>
    
    <text x="80" y="170" font-family="Courier New, monospace" font-size="16" font-weight="bold" fill="#296fa9">FROM</text>
    <text x="130" y="170" font-family="Courier New, monospace" font-size="16" fill="#1f1f1f">table2</text>
    
    <!-- Rule block -->
    <rect x="250" y="230" width="300" height="50" fill="#eeeeee" stroke="#b80b0b" stroke-width="2"/>
    <text x="400" y="250" font-family="Arial" font-size="14" font-weight="bold" fill="#b80b0b" text-anchor="middle">RULES</text>
    <text x="400" y="270" font-family="Arial" font-size="12" fill="#1f1f1f" text-anchor="middle">Only Scalar Subqueries are allowed here</text>

    <!-- Subquery label -->
    <path d="M 400 150 L 400 180" stroke="#793a74" stroke-width="2"/>
    <text x="400" y="200" font-family="Arial" font-size="14" font-weight="bold" fill="#793a74" text-anchor="middle">Subquery</text>
</svg>
