<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 250">
    <rect width="600" height="250" fill="#eeeeee" rx="10"/>
    <text x="300" y="30" font-family="Arial" font-size="18" font-weight="bold" fill="#1f1f1f" text-anchor="middle">Window Rank Functions | Syntax</text>
    
    <text x="300" y="80" font-family="Courier New" font-size="20" font-weight="bold" fill="#0072b0" text-anchor="middle">RANK() OVER (PARTITION BY col1 ORDER BY col2)</text>
    
    <!-- Arrows and Labels -->
    <path d="M 180 95 L 180 120" fill="none" stroke="#b80b0b" stroke-width="2" marker-end="url(#arrow_red)"/>
    <text x="180" y="140" font-family="Arial" font-size="14" fill="#1f1f1f" text-anchor="middle">Expression</text>
    <text x="180" y="160" font-family="Arial" font-size="14" font-weight="bold" fill="#b80b0b" text-anchor="middle">must be empty</text>

    <path d="M 330 95 L 330 120" fill="none" stroke="#0072b0" stroke-width="2" marker-end="url(#arrow_blue)"/>
    <text x="330" y="140" font-family="Arial" font-size="14" fill="#1f1f1f" text-anchor="middle">Partition By</text>
    <text x="330" y="160" font-family="Arial" font-size="14" font-weight="bold" fill="#0072b0" text-anchor="middle">is Optional</text>

    <path d="M 470 95 L 470 120" fill="none" stroke="#575724" stroke-width="2" marker-end="url(#arrow_yellow)"/>
    <text x="470" y="140" font-family="Arial" font-size="14" fill="#1f1f1f" text-anchor="middle">Order By</text>
    <text x="470" y="160" font-family="Arial" font-size="14" font-weight="bold" fill="#575724" text-anchor="middle">is Required</text>

    <defs>
        <marker id="arrow_red" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
            <path d="M0,0 L0,6 L9,3 z" fill="#F44747" />
        </marker>
        <marker id="arrow_blue" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
            <path d="M0,0 L0,6 L9,3 z" fill="#4FC1FF" />
        </marker>
        <marker id="arrow_yellow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
            <path d="M0,0 L0,6 L9,3 z" fill="#DCDCAA" />
        </marker>
    </defs>
</svg>