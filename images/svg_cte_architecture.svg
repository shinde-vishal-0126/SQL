<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300">
    <rect width="800" height="300" fill="#eeeeee" rx="10"/>
    
    <!-- Title -->
    <text x="400" y="40" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#a38a00" text-anchor="middle">Simple Query vs CTE Execution</text>
    
    <!-- Simple Query -->
    <text x="200" y="80" font-family="Arial" font-size="18" font-weight="bold" fill="#267d6b" text-anchor="middle">1. Normal Query Flow</text>
    <rect x="50" y="100" width="80" height="100" fill="#e8e8e9" stroke="#0072b0" stroke-width="2"/>
    <text x="90" y="155" font-family="Arial" font-size="14" fill="#0072b0" text-anchor="middle">DB Tables</text>
    
    <path d="M 130 150 L 190 150" fill="none" stroke="#333333" stroke-width="2" marker-end="url(#arrow)"/>
    
    <rect x="190" y="120" width="100" height="60" fill="#eeeeee" stroke="#a38a00" stroke-width="2"/>
    <text x="240" y="145" font-family="Arial" font-size="14" font-weight="bold" fill="#1f1f1f" text-anchor="middle">SELECT...</text>
    <text x="240" y="165" font-family="Arial" font-size="14" font-weight="bold" fill="#1f1f1f" text-anchor="middle">FROM...</text>
    
    <path d="M 290 150 L 350 150" fill="none" stroke="#333333" stroke-width="2" marker-end="url(#arrow)"/>
    
    <rect x="350" y="120" width="60" height="60" fill="#eeeeee" stroke="#267d6b" stroke-width="2"/>
    <text x="380" y="155" font-family="Arial" font-size="14" font-weight="bold" fill="#267d6b" text-anchor="middle">Result</text>
    
    <!-- CTE Architecture -->
    <text x="600" y="80" font-family="Arial" font-size="18" font-weight="bold" fill="#b80b0b" text-anchor="middle">2. CTE Query Flow</text>
    <rect x="450" y="100" width="60" height="100" fill="#e8e8e9" stroke="#0072b0" stroke-width="2"/>
    <text x="480" y="155" font-family="Arial" font-size="12" fill="#0072b0" text-anchor="middle">DB</text>
    
    <path d="M 510 130 Q 530 110 550 130" fill="none" stroke="#b80b0b" stroke-width="2" marker-end="url(#arrow)"/>
    <polygon points="550,130 540,125 540,135" fill="#F44747"/>
    
    <rect x="550" y="90" width="100" height="50" fill="#eeeeee" stroke="#b80b0b" stroke-width="2"/>
    <text x="600" y="110" font-family="Arial" font-size="12" font-weight="bold" fill="#1f1f1f" text-anchor="middle">CTE Query</text>
    <text x="600" y="130" font-family="Arial" font-size="12" fill="#1f1f1f" text-anchor="middle">(Virtual Table)</text>
    
    <path d="M 650 115 Q 700 130 650 180" fill="none" stroke="#267d6b" stroke-width="2" marker-end="url(#arrow)"/>
    <polygon points="650,180 660,175 660,185" fill="#4EC9B0"/>
    
    <rect x="550" y="170" width="100" height="60" fill="#eeeeee" stroke="#a38a00" stroke-width="2"/>
    <text x="600" y="190" font-family="Arial" font-size="12" font-weight="bold" fill="#1f1f1f" text-anchor="middle">Main Query</text>
    <text x="600" y="210" font-family="Arial" font-size="12" fill="#1f1f1f" text-anchor="middle">SELECT...</text>
    
    <path d="M 510 200 L 550 200" fill="none" stroke="#0072b0" stroke-width="2" marker-end="url(#arrow)"/>
    <polygon points="550,200 540,195 540,205" fill="#4FC1FF"/>
    
    <path d="M 650 200 L 710 200" fill="none" stroke="#333333" stroke-width="2" marker-end="url(#arrow)"/>
    
    <rect x="710" y="170" width="60" height="60" fill="#eeeeee" stroke="#267d6b" stroke-width="2"/>
    <text x="740" y="205" font-family="Arial" font-size="12" font-weight="bold" fill="#267d6b" text-anchor="middle">Final</text>
</svg>
