<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 150">
    <rect width="600" height="150" fill="#eeeeee" rx="10"/>
    <text x="300" y="30" font-family="Courier New" font-size="20" font-weight="bold" fill="#0072b0" text-anchor="middle">IF() Function (MySQL)</text>
    <text x="300" y="60" font-family="Arial" font-size="14" fill="#5f5f5f" text-anchor="middle">Shorthand for simple CASE statements.</text>
    
    <rect x="20" y="80" width="560" height="40" rx="5" fill="#e8e8e9" stroke="#b1b1b6" stroke-width="2"/>
    <text x="30" y="105" font-family="Courier New" font-size="16" fill="#0072b0" text-anchor="start">IF(</text>
    <text x="70" y="105" font-family="Courier New" font-size="16" fill="#1f1f1f" text-anchor="start">score > 50,</text>
    <text x="200" y="105" font-family="Courier New" font-size="16" fill="#267d6b" text-anchor="start">'Pass',</text>
    <text x="280" y="105" font-family="Courier New" font-size="16" fill="#b80b0b" text-anchor="start">'Fail'</text>
    <text x="350" y="105" font-family="Courier New" font-size="16" fill="#0072b0" text-anchor="start">)</text>
    
    <text x="70" y="135" font-family="Arial" font-size="10" fill="#5f5f5f" text-anchor="start">Condition</text>
    <text x="200" y="135" font-family="Arial" font-size="10" fill="#5f5f5f" text-anchor="start">If TRUE</text>
    <text x="280" y="135" font-family="Arial" font-size="10" fill="#5f5f5f" text-anchor="start">If FALSE</text>
</svg>