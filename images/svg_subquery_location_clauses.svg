<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
    <rect width="800" height="400" fill="#eeeeee" rx="10"/>
    <text x="400" y="30" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#575724" text-anchor="middle">Subquery Location | Clauses</text>
    
    <rect x="300" y="50" width="200" height="40" fill="#e8e8e9" stroke="#0072b0" stroke-width="3"/>
    <text x="400" y="75" font-family="Arial" font-size="16" font-weight="bold" fill="#1f1f1f" text-anchor="middle">Location | Clauses</text>

    <!-- 4 main branches -->
    <path d="M 400 90 L 400 120" stroke="#0072b0" stroke-width="2"/>
    <path d="M 150 120 L 650 120" stroke="#0072b0" stroke-width="2"/>
    <path d="M 150 120 L 150 140" stroke="#0072b0" stroke-width="2"/>
    <path d="M 316 120 L 316 140" stroke="#0072b0" stroke-width="2"/>
    <path d="M 483 120 L 483 140" stroke="#0072b0" stroke-width="2"/>
    <path d="M 650 120 L 650 140" stroke="#0072b0" stroke-width="2"/>

    <!-- 4 Boxes -->
    <rect x="100" y="140" width="100" height="40" fill="#eeeeee" stroke="#333333" stroke-width="2"/>
    <text x="150" y="165" font-family="Arial" font-size="14" font-weight="bold" fill="#1f1f1f" text-anchor="middle">SELECT</text>

    <rect x="266" y="140" width="100" height="40" fill="#e8e8e9" stroke="#267d6b" stroke-width="4"/>
    <text x="316" y="165" font-family="Arial" font-size="14" font-weight="bold" fill="#267d6b" text-anchor="middle">FROM</text>

    <rect x="433" y="140" width="100" height="40" fill="#eeeeee" stroke="#333333" stroke-width="2"/>
    <text x="483" y="165" font-family="Arial" font-size="14" font-weight="bold" fill="#1f1f1f" text-anchor="middle">JOIN</text>

    <rect x="600" y="140" width="100" height="40" fill="#eeeeee" stroke="#333333" stroke-width="2"/>
    <text x="650" y="165" font-family="Arial" font-size="14" font-weight="bold" fill="#1f1f1f" text-anchor="middle">WHERE</text>

    <!-- WHERE Branches -->
    <path d="M 650 180 L 650 210" stroke="#333333" stroke-width="2"/>
    <path d="M 500 210 L 750 210" stroke="#333333" stroke-width="2"/>
    <path d="M 500 210 L 500 230" stroke="#333333" stroke-width="2"/>
    <path d="M 750 210 L 750 230" stroke="#333333" stroke-width="2"/>

    <rect x="440" y="230" width="120" height="40" fill="#eeeeee" stroke="#793a74" stroke-width="2"/>
    <text x="500" y="245" font-family="Arial" font-size="12" fill="#793a74" text-anchor="middle">Comparison</text>
    <text x="500" y="260" font-family="Arial" font-size="12" fill="#793a74" text-anchor="middle">operators</text>

    <rect x="690" y="230" width="120" height="40" fill="#eeeeee" stroke="#793a74" stroke-width="2"/>
    <text x="750" y="245" font-family="Arial" font-size="12" fill="#793a74" text-anchor="middle">Logical</text>
    <text x="750" y="260" font-family="Arial" font-size="12" fill="#793a74" text-anchor="middle">operators</text>

    <!-- Comparison operators -->
    <path d="M 500 270 L 500 300" stroke="#793a74" stroke-width="2"/>
    <path d="M 400 300 L 600 300" stroke="#793a74" stroke-width="2"/>
    <text x="400" y="325" font-family="Arial" font-size="16" fill="#1f1f1f" text-anchor="middle">&lt;</text>
    <text x="440" y="325" font-family="Arial" font-size="16" fill="#1f1f1f" text-anchor="middle">&gt;</text>
    <text x="480" y="325" font-family="Arial" font-size="16" fill="#1f1f1f" text-anchor="middle">=</text>
    <text x="520" y="325" font-family="Arial" font-size="16" fill="#1f1f1f" text-anchor="middle">!=</text>
    <text x="560" y="325" font-family="Arial" font-size="16" fill="#1f1f1f" text-anchor="middle">&gt;=</text>
    <text x="600" y="325" font-family="Arial" font-size="16" fill="#1f1f1f" text-anchor="middle">&lt;=</text>
    
    <!-- Logical operators -->
    <path d="M 750 270 L 750 300" stroke="#793a74" stroke-width="2"/>
    <path d="M 660 300 L 840 300" stroke="#793a74" stroke-width="2"/>
    <rect x="640" y="310" width="40" height="25" fill="#eeeeee" stroke="#333333" stroke-width="1"/>
    <text x="660" y="327" font-family="Arial" font-size="12" fill="#1f1f1f" text-anchor="middle">IN</text>

    <rect x="690" y="310" width="40" height="25" fill="#eeeeee" stroke="#333333" stroke-width="1"/>
    <text x="710" y="327" font-family="Arial" font-size="12" fill="#1f1f1f" text-anchor="middle">ANY</text>

    <rect x="740" y="310" width="40" height="25" fill="#eeeeee" stroke="#333333" stroke-width="1"/>
    <text x="760" y="327" font-family="Arial" font-size="12" fill="#1f1f1f" text-anchor="middle">ALL</text>

    <rect x="790" y="310" width="60" height="25" fill="#eeeeee" stroke="#333333" stroke-width="1"/>
    <text x="820" y="327" font-family="Arial" font-size="12" fill="#1f1f1f" text-anchor="middle">EXISTS</text>
</svg>
