<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450">
    <rect width="800" height="450" fill="#eeeeee" rx="10"/>
    
    <rect x="300" y="20" width="200" height="30" fill="#DCDCAA" rx="5"/>
    <text x="400" y="40" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#000000" text-anchor="middle">Indexing Strategy</text>
    
    <!-- Strategy 1 -->
    <rect x="50" y="80" width="300" height="150" fill="#e8e8e9" stroke="#b1b1b6" stroke-width="2" rx="5"/>
    <rect x="50" y="70" width="200" height="20" fill="#E8EFF5" stroke="#0072b0" stroke-width="2" rx="3"/>
    <text x="150" y="85" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#000000" text-anchor="middle">#1 Initial Indexing Strategy</text>
    
    <rect x="70" y="110" width="100" height="25" fill="#f9f9f9" rx="3"/>
    <text x="120" y="127" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#1f1f1f" text-anchor="middle">OLAP</text>
    <text x="120" y="150" font-family="Arial, sans-serif" font-size="12" fill="#1f1f1f" text-anchor="middle">Optimize READ</text>
    <text x="120" y="180" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#1f1f1f" text-anchor="middle">ColumnStore</text>
    
    <rect x="220" y="110" width="100" height="25" fill="#f9f9f9" rx="3"/>
    <text x="270" y="127" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#1f1f1f" text-anchor="middle">OLTP</text>
    <text x="270" y="150" font-family="Arial, sans-serif" font-size="12" fill="#1f1f1f" text-anchor="middle">Optimize WRITE</text>
    <text x="270" y="180" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#1f1f1f" text-anchor="middle">Clustered (PK)</text>
    
    <!-- Strategy 2 -->
    <rect x="450" y="80" width="300" height="150" fill="#e8e8e9" stroke="#b1b1b6" stroke-width="2" rx="5"/>
    <rect x="450" y="70" width="200" height="20" fill="#E8EFF5" stroke="#267d6b" stroke-width="2" rx="3"/>
    <text x="550" y="85" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#000000" text-anchor="middle">#2 Usage Patterns Indexing</text>
    <rect x="470" y="110" width="20" height="20" fill="#d9d9d9" rx="3"/><text x="480" y="125" font-family="Arial" font-size="12" fill="#1f1f1f" text-anchor="middle">1</text>
    <text x="500" y="125" font-family="Arial, sans-serif" font-size="12" fill="#1f1f1f">Identify frequently used tables/cols</text>
    <rect x="470" y="140" width="20" height="20" fill="#d9d9d9" rx="3"/><text x="480" y="155" font-family="Arial" font-size="12" fill="#1f1f1f" text-anchor="middle">2</text>
    <text x="500" y="155" font-family="Arial, sans-serif" font-size="12" fill="#1f1f1f">Choose Right Index</text>
    <rect x="470" y="170" width="20" height="20" fill="#d9d9d9" rx="3"/><text x="480" y="185" font-family="Arial" font-size="12" fill="#1f1f1f" text-anchor="middle">3</text>
    <text x="500" y="185" font-family="Arial, sans-serif" font-size="12" fill="#1f1f1f">Test Index Performance</text>
    
    <!-- Strategy 3 -->
    <rect x="50" y="270" width="300" height="150" fill="#e8e8e9" stroke="#b1b1b6" stroke-width="2" rx="5"/>
    <rect x="50" y="260" width="200" height="20" fill="#E8EFF5" stroke="#793a74" stroke-width="2" rx="3"/>
    <text x="150" y="275" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#000000" text-anchor="middle">#3 Scenario-Based Indexing</text>
    <rect x="70" y="295" width="20" height="20" fill="#d9d9d9" rx="3"/><text x="80" y="310" font-family="Arial" font-size="12" fill="#1f1f1f" text-anchor="middle">1</text>
    <text x="100" y="310" font-family="Arial, sans-serif" font-size="12" fill="#1f1f1f">Identify Slow Queries</text>
    <rect x="70" y="325" width="20" height="20" fill="#d9d9d9" rx="3"/><text x="80" y="340" font-family="Arial" font-size="12" fill="#1f1f1f" text-anchor="middle">2</text>
    <text x="100" y="340" font-family="Arial, sans-serif" font-size="12" fill="#1f1f1f">Check Execution Plan</text>
    <rect x="70" y="355" width="20" height="20" fill="#d9d9d9" rx="3"/><text x="80" y="370" font-family="Arial" font-size="12" fill="#1f1f1f" text-anchor="middle">3</text>
    <text x="100" y="370" font-family="Arial, sans-serif" font-size="12" fill="#1f1f1f">Choose Right Index</text>
    <rect x="70" y="385" width="20" height="20" fill="#d9d9d9" rx="3"/><text x="80" y="400" font-family="Arial" font-size="12" fill="#1f1f1f" text-anchor="middle">4</text>
    <text x="100" y="400" font-family="Arial, sans-serif" font-size="12" fill="#1f1f1f">Compare Execution Plans</text>
    
    <!-- Strategy 4 -->
    <rect x="450" y="270" width="300" height="150" fill="#e8e8e9" stroke="#b1b1b6" stroke-width="2" rx="5"/>
    <rect x="450" y="260" width="200" height="20" fill="#E8EFF5" stroke="#575724" stroke-width="2" rx="3"/>
    <text x="550" y="275" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#000000" text-anchor="middle">#4 Monitoring &amp; Maintenance</text>
    <rect x="470" y="290" width="20" height="18" fill="#d9d9d9" rx="3"/><text x="480" y="303" font-family="Arial" font-size="11" fill="#1f1f1f" text-anchor="middle">1</text>
    <text x="500" y="303" font-family="Arial, sans-serif" font-size="12" fill="#1f1f1f">Monitor Index Usage</text>
    <rect x="470" y="315" width="20" height="18" fill="#d9d9d9" rx="3"/><text x="480" y="328" font-family="Arial" font-size="11" fill="#1f1f1f" text-anchor="middle">2</text>
    <text x="500" y="328" font-family="Arial, sans-serif" font-size="12" fill="#1f1f1f">Monitor Missing Indexes</text>
    <rect x="470" y="340" width="20" height="18" fill="#d9d9d9" rx="3"/><text x="480" y="353" font-family="Arial" font-size="11" fill="#1f1f1f" text-anchor="middle">3</text>
    <text x="500" y="353" font-family="Arial, sans-serif" font-size="12" fill="#1f1f1f">Monitor Duplicate Indexes</text>
    <rect x="470" y="365" width="20" height="18" fill="#d9d9d9" rx="3"/><text x="480" y="378" font-family="Arial" font-size="11" fill="#1f1f1f" text-anchor="middle">4</text>
    <text x="500" y="378" font-family="Arial, sans-serif" font-size="12" fill="#1f1f1f">Update Statistics</text>
    <rect x="470" y="390" width="20" height="18" fill="#d9d9d9" rx="3"/><text x="480" y="403" font-family="Arial" font-size="11" fill="#1f1f1f" text-anchor="middle">5</text>
    <text x="500" y="403" font-family="Arial, sans-serif" font-size="12" fill="#1f1f1f">Monitor Fragmentation</text>

</svg>
