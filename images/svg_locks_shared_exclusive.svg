<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 480" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="k" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker>
  </defs>
  <rect width="1000" height="480" fill="#f8fafc" rx="12"/>
  <text x="500" y="38" text-anchor="middle" font-size="24" font-weight="800" fill="#0f172a">Shared (S) vs Exclusive (X) Locks</text>
  <text x="500" y="62" text-anchor="middle" font-size="13" fill="#64748b">Many readers can share a row · one writer blocks everybody else until COMMIT</text>

  <!-- shared -->
  <rect x="20" y="85" width="470" height="220" rx="12" fill="#ffffff" stroke="#86efac" stroke-width="2"/>
  <rect x="20" y="85" width="470" height="44" rx="12" fill="#dcfce7"/>
  <text x="255" y="113" text-anchor="middle" font-size="16" font-weight="800" fill="#15803d">🔓 SHARED LOCK (S) — read together</text>
  <rect x="45" y="150" width="130" height="40" rx="8" fill="#f0fdf4" stroke="#16a34a"/><text x="110" y="175" text-anchor="middle" font-size="12" font-weight="700" fill="#15803d">T1: FOR SHARE</text>
  <rect x="45" y="210" width="130" height="40" rx="8" fill="#f0fdf4" stroke="#16a34a"/><text x="110" y="235" text-anchor="middle" font-size="12" font-weight="700" fill="#15803d">T2: FOR SHARE</text>
  <line x1="177" y1="170" x2="298" y2="195" stroke="#475569" stroke-width="2" marker-end="url(#k)"/>
  <line x1="177" y1="230" x2="298" y2="210" stroke="#475569" stroke-width="2" marker-end="url(#k)"/>
  <rect x="302" y="180" width="160" height="44" rx="8" fill="#ffffff" stroke="#94a3b8"/><text x="382" y="207" text-anchor="middle" font-size="12" font-family="Consolas, monospace" fill="#334155">row id = 1 (S, S)</text>
  <text x="45" y="285" font-size="12" fill="#334155">✅ Both read at the same time · ❌ nobody can UPDATE the row</text>

  <!-- exclusive -->
  <rect x="510" y="85" width="470" height="220" rx="12" fill="#ffffff" stroke="#fca5a5" stroke-width="2"/>
  <rect x="510" y="85" width="470" height="44" rx="12" fill="#fee2e2"/>
  <text x="745" y="113" text-anchor="middle" font-size="16" font-weight="800" fill="#b91c1c">🔒 EXCLUSIVE LOCK (X) — one writer</text>
  <rect x="535" y="150" width="140" height="40" rx="8" fill="#fef2f2" stroke="#dc2626"/><text x="605" y="175" text-anchor="middle" font-size="12" font-weight="700" fill="#b91c1c">T1: FOR UPDATE</text>
  <rect x="535" y="210" width="140" height="40" rx="8" fill="#fffbeb" stroke="#d97706"/><text x="605" y="235" text-anchor="middle" font-size="12" font-weight="700" fill="#b45309">T2: UPDATE ⏳</text>
  <line x1="677" y1="170" x2="788" y2="195" stroke="#475569" stroke-width="2" marker-end="url(#k)"/>
  <line x1="677" y1="230" x2="786" y2="214" stroke="#d97706" stroke-width="2" stroke-dasharray="5,4"/>
  <text x="712" y="252" font-size="11" fill="#b45309">waits…</text>
  <rect x="792" y="180" width="160" height="44" rx="8" fill="#ffffff" stroke="#94a3b8"/><text x="872" y="207" text-anchor="middle" font-size="12" font-family="Consolas, monospace" fill="#334155">row id = 1 (X)</text>
  <text x="535" y="285" font-size="12" fill="#334155">T2 continues only after T1 COMMIT / ROLLBACK</text>

  <!-- matrix -->
  <text x="500" y="340" text-anchor="middle" font-size="16" font-weight="800" fill="#0f172a">Compatibility Matrix</text>
  <rect x="300" y="355" width="400" height="36" fill="#e2e8f0"/>
  <text x="380" y="378" text-anchor="middle" font-size="13" font-weight="700" fill="#334155">Requested ↓ / Held →</text>
  <text x="530" y="378" text-anchor="middle" font-size="13" font-weight="700" fill="#15803d">S</text>
  <text x="640" y="378" text-anchor="middle" font-size="13" font-weight="700" fill="#b91c1c">X</text>
  <rect x="300" y="391" width="400" height="36" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="380" y="414" text-anchor="middle" font-size="13" font-weight="700" fill="#15803d">S</text>
  <text x="530" y="414" text-anchor="middle" font-size="13" fill="#15803d">✅ OK</text>
  <text x="640" y="414" text-anchor="middle" font-size="13" fill="#b91c1c">❌ wait</text>
  <rect x="300" y="427" width="400" height="36" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="380" y="450" text-anchor="middle" font-size="13" font-weight="700" fill="#b91c1c">X</text>
  <text x="530" y="450" text-anchor="middle" font-size="13" fill="#b91c1c">❌ wait</text>
  <text x="640" y="450" text-anchor="middle" font-size="13" fill="#b91c1c">❌ wait</text>
</svg>
