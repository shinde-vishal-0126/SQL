<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 250">
    <rect width="600" height="250" fill="#eeeeee" rx="10"/>
    <text x="300" y="40" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#0072b0" text-anchor="middle">Numeric Functions</text>
    
    <!-- ROUND -->
    <rect x="50" y="80" width="220" height="120" rx="5" fill="#e8e8e9" stroke="#267d6b" stroke-width="2"/>
    <text x="160" y="110" font-family="Arial" font-size="18" font-weight="bold" fill="#267d6b" text-anchor="middle">ROUND(val, N)</text>
    
    <text x="70" y="140" font-family="Courier New" font-size="14" fill="#1f1f1f">3.516, 2</text>
    <path d="M 150 135 L 200 135" fill="none" stroke="#b1b1b6" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="210" y="140" font-family="Courier New" font-size="16" font-weight="bold" fill="#267d6b">3.52</text>
    
    <text x="70" y="170" font-family="Courier New" font-size="14" fill="#1f1f1f">3.516, 0</text>
    <path d="M 150 165 L 200 165" fill="none" stroke="#b1b1b6" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="210" y="170" font-family="Courier New" font-size="16" font-weight="bold" fill="#267d6b">4</text>
    
    <!-- ABS -->
    <rect x="330" y="80" width="220" height="120" rx="5" fill="#e8e8e9" stroke="#575724" stroke-width="2"/>
    <text x="440" y="110" font-family="Arial" font-size="18" font-weight="bold" fill="#575724" text-anchor="middle">ABS(val)</text>
    
    <text x="360" y="150" font-family="Courier New" font-size="14" fill="#1f1f1f">-10</text>
    <path d="M 400 145 L 450 145" fill="none" stroke="#b1b1b6" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="460" y="150" font-family="Courier New" font-size="16" font-weight="bold" fill="#575724">10</text>
    
    <text x="440" y="180" font-family="Arial" font-size="12" fill="#5f5f5f" text-anchor="middle">Returns absolute (positive) value</text>

    <!-- Def -->
    <defs>
        <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
            <path d="M0,0 L0,6 L9,3 z" fill="#e3e3e5" />
        </marker>
    </defs>
</svg>