<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 250">
    <rect width="700" height="250" fill="#eeeeee" rx="10"/>
    <text x="350" y="30" font-family="Arial" font-size="20" font-weight="bold" fill="#575724" text-anchor="middle">Aggregate Window Functions | Use Cases</text>
    
    <!-- Use Case 1 -->
    <rect x="20" y="70" width="200" height="130" fill="#e8e8e9" stroke="#b1b1b6" stroke-width="2"/>
    <rect x="20" y="70" width="200" height="30" fill="#e3e3e5"/>
    <text x="120" y="90" font-family="Arial" font-size="14" font-weight="bold" fill="#1f1f1f" text-anchor="middle">#1 OVERALL ANALYSIS</text>
    <text x="120" y="130" font-family="Arial" font-size="14" fill="#0072b0" text-anchor="middle">Quick summary or</text>
    <text x="120" y="150" font-family="Arial" font-size="14" fill="#0072b0" text-anchor="middle">snapshot of the</text>
    <text x="120" y="170" font-family="Arial" font-size="14" fill="#0072b0" text-anchor="middle">entire dataset</text>

    <!-- Use Case 2 -->
    <rect x="250" y="70" width="200" height="130" fill="#e8e8e9" stroke="#b1b1b6" stroke-width="2"/>
    <rect x="250" y="70" width="200" height="30" fill="#e3e3e5"/>
    <text x="350" y="90" font-family="Arial" font-size="14" font-weight="bold" fill="#1f1f1f" text-anchor="middle">#2 TOTAL PER GROUPS</text>
    <text x="350" y="130" font-family="Arial" font-size="14" fill="#267d6b" text-anchor="middle">Group-wise analysis,</text>
    <text x="350" y="150" font-family="Arial" font-size="14" fill="#267d6b" text-anchor="middle">to understand patterns</text>
    <text x="350" y="170" font-family="Arial" font-size="14" fill="#267d6b" text-anchor="middle">within categories</text>

    <!-- Use Case 3 -->
    <rect x="480" y="70" width="200" height="130" fill="#e8e8e9" stroke="#b1b1b6" stroke-width="2"/>
    <rect x="480" y="70" width="200" height="30" fill="#e3e3e5"/>
    <text x="580" y="90" font-family="Arial" font-size="14" font-weight="bold" fill="#1f1f1f" text-anchor="middle">#3 COMPARISON</text>
    <text x="580" y="130" font-family="Arial" font-size="14" fill="#793a74" text-anchor="middle">Compare the current</text>
    <text x="580" y="150" font-family="Arial" font-size="14" fill="#793a74" text-anchor="middle">value and aggregated</text>
    <text x="580" y="170" font-family="Arial" font-size="14" fill="#793a74" text-anchor="middle">value of windows</text>
    <text x="580" y="190" font-family="Arial" font-size="12" font-style="italic" fill="#5f5f5f" text-anchor="middle">(e.g. % Contribution)</text>

</svg>