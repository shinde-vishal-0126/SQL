<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 200">
    <rect width="600" height="200" fill="#eeeeee" rx="10"/>
    <text x="300" y="40" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#575724" text-anchor="middle">EOMONTH() / LAST_DAY()</text>
    
    <text x="150" y="90" font-family="Courier New" font-size="20" fill="#1f1f1f" text-anchor="middle">2025-08-15</text>
    <path d="M 230 85 L 370 85" fill="none" stroke="#575724" stroke-width="3" marker-end="url(#arrow)"/>
    <text x="300" y="75" font-family="Arial" font-size="12" font-weight="bold" fill="#575724" text-anchor="middle">LAST_DAY()</text>
    
    <text x="450" y="90" font-family="Courier New" font-size="20" font-weight="bold" fill="#b80b0b" text-anchor="middle">2025-08-31</text>
    
    <text x="300" y="140" font-family="Arial" font-size="14" fill="#5f5f5f" text-anchor="middle">Returns the last valid date of the given month.</text>

    <!-- Def -->
    <defs>
        <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
            <path d="M0,0 L0,6 L9,3 z" fill="#DCDCAA" />
        </marker>
    </defs>
</svg>