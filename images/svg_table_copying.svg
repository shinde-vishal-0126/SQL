<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 250">
    <rect width="800" height="250" fill="#eeeeee" rx="10"/>
    <text x="400" y="30" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#575724" text-anchor="middle">Table Duplication Techniques</text>
    
    <g transform="translate(100, 70)">
        <rect width="250" height="130" fill="#e8e8e9" stroke="#b80b0b" stroke-width="2" rx="5"/>
        <text x="125" y="25" font-family="Arial" font-size="14" font-weight="bold" fill="#b80b0b" text-anchor="middle">CREATE TABLE AS SELECT</text>
        <text x="125" y="55" font-family="Arial" font-size="12" fill="#1f1f1f" text-anchor="middle">Copies Structure + Data</text>
        <text x="125" y="75" font-family="Arial" font-size="12" fill="#b80b0b" font-weight="bold" text-anchor="middle">NO Constraints Copied!</text>
        <text x="125" y="105" font-family="Arial" font-size="11" fill="#5f5f5f" text-anchor="middle">(No Indexes, No Primary Keys)</text>
    </g>
    
    <g transform="translate(450, 70)">
        <rect width="250" height="130" fill="#e8e8e9" stroke="#267d6b" stroke-width="2" rx="5"/>
        <text x="125" y="25" font-family="Arial" font-size="14" font-weight="bold" fill="#267d6b" text-anchor="middle">CREATE TABLE LIKE</text>
        <text x="125" y="55" font-family="Arial" font-size="12" fill="#1f1f1f" text-anchor="middle">Copies Exact Structure</text>
        <text x="125" y="75" font-family="Arial" font-size="12" fill="#267d6b" font-weight="bold" text-anchor="middle">ALL Constraints Copied!</text>
        <text x="125" y="105" font-family="Arial" font-size="11" fill="#5f5f5f" text-anchor="middle">Use INSERT SELECT for data.</text>
    </g>
</svg>
