<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650">
    <rect width="1000" height="650" fill="#eeeeee" rx="10"/>

    <text x="500" y="40" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#a38300" text-anchor="middle">Use Case 3: Physical Data Marts in Data Warehouse (CTAS)</text>

    <!-- Column Dividers -->
    <line x1="220" y1="80" x2="220" y2="580" stroke="#adadad" stroke-width="2" stroke-dasharray="5,5"/>
    <line x1="480" y1="80" x2="480" y2="580" stroke="#adadad" stroke-width="2" stroke-dasharray="5,5"/>
    <line x1="750" y1="80" x2="750" y2="580" stroke="#adadad" stroke-width="2" stroke-dasharray="5,5"/>

    <!-- Section Headers -->
    <text x="110" y="90" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#1f1f1f" text-anchor="middle">SOURCE SYSTEMS</text>
    <text x="350" y="90" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#1f1f1f" text-anchor="middle">DATA WAREHOUSE</text>
    <text x="615" y="90" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#1f1f1f" text-anchor="middle">DATA MARTS</text>
    <text x="875" y="90" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#1f1f1f" text-anchor="middle">REPORTING</text>

    <!-- Source Systems -->
    <!-- ERP System -->
    <g transform="translate(60, 150)">
        <ellipse cx="50" cy="20" rx="30" ry="10" fill="#4FC1FF" stroke="#c7c7c7" stroke-width="2"/>
        <path d="M 20 20 L 20 50 A 30 10 0 0 0 80 50 L 80 20" fill="#4FC1FF" stroke="#c7c7c7" stroke-width="2"/>
        <path d="M 20 35 L 20 65 A 30 10 0 0 0 80 65 L 80 35" fill="#4FC1FF" stroke="#c7c7c7" stroke-width="2"/>
        <text x="50" y="90" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#1f1f1f" text-anchor="middle">ERP SYSTEM</text>
    </g>

    <!-- CRM System -->
    <g transform="translate(60, 300)">
        <ellipse cx="50" cy="20" rx="30" ry="10" fill="#4FC1FF" stroke="#c7c7c7" stroke-width="2"/>
        <path d="M 20 20 L 20 50 A 30 10 0 0 0 80 50 L 80 20" fill="#4FC1FF" stroke="#c7c7c7" stroke-width="2"/>
        <path d="M 20 35 L 20 65 A 30 10 0 0 0 80 65 L 80 35" fill="#4FC1FF" stroke="#c7c7c7" stroke-width="2"/>
        <text x="50" y="90" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#1f1f1f" text-anchor="middle">CRM SYSTEM</text>
    </g>

    <!-- Logs -->
    <g transform="translate(60, 450)">
        <ellipse cx="50" cy="20" rx="30" ry="10" fill="#4FC1FF" stroke="#c7c7c7" stroke-width="2"/>
        <path d="M 20 20 L 20 50 A 30 10 0 0 0 80 50 L 80 20" fill="#4FC1FF" stroke="#c7c7c7" stroke-width="2"/>
        <path d="M 20 35 L 20 65 A 30 10 0 0 0 80 65 L 80 35" fill="#4FC1FF" stroke="#c7c7c7" stroke-width="2"/>
        <text x="50" y="90" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#1f1f1f" text-anchor="middle">LOGS</text>
    </g>

    <!-- Arrows to DWH -->
    <path d="M 160 180 Q 200 180 250 280" stroke="#a38a00" stroke-width="3" fill="none" marker-end="url(#arrow_yellow)"/>
    <path d="M 160 330 L 250 330" stroke="#a38a00" stroke-width="3" fill="none" marker-end="url(#arrow_yellow)"/>
    <path d="M 160 480 Q 200 480 250 380" stroke="#a38a00" stroke-width="3" fill="none" marker-end="url(#arrow_yellow)"/>

    <!-- Data Warehouse -->
    <ellipse cx="350" cy="180" rx="70" ry="20" fill="#FFF" stroke="#c7c7c7" stroke-width="3"/>
    <path d="M 280 180 L 280 430 A 70 20 0 0 0 420 430 L 420 180" fill="#FFF" stroke="#c7c7c7" stroke-width="3"/>
    
    <!-- Small tables inside DWH -->
    <rect x="300" y="220" width="25" height="20" fill="#FFF" stroke="#c7c7c7" stroke-width="2"/>
    <text x="312" y="235" font-family="Arial, sans-serif" font-size="12" fill="#000" text-anchor="middle">T</text>
    
    <rect x="350" y="210" width="25" height="20" fill="#FFF" stroke="#c7c7c7" stroke-width="2"/>
    <text x="362" y="225" font-family="Arial, sans-serif" font-size="12" fill="#000" text-anchor="middle">T</text>
    
    <rect x="380" y="240" width="25" height="20" fill="#FFF" stroke="#c7c7c7" stroke-width="2"/>
    <text x="392" y="255" font-family="Arial, sans-serif" font-size="12" fill="#000" text-anchor="middle">T</text>
    
    <rect x="310" y="280" width="25" height="20" fill="#FFF" stroke="#c7c7c7" stroke-width="2"/>
    <text x="322" y="295" font-family="Arial, sans-serif" font-size="12" fill="#000" text-anchor="middle">T</text>
    
    <rect x="340" y="320" width="25" height="20" fill="#FFF" stroke="#c7c7c7" stroke-width="2"/>
    <text x="352" y="335" font-family="Arial, sans-serif" font-size="12" fill="#000" text-anchor="middle">T</text>

    <!-- Network lines connecting tables -->
    <line x1="325" y1="230" x2="350" y2="220" stroke="#c7c7c7" stroke-width="1"/>
    <line x1="375" y1="220" x2="390" y2="240" stroke="#c7c7c7" stroke-width="1"/>
    <line x1="310" y1="240" x2="320" y2="280" stroke="#c7c7c7" stroke-width="1"/>
    <line x1="335" y1="290" x2="350" y2="320" stroke="#c7c7c7" stroke-width="1"/>

    <rect x="270" y="470" width="160" height="40" fill="#F44747" stroke="#c7c7c7" stroke-width="3" rx="5"/>
    <text x="350" y="495" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#1f1f1f" text-anchor="middle">PHYSICAL LAYER</text>

    <!-- CTAS Arrows -->
    <path d="M 430 250 L 520 200" stroke="#b80b0b" stroke-width="3" fill="none" marker-end="url(#arrow_red)"/>
    <text x="450" y="220" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#b80b0b" transform="rotate(-30 450,220)">CTAS</text>
    <text x="470" y="240" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#b80b0b" transform="rotate(-30 470,240)">30 Min</text>

    <path d="M 430 380 L 520 430" stroke="#b80b0b" stroke-width="3" fill="none" marker-end="url(#arrow_red)"/>
    <text x="470" y="400" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#b80b0b" transform="rotate(30 470,400)">CTAS</text>
    <text x="450" y="420" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#b80b0b" transform="rotate(30 450,420)">30 Min</text>

    <!-- Data Marts -->
    <!-- Sales Mart -->
    <rect x="530" y="150" width="120" height="100" fill="#FFF" stroke="#c7c7c7" stroke-width="3"/>
    <text x="590" y="270" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#1f1f1f" text-anchor="middle">SALES MART</text>
    <rect x="580" y="190" width="25" height="20" fill="#FFF" stroke="#c7c7c7" stroke-width="2"/>
    <text x="592" y="205" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#000" text-anchor="middle">T</text>
    <!-- Lines to small boxes showing a physical schema -->
    <line x1="560" y1="175" x2="580" y2="195" stroke="#c7c7c7" stroke-width="2"/>
    <line x1="620" y1="175" x2="605" y2="195" stroke="#c7c7c7" stroke-width="2"/>
    <line x1="560" y1="225" x2="580" y2="205" stroke="#c7c7c7" stroke-width="2"/>
    <line x1="620" y1="225" x2="605" y2="205" stroke="#c7c7c7" stroke-width="2"/>
    <rect x="545" y="160" width="15" height="15" fill="#FFF" stroke="#c7c7c7" stroke-width="1"/>
    <rect x="615" y="160" width="15" height="15" fill="#FFF" stroke="#c7c7c7" stroke-width="1"/>
    <rect x="545" y="220" width="15" height="15" fill="#FFF" stroke="#c7c7c7" stroke-width="1"/>
    <rect x="615" y="220" width="15" height="15" fill="#FFF" stroke="#c7c7c7" stroke-width="1"/>

    <!-- Finance Mart -->
    <rect x="530" y="350" width="120" height="100" fill="#FFF" stroke="#c7c7c7" stroke-width="3"/>
    <text x="590" y="470" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#1f1f1f" text-anchor="middle">FINANCE MART</text>
    <rect x="580" y="390" width="25" height="20" fill="#FFF" stroke="#c7c7c7" stroke-width="2"/>
    <text x="592" y="405" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#000" text-anchor="middle">T</text>
    <line x1="560" y1="375" x2="580" y2="395" stroke="#c7c7c7" stroke-width="2"/>
    <line x1="620" y1="375" x2="605" y2="395" stroke="#c7c7c7" stroke-width="2"/>
    <line x1="560" y1="425" x2="580" y2="405" stroke="#c7c7c7" stroke-width="2"/>
    <line x1="620" y1="425" x2="605" y2="405" stroke="#c7c7c7" stroke-width="2"/>
    <rect x="545" y="360" width="15" height="15" fill="#FFF" stroke="#c7c7c7" stroke-width="1"/>
    <rect x="615" y="360" width="15" height="15" fill="#FFF" stroke="#c7c7c7" stroke-width="1"/>
    <rect x="545" y="420" width="15" height="15" fill="#FFF" stroke="#c7c7c7" stroke-width="1"/>
    <rect x="615" y="420" width="15" height="15" fill="#FFF" stroke="#c7c7c7" stroke-width="1"/>

    <rect x="510" y="490" width="160" height="40" fill="#F44747" stroke="#c7c7c7" stroke-width="3" rx="5"/>
    <text x="590" y="515" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#1f1f1f" text-anchor="middle">PHYSICAL LAYER</text>

    <!-- Reporting -->
    <path d="M 670 200 L 780 200" stroke="#267d6b" stroke-width="3" stroke-dasharray="5,5" fill="none" marker-end="url(#arrow_green)"/>
    <text x="725" y="190" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#267d6b" text-anchor="middle">FAST!</text>

    <!-- Sales Dashboard Chart -->
    <rect x="800" y="150" width="100" height="80" fill="#FFF" stroke="#a38300" stroke-width="4"/>
    <rect x="800" y="150" width="100" height="15" fill="#FFCC00"/>
    <text x="850" y="140" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#1f1f1f" text-anchor="middle">SALES</text>
    
    <rect x="820" y="200" width="15" height="30" fill="#F44747"/>
    <rect x="845" y="180" width="15" height="50" fill="#4FC1FF"/>
    <rect x="870" y="165" width="15" height="65" fill="#FFD700"/>
    <line x1="810" y1="230" x2="890" y2="230" stroke="#c7c7c7" stroke-width="2"/>

    <defs>
        <marker id="arrow_yellow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#FFD700" /></marker>
        <marker id="arrow_red" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#F44747" /></marker>
        <marker id="arrow_green" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#4EC9B0" /></marker>
    </defs>
</svg>
