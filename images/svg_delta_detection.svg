<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300">
    <rect width="800" height="300" fill="#eeeeee" rx="10"/>
    <text x="400" y="40" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#575724" text-anchor="middle">EXCEPT Use Case: Delta Detection (Changes)</text>
    
    <!-- Source System Day 1 -->
    <rect x="50" y="70" width="200" height="60" rx="5" fill="#e8e8e9" stroke="#0072b0" stroke-width="2"/>
    <text x="150" y="95" font-family="Arial" font-size="14" font-weight="bold" fill="#1f1f1f" text-anchor="middle">Source System (Day 1)</text>
    <text x="150" y="115" font-family="Courier New, monospace" font-size="12" fill="#5f5f5f" text-anchor="middle">2 Rows</text>
    
    <!-- Source System Day 2 -->
    <rect x="50" y="180" width="200" height="60" rx="5" fill="#e8e8e9" stroke="#267d6b" stroke-width="2"/>
    <text x="150" y="205" font-family="Arial" font-size="14" font-weight="bold" fill="#1f1f1f" text-anchor="middle">Source System (Day 2)</text>
    <text x="150" y="225" font-family="Courier New, monospace" font-size="12" fill="#5f5f5f" text-anchor="middle">3 Rows (1 New Row Added)</text>
    
    <!-- Arrow to EXCEPT -->
    <path d="M 250 210 L 330 210 L 330 160 L 370 160" fill="none" stroke="#b1b1b6" stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M 250 100 L 330 100 L 330 150 L 370 150" fill="none" stroke="#b1b1b6" stroke-width="3" marker-end="url(#arrow)"/>
    
    <!-- EXCEPT Bubble -->
    <rect x="370" y="135" width="100" height="40" rx="20" fill="#F44747" opacity="0.2"/>
    <rect x="370" y="135" width="100" height="40" rx="20" fill="none" stroke="#b80b0b" stroke-width="2"/>
    <text x="420" y="160" font-family="Arial" font-size="14" font-weight="bold" fill="#b80b0b" text-anchor="middle">EXCEPT</text>
    <text x="420" y="195" font-family="Arial" font-size="12" fill="#5f5f5f" text-anchor="middle">(Day 2 - Day 1)</text>
    
    <!-- Arrow to Delta -->
    <path d="M 470 155 L 530 155" fill="none" stroke="#b1b1b6" stroke-width="3" marker-end="url(#arrow)"/>
    
    <!-- Delta Result (Data Warehouse) -->
    <rect x="530" y="110" width="220" height="90" rx="5" fill="#e8e8e9" stroke="#793a74" stroke-width="2"/>
    <text x="640" y="140" font-family="Arial" font-size="16" font-weight="bold" fill="#793a74" text-anchor="middle">The "Delta" (Changes)</text>
    <text x="640" y="160" font-family="Arial" font-size="12" fill="#1f1f1f" text-anchor="middle">Only 1 New Row is Returned</text>
    <text x="640" y="180" font-family="Arial" font-size="12" fill="#1f1f1f" text-anchor="middle">Insert into Data Warehouse</text>

    <!-- Def -->
    <defs>
        <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
            <path d="M0,0 L0,6 L9,3 z" fill="#e3e3e5" />
        </marker>
    </defs>
</svg>