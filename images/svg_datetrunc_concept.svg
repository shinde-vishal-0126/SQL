<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 200">
    <rect width="600" height="200" fill="#eeeeee" rx="10"/>
    <text x="300" y="40" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#793a74" text-anchor="middle">DATETRUNC() / DATE_TRUNC()</text>
    
    <text x="300" y="80" font-family="Courier New" font-size="20" fill="#5f5f5f" text-anchor="middle">2025-01-15 14:30:45</text>
    
    <!-- Truncating to YEAR -->
    <path d="M 300 90 L 300 110" fill="none" stroke="#b1b1b6" stroke-width="2" marker-end="url(#arrow)"/>
    
    <text x="150" y="120" font-family="Arial" font-size="14" font-weight="bold" fill="#267d6b" text-anchor="middle">Keep (Year)</text>
    <text x="450" y="120" font-family="Arial" font-size="14" font-weight="bold" fill="#b80b0b" text-anchor="middle">Reset (Month, Day, Time)</text>
    
    <rect x="100" y="130" width="100" height="40" fill="#e8e8e9" stroke="#267d6b" stroke-width="2"/>
    <text x="150" y="155" font-family="Courier New" font-size="20" font-weight="bold" fill="#1f1f1f" text-anchor="middle">2025-</text>
    
    <rect x="200" y="130" width="300" height="40" fill="#e8e8e9" stroke="#b80b0b" stroke-width="2"/>
    <text x="350" y="155" font-family="Courier New" font-size="20" font-weight="bold" fill="#b80b0b" text-anchor="middle">01-01 00:00:00</text>
    
    <text x="300" y="190" font-family="Arial" font-size="12" fill="#5f5f5f" text-anchor="middle">Truncates date to a specific part, resetting the rest to lowest value.</text>

    <!-- Def -->
    <defs>
        <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
            <path d="M0,0 L0,6 L9,3 z" fill="#e3e3e5" />
        </marker>
    </defs>
</svg>