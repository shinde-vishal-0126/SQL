<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 200">
    <rect width="600" height="200" fill="#eeeeee" rx="10"/>
    <text x="300" y="30" font-family="Courier New" font-size="18" font-weight="bold" fill="#0072b0" text-anchor="middle">NULLIF(Value1, Value2)</text>
    
    <polygon points="300,60 360,90 300,120 240,90" fill="#e8e8e9" stroke="#b1b1b6" stroke-width="2"/>
    <text x="300" y="95" font-family="Arial" font-size="12" fill="#1f1f1f" text-anchor="middle">Are they equal?</text>

    <!-- YES -->
    <path d="M 360 90 L 450 90 L 450 140" fill="none" stroke="#267d6b" stroke-width="2" marker-end="url(#arrow_green)"/>
    <text x="405" y="80" font-family="Arial" font-size="12" font-weight="bold" fill="#267d6b" text-anchor="middle">Yes</text>
    <rect x="420" y="140" width="60" height="30" fill="#e8e8e9" stroke="#b80b0b" stroke-width="2"/>
    <text x="450" y="160" font-family="Courier New" font-size="14" font-weight="bold" fill="#b80b0b" text-anchor="middle">NULL</text>

    <!-- NO -->
    <path d="M 240 90 L 150 90 L 150 140" fill="none" stroke="#b80b0b" stroke-width="2" marker-end="url(#arrow_red)"/>
    <text x="195" y="80" font-family="Arial" font-size="12" font-weight="bold" fill="#b80b0b" text-anchor="middle">No</text>
    <rect x="120" y="140" width="60" height="30" fill="#e8e8e9" stroke="#b1b1b6" stroke-width="2"/>
    <text x="150" y="160" font-family="Courier New" font-size="14" font-weight="bold" fill="#1f1f1f" text-anchor="middle">Value1</text>

    <defs>
        <marker id="arrow_green" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
            <path d="M0,0 L0,6 L9,3 z" fill="#4EC9B0" />
        </marker>
        <marker id="arrow_red" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
            <path d="M0,0 L0,6 L9,3 z" fill="#F44747" />
        </marker>
    </defs>
</svg>