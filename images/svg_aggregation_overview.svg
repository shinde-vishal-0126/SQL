<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 250">
    <rect width="600" height="250" fill="#eeeeee" rx="10"/>
    <text x="300" y="30" font-family="Arial" font-size="18" font-weight="bold" fill="#575724" text-anchor="middle">Aggregation Functions Overview</text>
    <text x="300" y="55" font-family="Arial" font-size="14" fill="#1f1f1f" text-anchor="middle">Accept multiple rows -> Return a SINGLE summarized value.</text>
    
    <rect x="50" y="80" width="100" height="30" fill="#e8e8e9" stroke="#0072b0" stroke-width="2"/>
    <text x="100" y="100" font-family="Courier New" font-size="14" font-weight="bold" fill="#1f1f1f" text-anchor="middle">COUNT()</text>
    
    <rect x="250" y="80" width="100" height="30" fill="#e8e8e9" stroke="#267d6b" stroke-width="2"/>
    <text x="300" y="100" font-family="Courier New" font-size="14" font-weight="bold" fill="#1f1f1f" text-anchor="middle">SUM()</text>

    <rect x="450" y="80" width="100" height="30" fill="#e8e8e9" stroke="#793a74" stroke-width="2"/>
    <text x="500" y="100" font-family="Courier New" font-size="14" font-weight="bold" fill="#1f1f1f" text-anchor="middle">AVG()</text>

    <rect x="50" y="140" width="100" height="30" fill="#e8e8e9" stroke="#575724" stroke-width="2"/>
    <text x="100" y="160" font-family="Courier New" font-size="14" font-weight="bold" fill="#1f1f1f" text-anchor="middle">MIN()</text>

    <rect x="250" y="140" width="100" height="30" fill="#e8e8e9" stroke="#b80b0b" stroke-width="2"/>
    <text x="300" y="160" font-family="Courier New" font-size="14" font-weight="bold" fill="#1f1f1f" text-anchor="middle">MAX()</text>

    <rect x="420" y="140" width="160" height="30" fill="#e8e8e9" stroke="#5f5f5f" stroke-width="2"/>
    <text x="500" y="160" font-family="Courier New" font-size="14" font-weight="bold" fill="#1f1f1f" text-anchor="middle">GROUP_CONCAT()</text>
</svg>