<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 200">
    <rect width="600" height="200" fill="#eeeeee" rx="10"/>
    <text x="300" y="30" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#1f1f1f" text-anchor="middle">COALESCE / ISNULL in JOIN Condition</text>
    
    <text x="300" y="60" font-family="Courier New" font-size="14" fill="#0072b0" text-anchor="middle">Handling NULLs before joining tables ensures matches aren't missed.</text>
    
    <rect x="100" y="90" width="400" height="80" rx="5" fill="#e8e8e9" stroke="#b1b1b6" stroke-width="2"/>
    <text x="120" y="115" font-family="Courier New" font-size="14" fill="#1f1f1f" text-anchor="start">SELECT a.type, b.sales FROM Table1 a</text>
    <text x="120" y="135" font-family="Courier New" font-size="14" fill="#0072b0" text-anchor="start">JOIN Table2 b ON a.year = b.year </text>
    <text x="120" y="155" font-family="Courier New" font-size="14" font-weight="bold" fill="#575724" text-anchor="start">AND IFNULL(a.type, '') = IFNULL(b.type, '')</text>
</svg>