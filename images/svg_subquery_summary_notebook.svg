<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
    <rect width="800" height="500" fill="#e8e8e9" rx="10"/>
    <rect x="100" y="30" width="600" height="440" fill="#F5F5F5" rx="5"/> <!-- Notebook page -->
    
    <!-- Rings -->
    <circle cx="120" cy="50" r="10" fill="#eeeeee"/> <rect x="90" y="47" width="20" height="6" fill="#eeeeee"/>
    <circle cx="120" cy="90" r="10" fill="#eeeeee"/> <rect x="90" y="87" width="20" height="6" fill="#eeeeee"/>
    <circle cx="120" cy="130" r="10" fill="#eeeeee"/> <rect x="90" y="127" width="20" height="6" fill="#eeeeee"/>
    <circle cx="120" cy="170" r="10" fill="#eeeeee"/> <rect x="90" y="167" width="20" height="6" fill="#eeeeee"/>
    <circle cx="120" cy="210" r="10" fill="#eeeeee"/> <rect x="90" y="207" width="20" height="6" fill="#eeeeee"/>
    <circle cx="120" cy="250" r="10" fill="#eeeeee"/> <rect x="90" y="247" width="20" height="6" fill="#eeeeee"/>
    <circle cx="120" cy="290" r="10" fill="#eeeeee"/> <rect x="90" y="287" width="20" height="6" fill="#eeeeee"/>
    <circle cx="120" cy="330" r="10" fill="#eeeeee"/> <rect x="90" y="327" width="20" height="6" fill="#eeeeee"/>
    <circle cx="120" cy="370" r="10" fill="#eeeeee"/> <rect x="90" y="367" width="20" height="6" fill="#eeeeee"/>
    <circle cx="120" cy="410" r="10" fill="#eeeeee"/> <rect x="90" y="407" width="20" height="6" fill="#eeeeee"/>
    <circle cx="120" cy="450" r="10" fill="#eeeeee"/> <rect x="90" y="447" width="20" height="6" fill="#eeeeee"/>
    
    <!-- Title -->
    <rect x="250" y="50" width="250" height="40" fill="#FFD700" stroke="#bebebe" stroke-width="3" rx="5"/>
    <text x="375" y="78" font-family="Comic Sans MS, cursive, sans-serif" font-size="28" font-weight="bold" fill="#1E1E1E" text-anchor="middle">SUBQUERY</text>
    
    <text x="180" y="140" font-family="Comic Sans MS, cursive, sans-serif" font-size="24" fill="#1E1E1E">Query <tspan fill="#007acc">inside</tspan> Another Query</text>
    <text x="180" y="180" font-family="Comic Sans MS, cursive, sans-serif" font-size="20" fill="#1E1E1E">Breaks Complex query into <tspan fill="#007acc">Smaller, manageable pieces.</tspan></text>
    
    <circle cx="620" cy="120" r="40" fill="none" stroke="#bebebe" stroke-width="2"/>
    <text x="620" y="100" font-family="Comic Sans MS, cursive, sans-serif" font-size="14" fill="#1E1E1E" text-anchor="middle">QUERY</text>
    <circle cx="630" cy="130" r="20" fill="#A7C7E7" stroke="#bebebe" stroke-width="2"/>
    <text x="630" y="135" font-family="Comic Sans MS, cursive, sans-serif" font-size="10" fill="#1E1E1E" text-anchor="middle">QUERY</text>
    
    <!-- Use Cases -->
    <rect x="180" y="210" width="150" height="35" fill="#90EE90" stroke="#bebebe" stroke-width="2" rx="5"/>
    <text x="255" y="235" font-family="Comic Sans MS, cursive, sans-serif" font-size="20" font-weight="bold" fill="#1E1E1E" text-anchor="middle">USE CASES</text>
    
    <path d="M 210 245 L 210 440" stroke="#bebebe" stroke-width="3"/>
    
    <circle cx="210" cy="280" r="8" fill="#32CD32" stroke="#bebebe" stroke-width="2"/>
    <text x="240" y="285" font-family="Comic Sans MS, cursive, sans-serif" font-size="18" fill="#1E1E1E">Create <tspan fill="#208320">Temporary</tspan> Result Set.</text>
    
    <circle cx="210" cy="320" r="8" fill="#32CD32" stroke="#bebebe" stroke-width="2"/>
    <text x="240" y="325" font-family="Comic Sans MS, cursive, sans-serif" font-size="18" fill="#1E1E1E">Prepare Data Before <tspan fill="#208320">Joining</tspan> Tables.</text>
    
    <circle cx="210" cy="360" r="8" fill="#32CD32" stroke="#bebebe" stroke-width="2"/>
    <text x="240" y="365" font-family="Comic Sans MS, cursive, sans-serif" font-size="18" fill="#1E1E1E">Dynamic &amp; Complex <tspan fill="#208320">Filtering</tspan>.</text>
    
    <circle cx="210" cy="400" r="8" fill="#32CD32" stroke="#bebebe" stroke-width="2"/>
    <text x="240" y="405" font-family="Comic Sans MS, cursive, sans-serif" font-size="18" fill="#1E1E1E">Check the Existence of Rows (<tspan fill="#0000d6">EXISTS</tspan>).</text>
    
    <circle cx="210" cy="440" r="8" fill="#32CD32" stroke="#bebebe" stroke-width="2"/>
    <text x="240" y="445" font-family="Comic Sans MS, cursive, sans-serif" font-size="18" fill="#1E1E1E">Row By Row Comparison - <tspan fill="#208320">Correlated Subquery</tspan></text>
</svg>
