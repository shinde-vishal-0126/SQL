<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 250">
    <rect width="600" height="250" fill="#eeeeee" rx="10"/>
    <text x="300" y="30" font-family="Arial" font-size="18" font-weight="bold" fill="#0072b0" text-anchor="middle">GROUP BY vs WINDOW FUNCTIONS</text>
    
    <!-- GROUP BY -->
    <rect x="20" y="60" width="260" height="160" fill="#e8e8e9" stroke="#575724" stroke-width="2"/>
    <text x="150" y="90" font-family="Arial" font-size="16" font-weight="bold" fill="#575724" text-anchor="middle">GROUP BY</text>
    <text x="150" y="120" font-family="Arial" font-size="14" fill="#1f1f1f" text-anchor="middle">Squashes / Collapses Rows</text>
    <text x="150" y="150" font-family="Arial" font-size="12" fill="#5f5f5f" text-anchor="middle">Loses row-level details</text>
    <text x="150" y="180" font-family="Courier New" font-size="14" fill="#b80b0b" text-anchor="middle">4 Rows -> 2 Rows</text>

    <!-- WINDOW -->
    <rect x="320" y="60" width="260" height="160" fill="#e8e8e9" stroke="#267d6b" stroke-width="2"/>
    <text x="450" y="90" font-family="Arial" font-size="16" font-weight="bold" fill="#267d6b" text-anchor="middle">WINDOW FUNCTION</text>
    <text x="450" y="120" font-family="Arial" font-size="14" fill="#1f1f1f" text-anchor="middle">Adds a calculation column</text>
    <text x="450" y="150" font-family="Arial" font-size="12" fill="#5f5f5f" text-anchor="middle">Keeps original row details</text>
    <text x="450" y="180" font-family="Courier New" font-size="14" fill="#0072b0" text-anchor="middle">4 Rows -> 4 Rows</text>
</svg>