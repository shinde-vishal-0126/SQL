<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker>
  </defs>
  <rect width="1000" height="560" fill="#f8fafc" rx="12"/>
  <text x="500" y="38" text-anchor="middle" font-size="24" font-weight="800" fill="#0f172a">Stored Procedure: Why We Need It</text>
  <text x="500" y="62" text-anchor="middle" font-size="13" fill="#64748b">Client side scripts (error-prone) vs. one CALL to a procedure stored on the server side</text>

  <!-- LEFT: without procedure -->
  <rect x="20" y="80" width="470" height="400" rx="12" fill="#fef2f2" stroke="#fca5a5"/>
  <text x="255" y="108" text-anchor="middle" font-size="16" font-weight="800" fill="#b91c1c">❌ WITHOUT Stored Procedure</text>
  <rect x="40" y="130" width="150" height="230" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="115" y="152" text-anchor="middle" font-size="13" font-weight="700" fill="#334155">CLIENT (You / Colleague)</text>
  <rect x="55" y="170" width="120" height="40" rx="6" fill="#eff6ff" stroke="#93c5fd"/><text x="115" y="195" text-anchor="middle" font-size="12" font-family="Consolas, monospace" fill="#1d4ed8">1. INSERT ...</text>
  <rect x="55" y="225" width="120" height="40" rx="6" fill="#eff6ff" stroke="#93c5fd"/><text x="115" y="250" text-anchor="middle" font-size="12" font-family="Consolas, monospace" fill="#1d4ed8">2. UPDATE ...</text>
  <rect x="55" y="280" width="120" height="40" rx="6" fill="#eff6ff" stroke="#93c5fd"/><text x="115" y="305" text-anchor="middle" font-size="12" font-family="Consolas, monospace" fill="#1d4ed8">3. SELECT ...</text>
  <text x="115" y="345" text-anchor="middle" font-size="11" fill="#64748b">run by hand, daily</text>
  <rect x="320" y="170" width="150" height="150" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
  <ellipse cx="395" cy="200" rx="45" ry="12" fill="#e2e8f0" stroke="#64748b"/>
  <path d="M350,200 v70 a45,12 0 0 0 90,0 v-70" fill="#e2e8f0" stroke="#64748b"/>
  <text x="395" y="245" text-anchor="middle" font-size="13" font-weight="700" fill="#334155">DATABASE</text>
  <text x="395" y="305" text-anchor="middle" font-size="11" fill="#64748b">Server side</text>
  <line x1="178" y1="190" x2="316" y2="210" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
  <line x1="178" y1="245" x2="316" y2="245" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
  <line x1="178" y1="300" x2="316" y2="280" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
  <text x="247" y="178" text-anchor="middle" font-size="11" fill="#475569">3 round trips</text>
  <rect x="40" y="385" width="430" height="80" rx="8" fill="#ffffff" stroke="#fca5a5"/>
  <text x="55" y="408" font-size="12" font-weight="700" fill="#b91c1c">Problems:</text>
  <text x="55" y="428" font-size="12" fill="#334155">• Wrong order (UPDATE before INSERT) → wrong data</text>
  <text x="55" y="446" font-size="12" fill="#334155">• Scripts handed over to colleagues → human errors</text>
  <text x="55" y="462" font-size="12" fill="#334155">• Many network round trips, logic scattered in the app</text>

  <!-- RIGHT: with procedure -->
  <rect x="510" y="80" width="470" height="400" rx="12" fill="#f0fdf4" stroke="#86efac"/>
  <text x="745" y="108" text-anchor="middle" font-size="16" font-weight="800" fill="#15803d">✅ WITH Stored Procedure</text>
  <rect x="530" y="190" width="140" height="90" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="600" y="215" text-anchor="middle" font-size="13" font-weight="700" fill="#334155">CLIENT</text>
  <rect x="542" y="228" width="116" height="34" rx="6" fill="#dcfce7" stroke="#16a34a"/>
  <text x="600" y="250" text-anchor="middle" font-size="12" font-family="Consolas, monospace" font-weight="700" fill="#15803d">CALL daily_job();</text>
  <line x1="672" y1="235" x2="728" y2="235" stroke="#16a34a" stroke-width="3" marker-end="url(#g)"/>
  <text x="700" y="225" text-anchor="middle" font-size="11" fill="#15803d">1 call</text>
  <rect x="732" y="130" width="230" height="250" rx="10" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <text x="847" y="152" text-anchor="middle" font-size="13" font-weight="800" fill="#15803d">DATABASE (Server side)</text>
  <rect x="748" y="165" width="198" height="175" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-dasharray="5 4"/>
  <text x="847" y="184" text-anchor="middle" font-size="12" font-weight="700" fill="#7c3aed">PROCEDURE daily_job</text>
  <rect x="765" y="195" width="164" height="30" rx="5" fill="#eff6ff" stroke="#93c5fd"/><text x="847" y="215" text-anchor="middle" font-size="12" font-family="Consolas, monospace" fill="#1d4ed8">① INSERT ...</text>
  <rect x="765" y="240" width="164" height="30" rx="5" fill="#eff6ff" stroke="#93c5fd"/><text x="847" y="260" text-anchor="middle" font-size="12" font-family="Consolas, monospace" fill="#1d4ed8">② UPDATE ...</text>
  <rect x="765" y="285" width="164" height="30" rx="5" fill="#eff6ff" stroke="#93c5fd"/><text x="847" y="305" text-anchor="middle" font-size="12" font-family="Consolas, monospace" fill="#1d4ed8">③ SELECT ...</text>
  <line x1="938" y1="215" x2="938" y2="300" stroke="#7c3aed" stroke-width="2" marker-end="url(#a)"/>
  <text x="955" y="262" font-size="10" fill="#7c3aed" transform="rotate(90 955 262)">top → bottom</text>
  <text x="847" y="360" text-anchor="middle" font-size="11" fill="#64748b">Stored once, runs in fixed order</text>
  <line x1="728" y1="300" x2="672" y2="300" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
  <text x="700" y="318" text-anchor="middle" font-size="11" fill="#475569">result</text>
  <rect x="530" y="395" width="430" height="70" rx="8" fill="#ffffff" stroke="#86efac"/>
  <text x="545" y="418" font-size="12" font-weight="700" fill="#15803d">Benefits:</text>
  <text x="545" y="438" font-size="12" fill="#334155">• Same order every time → no human errors • 1 network call</text>
  <text x="545" y="456" font-size="12" fill="#334155">• Reusable • Secure (GRANT EXECUTE) • Logic stays in the DB</text>

  <rect x="20" y="495" width="960" height="50" rx="10" fill="#fffbeb" stroke="#fcd34d"/>
  <text x="500" y="526" text-anchor="middle" font-size="14" fill="#92400e"><tspan font-weight="800">Rule: </tspan>Put repeated multi-step SQL work into a procedure and just run  CALL procedure_name(...);</text>
</svg>
