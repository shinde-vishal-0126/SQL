<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 250">
    <rect width="800" height="250" fill="#eeeeee" rx="10"/>
    <text x="400" y="30" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#575724" text-anchor="middle">Table Scan vs Index Scan vs Index Seek</text>
    
    <g transform="translate(50, 70)">
        <rect width="200" height="130" fill="#e8e8e9" stroke="#b80b0b" stroke-width="2" rx="5"/>
        <text x="100" y="25" font-family="Arial" font-size="14" font-weight="bold" fill="#b80b0b" text-anchor="middle">Table Scan</text>
        <text x="100" y="45" font-family="Arial" font-size="12" fill="#5f5f5f" text-anchor="middle">Read entire table</text>
        <rect x="20" y="60" width="160" height="20" fill="#F44747" opacity="0.3"/>
        <rect x="20" y="85" width="160" height="20" fill="#F44747" opacity="0.3"/>
        <text x="100" y="120" font-family="Arial" font-size="14" font-weight="bold" fill="#b80b0b" text-anchor="middle">VERY SLOW</text>
    </g>
    
    <g transform="translate(300, 70)">
        <rect width="200" height="130" fill="#e8e8e9" stroke="#0072b0" stroke-width="2" rx="5"/>
        <text x="100" y="25" font-family="Arial" font-size="14" font-weight="bold" fill="#0072b0" text-anchor="middle">Index Scan</text>
        <text x="100" y="45" font-family="Arial" font-size="12" fill="#5f5f5f" text-anchor="middle">Read entire index</text>
        <rect x="20" y="60" width="80" height="20" fill="#4FC1FF" opacity="0.5"/>
        <rect x="20" y="85" width="80" height="20" fill="#4FC1FF" opacity="0.5"/>
        <text x="100" y="120" font-family="Arial" font-size="14" font-weight="bold" fill="#0072b0" text-anchor="middle">FASTER</text>
    </g>
    
    <g transform="translate(550, 70)">
        <rect width="200" height="130" fill="#e8e8e9" stroke="#267d6b" stroke-width="2" rx="5"/>
        <text x="100" y="25" font-family="Arial" font-size="14" font-weight="bold" fill="#267d6b" text-anchor="middle">Index Seek</text>
        <text x="100" y="45" font-family="Arial" font-size="12" fill="#5f5f5f" text-anchor="middle">Direct lookup</text>
        <circle cx="100" cy="80" r="15" fill="#4EC9B0"/>
        <path d="M 40 80 L 80 80" stroke="#267d6b" stroke-width="2"/>
        <text x="100" y="120" font-family="Arial" font-size="14" font-weight="bold" fill="#267d6b" text-anchor="middle">FASTEST (Targeted)</text>
    </g>
</svg>
