<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600">
    <rect width="1000" height="600" fill="#eeeeee"/>
    <text x="500" y="40" fill="#1f1f1f" font-family="Arial" font-size="24" font-weight="bold" text-anchor="middle">Clustered Index B-Tree (Searching for ID 14)</text>
    <text x="500" y="70" fill="#5f5f5f" font-family="Arial" font-size="16" text-anchor="middle">The Leaf Level contains the actual Data Pages. Data is physically sorted.</text>

    <!-- Root Node (Index Page) -->
    <rect x="400" y="100" width="200" height="80" rx="5" fill="#e2e2e3" stroke="#793a74" stroke-width="3"/>
    <rect x="400" y="100" width="200" height="25" fill="#C586C0" fill-opacity="0.2"/>
    <text x="500" y="118" fill="#793a74" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle">Root Node (Index Page)</text>
    <text x="500" y="145" fill="#575724" font-family="Arial" font-size="16" text-anchor="middle">1 - 10 ➔ Page 1:200</text>
    <text x="500" y="165" fill="#267d6b" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle">11 - 20 ➔ Page 1:201</text>

    <!-- Intermediate Nodes (Index Pages) -->
    <rect x="200" y="250" width="200" height="80" rx="5" fill="#e2e2e3" stroke="#793a74" stroke-width="2"/>
    <rect x="200" y="250" width="200" height="25" fill="#C586C0" fill-opacity="0.2"/>
    <text x="300" y="268" fill="#793a74" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle">Intermediate (Page 1:200)</text>
    <text x="300" y="295" fill="#575724" font-family="Arial" font-size="14" text-anchor="middle">1 - 5 ➔ Data Page 1:100</text>
    <text x="300" y="315" fill="#575724" font-family="Arial" font-size="14" text-anchor="middle">6 - 10 ➔ Data Page 1:101</text>

    <rect x="600" y="250" width="200" height="80" rx="5" fill="#e2e2e3" stroke="#793a74" stroke-width="3"/>
    <rect x="600" y="250" width="200" height="25" fill="#C586C0" fill-opacity="0.2"/>
    <text x="700" y="268" fill="#793a74" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle">Intermediate (Page 1:201)</text>
    <text x="700" y="295" fill="#267d6b" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle">11 - 15 ➔ Data Page 1:102</text>
    <text x="700" y="315" fill="#575724" font-family="Arial" font-size="14" text-anchor="middle">16 - 20 ➔ Data Page 1:103</text>

    <!-- Arrows from Root to Intermediate -->
    <path d="M 400 140 L 300 250" fill="none" stroke="#5f5f5f" stroke-width="2" marker-end="url(#arrow_gray)"/>
    <path d="M 600 160 L 700 250" fill="none" stroke="#267d6b" stroke-width="3" marker-end="url(#arrow_green)"/>

    <!-- Leaf Level (Data Pages) -->
    <rect x="50" y="400" width="150" height="150" rx="5" fill="#e8e8e9" stroke="#0072b0" stroke-width="2"/>
    <rect x="50" y="400" width="150" height="25" fill="#4FC1FF" fill-opacity="0.2"/>
    <text x="125" y="418" fill="#0072b0" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle">Data Page 1:100</text>
    <text x="125" y="445" fill="#575724" font-family="Arial" font-size="14" text-anchor="middle">1, Bob</text>
    <text x="125" y="475" fill="#575724" font-family="Arial" font-size="14" text-anchor="middle">... to 5, Chris</text>

    <rect x="250" y="400" width="150" height="150" rx="5" fill="#e8e8e9" stroke="#0072b0" stroke-width="2"/>
    <rect x="250" y="400" width="150" height="25" fill="#4FC1FF" fill-opacity="0.2"/>
    <text x="325" y="418" fill="#0072b0" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle">Data Page 1:101</text>
    <text x="325" y="445" fill="#575724" font-family="Arial" font-size="14" text-anchor="middle">6, Jessica</text>
    <text x="325" y="475" fill="#575724" font-family="Arial" font-size="14" text-anchor="middle">... to 10, Olivia</text>

    <rect x="450" y="400" width="150" height="150" rx="5" fill="#e8e8e9" stroke="#267d6b" stroke-width="3"/>
    <rect x="450" y="400" width="150" height="25" fill="#4EC9B0" fill-opacity="0.2"/>
    <text x="525" y="418" fill="#267d6b" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle">Data Page 1:102</text>
    <text x="525" y="445" fill="#575724" font-family="Arial" font-size="14" text-anchor="middle">11, James</text>
    <text x="525" y="465" fill="#575724" font-family="Arial" font-size="14" text-anchor="middle">12, Lisa</text>
    <text x="525" y="485" fill="#575724" font-family="Arial" font-size="14" text-anchor="middle">13, Daniel</text>
    <rect x="460" y="495" width="130" height="20" fill="#4EC9B0" fill-opacity="0.3" stroke="#267d6b" stroke-width="1"/>
    <text x="525" y="510" fill="#1f1f1f" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle">14, Sophia (Found)</text>

    <rect x="650" y="400" width="150" height="150" rx="5" fill="#e8e8e9" stroke="#0072b0" stroke-width="2"/>
    <rect x="650" y="400" width="150" height="25" fill="#4FC1FF" fill-opacity="0.2"/>
    <text x="725" y="418" fill="#0072b0" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle">Data Page 1:103</text>
    <text x="725" y="445" fill="#575724" font-family="Arial" font-size="14" text-anchor="middle">16, Emma</text>
    <text x="725" y="475" fill="#575724" font-family="Arial" font-size="14" text-anchor="middle">... to 20, Jane</text>

    <!-- Arrows from Intermediate to Leaf -->
    <path d="M 250 330 L 125 400" fill="none" stroke="#5f5f5f" stroke-width="2" marker-end="url(#arrow_gray)"/>
    <path d="M 350 330 L 325 400" fill="none" stroke="#5f5f5f" stroke-width="2" marker-end="url(#arrow_gray)"/>
    <path d="M 650 330 L 525 400" fill="none" stroke="#267d6b" stroke-width="3" marker-end="url(#arrow_green)"/>
    <path d="M 750 330 L 725 400" fill="none" stroke="#5f5f5f" stroke-width="2" marker-end="url(#arrow_gray)"/>

    <!-- Read Summary -->
    <rect x="830" y="200" width="150" height="100" rx="5" fill="#e2e2e3" stroke="#267d6b" stroke-width="2"/>
    <text x="905" y="230" fill="#267d6b" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle">Query Execution</text>
    <text x="905" y="255" fill="#1f1f1f" font-family="Arial" font-size="12" text-anchor="middle">Reads: 3 Pages</text>
    <text x="905" y="275" fill="#1f1f1f" font-family="Arial" font-size="12" text-anchor="middle">(Root ➔ Int ➔ Leaf)</text>

    <defs>
        <marker id="arrow_gray" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
            <path d="M 0 0 L 10 5 L 0 10 z" fill="#A0A0A0"/>
        </marker>
        <marker id="arrow_green" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
            <path d="M 0 0 L 10 5 L 0 10 z" fill="#4EC9B0"/>
        </marker>
    </defs>
</svg>
