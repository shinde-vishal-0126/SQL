    </defs><text x='300' y='40' font-family='Arial' font-size='24' font-weight='bold' fill='#00a383' text-anchor='middle'>Alternative to Right Join</text><g transform='translate(0, 50)'><text x='300' y='100' font-size='18' fill='#d68100' text-anchor='middle'>Pro Tip: Just swap tables and use LEFT JOIN</text><text x='300' y='140' font-size='16' fill='#323859' text-anchor='middle'>FROM TableB LEFT JOIN TableA</text></g></svg>
