        <linearGradient id="right" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#ff00cc" stop-opacity="0.8"/><stop offset="100%" stop-color="#ff6600" stop-opacity="0.8"/></linearGradient>
