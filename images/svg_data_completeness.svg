<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300">
    <rect width="800" height="300" fill="#eeeeee" rx="10"/>
    <text x="400" y="40" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#267d6b" text-anchor="middle">EXCEPT Use Case: Data Completeness Check</text>
    
    <!-- DB A -->
    <path d="M 100 80 C 100 70, 200 70, 200 80 L 200 130 C 200 140, 100 140, 100 130 Z" fill="#e8e8e9" stroke="#0072b0" stroke-width="2"/>
    <path d="M 100 80 C 100 90, 200 90, 200 80" fill="none" stroke="#0072b0" stroke-width="2"/>
    <text x="150" y="115" font-family="Arial" font-size="16" font-weight="bold" fill="#1f1f1f" text-anchor="middle">Database A</text>
    
    <!-- DB B -->
    <path d="M 100 180 C 100 170, 200 170, 200 180 L 200 230 C 200 240, 100 240, 100 230 Z" fill="#e8e8e9" stroke="#793a74" stroke-width="2"/>
    <path d="M 100 180 C 100 190, 200 190, 200 180" fill="none" stroke="#793a74" stroke-width="2"/>
    <text x="150" y="215" font-family="Arial" font-size="16" font-weight="bold" fill="#1f1f1f" text-anchor="middle">Database B</text>
    
    <!-- Arrows to EXCEPT -->
    <path d="M 210 105 L 270 105 L 270 150 L 310 150" fill="none" stroke="#b1b1b6" stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M 210 205 L 270 205 L 270 160 L 310 160" fill="none" stroke="#b1b1b6" stroke-width="3" marker-end="url(#arrow)"/>
    
    <!-- EXCEPT Bubble -->
    <rect x="310" y="135" width="100" height="40" rx="20" fill="#F44747" opacity="0.2"/>
    <rect x="310" y="135" width="100" height="40" rx="20" fill="none" stroke="#b80b0b" stroke-width="2"/>
    <text x="360" y="160" font-family="Arial" font-size="14" font-weight="bold" fill="#b80b0b" text-anchor="middle">EXCEPT</text>
    <text x="360" y="195" font-family="Arial" font-size="12" fill="#5f5f5f" text-anchor="middle">(DB A - DB B)</text>
    
    <!-- Arrow to Result -->
    <path d="M 410 155 L 470 155" fill="none" stroke="#b1b1b6" stroke-width="3" marker-end="url(#arrow)"/>
    
    <!-- Completeness Result -->
    <rect x="470" y="125" width="160" height="60" rx="5" fill="#e8e8e9" stroke="#267d6b" stroke-width="2"/>
    <text x="550" y="150" font-family="Arial" font-size="16" font-weight="bold" fill="#267d6b" text-anchor="middle">Empty Result</text>
    <text x="550" y="170" font-family="Arial" font-size="12" fill="#1f1f1f" text-anchor="middle">(100% In Sync)</text>
    
    <text x="550" y="210" font-family="Arial" font-size="12" fill="#5f5f5f" text-anchor="middle">If DB B is missing data,</text>
    <text x="550" y="225" font-family="Arial" font-size="12" fill="#5f5f5f" text-anchor="middle">EXCEPT will show exactly</text>
    <text x="550" y="240" font-family="Arial" font-size="12" fill="#5f5f5f" text-anchor="middle">which rows are missing!</text>

    <!-- Def -->
    <defs>
        <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
            <path d="M0,0 L0,6 L9,3 z" fill="#e3e3e5" />
        </marker>
    </defs>
</svg>