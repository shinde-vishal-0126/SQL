<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
    <rect width="800" height="400" fill="#eeeeee" rx="10"/>
    
    <text x="400" y="40" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#a38a00" text-anchor="middle">CTE vs Regular Subquery</text>
    
    <!-- Subquery Side (Bottom-Up) -->
    <rect x="100" y="70" width="200" height="40" fill="#e8e8e9" stroke="#b80b0b" stroke-width="2"/>
    <text x="200" y="95" font-family="Arial" font-size="16" font-weight="bold" fill="#b80b0b" text-anchor="middle">Subquery (Bottom-Up)</text>
    
    <rect x="100" y="130" width="200" height="200" fill="#eeeeee" stroke="#333333" stroke-width="2"/>
    <text x="150" y="155" font-family="Arial" font-size="14" font-weight="bold" fill="#a38a00">Main Query</text>
    
    <rect x="120" y="220" width="160" height="90" fill="#e8e8e9" stroke="#267d6b" stroke-width="2"/>
    <text x="140" y="245" font-family="Arial" font-size="14" font-weight="bold" fill="#267d6b">Subquery</text>
    <text x="140" y="270" font-family="Arial" font-size="12" fill="#1f1f1f">SELECT ...</text>
    <text x="140" y="290" font-family="Arial" font-size="12" fill="#1f1f1f">FROM ...</text>
    
    <!-- Arrow pointing up -->
    <path d="M 60 300 L 60 150" fill="none" stroke="#b80b0b" stroke-width="4" marker-end="url(#arrow)"/>
    <polygon points="60,150 50,160 70,160" fill="#F44747"/>
    <text x="50" y="225" font-family="Arial" font-size="14" font-weight="bold" fill="#b80b0b" transform="rotate(-90 50 225)" text-anchor="middle">Execution Flow</text>

    <!-- CTE Side (Top-Down) -->
    <rect x="500" y="70" width="200" height="40" fill="#e8e8e9" stroke="#267d6b" stroke-width="2"/>
    <text x="600" y="95" font-family="Arial" font-size="16" font-weight="bold" fill="#267d6b" text-anchor="middle">CTE (Top-Down)</text>
    
    <rect x="500" y="130" width="200" height="200" fill="#eeeeee" stroke="#333333" stroke-width="2"/>
    
    <rect x="520" y="150" width="160" height="70" fill="#e8e8e9" stroke="#267d6b" stroke-width="2"/>
    <text x="540" y="175" font-family="Arial" font-size="14" font-weight="bold" fill="#267d6b">CTE Query</text>
    <text x="540" y="195" font-family="Arial" font-size="12" fill="#1f1f1f">WITH cte AS (...)</text>
    
    <rect x="520" y="240" width="160" height="70" fill="#eeeeee" stroke="#a38a00" stroke-width="2"/>
    <text x="540" y="265" font-family="Arial" font-size="14" font-weight="bold" fill="#a38a00">Main Query</text>
    <text x="540" y="285" font-family="Arial" font-size="12" fill="#1f1f1f">SELECT ... FROM cte</text>
    
    <!-- Arrow pointing down -->
    <path d="M 750 150 L 750 300" fill="none" stroke="#267d6b" stroke-width="4" marker-end="url(#arrow)"/>
    <polygon points="750,300 740,290 760,290" fill="#4EC9B0"/>
    <text x="760" y="225" font-family="Arial" font-size="14" font-weight="bold" fill="#267d6b" transform="rotate(90 760 225)" text-anchor="middle">Execution Flow</text>
</svg>
