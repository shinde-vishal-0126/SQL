<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 350">
    <rect width="800" height="350" fill="#eeeeee" rx="10"/>
    <text x="400" y="40" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#575724" text-anchor="middle">Correlated Subquery in WHERE Clause: EXISTS Operator</text>
    
    <rect x="50" y="80" width="700" height="220" fill="#e8e8e9" stroke="#333333" stroke-width="2" rx="5"/>
    
    <text x="80" y="120" font-family="Courier New, monospace" font-size="16" font-weight="bold" fill="#296fa9">SELECT</text>
    <text x="160" y="120" font-family="Courier New, monospace" font-size="16" fill="#1f1f1f">column1, column2, ...</text>
    
    <text x="80" y="160" font-family="Courier New, monospace" font-size="16" font-weight="bold" fill="#296fa9">FROM</text>
    <text x="140" y="160" font-family="Courier New, monospace" font-size="16" font-weight="bold" fill="#267d6b">Table2</text>
    
    <text x="80" y="200" font-family="Courier New, monospace" font-size="16" font-weight="bold" fill="#296fa9">WHERE</text>
    <text x="140" y="200" font-family="Courier New, monospace" font-size="18" font-weight="bold" fill="#0072b0">EXISTS</text>
    
    <text x="220" y="200" font-family="Courier New, monospace" font-size="16" font-weight="bold" fill="#793a74">( </text>
    <rect x="250" y="180" width="350" height="100" fill="#eeeeee" stroke="#793a74" stroke-width="1"/>
    
    <text x="270" y="210" font-family="Courier New, monospace" font-size="14" font-weight="bold" fill="#296fa9">SELECT</text>
    <text x="330" y="210" font-family="Courier New, monospace" font-size="14" fill="#1f1f1f">1</text>
    
    <text x="270" y="240" font-family="Courier New, monospace" font-size="14" font-weight="bold" fill="#296fa9">FROM</text>
    <text x="320" y="240" font-family="Courier New, monospace" font-size="14" fill="#1f1f1f">Table1</text>
    
    <text x="270" y="270" font-family="Courier New, monospace" font-size="14" font-weight="bold" fill="#296fa9">WHERE</text>
    <text x="320" y="270" font-family="Courier New, monospace" font-size="14" fill="#1f1f1f">Table1.ID = </text>
    <text x="420" y="270" font-family="Courier New, monospace" font-size="14" font-weight="bold" fill="#267d6b">Table2.ID</text>
    
    <text x="610" y="270" font-family="Courier New, monospace" font-size="16" font-weight="bold" fill="#793a74"> )</text>
    
    <!-- Correlated Arrow -->
    <path d="M 215 165 Q 450 160 450 250" fill="none" stroke="#b80b0b" stroke-width="2" stroke-dasharray="5,5"/>
    <polygon points="450,250 445,240 455,240" fill="#F44747"/>
    <text x="380" y="150" font-family="Arial" font-size="12" font-style="italic" fill="#b80b0b">Correlated Reference (Runs row-by-row)</text>
</svg>
