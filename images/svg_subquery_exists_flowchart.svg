<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400">
    <rect width="600" height="400" fill="#eeeeee" rx="10"/>
    <rect x="150" y="30" width="300" height="50" fill="#FFD700" stroke="#333333" stroke-width="2" rx="5"/>
    <text x="300" y="62" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#1E1E1E" text-anchor="middle">How EXISTS Works?</text>
    
    <rect x="200" y="110" width="200" height="40" fill="#e8e8e9" stroke="#333333" stroke-width="2"/>
    <text x="300" y="135" font-family="Arial" font-size="14" fill="#1f1f1f" text-anchor="middle">For each row in Main Query</text>
    
    <path d="M 300 150 L 300 180" stroke="#333333" stroke-width="2"/>
    <polygon points="300,180 295,170 305,170" fill="#E0E0E0"/>
    
    <text x="270" y="175" font-family="Arial" font-size="24" fill="#a38a00">⚡</text>
    
    <rect x="200" y="180" width="200" height="40" fill="#e8e8e9" stroke="#333333" stroke-width="2"/>
    <text x="300" y="205" font-family="Arial" font-size="14" fill="#1f1f1f" text-anchor="middle">Run Subquery</text>
    
    <path d="M 300 220 L 300 250" stroke="#333333" stroke-width="2"/>
    <path d="M 150 250 L 450 250" stroke="#333333" stroke-width="2"/>
    
    <!-- Left path: No Result -->
    <path d="M 150 250 L 150 280" stroke="#333333" stroke-width="2"/>
    <polygon points="150,280 145,270 155,270" fill="#E0E0E0"/>
    
    <rect x="50" y="280" width="200" height="40" fill="#eeeeee" stroke="#b80b0b" stroke-width="4"/>
    <text x="150" y="305" font-family="Arial" font-size="16" font-weight="bold" fill="#b80b0b" text-anchor="middle">No Result?</text>
    
    <path d="M 150 320 L 150 350" stroke="#333333" stroke-width="2"/>
    <polygon points="150,350 145,340 155,340" fill="#E0E0E0"/>
    
    <rect x="50" y="350" width="200" height="40" fill="#f2dcdc" stroke="#b80b0b" stroke-width="2"/>
    <text x="150" y="365" font-family="Arial" font-size="12" fill="#1f1f1f" text-anchor="middle">Row of Main Query</text>
    <text x="150" y="380" font-family="Arial" font-size="14" font-weight="bold" fill="#b80b0b" text-anchor="middle">is excluded</text>

    <!-- Right path: Returns Value -->
    <path d="M 450 250 L 450 280" stroke="#333333" stroke-width="2"/>
    <polygon points="450,280 445,270 455,270" fill="#E0E0E0"/>
    
    <rect x="350" y="280" width="200" height="40" fill="#eeeeee" stroke="#267d6b" stroke-width="4"/>
    <text x="450" y="305" font-family="Arial" font-size="16" font-weight="bold" fill="#267d6b" text-anchor="middle">returns Value?</text>
    
    <path d="M 450 320 L 450 350" stroke="#333333" stroke-width="2"/>
    <polygon points="450,350 445,340 455,340" fill="#E0E0E0"/>
    
    <rect x="350" y="350" width="200" height="40" fill="#def2e9" stroke="#267d6b" stroke-width="2"/>
    <text x="450" y="365" font-family="Arial" font-size="12" fill="#1f1f1f" text-anchor="middle">Row of Main Query</text>
    <text x="450" y="380" font-family="Arial" font-size="14" font-weight="bold" fill="#267d6b" text-anchor="middle">is included</text>
</svg>
