<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 350">
    <rect width="600" height="350" fill="#eeeeee" rx="10"/>
    <text x="300" y="30" font-family="Arial" font-size="20" font-weight="bold" fill="#575724" text-anchor="middle">WINDOW RANK FUNCTIONS SUMMARY</text>
    
    <!-- Types Box -->
    <rect x="50" y="60" width="230" height="120" fill="#e8e8e9" stroke="#0072b0" stroke-width="2"/>
    <text x="165" y="80" font-family="Arial" font-size="16" font-weight="bold" fill="#0072b0" text-anchor="middle">Types</text>
    <text x="60" y="110" font-family="Arial" font-size="14" fill="#1f1f1f">• Integer-based:</text>
    <text x="70" y="130" font-family="Courier New" font-size="12" fill="#5f5f5f">ROW_NUMBER, RANK, DENSE_RANK, NTILE</text>
    <text x="60" y="150" font-family="Arial" font-size="14" fill="#1f1f1f">• Percentage-based:</text>
    <text x="70" y="170" font-family="Courier New" font-size="12" fill="#5f5f5f">PERCENT_RANK, CUME_DIST</text>

    <!-- Rules Box -->
    <rect x="50" y="200" width="230" height="120" fill="#e8e8e9" stroke="#b80b0b" stroke-width="2"/>
    <text x="165" y="220" font-family="Arial" font-size="16" font-weight="bold" fill="#b80b0b" text-anchor="middle">Rules</text>
    <text x="60" y="250" font-family="Arial" font-size="14" fill="#1f1f1f">• Expression -> Empty</text>
    <text x="60" y="275" font-family="Arial" font-size="14" fill="#1f1f1f">• ORDER BY -> Required</text>
    <text x="60" y="300" font-family="Arial" font-size="14" fill="#1f1f1f">• FRAME -> Not Allowed</text>

    <!-- Use Cases Box -->
    <rect x="320" y="60" width="230" height="260" fill="#e8e8e9" stroke="#267d6b" stroke-width="2"/>
    <text x="435" y="80" font-family="Arial" font-size="16" font-weight="bold" fill="#267d6b" text-anchor="middle">Use Cases</text>
    <text x="330" y="110" font-family="Arial" font-size="14" fill="#1f1f1f">• Top-N / Bottom-N Analysis</text>
    <text x="330" y="140" font-family="Arial" font-size="14" fill="#1f1f1f">• Identify &amp; Remove Duplicates</text>
    <text x="330" y="170" font-family="Arial" font-size="14" fill="#1f1f1f">• Assign Unique ID (Pagination)</text>
    <text x="330" y="200" font-family="Arial" font-size="14" fill="#1f1f1f">• Data Segmentation (NTILE)</text>
    <text x="330" y="230" font-family="Arial" font-size="14" fill="#1f1f1f">• Distribution Analysis</text>
    <text x="330" y="260" font-family="Arial" font-size="14" fill="#1f1f1f">• Equalizing Load Processing</text>

</svg>