<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 200">
    <rect width="600" height="200" fill="#eeeeee" rx="10"/>
    <text x="300" y="30" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#267d6b" text-anchor="middle">NULL Functions Use Cases</text>
    
    <rect x="50" y="50" width="500" height="130" rx="5" fill="#e8e8e9" stroke="#b1b1b6" stroke-width="2"/>
    
    <text x="70" y="75" font-family="Courier New" font-size="14" fill="#0072b0" text-anchor="start">1. Data Aggregation (SUM, AVG)</text>
    <text x="70" y="95" font-family="Courier New" font-size="14" fill="#267d6b" text-anchor="start">2. Mathematical Operations</text>
    <text x="70" y="115" font-family="Courier New" font-size="14" fill="#793a74" text-anchor="start">3. Joining Tables</text>
    <text x="70" y="135" font-family="Courier New" font-size="14" fill="#575724" text-anchor="start">4. Sorting Data (NULLs first/last)</text>
    <text x="70" y="155" font-family="Courier New" font-size="14" fill="#b80b0b" text-anchor="start">5. Finding Unmatched Data (Anti-Joins)</text>
</svg>