<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650">
    <rect width="1000" height="650" fill="#eeeeee" rx="10"/>

    <text x="500" y="40" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#a38300" text-anchor="middle">Use Case 1: Optimize Performance using CTAS</text>
    
    <!-- Dividing Line -->
    <line x1="450" y1="80" x2="450" y2="600" stroke="#777777" stroke-width="3"/>

    <!-- Left Side (Database/Creation) -->
    
    <!-- DB Icon -->
    <ellipse cx="200" cy="100" rx="30" ry="10" fill="#CCC" stroke="#c7c7c7" stroke-width="2"/>
    <path d="M 170 100 L 170 120 A 30 10 0 0 0 230 120 L 230 100" fill="#CCC" stroke="#c7c7c7" stroke-width="2"/>
    <path d="M 170 110 L 170 130 A 30 10 0 0 0 230 130 L 230 110" fill="#CCC" stroke="#c7c7c7" stroke-width="2"/>
    <text x="250" y="120" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#1f1f1f">DATABASE</text>

    <!-- Source Tables -->
    <text x="100" y="190" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#1f1f1f" text-anchor="middle">TABLE</text>
    <rect x="70" y="200" width="60" height="60" fill="#FFF" stroke="#c7c7c7" stroke-width="2"/>
    <rect x="70" y="200" width="60" height="15" fill="#4FC1FF" stroke="#c7c7c7" stroke-width="1"/>
    <text x="100" y="212" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#000" text-anchor="middle">ORDERS</text>

    <text x="100" y="310" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#1f1f1f" text-anchor="middle">TABLE</text>
    <rect x="70" y="320" width="60" height="60" fill="#FFF" stroke="#c7c7c7" stroke-width="2"/>
    <rect x="70" y="320" width="60" height="15" fill="#4FC1FF" stroke="#c7c7c7" stroke-width="1"/>
    <text x="100" y="332" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#000" text-anchor="middle">CUSTOMERS</text>

    <!-- CTAS Query Process -->
    <text x="200" y="235" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#b80b0b" text-anchor="middle">CTAS</text>
    <rect x="170" y="245" width="60" height="60" fill="#FFF" stroke="#c7c7c7" stroke-width="3" rx="5"/>
    <text x="200" y="270" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#0000d6" text-anchor="middle">SUM</text>
    <text x="200" y="290" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#0000d6" text-anchor="middle">JOIN</text>

    <path d="M 130 230 L 170 260" stroke="#b80b0b" stroke-width="3" marker-end="url(#arrow_red)"/>
    <path d="M 130 350 L 170 290" stroke="#b80b0b" stroke-width="3" marker-end="url(#arrow_red)"/>

    <!-- Clock Icon for slow query -->
    <circle cx="280" cy="180" r="15" fill="#FFF" stroke="#b80b0b" stroke-width="3"/>
    <line x1="280" y1="180" x2="280" y2="170" stroke="#b80b0b" stroke-width="2"/>
    <line x1="280" y1="180" x2="288" y2="185" stroke="#b80b0b" stroke-width="2"/>
    <text x="330" y="185" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#b80b0b">30 Mins (Slow)</text>

    <path d="M 230 275 L 300 275" stroke="#b80b0b" stroke-width="3" stroke-dasharray="5,5" marker-end="url(#arrow_red)"/>

    <!-- CTAS Output Table (Sales) -->
    <text x="350" y="235" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#1f1f1f" text-anchor="middle">TABLE</text>
    <rect x="310" y="245" width="80" height="60" fill="#FFF" stroke="#267d6b" stroke-width="4"/>
    <rect x="310" y="245" width="80" height="20" fill="#4EC9B0"/>
    <text x="350" y="260" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#000" text-anchor="middle">SALES</text>

    <!-- Execution Time context -->
    <text x="250" y="550" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#b80b0b" text-anchor="middle">EXECUTED ONCE (At Night)</text>
    <path d="M 100 570 L 400 570" stroke="#b80b0b" stroke-width="6" marker-end="url(#arrow_red_big)"/>


    <!-- Right Side (Users/Analytics) -->

    <!-- Analyst 1 -->
    <rect x="520" y="100" width="80" height="60" fill="#FFF" stroke="#c7c7c7" stroke-width="3" rx="5"/>
    <text x="560" y="120" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#000" text-anchor="middle">Query</text>
    <text x="560" y="140" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#0000d6" text-anchor="middle">RANK</text>
    
    <path d="M 400 250 L 520 140" stroke="#267d6b" stroke-width="3" marker-end="url(#arrow_green)"/>
    <text x="460" y="170" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#267d6b">FAST</text>
    <path d="M 600 130 L 680 130" stroke="#267d6b" stroke-width="3" marker-end="url(#arrow_green)"/>

    <rect x="680" y="110" width="60" height="40" fill="#FFF" stroke="#c7c7c7" stroke-width="2"/>
    <text x="710" y="135" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#000" text-anchor="middle">RESULT</text>
    <rect x="760" y="110" width="80" height="40" fill="#ebebec" stroke="#333333" stroke-width="2"/>
    <text x="800" y="135" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#1f1f1f" text-anchor="middle">Financial Analyst</text>

    <!-- Analyst 2 -->
    <rect x="520" y="240" width="80" height="60" fill="#FFF" stroke="#c7c7c7" stroke-width="3" rx="5"/>
    <text x="560" y="260" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#000" text-anchor="middle">Query</text>
    <text x="560" y="280" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#0000d6" text-anchor="middle">MAX/MIN</text>
    
    <path d="M 400 275 L 520 275" stroke="#267d6b" stroke-width="3" marker-end="url(#arrow_green)"/>
    <text x="460" y="265" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#267d6b">FAST</text>
    <path d="M 600 270 L 680 270" stroke="#267d6b" stroke-width="3" marker-end="url(#arrow_green)"/>

    <rect x="680" y="250" width="60" height="40" fill="#FFF" stroke="#c7c7c7" stroke-width="2"/>
    <text x="710" y="275" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#000" text-anchor="middle">RESULT</text>
    <rect x="760" y="250" width="80" height="40" fill="#ebebec" stroke="#333333" stroke-width="2"/>
    <text x="800" y="275" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#1f1f1f" text-anchor="middle">Budget Analyst</text>

    <!-- Analyst 3 -->
    <rect x="520" y="380" width="80" height="60" fill="#FFF" stroke="#c7c7c7" stroke-width="3" rx="5"/>
    <text x="560" y="400" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#000" text-anchor="middle">Query</text>
    <text x="560" y="420" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#0000d6" text-anchor="middle">COMPARE</text>
    
    <path d="M 400 300 L 520 400" stroke="#267d6b" stroke-width="3" marker-end="url(#arrow_green)"/>
    <text x="460" y="380" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#267d6b">FAST</text>
    <path d="M 600 410 L 680 410" stroke="#267d6b" stroke-width="3" marker-end="url(#arrow_green)"/>

    <rect x="680" y="390" width="60" height="40" fill="#FFF" stroke="#c7c7c7" stroke-width="2"/>
    <text x="710" y="415" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#000" text-anchor="middle">RESULT</text>
    <rect x="760" y="390" width="80" height="40" fill="#ebebec" stroke="#333333" stroke-width="2"/>
    <text x="800" y="415" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#1f1f1f" text-anchor="middle">Risk Analyst</text>

    <!-- Execution Time context Right -->
    <text x="650" y="550" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#267d6b" text-anchor="middle">EXECUTED MULTIPLE TIMES (Fast)</text>
    <path d="M 500 570 L 800 570" stroke="#267d6b" stroke-width="6" marker-start="url(#arrow_green_rev_big)" marker-end="url(#arrow_green_big)"/>

    <defs>
        <marker id="arrow_red" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#F44747" /></marker>
        <marker id="arrow_green" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#4EC9B0" /></marker>
        
        <marker id="arrow_red_big" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#F44747" /></marker>
        <marker id="arrow_green_big" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#4EC9B0" /></marker>
        <marker id="arrow_green_rev_big" markerWidth="10" markerHeight="10" refX="2" refY="5" orient="auto-start-reverse"><path d="M 10 0 L 0 5 L 10 10 z" fill="#4EC9B0" /></marker>
    </defs>
</svg>
