<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300">
    <rect width="800" height="300" fill="#eeeeee" rx="10"/>
    <text x="400" y="40" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#575724" text-anchor="middle">Execution Plan Types</text>
    
    <g transform="translate(50, 80)">
        <rect width="200" height="120" fill="#e8e8e9" stroke="#0072b0" stroke-width="2" rx="5"/>
        <text x="100" y="30" font-family="Arial" font-size="14" font-weight="bold" fill="#0072b0" text-anchor="middle">Estimated Plan</text>
        <text x="100" y="55" font-family="Arial" font-size="12" fill="#1f1f1f" text-anchor="middle">Prediction (Guess)</text>
        <text x="100" y="75" font-family="Arial" font-size="12" fill="#b80b0b" font-weight="bold" text-anchor="middle">Query is NOT executed</text>
        <text x="100" y="95" font-family="Arial" font-size="12" fill="#5f5f5f" text-anchor="middle">Command: EXPLAIN</text>
    </g>
    
    <path d="M 260 140 L 290 140" stroke="#5f5f5f" stroke-width="2" marker-end="url(#arrow)"/>
    
    <g transform="translate(300, 80)">
        <rect width="200" height="120" fill="#e8e8e9" stroke="#267d6b" stroke-width="2" rx="5"/>
        <text x="100" y="30" font-family="Arial" font-size="14" font-weight="bold" fill="#267d6b" text-anchor="middle">Actual Plan</text>
        <text x="100" y="55" font-family="Arial" font-size="12" fill="#1f1f1f" text-anchor="middle">Real performance stats</text>
        <text x="100" y="75" font-family="Arial" font-size="12" fill="#267d6b" font-weight="bold" text-anchor="middle">Query IS executed</text>
        <text x="100" y="95" font-family="Arial" font-size="12" fill="#5f5f5f" text-anchor="middle">Command: EXPLAIN ANALYZE</text>
    </g>
    
    <path d="M 510 140 L 540 140" stroke="#5f5f5f" stroke-width="2" marker-end="url(#arrow)"/>

    <g transform="translate(550, 80)">
        <rect width="200" height="120" fill="#e8e8e9" stroke="#793a74" stroke-width="2" rx="5"/>
        <text x="100" y="30" font-family="Arial" font-size="14" font-weight="bold" fill="#793a74" text-anchor="middle">Live Statistics</text>
        <text x="100" y="55" font-family="Arial" font-size="12" fill="#1f1f1f" text-anchor="middle">Shows live progress</text>
        <text x="100" y="75" font-family="Arial" font-size="12" fill="#793a74" font-weight="bold" text-anchor="middle">In Real-Time</text>
        <text x="100" y="95" font-family="Arial" font-size="12" fill="#5f5f5f" text-anchor="middle">Used for long queries</text>
    </g>
</svg>
