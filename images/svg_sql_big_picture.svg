<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700">
    <rect width="1000" height="700" fill="#eeeeee" rx="10"/>

    <text x="500" y="40" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="#a38300" text-anchor="middle">The Big Picture of SQL</text>

    <!-- Divide into Database and Query area -->
    <line x1="300" y1="80" x2="300" y2="650" stroke="#777777" stroke-width="2" stroke-dasharray="5,5"/>
    <text x="150" y="80" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#0072b0" text-anchor="middle">DATABASE</text>
    <text x="650" y="80" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#1f1f1f" text-anchor="middle">QUERY EXECUTION (Analysts &amp; Scientists)</text>

    <!-- DATABASE AREA -->
    
    <!-- Table 1 -->
    <text x="150" y="120" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#1f1f1f" text-anchor="middle">TABLE</text>
    <rect x="110" y="130" width="80" height="60" fill="#FFF" stroke="#c7c7c7" stroke-width="2"/>
    <rect x="110" y="130" width="80" height="15" fill="#4FC1FF"/>
    <line x1="110" y1="150" x2="190" y2="150" stroke="#c7c7c7" stroke-width="1"/>
    <line x1="110" y1="170" x2="190" y2="170" stroke="#c7c7c7" stroke-width="1"/>
    <line x1="136" y1="130" x2="136" y2="190" stroke="#c7c7c7" stroke-width="1"/>
    <line x1="162" y1="130" x2="162" y2="190" stroke="#c7c7c7" stroke-width="1"/>
    
    <!-- DBA (Insert) -->
    <rect x="50" y="550" width="140" height="60" fill="#FFF" stroke="#c7c7c7" stroke-width="2"/>
    <text x="120" y="570" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#0000d6" text-anchor="middle">INSERT INTO</text>
    <text x="120" y="595" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#0000d6" text-anchor="middle">VALUES (...)</text>
    <text x="120" y="540" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#267d6b" text-anchor="middle">INSERT Statement</text>
    <text x="120" y="635" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#1f1f1f" text-anchor="middle">Database Admin</text>
    <circle cx="120" cy="615" r="10" fill="#FFCC00"/> <!-- Head -->
    
    <path d="M 120 550 L 120 190" stroke="#267d6b" stroke-width="3" fill="none" marker-end="url(#arrow_green)"/>
    

    <!-- Subquery linking to Table 1 -->
    <rect x="400" y="150" width="80" height="70" fill="#FFF" stroke="#c7c7c7" stroke-width="2"/>
    <text x="440" y="140" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#0072b0" text-anchor="middle">SUB Query</text>
    <text x="440" y="170" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#0000d6" text-anchor="middle">SELECT...</text>
    <text x="440" y="190" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#0000d6" text-anchor="middle">FROM ...</text>
    <path d="M 400 180 L 190 160" stroke="#b80b0b" stroke-width="2" fill="none" marker-end="url(#arrow_red)"/>
    
    <rect x="520" y="160" width="60" height="50" fill="#FFF" stroke="#c7c7c7" stroke-width="1"/>
    <line x1="520" y1="175" x2="580" y2="175" stroke="#c7c7c7" stroke-width="1"/>
    <line x1="520" y1="190" x2="580" y2="190" stroke="#c7c7c7" stroke-width="1"/>
    <text x="550" y="150" font-family="Arial, sans-serif" font-size="12" fill="#1f1f1f" text-anchor="middle">Result</text>
    <path d="M 480 185 L 520 185" stroke="#b80b0b" stroke-width="2" fill="none" marker-end="url(#arrow_red)"/>
    

    <!-- Table 2 (CTAS Physical Table) -->
    <text x="150" y="320" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#1f1f1f" text-anchor="middle">TABLE (CTAS)</text>
    <text x="70" y="350" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#1f1f1f" text-anchor="middle">DDL Statement</text>
    <rect x="110" y="330" width="80" height="60" fill="#FFF" stroke="#c7c7c7" stroke-width="3"/>
    <rect x="110" y="330" width="80" height="15" fill="#4FC1FF"/>
    <line x1="110" y1="350" x2="190" y2="350" stroke="#c7c7c7" stroke-width="1"/>
    <line x1="110" y1="370" x2="190" y2="370" stroke="#c7c7c7" stroke-width="1"/>
    
    <!-- CTE Query linking to Table 2 -->
    <rect x="400" y="300" width="80" height="70" fill="#FFF" stroke="#c7c7c7" stroke-width="2"/>
    <text x="440" y="290" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#267d6b" text-anchor="middle">CTE Query</text>
    <text x="440" y="320" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#0000d6" text-anchor="middle">SELECT...</text>
    <text x="440" y="340" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#0000d6" text-anchor="middle">FROM ...</text>
    <path d="M 400 330 L 190 350" stroke="#b80b0b" stroke-width="2" fill="none" marker-end="url(#arrow_red)"/>
    
    <rect x="520" y="310" width="60" height="50" fill="#FFF" stroke="#c7c7c7" stroke-width="1"/>
    <line x1="520" y1="325" x2="580" y2="325" stroke="#c7c7c7" stroke-width="1"/>
    <line x1="520" y1="340" x2="580" y2="340" stroke="#c7c7c7" stroke-width="1"/>
    <text x="550" y="300" font-family="Arial, sans-serif" font-size="12" fill="#1f1f1f" text-anchor="middle">Temp Set (Memory)</text>
    <path d="M 480 335 L 520 335" stroke="#b80b0b" stroke-width="2" fill="none" marker-end="url(#arrow_red)"/>


    <!-- View linking to Table 2 -->
    <line x1="100" y1="440" x2="200" y2="440" stroke="#777777" stroke-width="2" stroke-dasharray="5,5"/>
    <text x="150" y="460" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#1f1f1f" text-anchor="middle">VIEW</text>
    <rect x="110" y="470" width="80" height="60" fill="#FFF" stroke="#c7c7c7" stroke-width="2"/>
    <rect x="110" y="470" width="80" height="15" fill="#FFCC00"/>
    <line x1="110" y1="490" x2="190" y2="490" stroke="#c7c7c7" stroke-width="1"/>
    <line x1="110" y1="510" x2="190" y2="510" stroke="#c7c7c7" stroke-width="1"/>
    <text x="70" y="490" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#1f1f1f" text-anchor="middle">DDL Statement</text>
    
    <path d="M 150 470 L 150 390" stroke="#b80b0b" stroke-width="2" fill="none" marker-end="url(#arrow_red)"/>


    <!-- MAIN QUERY (Analyst) -->
    <rect x="650" y="330" width="100" height="120" fill="#FFF" stroke="#c7c7c7" stroke-width="3"/>
    <text x="700" y="320" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#0072b0" text-anchor="middle">MAIN QUERY</text>
    <text x="700" y="360" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#0000d6" text-anchor="middle">SELECT...</text>
    <text x="700" y="390" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#0000d6" text-anchor="middle">FROM ...</text>
    <text x="700" y="420" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#0000d6" text-anchor="middle">WHERE...</text>
    
    <!-- Arrows to Main Query -->
    <path d="M 580 185 Q 650 250 670 330" stroke="#b80b0b" stroke-width="2" fill="none" marker-end="url(#arrow_red)"/> <!-- Subquery result to Main -->
    <path d="M 580 335 L 650 380" stroke="#b80b0b" stroke-width="2" fill="none" marker-end="url(#arrow_red)"/> <!-- CTE result to Main -->
    <path d="M 190 370 Q 550 450 650 410" stroke="#b80b0b" stroke-width="2" fill="none" marker-end="url(#arrow_red)"/> <!-- Direct to Table -->
    <path d="M 190 500 Q 550 550 680 450" stroke="#b80b0b" stroke-width="2" fill="none" marker-end="url(#arrow_red)"/> <!-- Direct to View -->


    <!-- Data Analyst / Final Result -->
    <path d="M 750 390 L 820 390" stroke="#b80b0b" stroke-width="3" fill="none" marker-end="url(#arrow_red)"/>
    
    <rect x="830" y="350" width="90" height="70" fill="#FFF" stroke="#c7c7c7" stroke-width="2"/>
    <rect x="830" y="350" width="90" height="15" fill="#4EC9B0"/>
    <line x1="830" y1="373" x2="920" y2="373" stroke="#c7c7c7" stroke-width="1"/>
    <line x1="830" y1="396" x2="920" y2="396" stroke="#c7c7c7" stroke-width="1"/>
    <line x1="860" y1="350" x2="860" y2="420" stroke="#c7c7c7" stroke-width="1"/>
    <line x1="890" y1="350" x2="890" y2="420" stroke="#c7c7c7" stroke-width="1"/>
    <text x="875" y="340" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#1f1f1f" text-anchor="middle">Final Result</text>
    
    <path d="M 875 320 L 875 250" stroke="#b80b0b" stroke-width="3" fill="none" marker-end="url(#arrow_red)"/>
    <rect x="840" y="190" width="70" height="50" fill="#FFF" stroke="#c7c7c7" stroke-width="2"/>
    <circle cx="875" cy="170" r="15" fill="#FF8C00"/> <!-- Head -->
    <text x="875" y="260" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#0072b0" text-anchor="middle">Data Scientist/Analyst</text>

    <!-- Large White Box surrounding the queries to represent "One Script" -->
    <rect x="380" y="100" width="400" height="400" fill="none" stroke="#333333" stroke-width="2" stroke-dasharray="10,10"/>
    <text x="580" y="90" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#1f1f1f" text-anchor="middle">SINGLE SCRIPT</text>


    <defs>
        <marker id="arrow_red" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#F44747" /></marker>
        <marker id="arrow_green" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#4EC9B0" /></marker>
    </defs>
</svg>
