<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 200">
    <rect width="600" height="200" fill="#eeeeee" rx="10"/>
    <text x="300" y="30" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#1f1f1f" text-anchor="middle">CAST &amp; CONVERT vs FORMAT</text>
    
    <text x="200" y="70" font-family="Arial" font-size="14" font-weight="bold" fill="#575724" text-anchor="middle">CASTING</text>
    <text x="400" y="70" font-family="Arial" font-size="14" font-weight="bold" fill="#267d6b" text-anchor="middle">FORMATTING</text>

    <text x="80" y="110" font-family="Courier New" font-size="16" font-weight="bold" fill="#0072b0" text-anchor="middle">CAST</text>
    <text x="200" y="110" font-family="Arial" font-size="14" fill="#1f1f1f" text-anchor="middle">Any Type → Any Type</text>
    <text x="400" y="110" font-family="Arial" font-size="14" fill="#b80b0b" text-anchor="middle">X No Formatting</text>

    <text x="80" y="150" font-family="Courier New" font-size="16" font-weight="bold" fill="#0072b0" text-anchor="middle">FORMAT</text>
    <text x="200" y="150" font-family="Arial" font-size="14" fill="#1f1f1f" text-anchor="middle">Any Type → Only String</text>
    <text x="400" y="150" font-family="Arial" font-size="14" fill="#267d6b" text-anchor="middle">Formats Date, Time, Numbers</text>

    <!-- Grid lines -->
    <path d="M 140 50 L 140 180" fill="none" stroke="#b1b1b6" stroke-width="1"/>
    <path d="M 300 50 L 300 180" fill="none" stroke="#b1b1b6" stroke-width="1"/>
    <path d="M 50 130 L 550 130" fill="none" stroke="#b1b1b6" stroke-width="1"/>
</svg>