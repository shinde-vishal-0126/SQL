<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300">
    <rect width="800" height="300" fill="#eeeeee" rx="10"/>
    <text x="400" y="30" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#575724" text-anchor="middle">FROM Clause (Derived Table)</text>
    
    <rect x="50" y="80" width="700" height="150" fill="#e8e8e9" stroke="#333333" stroke-width="2" rx="5"/>
    
    <text x="80" y="120" font-family="Courier New, monospace" font-size="16" font-weight="bold" fill="#296fa9">SELECT</text>
    <text x="160" y="120" font-family="Courier New, monospace" font-size="16" fill="#1f1f1f">column1, column2, ...</text>
    
    <text x="80" y="160" font-family="Courier New, monospace" font-size="16" font-weight="bold" fill="#296fa9">FROM</text>
    <text x="130" y="160" font-family="Courier New, monospace" font-size="16" font-weight="bold" fill="#267d6b">( </text>
    
    <rect x="150" y="135" width="450" height="40" fill="#eeeeee" stroke="#267d6b" stroke-width="1"/>
    <text x="160" y="160" font-family="Courier New, monospace" font-size="14" font-weight="bold" fill="#296fa9">SELECT</text>
    <text x="220" y="160" font-family="Courier New, monospace" font-size="14" fill="#1f1f1f">column</text>
    <text x="280" y="160" font-family="Courier New, monospace" font-size="14" font-weight="bold" fill="#296fa9">FROM</text>
    <text x="320" y="160" font-family="Courier New, monospace" font-size="14" fill="#1f1f1f">table1</text>
    <text x="380" y="160" font-family="Courier New, monospace" font-size="14" font-weight="bold" fill="#296fa9">WHERE</text>
    <text x="430" y="160" font-family="Courier New, monospace" font-size="14" fill="#1f1f1f">condition</text>
    
    <text x="610" y="160" font-family="Courier New, monospace" font-size="16" font-weight="bold" fill="#267d6b">) AS alias</text>
    
    <!-- Arrows & Labels -->
    <path d="M 370 200 L 370 230" stroke="#267d6b" stroke-width="2"/>
    <text x="370" y="250" font-family="Arial" font-size="14" font-weight="bold" fill="#267d6b" text-anchor="middle">Subquery (Temporary Table)</text>

    <path d="M 680 70 L 680 40" stroke="#575724" stroke-width="2"/>
    <text x="680" y="30" font-family="Arial" font-size="14" font-weight="bold" fill="#575724" text-anchor="middle">Main Query</text>
</svg>
