<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 440" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="k" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker>
  </defs>
  <rect width="1000" height="440" fill="#f8fafc" rx="12"/>
  <text x="500" y="38" text-anchor="middle" font-size="24" font-weight="800" fill="#0f172a">Pagination: LIMIT OFFSET vs Keyset (Seek)</text>
  <text x="500" y="62" text-anchor="middle" font-size="13" fill="#64748b">Fetching page 5001 (20 rows per page) from a big orders table</text>

  <!-- offset -->
  <rect x="20" y="85" width="660" height="150" rx="12" fill="#ffffff" stroke="#fca5a5" stroke-width="2"/>
  <text x="40" y="112" font-size="15" font-weight="800" fill="#b91c1c">❌ LIMIT 20 OFFSET 100000</text>
  <rect x="40" y="130" width="560" height="40" rx="6" fill="#e2e8f0" stroke="#94a3b8"/>
  <text x="320" y="155" text-anchor="middle" font-size="12" fill="#475569">100,000 rows read and thrown away</text>
  <rect x="600" y="130" width="60" height="40" rx="6" fill="#dcfce7" stroke="#16a34a"/>
  <text x="630" y="155" text-anchor="middle" font-size="12" font-weight="700" fill="#15803d">20</text>
  <text x="40" y="200" font-size="12" fill="#334155">Cost grows with every page · rows shift if data changes → duplicates / missed rows</text>
  <text x="40" y="220" font-size="12" font-family="Consolas, monospace" fill="#334155">ORDER BY order_id LIMIT 20 OFFSET 100000</text>

  <!-- keyset -->
  <rect x="20" y="255" width="660" height="165" rx="12" fill="#ffffff" stroke="#86efac" stroke-width="2"/>
  <text x="40" y="282" font-size="15" font-weight="800" fill="#15803d">✅ Keyset: WHERE order_id &gt; last_id</text>
  <rect x="40" y="300" width="560" height="40" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-dasharray="5,4"/>
  <text x="300" y="325" text-anchor="middle" font-size="12" fill="#94a3b8">skipped through the B-Tree index (not read)</text>
  <path d="M60,296 C200,262 450,262 592,296" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#k)"/>
  <text x="330" y="276" text-anchor="middle" font-size="11" fill="#1d4ed8">index seek to last_id</text>
  <rect x="600" y="300" width="60" height="40" rx="6" fill="#dcfce7" stroke="#16a34a"/>
  <text x="630" y="325" text-anchor="middle" font-size="12" font-weight="700" fill="#15803d">20</text>
  <text x="40" y="370" font-size="12" fill="#334155">Reads only 20 rows · every page equally fast · stable when rows are added</text>
  <text x="40" y="395" font-size="12" font-family="Consolas, monospace" fill="#334155">WHERE order_id &gt; 1020 ORDER BY order_id LIMIT 20</text>

  <!-- compare -->
  <rect x="700" y="85" width="280" height="335" rx="12" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="840" y="112" text-anchor="middle" font-size="15" font-weight="800" fill="#0f172a">Quick compare</text>
  <text x="715" y="142" font-size="12" font-weight="700" fill="#334155">Deep page speed</text>
  <text x="715" y="160" font-size="12" fill="#b91c1c">OFFSET: slower and slower</text>
  <text x="715" y="178" font-size="12" fill="#15803d">Keyset: constant</text>
  <text x="715" y="210" font-size="12" font-weight="700" fill="#334155">Jump to page N</text>
  <text x="715" y="228" font-size="12" fill="#15803d">OFFSET: yes</text>
  <text x="715" y="246" font-size="12" fill="#b91c1c">Keyset: next / previous only</text>
  <text x="715" y="278" font-size="12" font-weight="700" fill="#334155">Best for</text>
  <text x="715" y="296" font-size="12" fill="#334155">OFFSET: small tables, admin</text>
  <text x="715" y="314" font-size="12" fill="#334155">Keyset: infinite scroll, APIs</text>
  <text x="715" y="346" font-size="12" font-weight="700" fill="#334155">Non-unique sort?</text>
  <text x="715" y="364" font-size="12" fill="#334155">add tie-breaker id + index</text>
  <text x="715" y="382" font-size="11" font-family="Consolas, monospace" fill="#334155">(order_date, order_id)</text>
</svg>
